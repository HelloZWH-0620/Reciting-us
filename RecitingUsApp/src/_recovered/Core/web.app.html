      notes: [{phrase:"静女",pos:"静女其姝",explain:"文静娴雅的姑娘。"},{phrase:"姝",pos:"静女其姝",explain:"姝（shū），美丽。"},{phrase:"俟",pos:"俟我于城隅",explain:"俟（sì），等待。"},{phrase:"城隅",pos:"俟我于城隅",explain:"城角。"},{phrase:"爱",pos:"爱而不见",explain:"通\'薆\'，隐藏、躲藏。"},{phrase:"踟蹰",pos:"搔首踟蹰",explain:"踟蹰（chí chú），徘徊不前的样子。"},{phrase:"娈",pos:"静女其娈",explain:"娈（luán），美好。"},{phrase:"贻",pos:"贻我彤管",explain:"贻（yí），赠送。"},{phrase:"彤管",pos:"贻我彤管",explain:"红色的管乐器。一说为红色笔管。"},{phrase:"炜",pos:"彤管有炜",explain:"炜（wěi），鲜亮发光的样子。"},{phrase:"说怿",pos:"说怿女美",explain:"说，通\'悦\'；怿（yì），欢喜。"},{phrase:"女",pos:"说怿女美",explain:"女（rǔ），通\'汝\'，你。"},{phrase:"归",pos:"自牧归荑",explain:"归（kuì），通\'馈\'，赠送。"},{phrase:"荑",pos:"自牧归荑",explain:"荑（tí），白茅草的嫩芽。"},{phrase:"洵",pos:"洵美且异",explain:"洵（xún），确实。"},{phrase:"匪",pos:"匪女之为美",explain:"匪，通\'非\'，不是。"}],
      appreciation: "《静女》出自《诗经·邶风》，是一首以男子口吻写的爱情诗，描写一对青年男女约会的情景，全诗充满健康活泼的生活气息和真挚热烈的爱情。\n\n思想内容：诗中男子在城角等待心上人，姑娘故意躲藏让他焦急万分。姑娘赠他彤管和白茅草，男子因是美人所赠而倍加珍爱。表现了纯真热烈的青年爱情。\n\n写作特色：1. 采用\"赋\"的手法，叙事与抒情相结合，情节生动；2. 通过动作描写刻画人物形象——\"搔首踟蹰\"生动传神地写出男子等不到心上人的焦急神态；3. 重章叠句，回环往复，富有民歌情味；4. 借物抒情，\"彤管\"和\"荑\"都因\"美人之贻\"而显得特别珍贵，物因人重，情感真挚。\n\n名句价值：\"爱而不见，搔首踟蹰\"成为描写恋人约会的经典之笔；\"匪女之为美，美人之贻\"则道出了\"爱屋及乌\"的心理，富有哲理意味，成为表达爱情真谛的千古名句。"
    },
    {
      id:'wuyi', title:'无衣', author:'《诗经·秦风》', authorId:'shijing', cat:'gushici',
      audio:'resource/audio/wuyi.aac',
      text:'岂曰无衣？与子同袍。王于兴师，修我戈矛。与子同仇！\n岂曰无衣？与子同泽。王于兴师，修我矛戟。与子偕作！\n岂曰无衣？与子同裳。王于兴师，修我甲兵。与子偕行！',
      translation: "谁说没有衣服穿？我与你同穿长袍。君王发兵去打仗，修整我们的戈和矛。我与你同仇敌忾！\n谁说没有衣服穿？我与你同穿内衣。君王发兵去打仗，修整我们的矛和戟。我与你一同出发！\n谁说没有衣服穿？我与你同穿战裙。君王发兵去打仗，修整我们的铠甲兵器。我与你一同前行！",
      notes: [{phrase:"岂曰",pos:"岂曰无衣",explain:"谁说。"},{phrase:"袍",pos:"与子同袍",explain:"长袍。"},{phrase:"王于兴师",pos:"王于兴师",explain:"王，指秦王；于，曰、语助词；兴师，起兵。"},{phrase:"戈矛",pos:"修我戈矛",explain:"戈、矛，古代长柄兵器。"},{phrase:"同仇",pos:"与子同仇",explain:"共同对付敌人。"},{phrase:"泽",pos:"与子同泽",explain:"泽，通\'襗\'（zé），内衣。"},{phrase:"戟",pos:"修我矛戟",explain:"戟（jǐ），古代兵器，戈与矛合为一体。"},{phrase:"偕作",pos:"与子偕作",explain:"一同起身。偕，共同。"},{phrase:"裳",pos:"与子同裳",explain:"裳（cháng），下衣，此指战裙。"},{phrase:"甲兵",pos:"修我甲兵",explain:"铠甲和兵器。"},{phrase:"偕行",pos:"与子偕行",explain:"一同前行。"}],
      appreciation: "《无衣》出自《诗经·秦风》，是著名的爱国主义战歌，表现了秦国军民团结互助、共御外侮的昂扬斗志，被誉为中国古代最早的\"军歌\"。\n\n思想内容：全诗三章，以问答形式开篇，表现出秦国军民面对战争的乐观精神和同仇敌忾的决心。将士们表示愿与战友共享衣物、共同修整兵器、并肩出征，洋溢着高昂的战斗热情。\n\n写作特色：1. 重章叠句，三章结构基本相同，只换几个字，回环往复中感情层层加深，是《诗经》典型艺术手法；2. 采用问答式开头，\"岂曰无衣\"铿锵有力，富有号召性；3. 句式短促整齐，节奏明快，富有战斗气息，音调铿锵；4. 由\"同袍\"到\"同泽\"再到\"同裳\"，由\"同仇\"到\"偕作\"再到\"偕行\"，层层递进，逻辑严密。\n\n名句价值：\"与子同袍\"\"与子同泽\"\"与子同裳\"成为后世表达战友之情的典故，\"岂曰无衣\"也成为表达团结御侮精神的千古名句，对后世边塞诗和军事题材作品有深远影响。"
    },
    {
      id:'lisao', title:'离骚（节选）', author:'屈原', authorId:'quyuan', cat:'gushici',
      audio:'resource/audio/lisao.aac',
      text:'帝高阳之苗裔兮，朕皇考曰伯庸。\n摄提贞于孟陬兮，惟庚寅吾以降。\n皇览揆余初度兮，肇锡余以嘉名：\n名余曰正则兮，字余曰灵均。\n纷吾既有此内美兮，又重之以修能。\n扈江离与辟芷兮，纫秋兰以为佩。\n汩余若将不及兮，恐年岁之不吾与。\n朝搴阰之木兰兮，夕揽洲之宿莽。\n日月忽其不淹兮，春与秋其代序。\n惟草木之零落兮，恐美人之迟暮。\n不抚壮而弃秽兮，何不改乎此度？\n乘骐骥以驰骋兮，来吾道夫先路！',
      translation: "我是古帝高阳氏的远代子孙，我已故的父亲名叫伯庸。\n岁星在寅的那年正月，庚寅那一天我降生。\n父亲观察揣度我初生时的气度，便赐给我美好的名字：\n名我叫正则，字我叫灵均。\n我已经拥有这些美好的内在品质，又加上修养才能。\n我把江离和辟芷披在身上，又编结秋兰作为佩饰。\n时光飞逝我好像快要赶不上了，怕年岁不等待我。\n早晨我攀折山坡上的木兰，傍晚我去采摘洲上的宿莽。\n日月飞速逝去不停留，春天和秋天交替更迭。\n想到草木不断地凋零枯萎，担心美人也终会衰老。\n为何不趁壮年抛弃污秽，为何不改变这种法度？\n驾驭骐骥奔驰吧，让我来为你引导前面的路！",
      notes: [{phrase:"高阳",pos:"帝高阳之苗裔兮",explain:"古帝颛顼（zhuān xū）的称号，屈原自述为颛顼的后代。"},{phrase:"皇考",pos:"朕皇考曰伯庸",explain:"对亡父的尊称。皇，美、光明；考，称已故的父亲。"},{phrase:"摄提",pos:"摄提贞于孟陬兮",explain:"即摄提格，寅年的别名。"},{phrase:"孟陬",pos:"摄提贞于孟陬兮",explain:"孟陬（zōu），正月。"},{phrase:"庚寅",pos:"惟庚寅吾以降",explain:"庚寅日，古人以干支纪日。"},{phrase:"揆",pos:"皇览揆余初度兮",explain:"揆（kuí），揣度、估量。"},{phrase:"内美",pos:"纷吾既有此内美兮",explain:"内在的美好品质。"},{phrase:"修能",pos:"又重之以修能",explain:"杰出的才能。修，长；能，才。一说为修饰姿态。"},{phrase:"扈",pos:"扈江离与辟芷兮",explain:"扈，楚地方言，披在身上。"},{phrase:"汩",pos:"汩余若将不及兮",explain:"汩（yù），水流急速的样子，比喻时光飞逝。"},{phrase:"搴",pos:"朝搴阰之木兰兮",explain:"搴（qiān），拔取、采摘。"},{phrase:"宿莽",pos:"夕揽洲之宿莽",explain:"经冬不死的香草。"},{phrase:"美人",pos:"恐美人之迟暮",explain:"美人，喻楚怀王。迟暮，衰老。"}],
      appreciation: "《离骚》是战国时期楚国诗人屈原的代表作，是中国文学史上第一首长篇政治抒情诗，也是中国浪漫主义诗歌的源头。本篇节选自《离骚》开篇部分。\n\n创作背景：屈原生活在楚国由盛转衰的战国后期，他主张举贤授能、修明法度、联齐抗秦，却遭到贵族保守派的排挤诬陷，被楚怀王疏远流放。在政治理想无法实现的痛苦中，屈原写下了这首千古绝唱。\n\n艺术特色：1. 浪漫主义手法——通过香草美人的比兴手法，将抽象的政治理想化为生动的形象；2. 句式创新——突破《诗经》四言格式，创造以六言为主、辅以\"兮\"字的骚体句式，开一代诗风；3. 想象丰富——大量运用神话传说、香花美草，构筑瑰丽的艺术境界。\n\n思想情感：开篇自述高贵身世和美好天赋，通过\"恐年岁之不吾与\"\"恐美人之迟暮\"表达对时光易逝、壮志难酬的焦虑，最后以\"乘骐骥以驰骋兮，来吾道夫先路\"表达引导君王走向正道的政治抱负。\n\n名句：\"惟草木之零落兮，恐美人之迟暮\"已成为感叹时光流逝的经典名句。"
    },
    {
      id:'shejiang', title:'涉江采芙蓉', author:'《古诗十九首》', authorId:'gushi19', cat:'gushici',
      audio:'resource/audio/shejiang.aac',
      text:'涉江采芙蓉，兰泽多芳草。\n采之欲遗谁？所思在远道。\n还顾望旧乡，长路漫浩浩。\n同心而离居，忧伤以终老。',
      translation: "渡过江水去采芙蓉花，兰草丛生的沼泽长满芳草。\n采了花要送给谁呢？我心思念的人在远方。\n回头眺望故乡，长路漫漫无边无际。\n心心相印却分离居住，只能忧伤地度过一生直到老死。",
      notes: [{phrase:"涉江",pos:"涉江采芙蓉",explain:"渡过江水。"},{phrase:"芙蓉",pos:"涉江采芙蓉",explain:"荷花。"},{phrase:"兰泽",pos:"兰泽多芳草",explain:"长满兰草的沼泽地。"},{phrase:"遗",pos:"采之欲遗谁",explain:"遗（wèi），赠送。"},{phrase:"所思",pos:"所思在远道",explain:"所思念的人。"},{phrase:"还顾",pos:"还顾望旧乡",explain:"回头看。"},{phrase:"旧乡",pos:"还顾望旧乡",explain:"故乡。"},{phrase:"漫浩浩",pos:"长路漫浩浩",explain:"形容路途遥远无边无际。"},{phrase:"同心",pos:"同心而离居",explain:"指感情深厚、心心相印。"},{phrase:"离居",pos:"同心而离居",explain:"分居两地。"}],
      appreciation: "《涉江采芙蓉》出自《古诗十九首》，作者不详，约产生于东汉末年，是一首抒发游子思乡怀人之情的经典之作。\n\n创作背景：东汉末年社会动荡，许多文人游子远离故乡漂泊在外，《古诗十九首》正是这一时期下层文人生活的真实写照。本诗以游子口吻抒写思乡之情与离别之苦。\n\n思想内容：诗中游子渡江采芙蓉花，本欲赠与远方所思之人，但所思之人远在千里之外。回首遥望故乡，长路漫漫，感叹同心之人却要分离，忧伤终老。表达了深沉的思乡怀人之情。\n\n写作特色：1. 起兴自然，由采花引出思念，富有生活气息；2. 情景交融，以\"兰泽多芳草\"反衬游子的孤独；3. 由动作（采花）到追问（遗谁）到回望（望旧乡）到抒情（忧伤终老），层次分明，感情层层推进；4. 语言朴素自然，不事雕琢，却有深沉韵味。\n\n名句价值：\"同心而离居，忧伤以终老\"成为表达离别相思之苦的千古名句，道出了古往今来无数离人的共同心声。"
    },
    {
      id:'duangexing', title:'短歌行', author:'曹操', authorId:'caocao', cat:'gushici',
      audio:'resource/audio/duangexing.aac',
      text:'对酒当歌，人生几何！譬如朝露，去日苦多。\n慨当以慷，忧思难忘。何以解忧？唯有杜康。\n青青子衿，悠悠我心。但为君故，沉吟至今。\n呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。\n明明如月，何时可掇？忧从中来，不可断绝。\n越陌度阡，枉用相存。契阔谈讌，心念旧恩。\n月明星稀，乌鹊南飞。绕树三匝，何枝可依？\n山不厌高，海不厌深。周公吐哺，天下归心。',
      translation: "面对美酒应当高歌，人生能有多少岁月！如同清晨的露水，逝去的日子太多而苦于无奈。\n慷慨激昂，忧愁思虑难以忘怀。用什么来排解忧愁？只有杜康美酒。\n青青的是你的衣领，悠悠的是我的思念。只为你的缘故，让我沉吟至今。\n鹿群呦呦鸣叫，啃食着野外的苹草。我有尊贵的客人，弹瑟吹笙宴请他。\n明月皎洁如镜，何时才能摘取？忧思从心中涌起，无法断绝。\n穿过纵横的小路，劳驾你前来探望。久别重逢设宴畅谈，心中念及旧日恩情。\n月明亮的夜晚星辰稀少，乌鹊向南飞去。绕树盘旋三圈，哪根枝条可以栖息？\n山不嫌其高，海不嫌其深。周公吐出嘴里食物（急忙迎客），天下人心归附。",
      notes: [{phrase:"对酒当歌",pos:"对酒当歌，人生几何",explain:"面对美酒应当高歌。当，对着、面对。"},{phrase:"几何",pos:"人生几何",explain:"多少。指岁月有多少。"},{phrase:"朝露",pos:"譬如朝露",explain:"早晨的露水，比喻短暂。"},{phrase:"杜康",pos:"唯有杜康",explain:"相传为最早酿酒的人，此处代指酒。"},{phrase:"青青子衿",pos:"青青子衿",explain:"出自《诗经·郑风·子衿》，原写女子思念情人，此处借喻对贤才的思慕。衿（jīn），衣领。"},{phrase:"呦呦鹿鸣",pos:"呦呦鹿鸣，食野之苹",explain:"出自《诗经·小雅·鹿鸣》，原为宴宾客的诗，此处表示招纳贤才之意。"},{phrase:"掇",pos:"何时可掇",explain:"掇（duō），拾取、摘取。"},{phrase:"契阔",pos:"契阔谈讌",explain:"契阔，聚散、久别重逢。讌（yàn），同\'宴\'，宴饮。"},{phrase:"三匝",pos:"绕树三匝",explain:"匝（zā），圈、周。三匝，多圈。比喻贤才寻找归宿。"},{phrase:"周公吐哺",pos:"周公吐哺，天下归心",explain:"《史记》载周公\'一沐三握发，一饭三吐哺\'，急于接待贤士。吐哺，吐出嘴里食物。"}],
      appreciation: "《短歌行》是曹操的代表作之一，是一首求贤若渴的政治抒情诗。\n\n创作背景：曹操统一北方后，欲南征天下，亟需招揽人才。此诗约作于建安十三年（208年）赤壁之战前夕，曹操当时已五十余岁，深感时光易逝、功业未就，借酒抒怀表达求贤之情。\n\n艺术特色：1. 引经据典——化用《诗经》中《子衿》《鹿鸣》等篇，以古喻今，表达对贤才的渴慕；2. 比兴手法——以朝露喻人生短暂，以乌鹊无枝可依喻贤才徘徊无主；3. 慷慨悲凉——全诗以\"忧\"为线索，反复咏叹，体现建安风骨的苍凉劲健；4. 句式整饬——四言为主，节奏铿锵。\n\n思想情感：诗人感叹人生苦短，忧思难忘，渴望招揽天下贤才辅佐自己成就统一大业。结尾以周公吐哺的典故自况，表达了\"天下归心\"的宏大志愿。\n\n名句：\"山不厌高，海不厌深。周公吐哺，天下归心\"成为求贤纳士的千古名句。"
    },
    {
      id:'guiyuantianju', title:'归园田居（其一）', author:'陶渊明', authorId:'taoyuanming', cat:'gushici',
      audio:'resource/audio/guiyuantianju.aac',
      text:'少无适俗韵，性本爱丘山。\n误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。\n榆柳荫后檐，桃李罗堂前。\n暧暧远人村，依依墟里烟。\n狗吠深巷中，鸡鸣桑树颠。\n户庭无尘杂，虚室有余闲。\n久在樊笼里，复得返自然。',
      translation: "从小就没有迎合世俗的本性，天性原本就热爱山丘林野。\n误落入仕途的尘网之中，一去就是三十年。\n关在笼中的鸟依恋旧日的树林，养在池中的鱼思念过去的深潭。\n在南野的边际开垦荒地，安守本分回归田园。\n住宅周围有十多亩地，茅草搭的屋子有八九间。\n榆树柳树遮蔽着后檐，桃树李树罗列在堂前。\n远远的村落依稀可见，村落里的炊烟袅袅上升。\n狗在深巷中吠叫，鸡在桑树顶端啼鸣。\n门庭里没有俗世杂物，空寂的屋子有闲暇时光。\n长久地关在樊笼里，如今又能重返自然了。",
      notes: [{phrase:"适俗韵",pos:"少无适俗韵",explain:"适应世俗的本性、气质。韵，气质、本性。"},{phrase:"尘网",pos:"误落尘网中",explain:"指仕途、官场，喻其污浊而束缚人。"},{phrase:"三十年",pos:"一去三十年",explain:"一说为十三年之误（陶渊明仕宦约十三年），一说泛指多年。"},{phrase:"羁鸟",pos:"羁鸟恋旧林",explain:"羁（jī）鸟，关在笼中的鸟。喻诗人自己。"},{phrase:"守拙",pos:"守拙归园田",explain:"安守本分。拙，愚拙，指不随波逐流。此处为自谦之词。"},{phrase:"方宅",pos:"方宅十余亩",explain:"方，旁、周围。方宅，住宅周围。"},{phrase:"暧暧",pos:"暧暧远人村",explain:"暧（ài）暧，昏暗、模糊的样子。"},{phrase:"墟里",pos:"依依墟里烟",explain:"墟里，村落。"},{phrase:"樊笼",pos:"久在樊笼里",explain:"鸟笼，比喻仕途。樊（fán），篱笆。"},{phrase:"自然",pos:"复得返自然",explain:"既指自然田园，也指顺应本性、自由自在的生活。"}],
      appreciation: "《归园田居》是陶渊明辞官归隐后所作的组诗，共五首，此为其一，写归田时的愉快心情和田园的宁静风光。\n\n创作背景：陶渊明四十一岁时任彭泽令，仅八十余日便因\"不为五斗米折腰\"而辞官归隐，从此躬耕田园。这组诗即作于归隐之初（405年）。\n\n艺术特色：1. 白描手法——用\"方宅十余亩，草屋八九间\"等朴素语言描绘田园风光，不事雕琢；2. 比兴寄托——以\"羁鸟\"\"池鱼\"自喻，以\"旧林\"\"故渊\"喻田园，形象生动；3. 动静结合——\"狗吠\"\"鸡鸣\"的动景与\"暧暧远人村\"的静景相映成趣；4. 情景交融——景物描写中渗透着摆脱束缚、回归自然的喜悦。\n\n思想情感：诗人通过对比官场的\"尘网\"\"樊笼\"与田园的\"旧林\"\"故渊\"，表达了对仕途的厌倦、对自然的热爱，以及归隐后的轻松喜悦。\"久在樊笼里，复得返自然\"是全诗的点睛之笔。\n\n影响：此诗开创了田园诗派，对后世王维、孟浩然等产生深远影响。"
    },
    {
      id:'nixinglunan', title:'拟行路难（其四）', author:'鲍照', authorId:'baozhao', cat:'gushici',
      audio:'resource/audio/nixinglunan.aac',
      text:'泻水置平地，各自东西南北流。\n人生亦有命，安能行叹复坐愁？\n酌酒以自宽，举杯断绝歌路难。\n心非木石岂无感？吞声踯躅不敢言。',
      translation: "把水倒在平地上，水向东西南北各自流去。\n人生也有命运安排，怎么能行走时叹息、坐下时发愁？\n斟酒来宽慰自己，举杯饮酒断绝了歌唱《行路难》。\n人心不是木头石头，怎能没有感慨？只能把话咽回去，徘徊不前不敢说话。",
      notes: [{phrase:"泻水",pos:"泻水置平地",explain:"倾倒水。泻，倾倒。"},{phrase:"人生亦有命",pos:"人生亦有命",explain:"古人认为人生由命运安排。"},{phrase:"行叹复坐愁",pos:"安能行叹复坐愁",explain:"行走时叹息，坐下时发愁。"},{phrase:"酌酒",pos:"酌酒以自宽",explain:":斟酒。酌（zhuó），斟。"},{phrase:"自宽",pos:"酌酒以自宽",explain:"自我宽慰。"},{phrase:"断绝",pos:"举杯断绝歌路难",explain:"中断。指饮酒中断了歌唱。"},{phrase:"行路难",pos:"举杯断绝歌路难",explain:"乐府《杂曲歌辞》篇名，内容多写世路艰难及离别悲伤。"},{phrase:"吞声",pos:"吞声踯躅不敢言",explain:"把话咽在肚子里不敢出声。"},{phrase:"踯躅",pos:"吞声踯躅不敢言",explain:"踯躅（zhí zhú），徘徊不前的样子。"}],
      appreciation: "《拟行路难（其四）》是南朝宋诗人鲍照的代表作。鲍照出身寒微，一生仕途坎坷，其《拟行路难》共十八首，本诗为第四首，抒发了怀才不遇的愤懑之情。\n\n创作背景：南朝门阀制度森严，寒门子弟难以进身。鲍照虽才华横溢，却因出身寒微而长期沉沦下僚，这种社会现实使他的诗歌充满了怀才不遇的愤懑与不平。\n\n思想内容：诗以\"泻水置平地\"起兴，用水向四方流去比喻人生际遇不同，引出\"人生亦有命\"的感慨。表面认命，实则愤激。后借酒浇愁，欲歌《行路难》而中断，最后以\"心非木石岂无感\"反诘，把内心的痛苦与压抑推向高潮，却又以\"不敢言\"收束，揭示出深沉的苦闷与无奈。\n\n写作特色：1. 起兴巧妙，以水之就下比喻人之命运，自然贴切；2. 反诘句\"安能行叹复坐愁\"\"心非木石岂无感\"气势强烈，凸显内心矛盾；3. 欲言又止、层层转折，从认命到愤激到自宽到不敢言，感情跌宕起伏；4. 语言质朴而感情沉郁，有建安风骨遗韵。\n\n名句价值：\"心非木石岂无感？吞声踯躅不敢言\"成为表达怀才不遇、欲言又止之情的经典名句，道出了无数有志之士的心声。"
    },
    {
      id:'shanjuqiuming', title:'山居秋暝', author:'王维', authorId:'wangwei', cat:'gushici',
      audio:'resource/audio/shanjuqiuming.aac',
      text:'空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。',
      translation: "空旷的山林中刚下过一场雨，傍晚的天气带着秋天的凉意。\n皎洁的月光透过松林洒落，清澈的泉水在石头上淙淙流淌。\n竹林里传来喧闹声，是洗衣的女子归来；莲叶摇动，是渔舟顺流而下。\n任凭春天的芳草凋零，王孙公子自己也可以留居在此。",
      notes: [{phrase:"空山",pos:"空山新雨后",explain:"空旷寂静的山林。王维诗中常用，如\'空山不见人\'。"},{phrase:"新雨",pos:"空山新雨后",explain:"刚下的雨。"},{phrase:"暝",pos:"山居秋暝",explain:"傍晚、夜色降临。"},{phrase:"竹喧",pos:"竹喧归浣女",explain:"竹林里传来喧笑声。喧，喧闹。"},{phrase:"浣女",pos:"竹喧归浣女",explain:"洗衣的女子。浣（huàn），洗。"},{phrase:"随意",pos:"随意春芳歇",explain:"任凭、随它去。"},{phrase:"春芳",pos:"随意春芳歇",explain:"春天的芳草香花。"},{phrase:"王孙",pos:"王孙自可留",explain:"原指贵族子弟，《楚辞·招隐士》有\'王孙兮归来，山中兮不可久留\'，此处反用其意，谓山中秋景亦佳，王孙自可留居。"}],
      appreciation: "《山居秋暝》是王维隐居终南山辋川别业时所作，是山水诗的代表作，被誉为\"诗中有画，画中有诗\"的典范。\n\n创作背景：王维晚年笃信佛教，半官半隐于辋川别业。此诗描绘秋日傍晚雨后山村的自然风光，体现诗人对山水田园的热爱和超脱尘俗的心境。\n\n艺术特色：1. 诗中有画——首联勾勒山雨初霁、秋凉宜人的全景，颔联绘\"明月松间照\"的静景，颈联写\"竹喧归浣女\"的动景，动静相生；2. 以动衬静——\"竹喧\"\"莲动\"反而衬托出山村的幽静；3. 用典反用——尾联反用《楚辞·招隐士》\"王孙兮归来，山中兮不可久留\"之意，翻出新境；4. 对仗工整——颔联颈联对仗精妙。\n\n思想情感：通过描绘清幽明净的山村秋景，寄托诗人高洁的情怀和对隐居生活的留恋，表达远离官场、归隐山林的志向。\n\n名句：\"明月松间照，清泉石上流\"是千古传诵的写景名句。"
    },
    {
      id:'shudaonan', title:'蜀道难', author:'李白', authorId:'libai', cat:'gushici',
      audio:'resource/audio/shudaonan.aac',
      text:'噫吁嚱，危乎高哉！蜀道之难，难于上青天！\n蚕丛及鱼凫，开国何茫然！\n尔来四万八千岁，不与秦塞通人烟。\n西当太白有鸟道，可以横绝峨眉巅。\n地崩山摧壮士死，然后天梯石栈相钩连。\n上有六龙回日之高标，下有冲波逆折之回川。\n黄鹤之飞尚不得过，猿猱欲度愁攀援。\n青泥何盘盘，百步九折萦岩峦。\n扪参历井仰胁息，以手抚膺坐长叹。\n\n问君西游何时还？畏途巉岩不可攀。\n但见悲鸟号古木，雄飞雌从绕林间。\n又闻子规啼夜月，愁空山。\n蜀道之难，难于上青天，使人听此凋朱颜！\n连峰去天不盈尺，枯松倒挂倚绝壁。\n飞湍瀑流争喧豗，砯崖转石万壑雷。\n其险也如此，嗟尔远道之人胡为乎来哉！\n\n剑阁峥嵘而崔嵬，一夫当关，万夫莫开。\n所守或匪亲，化为狼与豺。\n朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。\n锦城虽云乐，不如早还家。\n蜀道之难，难于上青天，侧身西望长咨嗟！',
      translation: "噫吁嚱，多么高峻啊！蜀道的难行，比上青天还难！\n蚕丛和鱼凫，开国的年代多么渺远难考！\n从那以来四万八千年，不与秦地相通人烟。\n西面挡着太白山只有鸟道可通，可以横越峨眉山巅。\n地崩山塌壮士牺牲，然后才有天梯石栈相钩连。\n上面有六龙驾日车也要回转的高峰，下面有波涛奔涌曲折回旋的川流。\n黄鹤高飞尚且飞不过去，猿猱想攀越也愁于攀援。\n青泥岭多么曲折盘旋，百步之内九折萦绕在岩峦之间。\n扪参历井仰头屏住呼吸，用手抚胸坐着长叹。\n\n问你西游何时归来？险恶的道路巉岩不可攀登。\n只见到悲鸟在古树上哀鸣，雄飞雌从在林间环绕。\n又听到子规在月夜啼叫，使空山也为之发愁。\n蜀道的难行，比上青天还难，使人听了也要吓得变了脸色！\n连绵的山峰离天不到一尺，枯松倒挂在绝壁之上。\n飞湍瀑流争相喧闹，砯崖转石如万壑雷鸣。\n它的险要就像这样，唉，你这远道之人为何要来这里呢！\n\n剑阁峥嵘而崔嵬，一人把守关口，万人也打不开。\n守关的如果不是亲信，就会变成豺狼一样的人。\n早上要躲避猛虎，傍晚要防备长蛇；它们磨牙吮血，杀人如麻。\n锦城虽说安乐，不如早早回家。\n蜀道的难行，比上青天还难，侧身西望令人长叹！",
      notes: [{phrase:"噫吁嚱",pos:"噫吁嚱，危乎高哉",explain:"蜀人方言，惊叹声。噫（yī）吁（xū）嚱（xī）。"},{phrase:"蚕丛、鱼凫",pos:"蚕丛及鱼凫",explain:"传说中古蜀国开国的两个国王。"},{phrase:"尔来",pos:"尔来四万八千岁",explain:"从那以来。尔，那、此。"},{phrase:"鸟道",pos:"西当太白有鸟道",explain:"只有鸟能飞过的高山小道，形容路险。"},{phrase:"地崩山摧壮士死",pos:"地崩山摧壮士死",explain:"用五丁开山的神话，秦惠王赠蜀王五美女，蜀王派五丁迎之，归途中五丁与美女皆被山压死，路乃通。"},{phrase:"六龙回日",pos:"上有六龙回日之高标",explain:"传说太阳神乘车由六龙驾拉而行，至此亦要回转。形容山高。"},{phrase:"猿猱",pos:"猿猱欲度愁攀援",explain:"猱（náo），猿类，善攀援。"},{phrase:"青泥",pos:"青泥何盘盘",explain:"青泥岭，在今陕西略阳县，为入蜀要道。"},{phrase:"扪参历井",pos:"扪参历井仰胁息",explain:"扪（mén），摸。参（shēn）、井，星宿名。形容山高可摸到星辰。胁息，屏住呼吸。"},{phrase:"子规",pos:"又闻子规啼夜月",explain:"即杜鹃鸟，蜀地最多，啼声哀切，似\'不如归去\'。"},{phrase:"砯崖",pos:"砯崖转石万壑雷",explain:"砯（pīng），水击岩石声。转石，转动石头。"},{phrase:"剑阁",pos:"剑阁峥嵘而崔嵬",explain:"剑阁道，在今四川剑阁县，为大、小剑山之间栈道，形势险要。"},{phrase:"咨嗟",pos:"侧身西望长咨嗟",explain:"叹息。"}],
      appreciation: "《蜀道难》是李白最著名的乐府诗之一，是唐诗中的浪漫主义杰作。\n\n创作背景：此诗大约作于唐玄宗天宝初年（742年前后），李白初到长安时。关于其寓意，有\"罪严武\"\"讽玄宗入蜀\"等多种说法，目前较普遍的看法是借蜀道之险写仕途坎坷，并有所规劝。\n\n艺术特色：1. 想象奇特——融合神话传说（蚕丛鱼凫、五丁开山、六龙回日）与现实，气势恢宏；2. 夸张大胆——\"难于上青天\"\"连峰去天不盈尺\"等夸张描写令人惊心动魄；3. 反复咏叹——\"蜀道之难，难于上青天\"三次出现，一唱三叹，回环往复；4. 句式灵活——三言、四言、五言、七言、九言错综使用，节奏跌宕。\n\n思想情感：全诗以雄健奔放的笔调描绘蜀道山川的奇险壮丽，既有对祖国大好河山的赞美，也暗含对藩镇割据、局势动荡的隐忧，结尾\"锦城虽云乐，不如早还家\"寄寓着对友人的关切和对时局的警示。\n\n名句：\"蜀道之难，难于上青天\"成为千古传诵的名句。"
    },
    {
      id:'mengyoutianmu', title:'梦游天姥吟留别', author:'李白', authorId:'libai', cat:'gushici',
      audio:'resource/audio/mengyoutianmu.aac',
      text:'海客谈瀛洲，烟涛微茫信难求；\n越人语天姥，云霞明灭或可睹。\n天姥连天向天横，势拔五岳掩赤城。\n天台四万八千丈，对此欲倒东南倾。\n\n我欲因之梦吴越，一夜飞度镜湖月。\n湖月照我影，送我至剡溪。\n谢公宿处今尚在，渌水荡漾清猿啼。\n脚著谢公屐，身登青云梯。\n半壁见海日，空中闻天鸡。\n千岩万转路不定，迷花倚石忽已暝。\n熊咆龙吟殷岩泉，栗深林兮惊层巅。\n云青青兮欲雨，水澹澹兮生烟。\n列缺霹雳，丘峦崩摧。\n洞天石扉，訇然中开。\n青冥浩荡不见底，日月照耀金银台。\n霓为衣兮风为马，云之君兮纷纷而来下。\n虎鼓瑟兮鸾回车，仙之人兮列如麻。\n忽魂悸以魄动，恍惊起而长嗟。\n惟觉时之枕席，失向来之烟霞。\n\n世间行乐亦如此，古来万事东流水。\n别君去兮何时还？且放白鹿青崖间，须行即骑访名山。\n安能摧眉折腰事权贵，使我不得开心颜？',
      translation: "航海的人谈起瀛洲，烟波渺茫实在难以寻求；\n越地的人说起天姥山，云霞明灭或许可以看见。\n天姥山连天向天横卧，气势超过五岳掩过赤城山。\n天台山四万八千丈，对着天姥山好像要向东南倾倒。\n\n我想要依照越人的话梦游吴越，一夜之间飞渡过镜湖上的月光。\n湖月照着我的身影，送我到剡溪。\n谢公住宿的地方至今还在，清澈的流水荡漾，猿猴清啼。\n脚上穿着谢公屐，身体登上青云梯。\n半山腰看见海上日出，半空中听到天鸡鸣叫。\n千岩万转道路不定，迷恋山花倚靠山石天色已昏暗。\n熊咆龙吟震动岩泉，使深林战栗使层巅惊骇。\n云青青的好像要下雨，水澹澹的升起烟雾。\n电光闪烁雷声霹雳，山峦崩塌摧毁。\n洞天石门，轰然中开。\n青冥浩荡看不见底，日月照耀着金银台。\n以霓虹为衣以风为马，云中之君纷纷降临。\n虎鼓瑟鸾回车，仙人排列如麻。\n忽然魂惊魄动，恍然惊醒而起长叹。\n醒来时只觉得枕席仍在，刚才的烟霞已经消失了。\n\n世间行乐也不过如此，古来万事都如东流水一去不返。\n告别你们何时才能回来？暂且把白鹿放养在青崖之间，要走时就骑它去访问名山。\n怎么能低眉弯腰侍奉权贵，让我不能舒展开心的容颜？",
      notes: [{phrase:"瀛洲",pos:"海客谈瀛洲",explain:"传说东海中的仙山。"},{phrase:"天姥",pos:"越人语天姥",explain:"天姥（mǔ）山，在今浙江新昌县境内。"},{phrase:"赤城",pos:"势拔五岳掩赤城",explain:"赤城山，在今浙江天台县北，为天台山的南门。"},{phrase:"剡溪",pos:"送我至剡溪",explain:"剡（shàn）溪，在今浙江嵊州市，曹娥江上游。"},{phrase:"谢公宿处",pos:"谢公宿处今尚在",explain:"南朝谢灵运游天姥山时曾宿于此。"},{phrase:"谢公屐",pos:"脚著谢公屐",explain:"谢灵运所创制的登山木鞋，前后装有可活动的木齿。"},{phrase:"天鸡",pos:"空中闻天鸡",explain:"《述异记》载\'东南有桃都山，上有天鸡，日初出照此木，天鸡则鸣\'。"},{phrase:"洞天石扉",pos:"洞天石扉，訇然中开",explain:"道家称神仙居处为洞天。扉（fēi），门。訇（hōng）然，大声。"},{phrase:"青冥",pos:"青冥浩荡不见底",explain:"青冥，青天。"},{phrase:"金银台",pos:"日月照耀金银台",explain:"神仙居处的金银宫阙。"},{phrase:"云之君",pos:"云之君兮纷纷而来下",explain:"云神，此处泛指神仙。"},{phrase:"摧眉折腰",pos:"安能摧眉折腰事权贵",explain:"低眉弯腰，意为委屈自己、卑躬屈膝。"}],
      appreciation: "《梦游天姥吟留别》是李白被赐金放还后，离开东鲁南下吴越时所作的留别诗，是浪漫主义诗歌的巅峰之作。\n\n创作背景：李白于天宝元年（742年）奉诏入京，供奉翰林，但因权贵谗毁，于天宝三年（744年）被\"赐金放还\"。离开长安后，他在东鲁居住，后将南下吴越，临行前作此诗留赠友人。\n\n艺术特色：1. 想象瑰丽——全诗以\"梦游\"为线索，描绘了一个奇丽变幻的神仙世界；2. 对比手法——以瀛洲衬托天姥，以现实中的山水衬托梦中的仙境，以仙境的美好衬托现实的失意；3. 句式多变——四言、五言、七言、骚体句交错使用，节奏跌宕起伏；4. 象征寄托——梦中仙境象征诗人追求的理想境界。\n\n思想情感：全诗通过梦游天姥山的奇幻经历，表达了对权贵的不屑、对自由的追求、对理想境界的向往。结尾\"安能摧眉折腰事权贵，使我不得开心颜\"是全诗的纲领，直抒胸臆，傲岸不羁，成为千古传诵的名句。\n\n名句：\"安能摧眉折腰事权贵，使我不得开心颜\"体现了李白蔑视权贵、追求自由的精神。"
    },
    {
      id:'qiangjinjiu', title:'将进酒', author:'李白', authorId:'libai', cat:'gushici',
      audio:'resource/audio/qiangjinjiu.aac',
      text:'君不见黄河之水天上来，奔流到海不复回。\n君不见高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金樽空对月。\n天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我倾耳听。\n钟鼓馔玉不足贵，但愿长醉不愿醒。\n古来圣贤皆寂寞，惟有饮者留其名。\n陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须沽取对君酌。\n五花马、千金裘，呼儿将出换美酒，与尔同销万古愁。',
      translation: "你没看见黄河之水从天上来，奔流到海不再回头。\n你没看见高堂明镜悲叹白发，早晨如青丝晚上就成雪白。\n人生得意之时应当尽情欢乐，不要让金樽空对明月。\n老天造就我材必有所用，千金散尽还会再回来。\n烹羊宰牛暂且为乐，应当一饮就是三百杯。\n岑夫子，丹丘生，请喝酒，杯不要停。\n我为你们唱一首歌，请你们侧耳倾听。\n钟鼓美食不足珍贵，我愿长醉不愿清醒。\n自古以来圣贤都寂寞，只有饮酒者留下美名。\n陈王曹植从前在平乐观设宴，斗酒十千尽情欢谑。\n主人为什么说钱少，只管去买酒来对饮。\n五花马、千金裘，叫童儿拿出去换美酒，与你一同消解万古愁。",
      notes: [{phrase:"高堂",pos:"君不见高堂明镜悲白发",explain:"父母，或指高大的厅堂。此处指父母，暗含父母已老之意。"},{phrase:"朝如青丝暮成雪",pos:"朝如青丝暮成雪",explain:"夸张手法，形容人生短暂。青丝，黑发。"},{phrase:"会须",pos:"会须一饮三百杯",explain:"应当。会，当、须。"},{phrase:"岑夫子、丹丘生",pos:"岑夫子，丹丘生",explain:"岑勋（岑夫子）、元丹丘（丹丘生），均为李白好友。"},{phrase:"钟鼓馔玉",pos:"钟鼓馔玉不足贵",explain:"钟鼓，权贵人家的乐器；馔（zhuàn）玉，精美如玉的食物。代指富贵生活。"},{phrase:"陈王",pos:"陈王昔时宴平乐",explain:"曹植，曹操之子，封陈王。平乐，平乐观，在洛阳。"},{phrase:"斗酒十千",pos:"斗酒十千恣欢谑",explain:"一斗酒值十千钱，极言酒美而宴盛。"},{phrase:"五花马",pos:"五花马、千金裘",explain:"毛色斑驳的名贵马。一说剪马鬃为五瓣花纹。"},{phrase:"千金裘",pos:"五花马、千金裘",explain:"珍贵的皮衣。化用《史记》\'千金之裘\'。"},{phrase:"销",pos:"与尔同销万古愁",explain:"同\'消\'，消除。"}],
      appreciation: "《将进酒》是李白最豪放的代表作之一，约作于天宝十一载（752年），当时李白被赐金放还已近十年，与友人岑勋、元丹丘在嵩山一带相聚饮酒时所作。\n\n创作背景：李白离开长安后，政治抱负无法实现，内心愤懑不平。此诗借酒抒发怀才不遇的感慨和对权贵的不满。\n\n艺术特色：1. 夸张手法的极致运用——\"黄河之水天上来\"\"朝如青丝暮成雪\"\"一饮三百杯\"\"万古愁\"等夸张，气势磅礴；2. 句式开阖自如——七言为主，杂以三言、五言、十言，长短错落，节奏跌宕；3. 情感大起大落——从悲（白发）到欢（饮酒），从狂（散尽千金）到愁（万古愁），波澜起伏；4. 用典精当——借用陈王曹植典故，以古人自况。\n\n思想情感：全诗表面豪放旷达，实则深藏悲愤。\"天生我材必有用\"体现了诗人坚定的自信和对自我价值的肯定，\"与尔同销万古愁\"则透露出深深的失意和愤懑。诗人借酒浇愁，以豪放掩饰悲凉，体现了盛唐文人的精神风貌。\n\n名句：\"天生我材必有用，千金散尽还复来\"成为表达自信和豁达的千古名句。"
    },
    {
      id:'yangexing', title:'燕歌行', author:'高适', authorId:'gaoshi', cat:'gushici',
      audio:'resource/audio/yangexing.aac',
      text:'汉家烟尘在东北，汉将辞家破残贼。\n男儿本自重横行，天子非常赐颜色。\n摐金伐鼓下榆关，旌旆逶迤碣石间。\n校尉羽书飞瀚海，单于猎火照狼山。\n山川萧条极边土，胡骑凭陵杂风雨。\n战士军前半死生，美人帐下犹歌舞。\n大漠穷秋塞草腓，孤城落日斗兵稀。\n身当恩遇常轻敌，力尽关山未解围。\n铁衣远戍辛勤久，玉箸应啼别离后。\n少妇城南欲断肠，征人蓟北空回首。\n边庭飘飖那可度，绝域苍茫无所有。\n杀气三时作阵云，寒声一夜传刁斗。\n相看白刃血纷纷，死节从来岂顾勋？\n君不见沙场征战苦，至今犹忆李将军。',
      translation: "东北边境燃起战火，汉朝将士辞别家乡去击破残敌。\n男儿本就崇尚横行天下的气概，天子又格外给予恩遇赏赐。\n敲锣打鼓下榆关，旗帜蜿蜒飘扬在碣石山间。\n校尉紧急文书飞越沙漠，单于打猎的火光照亮狼山。\n山川萧条荒凉到达边境尽头，胡骑仗势侵凌如狂风骤雨。\n战士在阵前半死半生，将帅帐下美人还在歌舞。\n大漠深秋边塞草枯萎，孤城落日之下战斗的士兵已经稀少。\n身受皇恩常轻敌冒进，力尽关山之围仍未解开。\n铁甲戍边辛勤已久，妻子应当在家为离别而哭泣。\n城南少妇哭得肝肠寸断，蓟北征人白白回头远望。\n边地动荡哪里能安然度过，绝域苍茫什么都没有。\n杀气早晚午三时化作阵云，寒夜刁斗声声相传。\n相看白刃之间鲜血纷飞，为节义而死何曾顾及功勋？\n你不见沙场征战的艰苦，至今人们还在怀念李广将军。",
      notes: [{phrase:"烟尘",pos:"汉家烟尘在东北",explain:"烽烟尘土，借指战争。"},{phrase:"横行",pos:"男儿本自重横行",explain:"横行天下，意为勇武善战。"},{phrase:"赐颜色",pos:"天子非常赐颜色",explain:"给予面子、恩遇。"},{phrase:"摐金伐鼓",pos:"摐金伐鼓下榆关",explain:"摐（chuāng）金，敲击铜锣；伐鼓，击鼓。指出兵时的声势。"},{phrase:"榆关",pos:"摐金伐鼓下榆关",explain:"山海关。"},{phrase:"旌旆",pos:"旌旆逶迤碣石间",explain:"旌旆（jīng pèi），旗帜。"},{phrase:"逶迤",pos:"旌旆逶迤碣石间",explain:"蜿蜒曲折的样子。"},{phrase:"羽书",pos:"校尉羽书飞瀚海",explain:"紧急文书，上插鸟羽表示紧急。"},{phrase:"瀚海",pos:"校尉羽书飞瀚海",explain:"沙漠。"},{phrase:"凭陵",pos:"胡骑凭陵杂风雨",explain:"仗势侵凌。"},{phrase:"腓",pos:"大漠穷秋塞草腓",explain:"腓（féi），枯萎。"},{phrase:"玉箸",pos:"玉箸应啼别离后",explain:"玉箸（zhù），玉筷子，比喻眼泪。"},{phrase:"蓟北",pos:"征人蓟北空回首",explain:"蓟（jì）北，唐代幽州蓟州一带，泛指东北边疆。"},{phrase:"刁斗",pos:"寒声一夜传刁斗",explain:"刁斗，古代军中铜炊具，白天烧饭，夜间敲击报时警众。"},{phrase:"死节",pos:"死节从来岂顾勋",explain:"为节义而死。"},{phrase:"李将军",pos:"至今犹忆李将军",explain:"汉代名将李广，匈奴畏其威，称\'飞将军\'。"}],
      appreciation: "《燕歌行》是唐代边塞诗人高适的代表作，也是唐代边塞诗的扛鼎之作。原诗有序言交代创作缘起：\"开元二十六年，客有从御史大夫张公出塞而还者，作《燕歌行》以示适，感征戍之事，因而和焉。\"\n\n思想内容：全诗以高度概括的手法描绘了一场边塞战争的全过程，揭露了军中将帅骄奢淫逸、不恤士卒的黑暗现实，同情戍边将士的艰苦生活与思妇征人的离愁别恨，最后借怀念李广将军寄寓对良将的渴望。\n\n写作特色：1. 对比鲜明——\"战士军前半死生，美人帐下犹歌舞\"将士兵浴血奋战与将帅荒淫享乐对照，极具批判力量；2. 多角度描写——既有金鼓旌旗的出师场面，又有羽书猎火的紧张气氛，还有思妇征人的相思之苦，层次丰富；3. 七言歌行体，音节铿锵，气势奔放；4. 用典贴切——结尾以李广作结，含蓄有力。\n\n名句价值：\"战士军前半死生，美人帐下犹歌舞\"成为揭露军中黑暗、批判将帅腐化的千古名句；\"君不见沙场征战苦，至今犹忆李将军\"则表达了对良将的渴慕与对和平的向往。"
    },
    {
      id:'shuxiang', title:'蜀相', author:'杜甫', authorId:'dufu', cat:'gushici',
      audio:'resource/audio/shuxiang.aac',
      text:'丞相祠堂何处寻？锦官城外柏森森。\n映阶碧草自春色，隔叶黄鹂空好音。\n三顾频烦天下计，两朝开济老臣心。\n出师未捷身先死，长使英雄泪满襟。',
      translation: "诸葛丞相的祠堂到哪里去寻找？在锦官城外柏树茂密的地方。\n映照台阶的碧草独自呈现着春色，隔着树叶的黄鹂白白地婉转鸣叫。\n刘备三顾茅庐频频劳烦，是为天下大计；辅佐刘备、刘禅两朝开创基业匡扶社稷，是老臣一片忠心。\n出师北伐还没取得胜利就先去世了，常使后世的英雄们泪湿衣襟。",
      notes: [{phrase:"蜀相",pos:"蜀相",explain:"指诸葛亮，曾任蜀汉丞相。"},{phrase:"丞相祠堂",pos:"丞相祠堂何处寻",explain:"即武侯祠，在今成都南郊。"},{phrase:"锦官城",pos:"锦官城外柏森森",explain:"成都的别称。"},{phrase:"柏森森",pos:"锦官城外柏森森",explain:"柏树茂密的样子。"},{phrase:"自春色",pos:"映阶碧草自春色",explain:"独自呈现春色。"},{phrase:"空好音",pos:"隔叶黄鹂空好音",explain:"白白地婉转鸣叫。"},{phrase:"三顾",pos:"三顾频烦天下计",explain:"刘备三顾茅庐请诸葛亮出山。"},{phrase:"频烦",pos:"三顾频烦天下计",explain:"多次劳烦。"},{phrase:"天下计",pos:"三顾频烦天下计",explain:"天下大计，指三分天下的策略。"},{phrase:"两朝",pos:"两朝开济老臣心",explain:"指刘备、刘禅两代。"},{phrase:"开济",pos:"两朝开济老臣心",explain:"开创基业，匡济艰难。"},{phrase:"出师未捷身先死",pos:"出师未捷身先死",explain:"指诸葛亮多次北伐未果，于建兴十二年（234年）病逝五丈原。"},{phrase:"长使",pos:"长使英雄泪满襟",explain:"长久使。"}],
      appreciation: "《蜀相》是杜甫于唐肃宗上元元年（760年）春初到成都时拜谒武侯祠所作。杜甫此时正值安史之乱，政治失意，对诸葛亮的忠贞不渝与功业未竟深有共鸣。\n\n创作背景：杜甫流寓成都，初定居于浣花溪畔，翌年春天游览武侯祠，凭吊诸葛亮，写下此诗。\n\n艺术特色：首联\"丞相祠堂何处寻？锦官城外柏森森\"以设问开篇，柏森森三字既写祠堂景致，又寄寓对丞相的崇敬。颔联\"映阶碧草自春色，隔叶黄鹂空好音\"以乐景衬哀情，\"自\"\"空\"二字意味深长，写出了祠堂冷落荒凉、无人祭奠的感慨。颈联\"三顾频烦天下计，两朝开济老臣心\"是名句，高度概括了诸葛亮一生的功业和忠贞。\n\n名句赏析：尾联\"出师未捷身先死，长使英雄泪满襟\"是千古传诵的名句，既惋惜诸葛亮功业未竟，又寄托了杜甫自己壮志难酬的悲愤。全诗以议为诗，以史为诗，感情沉郁顿挫，是杜甫咏史诗的代表作。"
    },
    {
      id:'kezhi', title:'客至', author:'杜甫', authorId:'dufu', cat:'gushici',
      audio:'resource/audio/kezhi.aac',
      text:'舍南舍北皆春水，但见群鸥日日来。\n花径不曾缘客扫，蓬门今始为君开。\n盘飧市远无兼味，樽酒家贫只旧醅。\n肯与邻翁相对饮，隔篱呼取尽余杯。',
      translation: "房舍南北都被春水环绕，只见群鸥天天飞来。\n长满花草的小路不曾因为客来而打扫过，柴门今天才为你打开。\n因离市集远盘中没有多样的菜肴，家境贫寒杯中只有自家酿的陈酒。\n你愿不愿意和邻家老翁对饮，隔着篱笆呼唤他来一同喝完剩下的酒。",
      notes: [{phrase:"但见",pos:"但见群鸥日日来",explain:"只见。"},{phrase:"花径",pos:"花径不曾缘客扫",explain:"长满花草的小路。"},{phrase:"缘",pos:"花径不曾缘客扫",explain:"因为，为了。"},{phrase:"蓬门",pos:"蓬门今始为君开",explain:"用蓬草编成的门，喻指贫寒之家。"},{phrase:"盘飧",pos:"盘飧市远无兼味",explain:"盘飧（sūn），盘中的熟食菜肴。"},{phrase:"兼味",pos:"盘飧市远无兼味",explain:"多种美味佳肴。"},{phrase:"樽",pos:"樽酒家贫只旧醅",explain:"樽（zūn），盛酒器。"},{phrase:"旧醅",pos:"樽酒家贫只旧醅",explain:"醅（pēi），未滤的酒。旧醅，旧酿的酒，古人以新酒为贵。"},{phrase:"肯与",pos:"肯与邻翁相对饮",explain:"肯，可，愿。表商询语气。"},{phrase:"呼取",pos:"隔篱呼取尽余杯",explain:"呼唤。取，语助词。"},{phrase:"余杯",pos:"隔篱呼取尽余杯",explain:"剩下的酒。"}],
      appreciation: "《客至》是杜甫在成都草堂定居后所作的一首七言律诗。杜甫历经安史之乱的颠沛流离后，于上元元年（760年）在成都西郊浣花溪畔建草堂定居，生活暂时安定。此诗约作于上元二年（761年）春天，表达了对客人来访的喜悦之情。\n\n思想内容：诗中描写了草堂春日的环境——舍南舍北春水环绕、群鸥飞翔，写出了居处的清幽与平日少有客来的寂寞。中间写为客开门、备酒设菜的简朴却真挚的招待，体现主客间的深厚情谊。最后请邻翁共饮，更显主人的随和豪爽与农家生活的质朴情趣。\n\n写作特色：1. 选取生活细节——花径不扫、蓬门始开、盘飧无兼味、樽酒只旧醅，皆是生活小事，却真实动人；2. 语言质朴自然，如话家常，亲切有味；3. 情感真挚，不事夸饰，于平淡处见真情；4. 由景及事，由事及情，层次井然；5. 末联\"隔篱呼取\"生动传神，活画出主人的豪爽与乡村生活的融洽。\n\n名句价值：\"花径不曾缘客扫，蓬门今始为君开\"为传诵名句，写尽待客之诚与喜悦之情，对后世写待客题材的诗文影响深远。"
    },
    {
      id:'denggao', title:'登高', author:'杜甫', authorId:'dufu', cat:'gushici',
      audio:'resource/audio/denggao.aac',
      text:'风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。',
      translation: "风急天高，猿猴的叫声凄哀；水清沙白，鸟儿在空中盘旋。\n无边无际的落叶纷纷飘下，奔流不息的长江滚滚涌来。\n漂泊万里，常在秋天作客他乡；一生多病，独自登临高台。\n历尽艰难苦恨，鬓边白发如霜；穷困潦倒，新近又停了浊酒。",
      notes: [{phrase:"猿啸哀",pos:"风急天高猿啸哀",explain:"猿猴的叫声凄凉。三峡一带多猿，啼声哀切。"},{phrase:"渚",pos:"渚清沙白鸟飞回",explain:"渚（zhǔ），水中小洲。"},{phrase:"落木",pos:"无边落木萧萧下",explain:"落叶。萧萧，风吹落叶声。"},{phrase:"万里",pos:"万里悲秋常作客",explain:"极言离家之远。"},{phrase:"百年",pos:"百年多病独登台",explain:"一生。一说指暮年。"},{phrase:"繁霜鬓",pos:"艰难苦恨繁霜鬓",explain:"耳边的白发增多，如染霜雪。繁，多。"},{phrase:"潦倒",pos:"潦倒新停浊酒杯",explain:"衰病、失意。"},{phrase:"新停",pos:"潦倒新停浊酒杯",explain:"新近停止。杜甫晚年因肺病戒酒。"}],
      appreciation: "《登高》是杜甫大历二年（767年）秋天在夔州（今重庆奉节）所作，被明代胡应麟誉为\"古今七律第一\"。\n\n创作背景：杜甫此时流寓夔州，年老多病，生活困顿。重阳节他独自登高远眺，面对萧瑟秋景，感怀身世飘零、国家动荡，写下此诗。\n\n艺术特色：1. 对仗工整——全诗八句皆对，被誉\"一篇之中，句句皆律\"；2. 景物开阔——首联十四字写六种景物（风、天、猿、渚、沙、鸟），声色俱备；3. 情景交融——前四句写景，后四句抒情，由景入情，自然过渡；4. 沉郁顿挫——情感深沉含蓄，节奏抑扬有致。\n\n思想情感：诗人将个人身世之悲（万里作客、百年多病）与家国动荡之愁（艰难苦恨）融为一体，\"悲秋\"是表层，\"悲己悲国\"是深层。尽管困顿潦倒，但忧国忧民之情不减。\n\n名句：\"无边落木萧萧下，不尽长江滚滚来\"气象宏大，成为悲秋名句；\"万里悲秋常作客，百年多病独登台\"将空间（万里）、时间（百年）、季节（秋）、处境（客、病）层层叠加，被誉为\"古今独步\"。"
    },
    {
      id:'dengyueyanglou', title:'登岳阳楼', author:'杜甫', authorId:'dufu', cat:'gushici',
      audio:'resource/audio/dengyueyanglou.aac',
      text:'昔闻洞庭水，今上岳阳楼。\n吴楚东南坼，乾坤日夜浮。\n亲朋无一字，老病有孤舟。\n戎马关山北，凭轩涕泗流。',
      translation: "从前就听说洞庭湖水壮阔，今天终于登上了岳阳楼。\n吴楚两地向东南分裂开去，天地日月日夜在湖水中浮动。\n亲戚朋友没有一个字的消息，年老多病只有一只孤舟相伴。\n北方关山战火未平，倚着栏杆眼泪鼻涕纵横流淌。",
      notes: [{phrase:"洞庭水",pos:"昔闻洞庭水",explain:"即洞庭湖，在今湖南省。"},{phrase:"岳阳楼",pos:"今上岳阳楼",explain:"在今湖南省岳阳市，下临洞庭湖。"},{phrase:"吴楚",pos:"吴楚东南坼",explain:"吴地和楚地，指江南一带。"},{phrase:"坼",pos:"吴楚东南坼",explain:"坼（chè），分裂、裂开。"},{phrase:"乾坤",pos:"乾坤日夜浮",explain:"天地。这里指日月星辰。"},{phrase:"孤舟",pos:"老病有孤舟",explain:"孤零零一只小船。杜甫晚年漂泊江湖，以船为家。"},{phrase:"戎马",pos:"戎马关山北",explain:"战马，借指战争。当时吐蕃入侵，长安戒严。"},{phrase:"关山北",pos:"戎马关山北",explain:"北方关塞山岳，指当时吐蕃入侵的边境。"},{phrase:"凭轩",pos:"凭轩涕泗流",explain:"倚着楼窗。轩，窗户。"},{phrase:"涕泗",pos:"凭轩涕泗流",explain:"涕，眼泪；泗（sì），鼻涕。"}],
      appreciation: "《登岳阳楼》是杜甫晚年漂泊到岳阳时所作的一首五言律诗，被誉为\"登岳阳楼诗之冠\"。唐代宗大历三年（768年）冬，杜甫携家眷从夔州出三峡，漂泊到岳阳，登上岳阳楼，写下这首千古名篇。\n\n创作背景：杜甫此时已经五十七岁，年老多病，生活困顿，国家又有吐蕃入侵之忧。个人身世之悲与家国之忧交织在一起，凝成这首悲壮苍凉之作。\n\n思想内容：首联点题，写昔日闻洞庭之名而今日登楼，含有一种沧桑之感。颔联\"吴楚东南坼，乾坤日夜浮\"写洞庭湖的浩瀚壮阔，气象万千，意境雄浑。颈联\"亲朋无一字，老病有孤舟\"由景入情，写自身漂泊孤苦。尾联\"戎马关山北，凭轩涕泗流\"由个人身世扩展到家国忧思，悲痛之情达到高潮。\n\n写作特色：1. 视野宏阔——\"吴楚东南坼，乾坤日夜浮\"以惊人的笔力写出洞庭湖的气象，被后人赞为\"古今绝唱\"；2. 情景交融——前半写景，后半抒情，由景入情过渡自然；3. 对仗工整——颔联、颈联对仗精工，气象雄大；4. 由个人之悲上升到国家之忧，体现杜甫\"沉郁顿挫\"的典型风格。\n\n名句价值：\"吴楚东南坼，乾坤日夜浮\"为描写洞庭湖壮丽景色的千古名句，可与孟浩然\"气蒸云梦泽，波撼岳阳城\"比美。"
    },
    {
      id:'pipaxing', title:'琵琶行（并序）', author:'白居易', authorId:'baijuyi', cat:'gushici',
      audio:'resource/audio/pipaxing.aac',
      text:'元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。\n\n浔阳江头夜送客，枫叶荻花秋瑟瑟。\n主人下马客在船，举酒欲饮无管弦。\n醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。\n寻声暗问弹者谁？琵琶声停欲语迟。\n移船相近邀相见，添酒回灯重开宴。\n千呼万唤始出来，犹抱琵琶半遮面。\n转轴拨弦三两声，未成曲调先有情。\n弦弦掩抑声声思，似诉平生不得志。\n低眉信手续续弹，说尽心中无限事。\n轻拢慢捻抹复挑，初为《霓裳》后《六幺》。\n大弦嘈嘈如急雨，小弦切切如私语。\n嘈嘈切切错杂弹，大珠小珠落玉盘。\n间关莺语花底滑，幽咽泉流冰下难。\n冰泉冷涩弦凝绝，凝绝不通声暂歇。\n别有幽愁暗恨生，此时无声胜有声。\n银瓶乍破水浆迸，铁骑突出刀枪鸣。\n曲终收拨当心画，四弦一声如裂帛。\n东船西舫悄无言，唯见江心秋月白。\n\n沉吟放拨插弦中，整顿衣裳起敛容。\n自言本是京城女，家在虾蟆陵下住。\n十三学得琵琶成，名属教坊第一部。\n曲罢曾教善才服，妆成每被秋娘妒。\n五陵年少争缠头，一曲红绡不知数。\n钿头银篦击节碎，血色罗裙翻酒污。\n今年欢笑复明年，秋月春风等闲度。\n弟走从军阿姨死，暮去朝来颜色故。\n门前冷落鞍马稀，老大嫁作商人妇。\n商人重利轻别离，前月浮梁买茶去。\n去来江口守空船，绕船月明江水寒。\n夜深忽梦少年事，梦啼妆泪红阑干。\n\n我闻琵琶已叹息，又闻此语重唧唧。\n同是天涯沦落人，相逢何必曾相识！\n我从去年辞帝京，谪居卧病浔阳城。\n浔阳地僻无音乐，终岁不闻丝竹声。\n住近湓江地低湿，黄芦苦竹绕宅生。\n其间旦暮闻何物？杜鹃啼血猿哀鸣。\n春江花朝秋月夜，往往取酒还独倾。\n岂无山歌与村笛？呕哑嘲哳难为听。\n今夜闻君琵琶语，如听仙乐耳暂明。\n莫辞更坐弹一曲，为君翻作《琵琶行》。\n感我此言良久立，却坐促弦弦转急。\n凄凄不似向前声，满座重闻皆掩泣。\n座中泣下谁最多？江州司马青衫湿。',
      translation: "元和十年，我被贬为九江郡司马。第二年秋天，到湓浦口送客，听到船上有人夜间弹奏琵琶，听那声音，铮铮然有京都的声调。问那个人，原本是长安的歌女，曾经向穆、曹两位琵琶高手学艺，年长色衰后，嫁给商人做妻子。于是命人摆酒，让她快弹几曲。弹完后她面带愁容，自叙年轻时欢乐往事，如今漂泊憔悴，辗转流离于江湖之间。我离开京城做地方官两年，恬然自安，被她这番话触动，这天晚上才觉出被贬谪的意味。于是写了这首长诗，赠给她，共六百一十六字，题为《琵琶行》。\n\n秋夜在浔阳江头送别客人，枫叶荻花在秋风中瑟瑟作响。\n主人下马客人在船上，举杯想饮酒却没有音乐助兴。\n酒喝得不痛快将要凄惨地分别，分别时茫茫江水浸着明月。\n忽然听到水上传来琵琶声，主人忘记归去客人也暂不发船。\n循声暗问弹琵琶的是谁，琵琶声停她迟疑着欲言又止。\n移船靠近邀请她出来相见，添酒拨灯重新摆开宴席。\n千呼万唤她才慢慢走出来，还抱着琵琶遮住半边脸面。\n转动琴轴拨动琴弦三两声，还没成曲调已先含深情。\n每根弦都低沉压抑每个声都含愁思，好像在诉说平生不得志。\n低眉随手不停地弹奏，说尽心中无限的心事。\n轻拢慢捻又抹又挑，先弹《霓裳》后弹《六幺》。\n大弦嘈嘈如急雨，小弦切切如私语。\n嘈嘈切切错杂弹奏，大小珍珠落在玉盘上。\n像黄莺在花下婉转啼鸣，又像泉水在冰下幽咽难流。\n冰泉冷涩琴弦好像要断绝，断绝不通声音暂歇。\n另有一种幽愁暗恨生出，此时无声胜过有声。\n突然银瓶破裂水浆迸溅，又似铁骑冲出刀枪齐鸣。\n曲终收拨在弦中一画，四弦齐响如同撕裂丝帛。\n东西船只静悄悄无人说话，只见江心秋月洁白。\n\n她沉吟着收拨插入弦中，整顿衣裳站起来庄重敛容。\n自言本是京城的女子，家住虾蟆陵下。\n十三岁学得琵琶技艺成功，名字列入教坊第一部。\n弹罢曾让琵琶高手叹服，梳妆后常被秋娘嫉妒。\n五陵少年争相赠送缠头，一曲弹罢红绡不知多少。\n钿头银篦打节拍而破碎，血色罗裙翻倒被酒玷污。\n今年欢笑明年又欢笑，秋月春风等闲度过。\n弟弟从军阿姨去世，时光流逝容颜衰老。\n门前冷落车马稀少，年纪大了嫁给商人做妻子。\n商人重利轻视别离，前月去浮梁买茶。\n他走后我守着空船，绕船明月江水凄寒。\n深夜忽然梦见少年往事，梦中啼哭泪水和脂粉流满脸颊。\n\n我听琵琶声已叹息，又听她这番话更唏嘘。\n同样是天涯沦落人，相逢何必曾经相识！\n我从去年辞别京城，谪居卧病在浔阳城。\n浔阳地处偏僻没有音乐，一年到头听不到丝竹之声。\n住近湓江地势低湿，黄芦苦竹绕着宅子生长。\n那里早晚听到什么？杜鹃啼血猿猴哀鸣。\n春江花朝秋月之夜，往往取酒独自倾饮。\n难道没有山歌和村笛？声音嘶哑嘈杂难听。\n今夜听你弹奏琵琶曲，如同听仙乐耳朵一时清明。\n请不要推辞再坐下弹一曲，我为你翻作《琵琶行》。\n她被我的话感动良久站立，退坐后拧紧琴弦弦声转急。\n凄凄切切不似刚才的声音，满座重听都掩面哭泣。\n座中谁流泪最多？江州司马青衫都被泪水打湿。",
      notes: [{phrase:"左迁",pos:"予左迁九江郡司马",explain:"贬官、降职。古代以右为尊，以左为卑。"},{phrase:"司马",pos:"予左迁九江郡司马",explain:"州郡的属官，当时为闲职。"},{phrase:"湓浦口",pos:"送客湓浦口",explain:"湓（pén）水入长江处，在今九江市。"},{phrase:"善才",pos:"尝学琵琶于穆、曹二善才",explain:"唐代对琵琶高手的称呼。"},{phrase:"倡女",pos:"本长安倡女",explain:"歌女。倡，同\'娼\'，古代指歌舞艺人。"},{phrase:"贾人",pos:"委身为贾人妇",explain:"商人。贾（gǔ），行商。"},{phrase:"管弦",pos:"举酒欲饮无管弦",explain:"管，管乐器；弦，弦乐器。代指音乐。"},{phrase:"回灯",pos:"添酒回灯重开宴",explain:"重新拨亮灯光。"},{phrase:"拢、捻、抹、挑",pos:"轻拢慢捻抹复挑",explain:"琵琶弹奏指法。拢，叩弦；捻（niǎn），揉弦；抹，顺手下拨；挑，反手回拨。"},{phrase:"霓裳、六幺",pos:"初为《霓裳》后《六幺》",explain:"《霓裳羽衣曲》《六幺》皆为唐代名曲。"},{phrase:"间关",pos:"间关莺语花底滑",explain:"鸟鸣声，形容乐声婉转。"},{phrase:"幽咽",pos:"幽咽泉流冰下难",explain:"低微的哭泣声，形容乐声阻塞不畅。"},{phrase:"敛容",pos:"整顿衣裳起敛容",explain:"庄重而有礼貌的表情。"},{phrase:"虾蟆陵",pos:"家在虾蟆陵下住",explain:"在长安城南，为歌女聚居之地。原名\'下马陵\'。"},{phrase:"教坊",pos:"名属教坊第一部",explain:"唐代管理歌舞百戏的机构。"},{phrase:"缠头",pos:"五陵年少争缠头",explain:"送给歌舞妓的锦帛。"},{phrase:"秋娘",pos:"妆成每被秋娘妒",explain:"唐代歌妓的通名，也借指美女。"},{phrase:"青衫",pos:"江州司马青衫湿",explain:"青色官服。唐制九品官服青色，白居易此时为从九品，故着青衫。"}],
      appreciation: "《琵琶行》是白居易于元和十一年（816年）所作的长篇叙事诗，是中国诗歌史上的杰作。\n\n创作背景：白居易因上书请捕刺杀宰相武元衡的刺客，得罪权贵，被贬为江州司马。他在浔阳江头送客时，听到一位长安歌女弹奏琵琶，感其身世与己相似，遂作此诗。\n\n艺术特色：1. 音乐描写出神入化——用\"大珠小珠落玉盘\"\"银瓶乍破水浆迸\"等比喻写琵琶声，化无形为有形，成为描写音乐的千古绝唱；2. 叙事抒情结合——以琵琶女的遭遇为线索，将自己的身世之感融入其中；3. 结构严谨——序言交代背景，正文依次写送客、闻声、邀见、弹奏、自述、感慨，层层推进；4. 双线交织——琵琶女的身世和诗人的遭遇两条线索在\"同是天涯沦落人\"处汇合。\n\n思想情感：诗人通过琵琶女昔盛今衰的悲惨遭遇，寄寓自己被贬的愤懑和失意。\"同是天涯沦落人，相逢何必曾相识\"将歌女与诗人、底层与士大夫的命运联系起来，体现了深厚的人文关怀。\n\n名句：\"同是天涯沦落人，相逢何必曾相识\"\"千呼万唤始出来，犹抱琵琶半遮面\"\"大珠小珠落玉盘\"\"此时无声胜有声\"等，均为千古名句。"
    },
    {
      id:'lipingkonghouyin', title:'李凭箜篌引', author:'李贺', authorId:'lihe', cat:'gushici',
      audio:'resource/audio/lipingkonghouyin.aac',
      text:'吴丝蜀桐张高秋，空山凝云颓不流。\n江娥啼竹素女愁，李凭中国弹箜篌。\n昆山玉碎凤凰叫，芙蓉泣露香兰笑。\n十二门前融冷光，二十三丝动紫皇。\n女娲炼石补天处，石破天惊逗秋雨。\n梦入神山教神妪，老鱼跳波瘦蛟舞。\n吴质不眠倚桂树，露脚斜飞湿寒兔。',
      translation: "用吴地的丝弦蜀地的桐木制成的箜篌，在秋高气爽时弹奏，声音激越使空山的凝云也停滞不流。\n湘妃为之悲啼于竹林，素女为之忧愁，只因李凭在国都弹奏箜篌。\n乐声如昆山玉碎般清脆，又如凤凰鸣叫般嘹亮，像荷花泣露般凄婉，像兰花含笑般明丽。\n清冷的光辉融化了长安十二门前的冷气，二十三根丝弦的乐声惊动了天上的紫皇。\n乐声传到女娲炼石补天的地方，把天惊破了，引得秋雨倾盆。\n乐声如梦入神山教神妪弹奏，老鱼在波浪中跳跃，瘦弱的蛟龙也在起舞。\n月宫中的吴刚被乐声迷住，倚着桂树不眠，露水斜飞打湿了月中的寒兔。",
      notes: [{phrase:"吴丝蜀桐",pos:"吴丝蜀桐张高秋",explain:"吴地的丝作弦，蜀地的桐木作琴身。指箜篌的精美。"},{phrase:"张",pos:"吴丝蜀桐张高秋",explain:"弹奏。"},{phrase:"高秋",pos:"吴丝蜀桐张高秋",explain:"深秋九月，秋高气爽之时。"},{phrase:"颓不流",pos:"空山凝云颓不流",explain:"凝滞不流。颓，凝滞。"},{phrase:"江娥",pos:"江娥啼竹素女愁",explain:"即湘妃娥皇、女英。传说舜死于苍梧，二妃追至湘江，溺死，化为湘水之神，泪水洒在竹上成斑竹。"},{phrase:"素女",pos:"江娥啼竹素女愁",explain:"古代传说中的神女，善弹瑟。"},{phrase:"中国",pos:"李凭中国弹箜篌",explain:"国都之中，指长安。"},{phrase:"昆山",pos:"昆山玉碎凤凰叫",explain:"昆仑山，产美玉。"},{phrase:"十二门",pos:"十二门前融冷光",explain:"长安城四面各三门，共十二门。"},{phrase:"二十三丝",pos:"二十三丝动紫皇",explain:"指箜篌。李凭所弹为二十三弦的竖箜篌。"},{phrase:"紫皇",pos:"二十三丝动紫皇",explain:"道教最高的神仙。"},{phrase:"女娲炼石补天",pos:"女娲炼石补天处",explain:"古代神话，女娲炼五色石补天。"},{phrase:"石破天惊",pos:"石破天惊逗秋雨",explain:"乐声使补过的天又破了，引得秋雨。后成成语。"},{phrase:"逗",pos:"石破天惊逗秋雨",explain:"引出。"},{phrase:"神妪",pos:"梦入神山教神妪",explain:"神妪（yù），神话中的女仙，善弹箜篌。"},{phrase:"吴质",pos:"吴质不眠倚桂树",explain:"即吴刚，神话中在月宫伐桂树的人。"},{phrase:"露脚",pos:"露脚斜飞湿寒兔",explain:"露水下落的形象化说法。"},{phrase:"寒兔",pos:"露脚斜飞湿寒兔",explain:"传说月中有白兔捣药。"}],
      appreciation: "《李凭箜篌引》是中唐诗人李贺的代表作之一，是一首描写音乐的诗篇，与白居易《琵琶行》、韩愈《听颖师弹琴》并称\"摹写声音至文\"。李凭是梨园中著名的箜篌演奏家，深得唐宪宗赏识，元和年间名震一时。\n\n创作背景：此诗作于唐宪宗元和六年（811年）至元和八年（813年）间，李贺在长安任奉礼郎时。诗人聆听李凭演奏箜篌，被其精妙乐声深深打动，写下此诗。\n\n思想内容：全诗通过丰富奇特的想象，运用神话传说和大量比喻，生动描摹李凭弹奏箜篌的高超技艺与奇妙乐声，赞美其艺术境界。\n\n写作特色：1. 想象奇特——以神话传说入诗，用湘妃、素女、女娲、吴刚、月兔等意象烘托乐声，瑰丽诡谲；2. 比喻新奇——\"昆山玉碎凤凰叫，芙蓉泣露香兰笑\"以视觉形象写听觉感受，化无形为有形；3. 夸张大胆——\"石破天惊逗秋雨\"\"老鱼跳波瘦蛟舞\"等语句出人意表，惊心动魄；4. 不写听众反应而通过自然万物、神仙鬼魅的反应侧面烘托乐声之美，手法独特。\n\n名句价值：\"昆山玉碎凤凰叫，芙蓉泣露香兰笑\"\"石破天惊逗秋雨\"等句成为描写音乐的千古名句，\"石破天惊\"更成为常用成语。"
    },
    {
      id:'pusaman', title:'菩萨蛮（小山重叠金明灭）', author:'温庭筠', authorId:'wentingyun', cat:'gushici',
      audio:'resource/audio/pusaman.aac',
      text:'小山重叠金明灭，鬓云欲度香腮雪。\n懒起画蛾眉，弄妆梳洗迟。\n照花前后镜，花面交相映。\n新帖绣罗襦，双双金鹧鸪。',
      translation: "屏风上重重叠叠的山景，金碧山水在晨光中明灭不定，如云的鬓发将要掩过雪白飘香的脸颊。\n懒洋洋地起床画着蛾眉，慢慢梳妆打扮迟迟才完成。\n用前后两面镜子照看头上簪的花，花朵和容颜交相辉映。\n新贴上花样绣成罗短衣，上面绣着一对对金色鹧鸪。",
      notes: [{phrase:"小山",pos:"小山重叠金明灭",explain:"屏风上画的山景。一说为眉毛的形状。"},{phrase:"金明灭",pos:"小山重叠金明灭",explain:"指屏风上金碧山水的光辉忽明忽暗。一说指阳光照在额黄上闪烁不定。"},{phrase:"鬓云",pos:"鬓云欲度香腮雪",explain:"如云的鬓发。"},{phrase:"欲度",pos:"鬓云欲度香腮雪",explain:"将要掩过。形容鬓发散乱下垂之态。"},{phrase:"香腮雪",pos:"鬓云欲度香腮雪",explain:"雪白飘香的脸颊。"},{phrase:"蛾眉",pos:"懒起画蛾眉",explain:"像蚕蛾触须般弯曲细长的眉毛。"},{phrase:"弄妆",pos:"弄妆梳洗迟",explain:"化妆。弄，摆弄、修饰。"},{phrase:"罗襦",pos:"新帖绣罗襦",explain:"丝绸短衣。襦（rú），短衣。"},{phrase:"帖",pos:"新帖绣罗襦",explain:"通\'贴\'，贴上花样再绣。"},{phrase:"鹧鸪",pos:"双双金鹧鸪",explain:"鸟名。这里指绣衣上的金色鹧鸪图案，反衬女子的孤独。"}],
      appreciation: "《菩萨蛮·小山重叠金明灭》是晚唐词人温庭筠的代表作，也是其《菩萨蛮》十四首中最著名的一首，被誉为\"花间词\"的典范之作。温庭筠是花间派词人的鼻祖，其词以浓艳绮丽著称。\n\n创作背景：本词为代言体，以女子口吻写闺中之情。所写闺中女子容貌美丽却独守空闺，梳妆打扮后无人欣赏，流露出孤独寂寞之情。\n\n思想内容：上阕写女子起床梳妆的过程——\"懒起\"\"迟\"字透露出一种慵懒孤寂之情；下阕写簪花照镜、贴绣罗衣，以成双成对的鹧鸪反衬女子形单影只的孤寂，含蓄蕴藉。\n\n写作特色：1. 工笔细描——以极其细腻的笔触描写女子的容貌、衣着、动作，色彩浓艳，画面感强；2. 用字精当——\"懒\"\"迟\"二字传神地写出女子的慵懒孤寂；3. 反衬手法——以\"双双金鹧鸪\"反衬女子之孤独，以艳景写哀情；4. 客观描绘，不直接抒情，而情自在其中，体现花间词\"深美闳约\"的特色。\n\n名句价值：\"懒起画蛾眉，弄妆梳洗迟\"\"照花前后镜，花面交相映\"为传诵名句，对后世闺情词影响深远，奠定了花间词的基本风格。"
    },
    {
      id:'jinse', title:'锦瑟', author:'李商隐', authorId:'lishangyin', cat:'gushici',
      audio:'resource/audio/jinse.aac',
      text:'锦瑟无端五十弦，一弦一柱思华年。\n庄生晓梦迷蝴蝶，望帝春心托杜鹃。\n沧海月明珠有泪，蓝田日暖玉生烟。\n此情可待成追忆？只是当时已惘然。',
      translation: "锦瑟为什么偏偏有五十根弦呢？每一根弦每一个柱都让我追忆青春年华。\n庄周在拂晓的梦中迷惘地化成蝴蝶，望帝把春日的心事托付给杜鹃。\n沧海之上明月皎洁，珍珠如同眼泪；蓝田山上日光温暖，美玉生出烟雾。\n这种感情难道要等到成为回忆时才追忆？只是当时就已经惘然若失了。",
      notes: [{phrase:"锦瑟",pos:"锦瑟无端五十弦",explain:"装饰华美的瑟。瑟（sè），古代弦乐器，相传本有五十弦。"},{phrase:"无端",pos:"锦瑟无端五十弦",explain:"没来由地、无故。此处含嗔怨之意。"},{phrase:"五十弦",pos:"锦瑟无端五十弦",explain:"《汉书·郊祀志》载\'泰帝使素女鼓五十弦瑟，悲，帝禁不止，故破其瑟为二十五弦\"。此处可能指瑟之弦数，也可能借指年龄（李商隐约四十多岁作此诗）。"},{phrase:"思华年",pos:"一弦一柱思华年",explain:"追忆青春年华。华年，美好的年华。"},{phrase:"庄生晓梦迷蝴蝶",pos:"庄生晓梦迷蝴蝶",explain:"《庄子·齐物论》载\'庄周梦为蝴蝶\'，醒来不知是庄周梦为蝴蝶，还是蝴蝶梦为庄周。喻人生如梦、物我两忘。"},{phrase:"望帝春心托杜鹃",pos:"望帝春心托杜鹃",explain:"传说蜀王杜宇（号望帝）死后化为杜鹃鸟，啼声哀切。喻悲剧性的执着和追求。"},{phrase:"沧海月明珠有泪",pos:"沧海月明珠有泪",explain:"《博物志》载南海有鲛人，泣泪成珠。月明时珠光如泪。"},{phrase:"蓝田日暖玉生烟",pos:"蓝田日暖玉生烟",explain:"蓝田山在今陕西，产美玉。司空图引戴叔伦语\'诗家之景，如蓝田日暖，良玉生烟，可望而不可置于眉睫之前也\'。喻美好而渺茫的境界。"},{phrase:"可待",pos:"此情可待成追忆",explain:"难道要等到。可，难道、岂。"},{phrase:"惘然",pos:"只是当时已惘然",explain:"惘（wǎng）然，失意的样子、迷茫若失。"}],
      appreciation: "《锦瑟》是李商隐的代表作，也是唐诗中最费解的名篇之一，自宋清以来有\"爱情说\"\"悼亡说\"\"自伤说\"\"咏物说\"\"诗序说\"等多种解读。\n\n创作背景：此诗大约作于李商隐妻子死后（约858年），诗人在晚年回顾一生时所作。李商隐一生陷入牛李党争，政治上郁郁不得志，又遭丧妻之痛，心境悲凉。\n\n艺术特色：1. 用典精妙——颔联颈联连用庄周梦蝶、望帝啼鹃、鲛人泣珠、蓝田生玉四个典故，意象朦胧而美丽；2. 象征朦胧——全诗没有直接抒情，所有情感都通过典故和意象暗示，造就\"诗无达诂\"的朦胧美；3. 对仗工整——中间两联对仗精工，意象鲜明；4. 起承转合——首联起兴，中间两联铺陈，尾联归结到\"惘然\"，结构严密。\n\n思想情感：无论何种解读，全诗都笼罩着一种怅惘迷茫的感情氛围，表达了对美好事物的追忆、对人生如梦的感慨、对逝去爱情的怀念。\"此情可待成追忆，只是当时已惘然\"道出了人生中一种普遍的体验：当时已感迷茫，事后再追忆更添惆怅。\n\n名句：\"此情可待成追忆，只是当时已惘然\"已成千古名句。"
    },
    {
      id:'yumeiren', title:'虞美人（春花秋月何时了）', author:'李煜', authorId:'liyu', cat:'gushici',
      audio:'resource/audio/yumeiren.aac',
      text:'春花秋月何时了？往事知多少。\n小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。\n问君能有几多愁？恰似一江春水向东流。',
      translation: "春花秋月什么时候才能了结？往事知道有多少。\n小楼昨夜又刮起东风，明月之中不堪回首那故国。\n雕花的栏杆玉石的台阶应该还在，只是那红润的容颜已经改变。\n问你能够有多少愁绪？恰好像一江春水向东流去。",
      notes: [{phrase:"了",pos:"春花秋月何时了",explain:"了结、终结。"},{phrase:"东风",pos:"小楼昨夜又东风",explain:"春风。东风吹起，又是春天来到，暗指又过了一年。"},{phrase:"故国",pos:"故国不堪回首月明中",explain:"旧国、亡国。指南唐故都金陵（今南京）。"},{phrase:"雕栏玉砌",pos:"雕栏玉砌应犹在",explain:"雕花栏杆和玉石台阶，代指南唐宫殿。砌（qì），台阶。"},{phrase:"朱颜改",pos:"只是朱颜改",explain:"红润的容颜变得憔悴衰老。一说指宫殿颜色改变。"},{phrase:"几多",pos:"问君能有几多愁",explain:"多少。"},{phrase:"一江春水向东流",pos:"恰似一江春水向东流",explain:"用春水东流比喻愁绪绵延不尽。长江流经南唐故都金陵。"}],
      appreciation: "《虞美人》是李煜的代表作，也是他绝命词，被誉为\"词中之帝\"。\n\n创作背景：李煜是南唐后主，亡国后被俘至汴京（今开封），被封为违命侯，过着\"日夕只以眼泪洗面\"的囚徒生活。太平兴国三年（978年）七夕，他四十二岁生日时作此词，宋太宗闻之怒，赐牵机药毒死李煜。\n\n艺术特色：1. 设问巧妙——\"春花秋月何时了\"以美景反衬哀情，越是美好越勾起亡国之痛；2. 比喻精妙——\"问君能有几多愁，恰似一江春水向东流\"将抽象的愁绪化为具象的江水，连绵不绝，成为写愁的千古绝唱；3. 对比手法——\"应犹在\"\"改\"对比物是人非；4. 语言自然——不加雕饰，纯以真情动人，体现了李煜\"不假雕饰，纯任性情\"的词风。\n\n思想情感：全词以\"愁\"为脉络，通过今昔对比、景物映衬，抒发了亡国之君深重的故国之思和亡国之恨。\"不堪回首\"四字包含着极大的痛苦和悔恨。\n\n影响：王国维《人间词话》评\"词至李后主而眼界始大，感慨遂深\"，此词标志着词从花间派的脂粉气中解放出来，开始抒发真挚深沉的人生感慨。"
    },
    {
      id:'wanghaichao', title:'望海潮（东南形胜）', author:'柳永', authorId:'liuyong', cat:'gushici',
      audio:'resource/audio/wanghaichao.aac',
      text:'东南形胜，三吴都会，钱塘自古繁华。\n烟柳画桥，风帘翠幕，参差十万人家。\n云树绕堤沙，怒涛卷霜雪，天堑无涯。\n市列珠玑，户盈罗绮，竞豪奢。\n\n重湖叠巘清嘉，有三秋桂子，十里荷花。\n羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。\n千骑拥高牙，乘醉听箫鼓，吟赏烟霞。\n异日图将好景，归去凤池夸。',
      translation: "东南一带形势优越的地方，三吴的繁华都市，钱塘自古以来就繁华。\n如烟的柳树和彩画的长桥，挡风的帘子和翠绿色的帷幕，错落有致住着十万户人家。\n高耸入云的树木环绕着江堤沙滩，怒涛翻卷着像霜雪一样的浪花，广阔无涯的天堑。\n市集上陈列着珍珠美玉，家家户户堆满绫罗绸缎，竞相夸耀奢华。\n\n里湖外湖和重叠的山峰清秀美丽，有秋天的桂子和十里荷花。\n晴朗的日子里吹奏着羌笛，夜晚泛舟采菱唱歌，老渔翁和采莲少女都十分欢乐。\n千骑簇拥着高官，乘着酒意听着箫鼓之声，吟咏赏玩烟霞美景。\n他日把这美景画成图，回到朝廷向同僚夸耀。",
      notes: [{phrase:"形胜",pos:"东南形胜",explain:"地理形势优越的地方。"},{phrase:"三吴",pos:"三吴都会",explain:"吴兴、吴郡、会稽，泛指江浙一带。"},{phrase:"都会",pos:"三吴都会",explain:"大城市。"},{phrase:"钱塘",pos:"钱塘自古繁华",explain:"即杭州。"},{phrase:"画桥",pos:"烟柳画桥",explain:"雕饰华美的桥。"},{phrase:"风帘翠幕",pos:"风帘翠幕",explain:"挡风的帘子和翠绿色的帷幕。"},{phrase:"参差",pos:"参差十万人家",explain:"错落的样子。"},{phrase:"云树",pos:"云树绕堤沙",explain:"高耸入云的树木。"},{phrase:"天堑",pos:"天堑无涯",explain:"天然的壕沟，此指钱塘江。"},{phrase:"珠玑",pos:"市列珠玑",explain:"玑（jī），不圆的珠。珠玑泛指珍珠美玉。"},{phrase:"重湖",pos:"重湖叠巘清嘉",explain:"西湖有里湖外湖，故称重湖。"},{phrase:"叠巘",pos:"重湖叠巘清嘉",explain:"巘（yǎn），山峰。重叠的山峰。"},{phrase:"清嘉",pos:"重湖叠巘清嘉",explain:"清秀美丽。"},{phrase:"三秋",pos:"三秋桂子",explain:"秋季三个月，也指深秋。"},{phrase:"羌管",pos:"羌管弄晴",explain:"笛子。出自羌地，故称。"},{phrase:"高牙",pos:"千骑拥高牙",explain:"高大的牙旗，借指高级长官。此指孙何。"},{phrase:"凤池",pos:"归去凤池夸",explain:"凤凰池，中书省的别称，借指朝廷。"}],
      appreciation: "《望海潮·东南形胜》是北宋词人柳永的代表作之一，是描写杭州城市繁华与西湖美景的千古名篇。此词约作于宋真宗咸平末年（1003年前后），是柳永赠给当时任两浙转运使的故友孙何之作。\n\n创作背景：柳永年轻时曾漫游杭州，对杭州的繁华景象与西湖的美丽风光有深刻感受。为投赠时任两浙转运使的故友孙何，写下这首赞美杭州的词作。\n\n思想内容：上阕描写杭州的地理形势、历史背景和城市繁华——\"东南形胜，三吴都会\"点明位置，\"烟柳画桥\"\"市列珠玑\"等铺写都市繁华；下阕描写西湖美景和百姓的安乐生活，最后以赞颂孙何作结。\n\n写作特色：1. 铺叙手法——大量使用铺陈手法，从地理、历史、市井、风景多角度描写，气象宏大，是慢词铺叙的典范；2. 对偶工整——\"三秋桂子，十里荷花\"\"羌管弄晴，菱歌泛夜\"等对仗精工；3. 数字运用——\"十万\"\"三秋\"\"十里\"\"千骑\"等数字使描写具体而夸张；4. 雅俗共赏——既有\"烟柳画桥\"之雅，又有\"嬉嬉钓叟莲娃\"之俗。\n\n名句价值：\"三秋桂子，十里荷花\"为传诵名句，相传金主完颜亮读到这两句，艳慕杭州，遂起投鞭渡江之志。\"市列珠玑，户盈罗绮\"也成为描写都市繁华的常用名句。"
    },
    {
      id:'guizhixiang', title:'桂枝香·金陵怀古', author:'王安石', authorId:'wanganshi', cat:'gushici',
      audio:'resource/audio/guizhixiang.aac',
      text:'登临送目，正故国晚秋，天气初肃。\n千里澄江似练，翠峰如簇。\n归帆去棹残阳里，背西风，酒旗斜矗。\n彩舟云淡，星河鹭起，画图难足。\n\n念往昔，繁华竞逐，叹门外楼头，悲恨相续。\n千古凭高对此，谩嗟荣辱。\n六朝旧事随流水，但寒烟衰草凝绿。\n至今商女，时时犹唱，后庭遗曲。',
      translation: "登高远眺，正是故都晚秋时节，天气刚刚变得肃杀。\n千里的清澈江水像白练一般，翠绿的山峰像箭头般聚簇。\n归航的帆船在夕阳中穿行，背着西风，酒旗斜斜地竖立着。\n彩舟如在淡云中穿行，银河下白鹭飞起，美景连画图也难以描摹尽致。\n\n回想往昔，人们竞相追逐繁华，可叹隋军兵临城下时，陈后主还在和妃子寻欢作乐，悲恨相继不断。\n千年来人们登高凭吊此景，徒然感叹兴亡荣辱。\n六朝旧事都随着流水消逝，只剩下寒烟衰草凝成一片翠绿。\n到如今那些歌女们，还时不时在唱着那首亡国之音《玉树后庭花》。",
      notes: [{phrase:"登临送目",pos:"登临送目",explain:"登山临水眺望远方。"},{phrase:"故国",pos:"正故国晚秋",explain:"旧都，指金陵（今南京）。"},{phrase:"肃",pos:"天气初肃",explain:"肃杀、萧索。"},{phrase:"练",pos:"千里澄江似练",explain:"白绢。比喻江水澄澈。"},{phrase:"簇",pos:"翠峰如簇",explain:"簇（cù），聚集。指山峰攒聚如箭头。"},{phrase:"归帆去棹",pos:"归帆去棹残阳里",explain:"往来的船只。棹（zhào），船桨，代指船。"},{phrase:"酒旗",pos:"酒旗斜矗",explain:"酒楼悬挂的布招牌。"},{phrase:"矗",pos:"酒旗斜矗",explain:"矗（chù），直立。"},{phrase:"星河",pos:"星河鹭起",explain:"银河。这里指星空下的长江。"},{phrase:"画图难足",pos:"画图难足",explain:"画图也难以完全描绘。足，完备。"},{phrase:"繁华竞逐",pos:"繁华竞逐",explain:"竞相追逐繁华。"},{phrase:"门外楼头",pos:"叹门外楼头",explain:"指隋朝大将韩擒虎攻破金陵朱雀门时，陈后主还在结绮阁上和张丽华寻欢。用杜牧\'门外韩擒虎，楼头张丽华\'句意。"},{phrase:"谩嗟",pos:"谩嗟荣辱",explain:"徒然感叹。谩，通\'漫\'，徒然。"},{phrase:"六朝",pos:"六朝旧事随流水",explain:"吴、东晋、宋、齐、梁、陈，均建都于金陵。"},{phrase:"商女",pos:"至今商女",explain:"歌女。"},{phrase:"后庭遗曲",pos:"后庭遗曲",explain:"指陈后主所作《玉树后庭花》，被视为亡国之音。"}],
      appreciation: "《桂枝香·金陵怀古》是北宋政治家、文学家王安石的怀古词代表作，被誉为\"金陵怀古之绝唱\"。此词约作于王安石晚年退居金陵时期（约1076年后），时诗人政治失意，登高远眺，抚今追昔而作。\n\n创作背景：金陵为六朝古都，历来为怀古之地。王安石变法失败后退居金陵，登高远眺，看到金陵山水依旧而六朝繁华已成陈迹，触景生情，写下了这首怀古词。\n\n思想内容：上阕描绘金陵壮丽秋景——澄江似练、翠峰如簇、酒旗斜矗、白鹭飞起，画面壮阔；下阕转入怀古——由\"念往昔\"引出对六朝兴亡的慨叹，以\"门外楼头\"讽刺陈后主荒淫误国，最后以\"至今商女\"\"后庭遗曲\"作结，借古讽今，警醒世人勿重蹈覆辙。\n\n写作特色：1. 上阕写景下阕怀古，结构谨严；2. 比喻精当——\"澄江似练\"\"翠峰如簇\"形象生动；3. 用典贴切——\"门外楼头\"用杜牧诗意，\"后庭遗曲\"用陈后主典，含蓄有力；4. 立意高远——非一般怀古词的悲叹，而含借古讽今之意；5. 笔力雄健，气象宏大，一扫五代以来词的柔靡之风。\n\n名句价值：\"千里澄江似练，翠峰如簇\"\"至今商女，时时犹唱，后庭遗曲\"为传诵名句，对后世怀古词影响深远。苏轼赞此词\"此老乃野狐精也\"。"
    },
    {
      id:'jiangchengzi', title:'江城子·乙卯正月二十日夜记梦', author:'苏轼', authorId:'sushi', cat:'gushici',
      audio:'resource/audio/jiangchengzi.aac',
      text:'十年生死两茫茫，不思量，自难忘。\n千里孤坟，无处话凄凉。\n纵使相逢应不识，尘满面，鬓如霜。\n\n夜来幽梦忽还乡，小轩窗，正梳妆。\n相顾无言，惟有泪千行。\n料得年年肠断处，明月夜，短松冈。',
      translation: "十年生死相隔，两处茫茫都不知晓，即使不去想念，也自然难以忘怀。\n你孤零零的坟墓在千里之外，我到哪里去倾诉心中的凄凉？\n纵然现在相逢你也该认不出我了，我已满脸风尘，两鬓如霜。\n\n夜里忽然梦见自己回到了家乡，你正坐在小窗前对镜梳妆。\n我们相看无言，只有眼泪流下千行。\n料想年年让我肝肠寸断的地方，就是那明月高悬之夜，长着小松树的坟冈。",
      notes: [{phrase:"茫茫",pos:"十年生死两茫茫",explain:"形容遥远、不清楚。这里指生死隔绝、音讯渺茫。"},{phrase:"思量",pos:"不思量，自难忘",explain:"想念。"},{phrase:"千里孤坟",pos:"千里孤坟",explain:"苏轼之妻王弗葬于四川眉山，苏轼时任密州知州，相隔千里。"},{phrase:"尘满面",pos:"尘满面，鬓如霜",explain:"形容自己奔波劳碌、容颜衰老。"},{phrase:"鬓如霜",pos:"尘满面，鬓如霜",explain:"两鬓白如霜。"},{phrase:"幽梦",pos:"夜来幽梦忽还乡",explain:"梦境隐约。"},{phrase:"轩窗",pos:"小轩窗，正梳妆",explain:"轩窗，窗户。"},{phrase:"顾",pos:"相顾无言",explain:"看。"},{phrase:"料得",pos:"料得年年肠断处",explain:"料想。"},{phrase:"短松冈",pos:"明月夜，短松冈",explain:"长着小松树的山冈，指王弗墓地。古人墓地多种松柏。"}],
      appreciation: "《江城子·乙卯正月二十日夜记梦》是北宋文学家苏轼悼念亡妻王弗的词作，是中国文学史上最著名的悼亡词之一。乙卯年为宋神宗熙宁八年（1075年），苏轼时任密州知州。其妻王弗于英宗治平二年（1065年）病逝于京师，距写词时正好十年。\n\n创作背景：苏轼之妻王弗温柔贤淑，知书达礼，与苏轼感情深厚。王弗早逝后，苏轼始终难以忘怀。熙宁八年正月二十日夜，苏轼梦见了亡妻，醒后写下这首悼亡词。\n\n思想内容：上阕写现实——\"十年生死两茫茫\"写生死相隔的悲苦，\"千里孤坟，无处话凄凉\"写相隔遥远之痛，\"纵使相逢应不识\"更进一层写自己的衰老沧桑；下阕写梦境——梦中回到故乡见到妻子对镜梳妆，相顾无言唯有泪千行，情景真切，悲恸欲绝；结尾\"明月夜，短松冈\"回到现实，以景结情，余韵悠长。\n\n写作特色：1. 虚实结合——上阕实写现实之感，下阕虚写梦中相见，由实到虚，再由虚到实；2. 情真意切——\"不思量，自难忘\"\"相顾无言，惟有泪千行\"等句感情真挚，催人泪下；3. 想象入妙——\"纵使相逢应不识\"设想奇特，进一层写哀；4. 以景结情——\"明月夜，短松冈\"以冷寂之景作结，余味无穷；5. 语言朴素，不事雕饰，而情致缠绵。\n\n名句价值：\"十年生死两茫茫，不思量，自难忘\"\"相顾无言，惟有泪千行\"为传诵名句，成为悼亡文学的千古绝唱。"
    },
    {
      id:'niannujiao', title:'念奴娇·赤壁怀古', author:'苏轼', authorId:'sushi', cat:'gushici',
      audio:'resource/audio/niannujiao.aac',
      text:'大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。',
      translation: "大江向东流去，浪涛淘尽千古以来的风流人物。\n旧时营垒的西边，人们说那就是三国时周瑜大破曹军的赤壁。\n乱石直插云空，惊涛拍打着江岸，卷起千堆雪白的浪花。\n江山美如图画，一时之间涌现出多少英雄豪杰。\n\n遥想当年的周公瑾，小乔刚嫁给他，英姿勃发才华横溢。\n手摇羽扇头戴纶巾，谈笑之间，曹操的舰队灰飞烟灭。\n神游于当年的故国战场，多情的人应该笑我，过早地生出白发。\n人生如同一场梦，还是洒一杯酒祭奠这江上的明月吧。",
      notes: [{phrase:"风流人物",pos:"千古风流人物",explain:"杰出的英雄人物。"},{phrase:"故垒",pos:"故垒西边",explain:"旧时的营垒。"},{phrase:"周郎",pos:"三国周郎赤壁",explain:"周瑜，字公瑾，三国时吴军主将。他任建威中郎将时年仅二十四岁，吴中皆呼为\'周郎\'。"},{phrase:"雪",pos:"卷起千堆雪",explain:"比喻浪花。"},{phrase:"小乔",pos:"小乔初嫁了",explain:"三国时乔公的次女，嫁周瑜。与其姊大乔合称\'二乔\'。"},{phrase:"英发",pos:"雄姿英发",explain:"英气勃发。形容周瑜才华出众。"},{phrase:"羽扇纶巾",pos:"羽扇纶巾",explain:"羽毛扇和青丝帛头巾，古代儒将装束。此处指周瑜。纶（guān）巾。"},{phrase:"樯橹",pos:"樯橹灰飞烟灭",explain:"桅杆和船桨，代指曹军战船。樯（qiáng），桅杆。橹（lǔ），船桨。一作\'强虏\'。"},{phrase:"故国神游",pos:"故国神游",explain:"精神漫游于古代战场。故国，旧地，指赤壁古战场。"},{phrase:"华发",pos:"早生华发",explain:"花白的头发。华，花白。"},{phrase:"尊",pos:"一尊还酹江月",explain:"同\'樽\'，酒器。"},{phrase:"酹",pos:"一尊还酹江月",explain:"酹（lèi），把酒洒在地上祭奠。"}],
      appreciation: "《念奴娇·赤壁怀古》是苏轼贬谪黄州时所作的词，是宋词豪放派的代表作品，被誉为\"古今绝唱\"。\n\n创作背景：宋神宗元丰五年（1082年），苏轼因\"乌台诗案\"被贬为黄州团练副使已近三年。七月，他游黄州赤壁（并非三国赤壁之战的真正发生地），借赤壁之名怀古抒怀。\n\n艺术特色：1. 气魄宏大——开篇\"大江东去\"以壮阔景象笼罩全篇，将时间（千古）与空间（大江）交融；2. 写景绘声——\"乱石穿空，惊涛拍岸，卷起千堆雪\"动静结合，色彩鲜明；3. 人物勾勒——\"羽扇纶巾，谈笑间，樯橹灰飞烟灭\"以少总多，周瑜的英姿跃然纸上；4. 对比反衬——以周瑜的少年得志反衬自己的老大无为，以古英雄反衬今日的失意。\n\n思想情感：上阕咏赤壁怀古，下阕怀周瑜以自伤。\"多情应笑我，早生华发\"抒发了岁月蹉跎、功业未就的感慨，但\"人生如梦，一尊还酹江月\"又将一己之愁消解于江月之中，体现了苏轼旷达洒脱的人生态度。\n\n名句：\"大江东去，浪淘尽，千古风流人物\"成为豪放词的开山之作；\"人生如梦，一尊还酹江月\"体现苏轼超然达观的胸怀。"
    },
    {
      id:'dengkuaige', title:'登快阁', author:'黄庭坚', authorId:'huangtingjian', cat:'gushici',
      audio:'resource/audio/dengkuaige.aac',
      text:'痴儿了却公家事，快阁东西倚晚晴。\n落木千山天远大，澄江一道月分明。\n朱弦已为佳人绝，青眼聊因美酒横。\n万里归船弄长笛，此心吾与白鸥盟。',
      translation: "我这个痴人办完了公家的事务，靠在快阁东西两侧欣赏晚晴。\n千山落叶满天显得格外辽远空阔，一道清澈的江水倒映着分明的月色。\n红色的琴弦已经为知音断绝，青色的眼眸只因美酒才流盼。\n有朝一日乘船归去吹奏长笛，这颗心早已和白鸥订下盟约。",
      notes: [{phrase:"痴儿",pos:"痴儿了却公家事",explain:"痴人，傻小子。作者自嘲之词。用《晋书·傅咸传》\'生子痴，了官事\'典故。"},{phrase:"了却",pos:"痴儿了却公家事",explain:"办完。"},{phrase:"快阁",pos:"快阁东西倚晚晴",explain:"在今江西省泰和县，黄庭坚时任泰和知县。"},{phrase:"倚晚晴",pos:"快阁东西倚晚晴",explain:"倚阁眺望晚晴之景。"},{phrase:"落木",pos:"落木千山天远大",explain:"落叶。"},{phrase:"澄江",pos:"澄江一道月分明",explain:"清澈的江水，指赣江。"},{phrase:"朱弦已为佳人绝",pos:"朱弦已为佳人绝",explain:"用伯牙为钟子期绝弦的典故。佳人指知音。绝，断。"},{phrase:"青眼",pos:"青眼聊因美酒横",explain:"用阮籍青白眼典故。阮籍对喜欢的人以青眼视之，对讨厌的人以白眼视之。"},{phrase:"横",pos:"青眼聊因美酒横",explain:"流盼，目光转动。"},{phrase:"白鸥盟",pos:"此心吾与白鸥盟",explain:"与白鸥结盟，喻归隐田园。典出《列子·黄帝》海上有人与鸥鸟相亲。"}],
      appreciation: "《登快阁》是北宋诗人黄庭坚的代表作，是一首七言律诗。宋神宗元丰五年（1082年），黄庭坚任吉州泰和县（今江西泰和）知县，公事之余登快阁，写下此诗。\n\n创作背景：黄庭坚任泰和知县时，因官务繁杂、政局纷扰而心生厌倦，登快阁远眺，遂有归隐之意，写下此诗以抒怀。\n\n思想内容：首联写公事完毕后登阁远眺的轻松；颔联\"落木千山天远大，澄江一道月分明\"写登阁所见壮阔秋景，意境开阔；颈联用典抒怀，感叹世无知音，唯寄情美酒；尾联\"万里归船弄长笛，此心吾与白鸥盟\"表达归隐之志。\n\n写作特色：1. 用典精当——\"痴儿了官事\"用《晋书·傅咸传》典，\"朱弦绝\"用伯牙典，\"青眼\"用阮籍典，\"白鸥盟\"用《列子》典，自然贴切；2. 颔联\"落木千山天远大，澄江一道月分明\"意境开阔，被赞为\"能移人情\"；3. 由景入情，由感叹无知情到归隐之志，层次分明；4. 全诗一气呵成，气势连贯，格调高远。\n\n名句价值：\"落木千山天远大，澄江一道月分明\"为传诵名句，气象宏阔，可与杜甫\"无边落木萧萧下，不尽长江滚滚来\"媲美，对后世写景抒怀诗影响深远。"
    },
    {
      id:'queqiaoxian', title:'鹊桥仙（纤云弄巧）', author:'秦观', authorId:'qinguan', cat:'gushici',
      audio:'resource/audio/queqiaoxian.aac',
      text:'纤云弄巧，飞星传恨，银汉迢迢暗度。\n金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。\n两情若是久长时，又岂在朝朝暮暮。',
      translation: "纤细的云彩变幻出巧妙的花样，飞逝的流星传递着离愁别恨，牛郎织女悄悄渡过遥远的银河。\n秋风白露之夜一年一相逢，便胜过人间那些朝夕相伴的普通情侣。\n柔情像水一样绵长，美好的佳期如同梦境一般，怎么忍心回望鹊桥上回去的路？\n两人的感情若是长久深厚，又何必在乎朝朝暮暮的相伴。",
      notes: [{phrase:"纤云弄巧",pos:"纤云弄巧",explain:"纤细的云彩变幻出巧妙的花样。暗示织女巧手织云锦。"},{phrase:"飞星传恨",pos:"飞星传恨",explain:"飞逝的流星传递着离愁别恨。指牛郎织女的相思。"},{phrase:"银汉",pos:"银汉迢迢暗度",explain:"银河。"},{phrase:"迢迢",pos:"银汉迢迢暗度",explain:"遥远的样子。"},{phrase:"暗度",pos:"银汉迢迢暗度",explain:"悄悄渡过。"},{phrase:"金风",pos:"金风玉露一相逢",explain:"秋风。古代以五行配四季，秋属金。"},{phrase:"玉露",pos:"金风玉露一相逢",explain:"白露，秋天的露水。"},{phrase:"佳期",pos:"佳期如梦",explain:"美好的相会之期。"},{phrase:"忍顾",pos:"忍顾鹊桥归路",explain:"怎么忍心回头看。"},{phrase:"鹊桥",pos:"忍顾鹊桥归路",explain:"传说七夕时喜鹊在银河上搭成的桥，供牛郎织女相会。"},{phrase:"朝朝暮暮",pos:"又岂在朝朝暮暮",explain:"每天早晚，指朝夕相伴。"}],
      appreciation: "《鹊桥仙·纤云弄巧》是北宋词人秦观的一首七夕词，是吟咏牛郎织女故事的千古绝唱，被誉为\"七夕词之冠\"。秦观为\"苏门四学士\"之一，词风婉约细腻。\n\n创作背景：本词以七夕牛郎织女相会的神话为题材。七夕为农历七月初七，传说牛郎织女此夜在天河相会，民间有乞巧风俗。秦观借这一传统题材，翻出新意，写下了这首名作。\n\n思想内容：上阕写七夕相会——\"纤云弄巧，飞星传恨，银汉迢迢暗度\"描绘牛郎织女渡银河相会的情景，\"金风玉露一相逢，便胜却人间无数\"以极高格调赞颂爱情之珍贵，胜过世俗朝夕相伴；下阕写离别——\"柔情似水，佳期如梦\"写相会短暂，\"忍顾鹊桥归路\"写离别不舍，最后\"两情若是久长时，又岂在朝朝暮暮\"以警策之语作结，提出爱情贵在长久而非朝夕相守的见解。\n\n写作特色：1. 立意翻新——一反前人写七夕的哀怨情调，肯定牛郎织女爱情的崇高与珍贵；2. 警策之句——\"金风玉露一相逢，便胜却人间无数\"\"两情若是久长时，又岂在朝朝暮暮\"为千古名句，蕴含哲理；3. 比喻精巧——\"柔情似水，佳期如梦\"以水、梦喻情喻期，形象贴切；4. 写景、抒情、议论融为一体，情景交融，议论警醒。\n\n名句价值：\"金风玉露一相逢，便胜却人间无数\"\"两情若是久长时，又岂在朝朝暮暮\"成为歌颂真挚爱情的千古名句，对后世爱情文学影响深远。"
    },
    {
      id:'sumuzhe', title:'苏幕遮（燎沉香）', author:'周邦彦', authorId:'zhoubangyan', cat:'gushici',
      audio:'resource/audio/sumuzhe.aac',
      text:'燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。\n叶上初阳干宿雨，水面清圆，一一风荷举。\n故乡遥，何日去？家住吴门，久作长安旅。\n五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。',
      translation: "上阕：燃起沉香，消除潮湿闷热的暑气。鸟雀在屋檐上叽叽喳喳呼唤晴天，拂晓时分在檐边窥视着鸣叫。初升的太阳晒干了荷叶上昨夜的雨滴，水面上荷叶清润圆正，一一在风中挺举而起。\n下阕：故乡遥远，何日能归去？我家住在吴门，却长久客居在长安。五月的渔郎是否还在思念我？划着小桨驾着轻舟，在梦中驶入了荷花盛开的江浦。",
      notes: [{phrase:"燎",pos:"燎沉香",explain:"烧，焚。"},{phrase:"沉香",pos:"燎沉香",explain:"一种名贵的香料。"},{phrase:"溽暑",pos:"消溽暑",explain:"潮湿闷热的夏天。溽（rù），湿润。"},{phrase:"侵晓",pos:"侵晓窥檐语",explain:"拂晓，天刚亮。"},{phrase:"窥檐语",pos:"侵晓窥檐语",explain:"在屋檐下窥视着鸣叫。"},{phrase:"宿雨",pos:"叶上初阳干宿雨",explain:"昨夜的雨。"},{phrase:"清圆",pos:"水面清圆",explain:"清润圆正。"},{phrase:"风荷举",pos:"一一风荷举",explain:"荷叶在风中挺举。"},{phrase:"吴门",pos:"家住吴门",explain:"苏州旧称。"},{phrase:"长安",pos:"久作长安旅",explain:"借指北宋都城汴京。"},{phrase:"楫",pos:"小楫轻舟",explain:"楫（jí），船桨。"},{phrase:"芙蓉浦",pos:"梦入芙蓉浦",explain:"长满荷花的江岸。浦，水滨。"}],
      appreciation: "《苏幕遮·燎沉香》是北宋词人周邦彦的思乡名作。上阕写景，描绘了盛夏清晨的荷塘美景：\"水面清圆，一一风荷举\"是传神名句，写出了荷叶的清润圆正和风中挺立的姿态，被王国维在《人间词话》中赞为\"得荷之神理者\"。\n\n创作背景：周邦彦久客京师，时值盛夏，闻雨后鸟鸣、见风中之荷，思乡之情油然而生。\n\n艺术特色：下阕由景入情，从眼前的荷花联想到故乡的荷花，\"故乡遥，何日去\"直抒思乡之情。\"五月渔郎相忆否\"是词人由己及人的设想，\"小楫轻舟，梦入芙蓉浦\"以梦境收束，化实为虚，余韵悠长。全词以荷花为线索，将现实之景与梦境之乡交织，语言清新淡雅，是周邦彦婉约词风的代表作之一。"
    },
    {
      id:'shengshengman', title:'声声慢（寻寻觅觅）', author:'李清照', authorId:'liqingzhao', cat:'gushici',
      audio:'resource/audio/shengshengman.aac',
      text:'寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急！\n雁过也，正伤心，却是旧时相识。\n\n满地黄花堆积，憔悴损，如今有谁堪摘？\n守着窗儿，独自怎生得黑！\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个愁字了得！',
      translation: "苦苦地寻寻觅觅，却只见冷冷清清，凄凄惨惨悲悲戚戚。\n乍暖还寒的时节，最难调养休息。\n三杯两盏淡酒，怎能抵挡晚来风急！\n大雁飞过，正伤心时，却是旧时相识。\n\n满地黄花堆积，憔悴枯损，如今还有谁堪摘取？\n守着窗儿，独自怎么熬到天黑！\n梧桐叶上更兼细雨，到黄昏时分点点滴滴。\n这般光景，怎是一个\"愁\"字概括得了！",
      notes: [{phrase:"寻寻觅觅",pos:"寻寻觅觅",explain:"若有所失、四处寻找的样子。表现内心的空虚失落。"},{phrase:"凄凄惨惨戚戚",pos:"凄凄惨惨戚戚",explain:"忧愁悲伤的样子。戚戚（qī qī），忧愁。"},{phrase:"乍暖还寒",pos:"乍暖还寒时候",explain:"忽暖忽寒。指秋天多变的天气。"},{phrase:"将息",pos:"最难将息",explain:"调养休息、保养身体。"},{phrase:"敌",pos:"怎敌他、晚来风急",explain:"抵挡、对付。"},{phrase:"旧时相识",pos:"却是旧时相识",explain:"大雁从北方飞来，词人是北方人，故称\'旧时相识\'。古有雁足传书之说，看到大雁更引起对故国亲人的思念。"},{phrase:"黄花",pos:"满地黄花堆积",explain:"菊花。菊花秋季开放，象征秋天。"},{phrase:"损",pos:"憔悴损",explain:"衰败、枯损。此处指花也指人。"},{phrase:"堪",pos:"如今有谁堪摘",explain:"可以、能够。"},{phrase:"怎生",pos:"独自怎生得黑",explain:"怎么。怎生，怎么、怎样。"},{phrase:"次第",pos:"这次第，怎一个愁字了得",explain:"光景、情形。"},{phrase:"了得",pos:"怎一个愁字了得",explain:"概括得了、包含得了。"}],
      appreciation: "《声声慢》是李清照晚年所作的词，是婉约词的巅峰之作，被誉为\"千古第一悲秋之作\"。\n\n创作背景：此词作于李清照晚年。靖康之变后，北宋灭亡，李清照南渡避难，不久丈夫赵明诚病逝，她孤身流寓金华、临安一带，国破家亡、丧夫之痛与颠沛流离的孤独交织，遂作此词。\n\n艺术特色：1. 叠词运用——开篇\"寻寻觅觅，冷冷清清，凄凄惨惨戚戚\"连用十四个叠字，七组叠词，由浅入深，层层递进，开创词中叠词奇观；2. 以景写情——选用淡酒、晚风、过雁、黄花、梧桐、细雨等秋日意象，渲染凄凉氛围；3. 口语入词——\"怎一个愁字了得\"用近乎口语的表达，亲切自然；4. 声韵哀婉——全词押仄声韵（觅、戚、息、敌、识、积、摘、黑、滴、得），声调短促凄厉，与悲苦之情相得益彰。\n\n思想情感：全词通过秋日种种凄凉意象的描绘，抒发了国破家亡、丧夫寡居、颠沛流离的深重愁苦。\"这次第，怎一个愁字了得\"以反诘作结，言愁之多之深非\"愁\"字所能概括，余味无穷。\n\n名句：\"寻寻觅觅，冷冷清清，凄凄惨惨戚戚\"成为千古绝唱；\"这次第，怎一个愁字了得\"道尽愁苦之深。"
    },
    {
      id:'shufen', title:'书愤', author:'陆游', authorId:'luyou', cat:'gushici',
      audio:'resource/audio/shufen.aac',
      text:'早岁那知世事艰，中原北望气如山。\n楼船夜雪瓜洲渡，铁马秋风大散关。\n塞上长城空自许，镜中衰鬓已先斑。\n出师一表真名世，千载谁堪伯仲间！',
      translation: "年轻时哪里懂得世事的艰难，北望中原，收复失地的豪情像山一样坚定。\n楼船在夜雪中守卫瓜洲渡，铁马在秋风中驰骋大散关。\n徒然以\"塞上长城\"自许，揽镜自照，两鬓已经斑白。\n诸葛亮的《出师表》名传后世，千百年来谁能与他相比！",
      notes: [{phrase:"早岁",pos:"早岁那知世事艰",explain:"早年，年轻时。"},{phrase:"那知",pos:"早岁那知世事艰",explain:"哪知，怎么知道。"},{phrase:"中原北望",pos:"中原北望气如山",explain:"即\'北望中原\'，倒装句式。"},{phrase:"气如山",pos:"中原北望气如山",explain:"收复失地的豪情像山一样坚定。"},{phrase:"楼船",pos:"楼船夜雪瓜洲渡",explain:"高大的战船。"},{phrase:"瓜洲渡",pos:"楼船夜雪瓜洲渡",explain:"在今江苏镇江对岸，瓜洲在长江北岸。"},{phrase:"铁马",pos:"铁马秋风大散关",explain:"披甲的战马。"},{phrase:"大散关",pos:"铁马秋风大散关",explain:"在今陕西宝鸡西南，南宋与金交界处的关隘。"},{phrase:"塞上长城",pos:"塞上长城空自许",explain:"比喻能守卫边疆的将领，南朝宋名将檀道济自比长城。"},{phrase:"空自许",pos:"塞上长城空自许",explain:"徒然自负，自我期许。"},{phrase:"衰鬓",pos:"镜中衰鬓已先斑",explain:"苍老的鬓发。"},{phrase:"出师一表",pos:"出师一表真名世",explain:"诸葛亮的《出师表》。"},{phrase:"伯仲",pos:"千载谁堪伯仲间",explain:"兄弟，引申为不相上下。"}],
      appreciation: "《书愤》是陆游于宋孝宗淳熙十三年（1186年）闲居山阴时所作。全诗感情沉郁，气韵浑厚，集中体现了陆游\"一生志在恢复中原\"的爱国情怀。\n\n创作背景：陆游一生力主抗金，却屡遭投降派排挤，闲居乡里时回忆青年时代的壮志，对比眼前衰老的处境，悲愤难抑，写下此诗。\n\n艺术特色：首联\"早岁那知世事艰，中原北望气如山\"追忆少年壮志，气吞山河。颔联\"楼船夜雪瓜洲渡，铁马秋风大散关\"是历来传诵的名句，仅用十二字便勾勒出两幅壮阔的战斗场景，意象鲜明，气象宏大。颈联\"塞上长城空自许，镜中衰鬓已先斑\"由壮志转为悲愤，对比鲜明，沉痛至极。\n\n名句赏析：尾联以诸葛亮自比，\"千载谁堪伯仲间\"既是赞颂先贤，也是自叹无人能继，含蓄地表达了对南宋朝廷偏安一隅、不思恢复的不满。全诗以议论入诗而不失诗味，沉郁顿挫，是陆游七律的代表作。"
    },
    {
      id:'linanchunyu', title:'临安春雨初霁', author:'陆游', authorId:'luyou', cat:'gushici',
      audio:'resource/audio/linanchunyu.aac',
      text:'世味年来薄似纱，谁令骑马客京华？\n小楼一夜听春雨，深巷明朝卖杏花。\n矮纸斜行闲作草，晴窗细乳戏分茶。\n素衣莫起风尘叹，犹及清明可到家。',
      translation: "近年来人情世态薄得像纱一样，是谁让我骑马客居在京城？\n在小楼上听了一夜的春雨，明天清晨深巷里就会传来卖杏花的叫声。\n在短纸上斜着行书闲适地写着草书，在晴日的窗前细细品味着分茶的乐趣。\n不要叹息白衣被京城的尘土沾染，还来得及在清明时节回到家乡。",
      notes: [{phrase:"世味",pos:"世味年来薄似纱",explain:"人情世态。"},{phrase:"薄似纱",pos:"世味年来薄似纱",explain:"像纱一样薄。"},{phrase:"京华",pos:"谁令骑马客京华",explain:"京城，指临安。"},{phrase:"小楼一夜听春雨",pos:"小楼一夜听春雨",explain:"写春雨之细腻。"},{phrase:"深巷明朝卖杏花",pos:"深巷明朝卖杏花",explain:"写明早深巷中将传出卖杏花的叫卖声。"},{phrase:"矮纸",pos:"矮纸斜行闲作草",explain:"短纸。"},{phrase:"斜行",pos:"矮纸斜行闲作草",explain:"斜着写。"},{phrase:"作草",pos:"矮纸斜行闲作草",explain:"写草书。"},{phrase:"晴窗",pos:"晴窗细乳戏分茶",explain:"晴日的窗前。"},{phrase:"细乳",pos:"晴窗细乳戏分茶",explain:"茶中的精华浮沫。"},{phrase:"分茶",pos:"晴窗细乳戏分茶",explain:"宋代茶艺，将茶分出各种形状。"},{phrase:"素衣",pos:"素衣莫起风尘叹",explain:"白色衣服，喻指清白操守。"},{phrase:"风尘叹",pos:"素衣莫起风尘叹",explain:"叹息京城尘土沾染白衣，借喻被世俗所污。"},{phrase:"犹及",pos:"犹及清明可到家",explain:"还来得及。"}],
      appreciation: "《临安春雨初霁》是陆游于淳熙十三年（1186年）奉诏入京，寓居西湖边时所作。当时陆游被罢官多年，此次入京本欲有所作为，但现实让他感到失望。\n\n思想情感：开篇\"世味年来薄似纱，谁令骑马客京华\"以反问口气表达对官场的厌倦。颔联\"小楼一夜听春雨，深巷明朝卖杏花\"是千古传诵的名句，以工整的对仗描绘了临安春日的明媚与闲适，色彩明丽，意境清新。颈联\"矮纸斜行闲作草，晴窗细乳戏分茶\"写日常闲适之事，看似风雅，实则蕴含壮志难酬的无奈。\n\n艺术特色：尾联\"素衣莫起风尘叹，犹及清明可到家\"表面是自我宽慰，实则流露出归隐之意。全诗表面写得闲适雅致，骨子里却是一腔报国无门的悲愤，与《书愤》异曲同工，是陆游婉约风格的代表作。"
    },
    {
      id:'niannujiaogd', title:'念奴娇·过洞庭', author:'张孝祥', authorId:'zhangxiaoxiang', cat:'gushici',
      audio:'resource/audio/niannujiaogd.aac',
      text:'洞庭青草，近中秋，更无一点风色。\n玉鉴琼田三万顷，着我扁舟一叶。\n素月分辉，明河共影，表里俱澄澈。\n悠然心会，妙处难与君说。\n\n应念岭海经年，孤光自照，肝肺皆冰雪。\n短发萧骚襟袖冷，稳泛沧浪空阔。\n尽挹西江，细斟北斗，万象为宾客。\n扣舷独啸，不知今夕何夕。',
      translation: "上阕：洞庭湖与青草湖相连，时近中秋，湖面上没有一丝风色。三万顷的湖面像美玉磨成的镜子一般，承载着我这一叶扁舟。皎洁的月光洒下光辉，银河与湖面共映着月影，水天上下里外一片澄澈。我悠然心领神会这妙境，但其中的妙处却难以向你诉说。\n下阕：回想在岭南沿海任职的多年间，我以孤光自照，肝胆肺腑都如冰雪般纯洁。短发稀疏，衣襟袖口生寒，但我仍稳稳地泛舟于空阔的沧浪之上。我要舀尽西江之水，用北斗七星作酒杯细细斟酌，请万象做我的宾客。我敲击船舷独自长啸，忘记了今夕是何年。",
      notes: [{phrase:"洞庭青草",pos:"洞庭青草，近中秋",explain:"洞庭湖和青草湖，两湖相连。"},{phrase:"风色",pos:"更无一点风色",explain:"风势。"},{phrase:"玉鉴琼田",pos:"玉鉴琼田三万顷",explain:"美玉磨成的镜子，形容湖水的明净。"},{phrase:"扁舟一叶",pos:"着我扁舟一叶",explain:"像一片叶子的小船。"},{phrase:"素月",pos:"素月分辉",explain:"皎洁的月亮。"},{phrase:"明河",pos:"明河共影",explain:"银河。"},{phrase:"表里",pos:"表里俱澄澈",explain:"上下，内外。"},{phrase:"心会",pos:"悠然心会",explain:"心领神会。"},{phrase:"岭海",pos:"应念岭海经年",explain:"指两广一带，五岭以南、南海以北。"},{phrase:"经年",pos:"应念岭海经年",explain:"年复一年，多年。"},{phrase:"孤光",pos:"孤光自照",explain:"月光。"},{phrase:"肝肺皆冰雪",pos:"肝肺皆冰雪",explain:"比喻心地光明磊落，廉洁清白。"},{phrase:"萧骚",pos:"短发萧骚襟袖冷",explain:"头发稀疏的样子。"},{phrase:"尽挹西江",pos:"尽挹西江",explain:"把西江的水全部舀出来。挹（yì），舀。"},{phrase:"北斗",pos:"细斟北斗",explain:"北斗星，比喻酒器。"},{phrase:"万象",pos:"万象为宾客",explain:"宇宙间的万事万物。"},{phrase:"扣舷",pos:"扣舷独啸",explain:"敲击船舷。"}],
      appreciation: "《念奴娇·过洞庭》是南宋词人张孝祥于宋孝宗乾道二年（1166年）乘舟经过洞庭湖时所作。其时张孝祥因支持张浚北伐而被罢官，由广南经略安抚使任上罢归，途径洞庭湖。\n\n艺术特色：上阕写景，描绘了中秋前夕洞庭湖澄澈空明的壮丽景色，\"玉鉴琼田三万顷，着我扁舟一叶\"以巨大的湖面衬托出个体的渺小，又以扁舟写出人的悠然。下阕抒情，\"肝肺皆冰雪\"以冰雪为喻，表明自己虽遭贬谪却始终清白磊落的胸怀。\n\n名句赏析：\"尽挹西江，细斟北斗，万象为宾客\"想象奇绝，气魄宏大，是千古传诵的名句，体现了词人超然物外的胸襟与气度。全词意境开阔，气象宏大，被前人评为\"飘飘有凌云之气\"，与苏轼《水调歌头》等中秋词并称。"
    },
    {
      id:'yongyule', title:'永遇乐·京口北固亭怀古', author:'辛弃疾', authorId:'xinqiji', cat:'gushici',
      audio:'resource/audio/yongyule.aac',
      text:'千古江山，英雄无觅，孙仲谋处。\n舞榭歌台，风流总被，雨打风吹去。\n斜阳草树，寻常巷陌，人道寄奴曾住。\n想当年，金戈铁马，气吞万里如虎。\n\n元嘉草草，封狼居胥，赢得仓皇北顾。\n四十三年，望中犹记，烽火扬州路。\n可堪回首，佛狸祠下，一片神鸦社鼓。\n凭谁问：廉颇老矣，尚能饭否？',
      translation: "千古江山依旧，却无处寻找孙仲谋那样的英雄。\n舞榭歌台，风流总被雨打风吹去。\n斜阳照着草木，寻常的巷陌，人们说刘裕曾住在这里。\n想当年，他率金戈铁马的北伐军，气吞万里犹如猛虎。\n\n元嘉年间草率出兵，妄图封狼居胥山，结果只落得仓皇北望。\n四十三年前，眺望中还记得，扬州路上烽火连天。\n怎么忍心回首，佛狸祠下，一片神鸦啄食社日祭品。\n凭谁问：廉颇老矣，尚能饭否？",
      notes: [{phrase:"孙仲谋",pos:"英雄无觅，孙仲谋处",explain:"孙权，字仲谋，三国时吴国皇帝，曾在京口建都，抗击曹操。"},{phrase:"寄奴",pos:"人道寄奴曾住",explain:"南朝宋武帝刘裕的小名。刘裕生于京口，曾两次北伐收复洛阳、长安。"},{phrase:"金戈铁马",pos:"金戈铁马，气吞万里如虎",explain:"指刘裕北伐时的军威。"},{phrase:"元嘉",pos:"元嘉草草",explain:"南朝宋文帝刘义隆的年号。他好大喜功，草率北伐，结果大败。"},{phrase:"封狼居胥",pos:"封狼居胥",explain:"汉武帝时霍去病追击匈奴至狼居胥山，封山祭天而还。此处指刘义隆妄想建立霍去病那样的功业。"},{phrase:"赢得仓皇北顾",pos:"赢得仓皇北顾",explain:"结果只落得仓皇败退，回头北望追兵。"},{phrase:"四十三年",pos:"四十三年，望中犹记",explain:"辛弃疾于1162年南归，至1205年作此词，正好四十三年。"},{phrase:"佛狸",pos:"佛狸祠下",explain:"北魏太武帝拓跋焘的小名。他击败刘义隆后，在长江北岸建立行宫，后人在此建祠。佛（bì）狸。"},{phrase:"神鸦社鼓",pos:"一片神鸦社鼓",explain:"祭祀时乌鸦啄食祭品，社日击鼓迎神。指异族统治下的人们已忘记亡国之耻。"},{phrase:"廉颇",pos:"廉颇老矣，尚能饭否",explain:"战国时赵国名将。《史记》载廉颇晚年遭人陷害，逃到魏国，赵王想重新起用他，派使者去看他。廉颇\'为之一饭斗米，肉十斤，被甲上马\'表示还可任用，但使者受人收买，回报赵王说廉颇\'一饭三遗矢\'，遂不被用。辛弃疾以廉颇自比。"}],
      appreciation: "《永遇乐·京口北固亭怀古》是辛弃疾晚年所作，是宋词豪放派的代表作品，被杨慎评为\"辛词第一\"。\n\n创作背景：此词作于宋宁宗开禧元年（1205年），辛弃疾六十六岁任镇江知府。当时权臣韩侂胄准备北伐，但准备仓促、用人不当。辛弃疾借怀古讽谏，既支持北伐又反对草率行事。\n\n艺术特色：1. 用典密集而贴切——全词连用孙权、刘裕、刘义隆、拓跋焘、廉颇五个人物典故，借古鉴今；2. 对比手法——以孙权、刘裕的英雄业绩反衬南宋的萎靡，以刘义隆草率北伐的失败警告韩侂胄；3. 沉郁顿挫——情感深沉而曲折，既有豪情又有忧虑；4. 语言凝练——用典虽多而不觉堆砌，融叙事、抒情、议论于一炉。\n\n思想情感：上阕怀念孙权、刘裕，赞颂他们抗敌的英雄业绩，暗含对南宋朝廷偏安的不满；下阕借刘义隆草率北伐失败的教训，警示韩侂胄不可轻举妄动，最后以廉颇自比，表达了虽年老仍渴望报国的壮志和不被重用的愤懑。\n\n名句：\"凭谁问：廉颇老矣，尚能饭否？\"成为怀才不遇、壮志难酬的千古绝唱。"
    },
    {
      id:'pusamanshu', title:'菩萨蛮·书江西造口壁', author:'辛弃疾', authorId:'xinqiji', cat:'gushici',
      audio:'resource/audio/pusamanshu.aac',
      text:'郁孤台下清江水，中间多少行人泪。\n西北望长安，可怜无数山。\n青山遮不住，毕竟东流去。\n江晚正愁余，山深闻鹧鸪。',
      translation: "郁孤台下那清清的江水啊，其中有多少行路人的眼泪！\n向西北方向远望长安，可惜被无数座山遮挡。\n青山虽能遮住视线，却遮不住江水，它毕竟还是向东流去。\n傍晚的江色更引起我的忧愁，深山中传来鹧鸪\"行不得也哥哥\"的叫声。",
      notes: [{phrase:"郁孤台",pos:"郁孤台下清江水",explain:"在今江西赣州西北，宋代赣州为江南西路治所。"},{phrase:"清江",pos:"郁孤台下清江水",explain:"赣江与袁江合流处。"},{phrase:"行人",pos:"中间多少行人泪",explain:"流离失所的人民，也指被金兵追赶的难民。"},{phrase:"长安",pos:"西北望长安",explain:"借指北宋故都汴京（今开封）。"},{phrase:"可怜",pos:"可怜无数山",explain:"可惜。"},{phrase:"无数山",pos:"可怜无数山",explain:"暗喻中原尚未收复。"},{phrase:"毕竟东流去",pos:"毕竟东流去",explain:"江水终究东流，暗喻收复失地之志终不可挡。"},{phrase:"愁余",pos:"江晚正愁余",explain:"使我忧愁。"},{phrase:"鹧鸪",pos:"山深闻鹧鸪",explain:"鸟名，叫声似\'行不得也哥哥\'，寓意恢复中原难行。"}],
      appreciation: "《菩萨蛮·书江西造口壁》是辛弃疾于宋孝宗淳熙三年（1176年）任江西提点刑狱时途经造口（今江西万安境内）所作。建炎三年（1129年），金兵曾追击隆祐太后至造口，给当地百姓带来深重灾难，词人题壁感怀即与此相关。\n\n创作背景：南宋偏安一隅，中原未复，辛弃疾怀着满腔爱国热忱却无由施展，途经造口时见景生情，写下此词。\n\n艺术特色：开篇\"郁孤台下清江水，中间多少行人泪\"以江水之深衬流民之泪之多，写出中原沦陷之痛。\"西北望长安，可怜无数山\"以长安借指故都，写出对失地的眷恋与无奈。\"青山遮不住，毕竟东流去\"是名句，借江水东流暗喻收复之志不可阻挡。结尾\"山深闻鹧鸪\"以鹧鸪\"行不得也\"的啼声作结，含蓄地表达了对南宋朝廷偏安不思恢复的愤懑。全词比兴寄托，言近旨远，是辛弃疾爱国词的代表作之一。"
    },
    {
      id:'qingyuan', title:'青玉案·元夕', author:'辛弃疾', authorId:'xinqiji', cat:'gushici',
      audio:'resource/audio/qingyuan.aac',
      text:'东风夜放花千树，更吹落、星如雨。\n宝马雕车香满路。\n凤箫声动，玉壶光转，一夜鱼龙舞。\n蛾儿雪柳黄金缕，笑语盈盈暗香去。\n众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。',
      translation: "上阕：春风像在夜晚吹开了千树繁花，又像把繁星吹落如雨。华丽的马车香气弥漫一路。凤箫声起，玉壶般的月亮光华流转，鱼龙花灯彻夜飞舞。\n下阕：头上戴着蛾儿、雪柳、黄金缕等饰物，笑语盈盈带着暗香走过。在人群中寻找她千百遍，猛然回头，那人却在灯火暗淡稀疏的地方。",
      notes: [{phrase:"元夕",pos:"青玉案·元夕",explain:"元宵节之夜，农历正月十五。"},{phrase:"花千树",pos:"东风夜放花千树",explain:"形容灯火灿烂如千树繁花。"},{phrase:"星如雨",pos:"更吹落、星如雨",explain:"形容烟花如雨落。"},{phrase:"宝马雕车",pos:"宝马雕车香满路",explain:"华丽的马车。"},{phrase:"凤箫",pos:"凤箫声动",explain:"笙箫类乐器。"},{phrase:"玉壶",pos:"玉壶光转",explain:"比喻月亮，也指白玉雕成的灯。"},{phrase:"鱼龙舞",pos:"一夜鱼龙舞",explain:"鱼形龙形花灯飞舞。"},{phrase:"蛾儿雪柳",pos:"蛾儿雪柳黄金缕",explain:"宋代妇女元宵节戴的首饰。"},{phrase:"黄金缕",pos:"蛾儿雪柳黄金缕",explain:"金线编织的饰物。"},{phrase:"盈盈",pos:"笑语盈盈暗香去",explain:"笑容满面的样子。"},{phrase:"暗香",pos:"笑语盈盈暗香去",explain:"女子身上散发的香气。"},{phrase:"千百度",pos:"众里寻他千百度",explain:"千百遍。"},{phrase:"蓦然",pos:"蓦然回首",explain:"忽然。"},{phrase:"阑珊",pos:"灯火阑珊处",explain:"零落稀疏。"}],
      appreciation: "《青玉案·元夕》是辛弃疾描写元宵佳节的代表作。上阕极写元宵夜热闹繁华的景象，\"东风夜放花千树，更吹落、星如雨\"以奇特的想象描绘烟花灿烂，\"宝马雕车香满路\"写游人如织，\"凤箫声动，玉壶光转，一夜鱼龙舞\"渲染出狂欢不眠的元宵盛况。\n\n创作背景：辛弃疾南归后不受重用，借元宵佳节之繁华以寄托自己孤高自许、不愿随波逐流的情怀。\n\n艺术特色：下阕由热闹转向冷寂，先写盛装女子的美丽与热闹，后以\"众里寻他千百度，蓦然回首，那人却在，灯火阑珊处\"作结，是千古传诵的名句。这位\"灯火阑珊处\"的\"那人\"正是词人自己高洁孤傲、不愿随波逐流的人格写照。王国维在《人间词话》中将\"蓦然回首\"一句视为成大事业者必经之第三境界。全词以热闹衬冷寂，以繁华衬孤高，寄托深远，是辛弃疾词中婉约风格的代表作。"
    },
    {
      id:'hexinlang', title:'贺新郎（国脉微如缕）', author:'刘克庄', authorId:'liukezhuang', cat:'gushici',
      audio:'resource/audio/hexinlang.aac',
      text:'国脉微如缕。问长缨何时入手，缚将戎主？\n未必人间无好汉，谁与宽些尺度？\n试看取当年韩五。\n岂有谷城公付授，也不干曾遇骊山母。\n谈笑起，两河路。\n\n少时棋柝曾联句。叹而今登楼揽镜，事机频误。\n闻说北风吹面急，边上冲梯屡舞。\n君莫道投鞭虚语。\n自古一贤能制难，有金汤便可无张许？\n快投笔，莫题柱。',
      translation: "上阕：国家的命脉已经微弱得像一根丝线。试问什么时候才能得到长缨，把敌人的首领绑来？未必人间没有英雄好汉，只是谁给他们放宽用人的尺度？请看当年的韩世忠，难道真有谷城公的传授？也不曾像张良那样遇到骊山老母。谈笑间起兵，平定两河路。\n下阕：年轻时下棋、击柝曾一起联句赋诗。可叹如今登楼远眺，对镜自照，机会一次次地错过。听说北风刮得正急，敌人的攻城云梯屡屡逼近。您不要说\"投鞭断流\"是空话。自古以来一位贤才就能平定危难，难道有了金城汤池就可以不要张巡、许远这样的忠臣？赶快投笔从戎，不要再像司马相如那样题柱求官了。",
      notes: [{phrase:"国脉",pos:"国脉微如缕",explain:"国家的命脉。"},{phrase:"微如缕",pos:"国脉微如缕",explain:"微细得像一根丝线。"},{phrase:"长缨",pos:"问长缨何时入手",explain:"长绳，汉武帝时终军请长缨缚南越王。"},{phrase:"缚将戎主",pos:"缚将戎主",explain:"把敌人的首领绑来。"},{phrase:"韩五",pos:"试看取当年韩五",explain:"南宋名将韩世忠，排行第五。"},{phrase:"谷城公",pos:"岂有谷城公付授",explain:"黄石公，张良的老师，曾在谷城传授张良兵法。"},{phrase:"骊山母",pos:"也不干曾遇骊山母",explain:"传说中的女仙，曾授李白兵法。"},{phrase:"两河路",pos:"谈笑起，两河路",explain:"黄河两岸地区。"},{phrase:"棋柝",pos:"少时棋柝曾联句",explain:"下棋和击柝报更。"},{phrase:"联句",pos:"少时棋柝曾联句",explain:"几人合作写诗。"},{phrase:"登楼揽镜",pos:"叹而今登楼揽镜",explain:"用王粲登楼的典故喻忧国；揽镜，照镜看自己的衰老。"},{phrase:"事机频误",pos:"事机频误",explain:"机会一次次地错过。"},{phrase:"冲梯",pos:"边上冲梯屡舞",explain:"攻城用的云梯。"},{phrase:"投鞭",pos:"君莫道投鞭虚语",explain:"苻坚\'投鞭断流\'之典，比喻人多势众。"},{phrase:"金汤",pos:"有金汤便可无张许",explain:"金城汤池，坚固的城防。"},{phrase:"张许",pos:"有金汤便可无张许",explain:"张巡、许远，唐代安史之乱中坚守睢阳的忠臣。"},{phrase:"投笔",pos:"快投笔",explain:"班超投笔从戎。"},{phrase:"题柱",pos:"莫题柱",explain:"司马相如过升仙桥题柱，立志做高官。"}],
      appreciation: "《贺新郎·国脉微如缕》是南宋词人刘克庄于宋理宗淳祐年间所作的爱国词。当时南宋国势危殆，蒙古军队屡屡南侵，词人忧心如焚，写下此词。\n\n创作背景：刘克庄是南宋后期江湖诗派的代表人物，一生力主抗金抗元，却仕途坎坷。词以\"国脉微如缕\"开篇，开门见山点出国家危亡的严峻形势。\n\n艺术特色：词中运用大量典故，以终军请长缨、韩世忠抗金、张良得黄石公兵法等典故，呼吁朝廷破格用人，选拔英才抗敌。下阕\"事机频误\"感叹朝廷屡屡错过抗金恢复的机会，\"君莫道投鞭虚语\"以苻坚的典故提醒人们不要低估敌情。\n\n名句赏析：结句\"快投笔，莫题柱\"以班超投笔从戎激励读者，希望志士仁人投身报国。全词用典丰富，议论纵横，感情激越，体现了刘克庄词\"雄奇跌宕\"的风格，是宋末爱国词中的力作。"
    },
    {
      id:'yangzhouman', title:'扬州慢（淮左名都）', author:'姜夔', authorId:'jiangkui', cat:'gushici',
      audio:'resource/audio/yangzhouman.aac',
      text:'淮左名都，竹西佳处，解鞍少驻初程。\n过春风十里，尽荠麦青青。\n自胡马窥江去后，废池乔木，犹厌言兵。\n渐黄昏，清角吹寒，都在空城。\n\n杜郎俊赏，算而今重到须惊。\n纵豆蔻词工，青楼梦好，难赋深情。\n二十四桥仍在，波心荡，冷月无声。\n念桥边红药，年年知为谁生？',
      translation: "上阕：扬州是淮南东路的名都，竹西亭是游览胜地，我解下马鞍在旅途开端稍作停留。走过昔日繁华的春风十里长街，如今尽是青青的荠麦。自从金兵南侵长江之后，连废弃的池苑和高大的乔木，都厌倦谈论战争。渐渐到了黄昏，凄清的号角声吹送着寒意，回荡在这座空城里。\n下阕：杜牧如果今日重游扬州，也一定会感到震惊。纵然他有写\"豆蔻\"词的好才华，有写\"青楼梦\"的好笔力，也难以表达此时的深情。二十四桥依然存在，桥下的水波荡漾，冷月寂寂无声。可怜桥边的红色芍药花，年年开放，又知道是为谁而开呢？",
      notes: [{phrase:"淮左",pos:"淮左名都",explain:"淮水之东，宋代设淮南东路，扬州为其治所。"},{phrase:"竹西",pos:"竹西佳处",explain:"亭名，在扬州北门外。"},{phrase:"解鞍",pos:"解鞍少驻初程",explain:"解下马鞍，表示停驻。"},{phrase:"初程",pos:"解鞍少驻初程",explain:"旅途的开始。"},{phrase:"春风十里",pos:"过春风十里",explain:"借杜牧诗指扬州昔日的繁华街道。"},{phrase:"荠麦",pos:"尽荠麦青青",explain:"荠菜和麦子。"},{phrase:"胡马窥江",pos:"自胡马窥江去后",explain:"指宋高宗建炎三年（1129年）金兵南侵。"},{phrase:"废池",pos:"废池乔木",explain:"废弃的池苑。"},{phrase:"清角",pos:"清角吹寒",explain:"凄清的号角声。"},{phrase:"杜郎",pos:"杜郎俊赏",explain:"唐代诗人杜牧，曾在扬州为官。"},{phrase:"俊赏",pos:"杜郎俊赏",explain:"风流俊赏，善于游赏。"},{phrase:"豆蔻词",pos:"纵豆蔻词工",explain:"杜牧《赠别》诗\'娉娉袅袅十三余，豆蔻梢头二月初\'。"},{phrase:"青楼梦",pos:"青楼梦好",explain:"杜牧《遣怀》\'十年一觉扬州梦，赢得青楼薄幸名\'。"},{phrase:"二十四桥",pos:"二十四桥仍在",explain:"扬州名胜，唐代有二十四座桥，宋代已废。"},{phrase:"红药",pos:"念桥边红药",explain:"红芍药花。"}],
      appreciation: "《扬州慢·淮左名都》是南宋词人姜夔于宋孝宗淳熙三年（1176年）路过扬州时所作。当时扬州在靖康之难后屡遭金兵洗劫，昔日\"春风十里\"的繁华都市变成了满目荠麦的荒凉空城。年方二十的姜夔目睹此景，感慨万千，写下这首著名的\"黍离之悲\"词作。\n\n艺术特色：上阕写景，以\"春风十里\"的昔盛与\"荠麦青青\"的今衰对比，\"废池乔木，犹厌言兵\"以拟人手法写景物犹厌战争，\"清角吹寒，都在空城\"渲染出荒凉冷寂的氛围。下阕以杜牧重游扬州的设想作结，\"二十四桥仍在，波心荡，冷月无声\"是写景名句，桥仍在而月冷无声，写出今昔之痛。\n\n名句赏析：\"念桥边红药，年年知为谁生\"以花拟人，余韵悠长。全词语言雅致清丽，对仗工整，是姜夔\"清空\"词风的代表作。"
    },
    {
      id:'changtingsongbie', title:'长亭送别（节选）', author:'王实甫', authorId:'wangshifu', cat:'gushici',
      audio:'resource/audio/changtingsongbie.aac',
      text:'【正宫】【端正好】碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。',
      translation: "湛蓝的天空飘着朵朵白云，地上铺满金黄的菊花，西风劲急，北雁向南飞去。清晨是谁把经霜的树林染成醉人的红色？那都是离别人流的眼泪。",
      notes: [{phrase:"正宫",pos:"【正宫】【端正好】",explain:"宫调名。"},{phrase:"端正好",pos:"【正宫】【端正好】",explain:"曲牌名。"},{phrase:"碧云天",pos:"碧云天，黄花地",explain:"蓝天白云。"},{phrase:"黄花",pos:"碧云天，黄花地",explain:"菊花。"},{phrase:"西风紧",pos:"西风紧",explain:"秋风劲急。"},{phrase:"北雁南飞",pos:"北雁南飞",explain:"秋天候鸟南迁。"},{phrase:"晓来",pos:"晓来谁染霜林醉",explain:"清晨。"},{phrase:"霜林醉",pos:"晓来谁染霜林醉",explain:"经霜的树林红得像喝醉了酒。醉，比喻树叶变红。"},{phrase:"离人泪",pos:"总是离人泪",explain:"离别之人的眼泪。"}],
      appreciation: "《长亭送别》节选自元代王实甫《西厢记》第四本第三折，是崔莺莺在长亭送别张生赴京赶考时唱的曲子。这支【端正好】小令以秋景写离情，被誉为元曲中的写景抒情绝唱。\n\n创作背景：《西厢记》描写张生与崔莺莺的爱情故事，长亭送别是其中著名段落，莺莺送张生进京赶考，离愁别绪借秋景抒发。\n\n艺术特色：\"碧云天，黄花地，西风紧，北雁南飞\"四句抓住蓝天、黄花、西风、北雁四个秋日典型意象，描绘出一幅寥廓萧瑟的秋景图，色彩鲜明，气氛浓郁。范仲淹《苏幕遮》\"碧云天，黄叶地\"是其所本。\n\n名句赏析：\"晓来谁染霜林醉？总是离人泪\"是千古名句，以拟人设问手法，把霜林之红归因于离人的眼泪，将景物与人物情感完美融合，想象奇特，感情深沉。全曲语言凝练清丽，意境深远，体现了王实甫\"花间美人\"的艺术风格。"
    },
    {
      id:'chaotianzi', title:'朝天子·咏喇叭', author:'王磐', authorId:'wangpan', cat:'gushici',
      audio:'resource/audio/chaotianzi.aac',
      text:'喇叭，锁哪，曲儿小腔儿大。\n官船来往乱如麻，全仗你抬声价。\n军听了军愁，民听了民怕。\n那里去辨甚么真共假？\n眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！',
      translation: "喇叭和唢呐，吹的曲子短小声音却很大。官船来来往往多如乱麻，全靠你抬高声价。军队听了军队发愁，百姓听了百姓害怕。哪里还去分辨什么真假？眼睁睁看着吹翻了这家，又吹伤了那家，直吹得水尽鹅飞一场空！",
      notes: [{phrase:"朝天子",pos:"朝天子·咏喇叭",explain:"曲牌名。"},{phrase:"喇叭",pos:"喇叭，锁哪",explain:"一种管乐器，明代宦官出行时常吹奏以壮声威。"},{phrase:"锁哪",pos:"喇叭，锁哪",explain:"即唢呐。"},{phrase:"曲儿小腔儿大",pos:"曲儿小腔儿大",explain:"曲子短小但声音洪亮。"},{phrase:"官船",pos:"官船来往乱如麻",explain:"官员乘坐的船只。"},{phrase:"乱如麻",pos:"官船来往乱如麻",explain:"多而杂乱。"},{phrase:"抬声价",pos:"全仗你抬声价",explain:"抬高身价。"},{phrase:"真共假",pos:"那里去辨甚么真共假",explain:"真和假。"},{phrase:"水尽鹅飞罢",pos:"只吹的水尽鹅飞罢",explain:"比喻倾家荡产、家破人亡。"}],
      appreciation: "《朝天子·咏喇叭》是明代散曲家王磐的代表作，是一首著名的讽刺小令。作品表面咏物，实则讽刺明代正德年间宦官刘瑾专权乱政的社会现实。\n\n创作背景：明代正德年间，宦官刘瑾专权，太监们仗势欺人，民不聊生。王磐借咏喇叭为题，写下了这首传诵至今的讽刺小令。\n\n艺术特色：喇叭本是民间乐器，却被宦官用来摆威风、欺压百姓。开篇\"曲儿小腔儿大\"以喇叭的特性暗喻宦官本身卑下却声势显赫，是全曲的\"诗眼\"。\"官船来往乱如麻，全仗你抬声价\"揭露宦官借喇叭壮声威欺压百姓的丑态。\"军听了军愁，民听了民怕\"写出了宦官之害的普遍与深重。\n\n名句赏析：结句\"只吹的水尽鹅飞罢\"以夸张手法写出了宦官祸国殃民、家破人亡的惨况。全曲语言通俗浅近，嬉笑怒骂皆成文章，物象与人事巧妙结合，是中国古代讽刺文学的杰作。"
    }

    // 字段类型兜底：避免脏数据导致崩溃
    if (typeof _a.text !== 'string') _a.text = String(_a.text || '');
    if (typeof _a.translation !== 'string') _a.translation = String(_a.translation || '');
    if (!Array.isArray(_a.notes)) _a.notes = [];

  }

<script>
<!-- ===== 内联：data/authors.js ===== -->
/* 数据来源：app.html 行 890-1006 */
/* 此文件由 app.html 拆分而来，非商业用途可自由编辑 */

  var AUTHORS = [
    { id:'kongzi', name:'孔子及其弟子', dynasty:'春秋',
      bio:'孔子（公元前551年\u2014前479年），名丘，字仲尼，鲁国陬邑（今山东曲阜）人。中国古代思想家、教育家，儒家学派创始人。其弟子及再传弟子记录其言行，编成《论语》一书，为儒家经典之一。孔子倡导仁、义、礼、智、信，被后世尊为"至圣先师"。' },
    { id:'xunzi', name:'荀子', dynasty:'战国',
      bio:'荀子（约公元前313年\u2014前238年），名况，字卿，赵国人。战国末期思想家、教育家，儒家学派代表人物之一。其思想以"性恶论"著称，主张通过后天学习和礼仪教化来改造人性。代表作《劝学》为千古名篇，强调学习的重要性和持之以恒的精神。' },
    { id:'simaqian', name:'司马迁', dynasty:'西汉',
      bio:'司马迁（约公元前145年\u2014约前87年），字子长，夏阳（今陕西韩城）人。西汉史学家、文学家。因替李陵辩护而遭受宫刑，后发愤著书，完成中国第一部纪传体通史《史记》，被誉为"史家之绝唱，无韵之离骚"。' },
    { id:'weizheng', name:'魏征', dynasty:'唐朝',
      bio:'魏征（580年\u2014643年），字玄成，巨鹿（今河北邢台）人。唐朝政治家、思想家、文学家。以直言敢谏著称，为唐太宗"贞观之治"做出了重要贡献。其谏议多被后世视为从政典范，《谏太宗十思疏》为其代表作。' },
    { id:'hanyu', name:'韩愈', dynasty:'唐朝',
      bio:'韩愈（768年\u2014824年），字退之，河南河阳（今河南孟州）人。唐代文学家、思想家，"唐宋八大家"之首。倡导古文运动，反对六朝以来的骈偶文风，主张"文以载道"。其散文气势雄浑，说理透彻，对后世文学影响深远。' },
    { id:'jiayi', name:'贾谊', dynasty:'西汉',
      bio:'贾谊（公元前200年\u2014前168年），洛阳（今河南洛阳）人。西汉政论家、文学家，世称贾生。少有才名，年十八能诵诗书，二十岁即被汉文帝召为博士。其政论文《过秦论》气势磅礴，议论精辟，为千古名篇。' },
    { id:'liji', name:'《礼记》', dynasty:'先秦',
      bio:'《礼记》又名《小戴礼记》，成书于汉代，为西汉礼学家戴圣所编。是中国古代一部重要的典章制度选集，共二十卷四十九篇。书中记载了先秦时期的社会政治、伦理道德及各种礼仪规范，对后世儒家思想有深远影响。' },
    { id:'limi', name:'李密', dynasty:'西晋',
      bio:'李密（224年\u2014287年），字令伯，犍为武阳（今四川彭山）人。西晋文学家。幼年丧父，母改嫁，由祖母刘氏抚养成人。以孝敬祖母闻名，所作《陈情表》情真意切，感人至深，为千古散文名篇。' },
    { id:'taoyuanming', name:'陶渊明', dynasty:'东晋',
      bio:'陶渊明（约365年\u2014427年），字元亮，号五柳先生，浔阳柴桑（今江西九江）人。东晋诗人、辞赋家。不为五斗米折腰，辞官归隐田园，是中国第一位田园诗人，被称为"古今隐逸诗人之宗"。代表作有《归去来兮辞》《桃花源记》《饮酒》等。' },
    { id:'liuzongyuan', name:'柳宗元', dynasty:'唐朝',
      bio:'柳宗元（773年\u2014819年），字子厚，河东（今山西运城）人。唐代文学家、哲学家，"唐宋八大家"之一。与韩愈共同倡导古文运动，并称"韩柳"。其散文峭拔矫健，说理透彻。参与永贞革新失败后，被贬永州，期间写下大量优秀作品。' },
    { id:'dumu', name:'杜牧', dynasty:'唐朝',
      bio:'杜牧（803年\u2014852年），字牧之，京兆万年（今陕西西安）人。唐代诗人、散文家。与李商隐并称"小李杜"。其诗清丽俊逸，多写伤春伤别之作；其赋文气势雄浑，代表作《阿房宫赋》借秦之亡以讽谏当朝，为千古名篇。' },
    { id:'ouyangxiu', name:'欧阳修', dynasty:'北宋',
      bio:'欧阳修（1007年\u20141072年），字永叔，号醉翁、六一居士，吉州庐陵（今江西吉安）人。北宋政治家、文学家，"唐宋八大家"之一。领导北宋诗文革新运动，是宋代文坛领袖。散文说理畅达、抒情委婉，对后世影响深远。' },
    { id:'suxun', name:'苏洵', dynasty:'北宋',
      bio:'苏洵（1009年\u20141066年），字明允，眉州眉山（今四川眉山）人。北宋文学家，"唐宋八大家"之一，苏轼、苏辙之父，世称"老苏"。大器晚成，年二十七始发愤读书。其散文锋利简洁，善于议论，代表作《六国论》为千古名篇。' },
    { id:'wanganshi', name:'王安石', dynasty:'北宋',
      bio:'王安石（1021年\u20141086年），字介甫，号半山，临川（今江西抚州）人。北宋政治家、思想家、文学家，"唐宋八大家"之一。主持熙宁变法，力图富国强兵。其散文雄健峭拔，说理严密，代表作有《答司马谏议书》《游褒禅山记》等。' },
    { id:'guiyouguang', name:'归有光', dynasty:'明朝',
      bio:'归有光（1507年\u20141571年），字熙甫，号震川，昆山（今江苏昆山）人。明代散文家。屡试不第，六十岁方中进士。其散文风格朴素自然，感情真挚，尤善于从日常琐事中抒发深情，被誉为"明文第一"。代表作有《项脊轩志》等。' },
    { id:'sushi', name:'苏轼', dynasty:'北宋',
      bio:'苏轼（1037年\u20141101年），字子瞻，号东坡居士，眉州眉山（今四川眉山）人。北宋文学家、书法家、画家，"唐宋八大家"之一。与父苏洵、弟苏辙并称"三苏"。诗、词、文、书、画皆有极高成就，散文与欧阳修并称"欧苏"，词与辛弃疾并称"苏辛"。' },
    { id:'zhangruoxu', name:'张若虚', dynasty:'唐朝',
      bio:'张若虚（约660年\u2014约720年），扬州（今江苏扬州）人。唐朝诗人。曾任兖州兵曹，与贺知章、张旭、包融并称"吴中四士"。其代表作《春江花月夜》被誉为"孤篇盖全唐"，以清丽空灵的笔触描绘春江月夜的壮丽景色，融情入景，哲理深蕴。' },
    { id:'yaonai', name:'姚鼐', dynasty:'清朝',
      bio:'姚鼐（1732年\u20141815年），字姬传，一字梦谷，桐城（今安徽桐城）人。清代散文家，"桐城派"三祖之一。治学以经为主，兼及子史、诗文。曾任四库全书馆纂修官。其散文简洁淡雅，代表作有《登泰山记》等。' },
    { id:'shijing', name:'《诗经》', dynasty:'先秦',
      bio:'《诗经》是中国最早的诗歌总集，收集了西周初年至春秋中叶的诗歌305篇，分为风、雅、颂三部分。其中"风"是各地民歌，反映了劳动人民的生活与情感；"雅"多为贵族祭祀之乐；"颂"为宗庙祭祀之乐歌。赋、比、兴是其基本表现手法。' },
    { id:'quyuan', name:'屈原', dynasty:'战国',
      bio:'屈原（约公元前340年\u2014前278年），名平，字原，楚国贵族。中国最早的浪漫主义诗人，开创了"楚辞"这一文体。因遭贵族排挤诽谤，被先后流放。秦将白起攻破郢都后，屈原自沉汨罗江。代表作《离骚》为中国古代最长的抒情诗，与《诗经》并称"风骚"。' },
    { id:'gushi19', name:'《古诗十九首》', dynasty:'汉',
      bio:'《古诗十九首》是汉代文人五言诗的杰出代表，作者已不可考，最早见于南朝梁萧统所编的《文选》。这些诗多写游子思妇的离愁别绪和人生无常的感慨，语言朴素自然，感情真挚动人，被誉为"五言之冠冕"。' },
    { id:'caocao', name:'曹操', dynasty:'汉末',
      bio:'曹操（155年\u2014220年），字孟德，沛国谯（今安徽亳州）人。东汉末年杰出的政治家、军事家、文学家。其诗作气魄雄伟，慷慨悲凉，开创建安文学新风。代表作《短歌行》《观沧海》《龟虽寿》等，体现了"老骥伏枥，志在千里"的豪迈气概。' },
    { id:'baozhao', name:'鲍照', dynasty:'南北朝',
      bio:'鲍照（约414年\u2014466年），字明远，东海（今山东郯城）人。南朝宋文学家，与谢灵运、颜延之并称"元嘉三大家"。其诗风格俊逸，尤擅七言歌行，《拟行路难》十八首为其代表作，对后世李白、杜甫等均有深远影响。' },
    { id:'wangwei', name:'王维', dynasty:'唐朝',
      bio:'王维（701年\u2014761年），字摩诘，河东蒲州（今山西运城）人。唐代诗人、画家，与孟浩然并称"王孟"。其诗以山水田园为主，清新自然，意境深远，苏轼赞其"诗中有画，画中有诗"。晚年隐居终南山，信奉佛教，有"诗佛"之称。' },
    { id:'libai', name:'李白', dynasty:'唐朝',
      bio:'李白（701年\u2014762年），字太白，号青莲居士，祖籍陇西成纪（今甘肃秦安）。唐代最伟大的浪漫主义诗人，被后人誉为"诗仙"。其诗想象丰富，气势磅礴，语言奔放，代表作有《蜀道难》《将进酒》《梦游天姥吟留别》等。与杜甫并称"李杜"。' },
    { id:'gaoshi', name:'高适', dynasty:'唐朝',
      bio:'高适（约704年\u2014约765年），字达夫，渤海蓨（今河北景县）人。唐代边塞诗人，与岑参并称"高岑"。其诗笔力雄健，气势奔放，洋溢着盛唐时期奋发进取的时代精神。代表作《燕歌行》为唐代边塞诗中的杰作。' },
    { id:'dufu', name:'杜甫', dynasty:'唐朝',
      bio:'杜甫（712年\u2014770年），字子美，号少陵野老，河南巩县（今河南巩义）人。唐代最伟大的现实主义诗人，被后人誉为"诗圣"。其诗深刻反映了唐代由盛转衰的历史变迁，风格沉郁顿挫，被称为"诗史"。代表作有《登高》《蜀相》《客至》等。' },
    { id:'baijuyi', name:'白居易', dynasty:'唐朝',
      bio:'白居易（772年\u2014846年），字乐天，号香山居士，下邽（今陕西渭南）人。唐代伟大的现实主义诗人，新乐府运动的倡导者。其诗语言通俗易懂，老妪能解。代表作《琵琶行》《长恨歌》为千古绝唱，与元稹并称"元白"。' },
    { id:'lihe', name:'李贺', dynasty:'唐朝',
      bio:'李贺（790年\u2014816年），字长吉，福昌（今河南宜阳）人。唐代诗人，与李白、李商隐并称"唐代三李"。其诗想象奇特，语言瑰丽，善用神话传说，形成了独特的"长吉体"风格，被称为"诗鬼"。代表作有《李凭箜篌引》《雁门太守行》等。' },
    { id:'wentingyun', name:'温庭筠', dynasty:'唐朝',
      bio:'温庭筠（约812年\u2014约866年），字飞卿，太原祁（今山西祁县）人。唐代诗人、词人，"花间词派"鼻祖。其诗与李商隐齐名，并称"温李"；其词秾丽精巧，开五代宋词之盛。代表作《菩萨蛮》等对后世词的发展影响深远。' },
    { id:'lishangyin', name:'李商隐', dynasty:'唐朝',
      bio:'李商隐（约813年\u2014约858年），字义山，号玉溪生，怀州河内（今河南沁阳）人。唐代诗人，与杜牧并称"小李杜"。其诗构思新奇，风格秾丽，尤以爱情诗和无题诗最为著名，意境朦胧，深情绵邈。《锦瑟》为其代表作。' },
    { id:'liyu', name:'李煜', dynasty:'五代',
      bio:'李煜（937年\u2014978年），字重光，号钟隐，徐州（今江苏徐州）人。五代十国时期南唐后主，世称"李后主"。其词以亡国为界，前期多写宫廷生活，后期追怀故国，感慨深沉，语言凝练，被誉为"词中之帝"。代表作《虞美人》《浪淘沙》等。' },
    { id:'liuyong', name:'柳永', dynasty:'北宋',
      bio:'柳永（约987年\u2014约1053年），字耆卿，崇安（今福建武夷山）人。北宋词人，婉约派代表人物。其词多写都市繁华和羁旅行役，创制了大量慢词，对宋词的发展有重要贡献。代表作《望海潮》《雨霖铃》等广为传诵。' },
    { id:'huangtingjian', name:'黄庭坚', dynasty:'北宋',
      bio:'黄庭坚（1045年\u20141105年），字鲁直，号山谷道人，洪州分宁（今江西修水）人。北宋诗人、书法家，江西诗派创始人。与苏轼并称"苏黄"，与秦观、张耒、晁补之并称"苏门四学士"。其诗讲究法度，风格奇崛，代表作有《登快阁》等。' },
    { id:'qinguan', name:'秦观', dynasty:'北宋',
      bio:'秦观（1049年\u20141100年），字少游，号淮海居士，高邮（今江苏高邮）人。北宋词人，"苏门四学士"之一，婉约派代表人物。其词音节谐美，风格清丽婉约，情韵兼胜。《鹊桥仙》为千古名篇。' },
    { id:'zhoubangyan', name:'周邦彦', dynasty:'北宋',
      bio:'周邦彦（1056年\u20141121年），字美成，号清真居士，钱塘（今浙江杭州）人。北宋词人，婉约派集大成者。其词音律严整，语言精丽，善用典故，对南宋格律词派影响深远。代表作有《苏幕遮》等。' },
    { id:'liqingzhao', name:'李清照', dynasty:'宋',
      bio:'李清照（1084年\u2014约1155年），号易安居士，齐州章丘（今山东济南）人。宋代女词人，婉约词派代表，被誉为"千古第一才女"。其词以南渡为界，前期多写闺中生活，后期多叹身世飘零，风格凄婉。《声声慢》为传世名篇。' },
    { id:'luyou', name:'陆游', dynasty:'南宋',
      bio:'陆游（1125年\u20141210年），字务观，号放翁，越州山阴（今浙江绍兴）人。南宋诗人、词人。一生力主抗金，诗作近万首，多为爱国忧民之作，风格雄浑豪放。与杨万里、范成大、尤袤并称"中兴四大诗人"。代表作有《书愤》《临安春雨初霁》等。' },
    { id:'zhangxiaoxiang', name:'张孝祥', dynasty:'南宋',
      bio:'张孝祥（1132年\u20141170年），字安国，号于湖居士，历阳乌江（今安徽和县）人。南宋词人、书法家。其词豪放壮阔，上承苏轼，下启辛弃疾，为南宋豪放词派重要作家。代表作《念奴娇·过洞庭》意境澄澈，气象高远。' },
    { id:'xinqiji', name:'辛弃疾', dynasty:'南宋',
      bio:'辛弃疾（1140年\u20141207年），字幼安，号稼轩，历城（今山东济南）人。南宋豪放派词人，与苏轼并称"苏辛"。一生力主抗金，其词慷慨激昂，题材广阔，善用典故而自然浑成，代表了南宋词的最高成就。代表作有《永遇乐》《青玉案》等。' },
    { id:'liukezhuang', name:'刘克庄', dynasty:'南宋',
      bio:'刘克庄（1187年\u20141269年），字潜夫，号后村，莆田（今福建莆田）人。南宋诗人、词人，江湖诗派重要作家。其词学辛弃疾，风格豪放，多写家国之忧，为辛派词人后劲。代表作有《贺新郎》等。' },
    { id:'jiangkui', name:'姜夔', dynasty:'南宋',
      bio:'姜夔（约1155年\u2014约1221年），字尧章，号白石道人，饶州鄱阳（今江西鄱阳）人。南宋词人、音乐家。其词格律严谨，音调谐婉，风格清空骚雅，自成一派。代表作《扬州慢》为感时伤怀之名篇。' },
    { id:'wangshifu', name:'王实甫', dynasty:'元',
      bio:'王实甫（生卒年不详），名德信，大都（今北京）人。元代杂剧作家，与关汉卿、马致远、白朴并称"元曲四大家"。代表作《西厢记》为元代杂剧的巅峰之作，文辞优美，情感真挚，被誉为"天下夺魁"之作。' },
    { id:'wangpan', name:'王磐', dynasty:'明',

<script>
function bootApp() {

  /* ===== STORE: localStorage 持久化 ===== */
  var Store = {
    get: function(key, def){
      try { var v = localStorage.getItem('bsw_'+key); return v===null ? def : JSON.parse(v); }
      catch(e){ return def; }
    },
    set: function(key, val){ try { localStorage.setItem('bsw_'+key, JSON.stringify(val)); } catch(e){} },
    getFont: function(){ return this.get('font', 16); },
    setFont: function(v){ this.set('font', v); },
    getAuthorFont: function(){ return this.get('authorFont', 16); },
    setAuthorFont: function(v){ this.set('authorFont', v); },
    getTheme: function(){ return this.get('theme','light'); },
    setTheme: function(v){ this.set('theme', v); },
    getLast: function(){ return this.get('last', null); },
    setLast: function(v){ this.set('last', v); },
    getScroll: function(id){ return this.get('scroll_'+id, 0); },
    setScroll: function(id, v){ this.set('scroll_'+id, v); },
    getAudio: function(id){ return this.get('audio_'+id, 0); },
    setAudio: function(id, v){ this.set('audio_'+id, v); },
    getRecited: function(){ return this.get('recited', []); },
    isRecited: function(id){ return this.getRecited().indexOf(id) >= 0; },
    toggleRecited: function(id){
      var r = this.getRecited(); var i = r.indexOf(id);
      if(i>=0){ r.splice(i,1); } else { r.push(id); }
      this.set('recited', r); return i<0;
    },
    getSpeed: function(){ return this.get('audiospeed', 1); },
    setSpeed: function(v){ this.set('audiospeed', v); },
    getLoop: function(){ return this.get('audioloop', false); },
    setLoop: function(v){ this.set('audioloop', v); },

    setWallpaper: function(v){ this.set('wallpaper', v); },
    getAIConfig: function(){ return this.get('aiConfig', {apiUrl:'', apiKey:'', model:'', quizType:'any'}); },
    setAIConfig: function(v){ this.set('aiConfig', v); },
    /* 学习时间统计 */
    getStudyTime: function(){ return this.get('studyTime', {today:0}); },
    addStudyTime: function(min){
      var t = this.getStudyTime();
      if (typeof t !== 'object' || t === null) t = {today:0};
      t.today = (t.today || 0) + min;
      this.set('studyTime', t);
      var today = new Date();
      var fmt = today.getFullYear() + '-' + ((today.getMonth()+1)+'').padStart(2,'0') + '-' + (today.getDate()+'').padStart(2,'0');

      if (days.indexOf(fmt) < 0) { days.push(fmt); this.set('studyDays', days); }

      var days = this.get('studyDays', []);

      for (var i=0;i<days.length;i++) set[days[i]] = 1;
      var streak = 0;
      var d = new Date();
      d.setDate(d.getDate() - 1);

       修复方案 V2 P0-1b：原代码在 3 处调用未定义的 updateStreak 导致 TypeError */

  /* ===== USERDATA: 文件存储层（桌面端持久化） ===== */
  var UserDataAPI = {
    PREF_FILE: 'preferences.json',
    AI_FILE: 'ai_config.json',
    QUESTIONS_FILE: 'ai_questions.json',

    _cache: null,

    _url: function(name){ return '/api/userdata/file/' + encodeURIComponent(name); },

    read: function(name){
      return fetch(this._url(name)).then(function(r){ return r.json(); });
    },

    write: function(name, data){
      return fetch(this._url(name), {
        method: 'POST',
        headers: {'Content-Type': 'application/json; charset=utf-8'},
        body: JSON.stringify({data: data})
      }).then(function(r){ return r.json(); });
    },

    remove: function(name){
      return fetch(this._url(name), {method: 'DELETE'}).then(function(r){ return r.json(); });
    },

    // Flush a specific Store key to its userdata file
    syncKey: function(key, val){
      var fileMap = {
        'aiConfig': 'ai_config.json',
        'theme': 'preferences.json',
        'font': 'preferences.json',
        'authorFont': 'preferences.json',
        'wallpaper': 'preferences.json'
      };
      var fname = fileMap[key];
      if (!fname) return Promise.resolve();

      // Read existing, merge, write back
      return this.read(fname).then(function(result){
        var obj = (result && result.data) ? result.data : {};
        if (typeof obj !== 'object') obj = {};
        obj[key] = val;
        return UserDataAPI.write(fname, obj);
      }).catch(function(){
        var obj = {};
        obj[key] = val;
        return UserDataAPI.write(fname, obj);
      });
    },

    // Hydrate localStorage from userdata files on startup
    hydrate: function(){
      var self = this;
      var keys = {
        'ai_config.json': ['aiConfig'],
        'preferences.json': ['theme', 'font', 'authorFont', 'wallpaper']
      };
      var promises = [];
      Object.keys(keys).forEach(function(fname){
        promises.push(self.read(fname).then(function(result){
          if (!result || !result.data) return;
          var data = result.data;
          var mapped = keys[fname];
          mapped.forEach(function(k){
            if (data[k] !== undefined) {
              localStorage.setItem('bsw_' + k, JSON.stringify(data[k]));
            }
          });
        }).catch(function(){}));
      });
      return Promise.all(promises);
    }
  };

     固定在右上角的 notice-rail：从右侧滑入、带左侧主色指示条、可单条关闭或一键清除全部。 */
  function getNoticeRail(){
    var rail = document.getElementById('noticeRail');
    if (!rail) {
      rail = document.createElement('div');
      rail.id = 'noticeRail';
      rail.className = 'notice-rail';
      rail.setAttribute('aria-live', 'polite');
      document.body.appendChild(rail);
      var clearAll = document.createElement('button');
      clearAll.type = 'button';
      clearAll.className = 'notice-clear-all';
      clearAll.textContent = '清除全部';
      clearAll.onclick = function(){
        var items = rail.querySelectorAll('.notice-item');
        for (var i = 0; i < items.length; i++) items[i].remove();
        refreshClearAll();
      };
      rail._clearAll = clearAll;
      rail.appendChild(clearAll);
    }
    return rail;
  }

  function refreshClearAll(){
    var r = document.getElementById('noticeRail');
    if (!r) return;
    var hasItems = r.querySelectorAll('.notice-item').length > 0;
    if (r._clearAll) r._clearAll.style.display = hasItems ? '' : 'none';
  }

  function buildNotice(msg, type, autoMs){
    var item = document.createElement('div');
    item.className = 'notice-item' + (type ? ' ' + type : '');
    var span = document.createElement('span');
    span.className = 'notice-text';
    span.textContent = msg;
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'notice-close';
    close.title = '清除本消息';
    close.setAttribute('aria-label', '清除本消息');
    close.textContent = '×';
    item.appendChild(span);
    item.appendChild(close);
    var timer = null;
    function kill(){ if (timer) { clearTimeout(timer); timer = null; } item.remove(); refreshClearAll(); }
    close.onclick = kill;
    if (autoMs && autoMs > 0) timer = setTimeout(kill, autoMs);
    return item;
  }

  /* 常驻确认类提示：添加到背诵 / 加入错题本等；7 秒后自动收回，也可手动关闭 */
  function pushNotice(msg, type){
    if (type === 'error') { showErrorAlert(msg); return; }
    var rail = getNoticeRail();
    var item = buildNotice(msg, type, 7000);
    rail.insertBefore(item, rail.firstChild);
    refreshClearAll();
  }

        body: JSON.stringify({ filename: file.name, data: dataUrl })

      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.success) {
          wpStatus.textContent = '上传成功：' + data.filename;

          loadWallpaperList();
          setTimeout(function(){ location.reload(); }, 600);
        } else {
          wpStatus.textContent = '上传失败：' + (data.error || '未知错误');
        }
      })
      .catch(function(e){

  function throttle(fn, ms){
    var last=0, timer=null;
    return function(){
      var ctx=this, args=arguments, now=Date.now();
      var rem = ms - (now-last);
      if(rem<=0){ last=now; if(timer){ clearTimeout(timer); timer=null; } fn.apply(ctx,args); }
      else if(!timer){ timer=setTimeout(function(){ last=Date.now(); timer=null; fn.apply(ctx,args); }, rem); }
    };
  }
  function escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function debounce(fn, ms){
    var timer = null;
    return function(){
      var ctx = this, args = arguments;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function(){ timer = null; fn.apply(ctx, args); }, ms);
    };
  }
