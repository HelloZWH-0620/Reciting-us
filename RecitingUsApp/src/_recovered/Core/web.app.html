      id:'liuyun', title:'礼运（节选）', author:'《礼记》', authorId:'liji', cat:'wenyanwen',
      audio:'',
      text:'"大道之行也，天下为公。选贤与能，讲信修睦，故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。"',
      translation: "大道实行的时代，天下为天下人所共有。选拔贤德的人，推举能干的人，讲求信用，调整人与人之间的关系使它和睦。所以人们不只敬爱自己的双亲，不只疼爱自己的子女。使老人们能终其天年，壮年人能发挥自己的才能，孩子们能很好地成长，矜寡孤独残疾的人都能得到供养。男子有职业，女子有归宿。对于财物，人们厌恶它被扔在地上（不被人收起来），但不一定藏在自己家里；对于力气，人们厌恶它不从自己身上使出来，但不一定为了自己。所以奸诈之心闭塞而不发生，盗窃造反害人的事情不发生，所以大门外出而不关，这就是\"大同\"。",
      notes: [{phrase:"大道",pos:"大道之行也",explain:"治国的大道，指太平治世的原则。"},{phrase:"大同",pos:"是谓大同",explain:"儒家理想社会。"},{phrase:"与",pos:"选贤与能",explain:"同「举」，选拔。"},{phrase:"修睦",pos:"讲信修睦",explain:"调整人际关系使和睦。"},{phrase:"亲其亲",pos:"不独亲其亲",explain:"第一个亲是动词，敬爱；第二个亲是名词，双亲。"},{phrase:"矜",pos:"矜寡孤独废疾者",explain:"同「鳏」，老而无妻的人。"},{phrase:"分",pos:"男有分",explain:"职分。"},{phrase:"归",pos:"女有归",explain:"出嫁。"},{phrase:"货恶其弃于地也",pos:"货恶其弃于地也",explain:"财物，厌恶它被扔在地上。"},{phrase:"谋闭",pos:"谋闭而不兴",explain:"奸诈之心闭塞。"},{phrase:"外户",pos:"外户而不闭",explain:"大门。"}],
      appreciation: "本文节选自《礼记·礼运》，是儒家经典中关于理想社会的重要论述，集中反映了儒家的社会政治理想。\n\n写作背景：《礼记》是战国至秦汉年间儒家学者解释说明经书《仪礼》的文章选集。\"礼运\"是指礼的运行，本文是孔子参加蜡祭后感叹而发，向弟子言偃讲述的关于大同社会的理想。\n\n思想内容：描绘了\"大同\"社会的图景——天下为公、选贤与能、讲信修睦、老有所终、壮有所用、幼有所长、矜寡孤独皆有所养。这是中国古代思想中关于理想社会的经典论述，是儒家\"天下为公\"思想的集中体现。\n\n写作特色：1. 语言简练而内涵丰富——\"天下为公\"四字浓缩了儒家政治理想的精髓；2. 排比铺陈——\"老有所终，壮有所用，幼有所长\"等句式整齐，气势充沛；3. 描述与论述结合，描绘出一幅和谐美好的社会图景。\n\n名句价值：\"大道之行也，天下为公\"\"是谓大同\"成为儒家社会理想的最高概括，对后世影响极为深远，近代孙中山的\"天下为公\"即出于此。"
    },
    {
      id:'chenqingbiao', title:'陈情表', author:'李密', authorId:'limi', cat:'wenyanwen',
      audio:'resource/audio/chenqingbiao.aac',
      text:'臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。\n\n逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉；后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃，欲苟顺私情，则告诉不许：臣之进退，实为狼狈。\n\n伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日，祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。\n\n臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。',
      translation: "臣子李密上言：臣子因命运不好，小时候就遭遇不幸。生下来才六个月，慈父就去世了；到了四岁，舅舅强迫母亲改变了守节的志愿。祖母刘氏怜悯我孤单弱小，亲自抚养我。我小时候经常生病，九岁还不能行走，孤苦零丁，一直到成年。既没有伯伯叔叔，到底也没有兄弟，门庭衰微福分浅薄，很晚才有儿子。外面没有比较亲近的亲戚，里面没有照应门户的童仆，孤单无依地独立生活，只有身体和影子互相安慰。而刘氏早就被疾病缠身，常常躺在床上，我服侍她服用汤药，从未曾停止离开。\n\n到了侍奉圣朝，我沐浴在清明的教化之中。先前太守臣逵考察举荐我为孝廉；后来刺史臣荣推举我为秀才。我因为供养祖母没有人主持，辞谢没有赴命。诏书特地下来，任命我为郎中，不久蒙受国恩，授我为洗马。以我这样的微贱之人，担任侍奉太子的官职，这不是我丧命所能报答的。我用表章详尽地上闻，辞谢不去就职。诏书急切严厉，责备我逃避怠慢；郡县长官逼迫，催我上路；州官登门督促，比星火还要急迫。我想奉诏奔驰，则刘氏病情日益严重，想苟且顺从私情，则申诉又不被允许：我实在是进退两难，十分狼狈。\n\n我想到圣朝以孝道治理天下，凡是故老，还蒙受怜悯养育，何况我孤单苦楚，特别严重。而且我年轻时在伪朝做官，历任郎署官职，本图官位显达，不顾惜名节。如今我是亡国的贱俘，至微至陋，过分蒙受提拔，恩宠优厚，怎敢徘徊不前，还有什么希冀。只是因为刘氏日薄西山，气息奄奄，生命危浅，朝不保夕。我没有祖母，不能到今天；祖母没有我，不能终其余年。祖孙二人，互相依靠为命，因此我这点心意不能废止远离。\n\n臣子今年四十四岁，祖母今年九十六岁，这样我向陛下尽节的日子还长，而奉养刘氏的日子不多了。乌鸟有私情，我乞求奉养到终。我的苦辛，不仅蜀地人士及二州牧伯所见明知，皇天后土实在共同看见。希望陛下怜悯我的愚诚，听任我的小小心愿，使刘氏侥幸，保卒余年。我活着当陨首效忠，死了当结草报恩。臣子怀着犬马一样不胜怖惧的心情，恭敬地拜上此表让陛下闻知。",
      notes: [{phrase:"险衅",pos:"臣以险衅",explain:"命运不好。衅（xìn）。"},{phrase:"夙",pos:"夙遭闵凶",explain:"早。"},{phrase:"闵凶",pos:"夙遭闵凶",explain:"忧伤凶丧。闵通「悯」。"},{phrase:"见背",pos:"慈父见背",explain:"背离我，指去世。"},{phrase:"夺",pos:"舅夺母志",explain:"强迫改变。"},{phrase:"愍",pos:"愍臣孤弱",explain:"怜悯。"},{phrase:"鲜",pos:"终鲜兄弟",explain:"少，这里指没有。"},{phrase:"祚薄",pos:"门衰祚薄",explain:"福分浅薄。祚（zuò）。"},{phrase:"期功",pos:"期功强近之亲",explain:"古代丧服的名称。期（jī）。"},{phrase:"茕茕孑立",pos:"茕茕孑立，形影相吊",explain:"孤单无依地独立。"},{phrase:"婴",pos:"夙婴疾病",explain:"缠绕。"},{phrase:"蓐",pos:"常在床蓐",explain:"草垫。蓐（rù）。"},{phrase:"逮",pos:"逮奉圣朝",explain:"到了。"},{phrase:"察",pos:"察臣孝廉",explain:"考察举荐。"},{phrase:"寻",pos:"寻蒙国恩",explain:"不久。"},{phrase:"除",pos:"除臣洗马",explain:"授职。"},{phrase:"洗马",pos:"除臣洗马",explain:"太子的侍从官。洗（xiǎn）。"},{phrase:"猥",pos:"猥以微贱",explain:"鄙贱，谦词。"},{phrase:"逋慢",pos:"责臣逋慢",explain:"逃避怠慢。"},{phrase:"笃",pos:"刘病日笃",explain:"沉重。"},{phrase:"日薄西山",pos:"日薄西山",explain:"太阳接近西山，比喻人临近死亡。"},{phrase:"矜育",pos:"犹蒙矜育",explain:"怜悯养育。"},{phrase:"盘桓",pos:"岂敢盘桓",explain:"徘徊不前。"},{phrase:"乌鸟私情",pos:"乌鸟私情",explain:"比喻奉养老人的孝心。"},{phrase:"矜愍",pos:"矜愍愚诚",explain:"怜悯。"},{phrase:"庶",pos:"庶刘侥幸",explain:"庶几，或许可以。"},{phrase:"结草",pos:"死当结草",explain:"死后报恩的典故。"}],
      appreciation: "《陈情表》是李密在晋武帝司马炎征召他入朝任职时上奏的一篇奏章，是中国古代\"表\"体散文的典范之作，与《出师表》并称。\n\n写作背景：李密曾在蜀汉任职，蜀亡后晋武帝征他为太子洗马。李密因祖母刘氏年迈多病无人奉养，上表辞谢，情真意切，晋武帝阅后深受感动，赐他赡养祖母并赐奴婢二人。\n\n思想内容：以\"孝\"为核心，陈述自己与祖母\"更相为命\"的处境，表达\"先尽孝后尽忠\"的请求，最终打动晋武帝。文章体现了\"以孝治天下\"的时代背景，也表达了\"忠孝不能两全\"时的取舍。\n\n写作特色：1. 情真意切，以情动人——\"臣无祖母，无以至今日；祖母无臣，无以终余年\"一句催人泪下；2. 骈散结合，对仗工整——大量四字句的运用使文章富有节奏感；3. 语气委婉——既表达辞命之愿，又表明忠心，进退得宜。\n\n名句价值：\"茕茕孑立，形影相吊\"\"日薄西山，气息奄奄\"\"乌鸟私情，愿乞终养\"\"人命危浅，朝不虑夕\"等句成为千古传诵的名句。"
    },
    {
      id:'guiqulaixici', title:'归去来兮辞（并序）', author:'陶渊明', authorId:'taoyuanming', cat:'wenyanwen',
      audio:'resource/audio/guiqulaixici.aac',
      text:'余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。\n\n归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。\n\n乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。\n\n归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓以始流。善万物之得时，感吾生之行休。\n\n已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流以赋诗。聊乘化以归尽，乐夫天命复奚疑！',
      translation: "我家里贫穷，自己耕种不足以养活自己。满屋子的小孩，米缸里没有存粮，维持生活的方法，我还没有找到。亲戚朋友大多劝我出去做个小官，我也有所动心，但是没有门路求得。恰逢各州郡向京城交派公差，地方官员都把爱才当做恩德，家叔因为我的贫穷，于是我被任用在小县。当时社会动荡未平，心里害怕远行，彭泽县距离我家只有一百里，公田收获的利益，足够酿酒。所以便请求去做这个官。过了几天，有思念归家的心情。为什么呢？我的本性自然，不是勉强矫饰所能得到的。饥寒虽然切身，但违背本心就会生病。曾经出仕做官，都是为了口腹之欲而役使自己。于是怅然感慨，深感平生之志愧恨。还希望等收获一次庄稼，便收拾行装连夜离去。不久程氏妹妹在武昌去世，我急于奔丧，自己免去官职。从仲秋到冬天，做官共八十多天。因辞官归家顺乎心意，写下了这篇辞叫《归去来兮》。时在乙巳年十一月。\n\n回去吧，田园快要荒芜了，为什么还不回去？既然自己让心志被形体所驱使，为什么还要惆怅而独自悲伤？觉悟到过去的事情已经不能挽回，知道未来的事情还可以补救。实际上走入迷途还不算太远，我已经觉悟到今天是对的而昨天是错的。船儿轻快地飘荡前进，风儿飘飘地吹动衣襟。向行人打听前面的路程，只恨晨光还是这样微弱。\n\n终于看到了简陋的家门，我一边高兴地一边奔去。仆人们欢喜地迎接，小孩子在门口等候。庭院中的小路已经荒芜，松树菊花依然存在。带着幼儿进入室内，酒樽中已经盛满了酒。拿起酒壶酒杯自斟自饮，看着庭院中的树枝露出喜悦的笑容。倚靠南窗寄托傲然自得的心情，深知这狭小的居室也足以安身。每天在园中散步成为乐趣，房屋虽然有门却经常关闭。拄着拐杖走走停停，时时抬头眺望远方。云气自然而然地从山峰中冒出，鸟儿飞累了就知道返回。日光渐渐暗淡太阳即将落山，我抚摸着孤松徘徊不忍离去。\n\n回去吧，让我断绝与世俗的交往。既然世俗与我的志趣相违背，我还驾车出去追求什么呢？我喜欢听亲戚们说说知心话，乐于弹琴读书来消除忧愁。农人告诉我春天到了，将要有农事在西边的田里。有时驾着带帷幕的车，有时划着一只小船。既探索幽深的沟壑，也经过崎岖的山丘。树木生机勃勃地向荣生长，泉水潺潺地开始流淌。羡慕万物的逢时生机，感叹我的生命即将终结。\n\n算了吧！寄身天地之间还能有多少时间？为什么不顺应自己的心意决定去留？为什么还要心神不定地想要去哪里？富贵不是我的愿望，仙境也不可期待。趁着美好的时光独自外出，有时放下拐杖除草培苗。登上东边的高地放声长啸，面对清澈的流水吟诵诗篇。姑且顺应自然的变化走向生命的尽头，乐天安命还有什么可疑虑的！",
      notes: [{phrase:"来",pos:"归去来兮",explain:"语气词。"},{phrase:"芜",pos:"田园将芜胡不归",explain:"荒芜。"},{phrase:"胡",pos:"胡不归",explain:"为什么。"},{phrase:"形",pos:"既自以心为形役",explain:"形体。"},{phrase:"奚",pos:"奚惆怅而独悲",explain:"为什么。"},{phrase:"谏",pos:"悟已往之不谏",explain:"挽回。"},{phrase:"追",pos:"知来者之可追",explain:"补救。"},{phrase:"飏",pos:"舟遥遥以轻飏",explain:"飞扬。"},{phrase:"熹微",pos:"恨晨光之熹微",explain:"微弱。"},{phrase:"瞻",pos:"乃瞻衡宇",explain:"看到。"},{phrase:"衡宇",pos:"乃瞻衡宇",explain:"简陋的房屋。"},{phrase:"载...载...",pos:"载欣载奔",explain:"又……又……。"},{phrase:"三径",pos:"三径就荒",explain:"庭院中的小路。"},{phrase:"眄",pos:"眄庭柯以怡颜",explain:"斜视。"},{phrase:"容膝",pos:"审容膝之易安",explain:"形容居室狭小。"},{phrase:"策",pos:"策扶老以流憩",explain:"拄着。"},{phrase:"岫",pos:"云无心以出岫",explain:"山峰。"},{phrase:"景",pos:"景翳翳以将入",explain:"日光。景通「影」。"},{phrase:"棹",pos:"或棹孤舟",explain:"桨，这里作动词。"},{phrase:"善",pos:"善万物之得时",explain:"羡慕。"},{phrase:"行休",pos:"感吾生之行休",explain:"将要结束。"},{phrase:"曷",pos:"曷不委心任去留",explain:"何。"},{phrase:"遑遑",pos:"胡为乎遑遑欲何之",explain:"心神不定。"},{phrase:"帝乡",pos:"帝乡不可期",explain:"仙境。"},{phrase:"耘耔",pos:"或植杖而耘耔",explain:"除草培苗。"},{phrase:"皋",pos:"登东皋以舒啸",explain:"水边高地。"},{phrase:"乘化",pos:"聊乘化以归尽",explain:"顺应自然变化。"}],
      appreciation: "《归去来兮辞》是陶渊明辞去彭泽令后所作，是中国文学史上著名的辞赋作品，是\"隐逸诗人之宗\"的代表作。\n\n写作背景：陶渊明四十一岁时任彭泽令，仅八十余日即辞官归隐。序中详述辞官原因——\"质性自然，非矫厉所得\"\"饥冻虽切，违己交病\"，写出了不愿为五斗米折腰的心志。\n\n思想内容：通过描写辞官归隐的喜悦和田园生活的情趣，表达了作者对官场生活的厌恶、对田园生活的热爱，以及对自然人生的顺应——\"乐夫天命复奚疑\"，体现了道家\"顺应自然\"的哲学思想。\n\n写作特色：1. 情景交融——\"云无心以出岫，鸟倦飞而知还\"既是写景，也是抒怀；2. 音韵和谐——大量\"兮\"字和\"以、而\"的运用使文章具有回环往复的音乐美；3. 句式整齐而有变化，骈散结合；4. 想象丰富——\"舟遥遥以轻飏\"等描写了归途中的情景，其实辞官时这些尚未发生，纯属想象。\n\n名句价值：\"悟已往之不谏，知来者之可追\"\"云无心以出岫，鸟倦飞而知还\"\"登东皋以舒啸，临清流以赋诗\"等句成为后世文人归隐情怀的经典表达。"

      id:'zhongshu', title:'种树郭橐驼传', author:'柳宗元', authorId:'liuzongyuan', cat:'wenyanwen',
      audio:'resource/audio/zhongshu.aac',
      text:'郭橐驼，不知始何名。病瘘，隆然伏行，有类橐驼者，故乡人号之"驼"。驼闻之，曰："甚善。名我固当。"因舍其名，亦自谓橐驼云。\n\n其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活，且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。\n\n有问之，对曰："橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然，根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤，旦视而暮抚，已去而复顾，甚者爪其肤以验其生枯，摇其本以观察其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之，故不我若也。吾又何能为哉！"\n\n问者曰："以子之道，移之官理，可乎？"驼曰："我知种树而已，官理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：\u2018官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。\u2019鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？"\n\n问者曰："嘻，不亦善夫！吾问养树，得养人术。"传其事以为官戒。',
      translation: "郭橐驼，不知道他原来叫什么名字。他患有佝偻病，弯着背走路，有些像骆驼，所以乡里人叫他\"驼\"。他听到后，说：\"很好。这样叫我本来很恰当。\"于是舍弃他的本名，也自称郭橐驼了。\n\n他的乡叫做丰乐乡，在长安西边。橐驼以种树为业，凡是长安富贵人家修筑园林观赏以及卖水果的人，都争相迎接供养他。看橐驼所种的树，或者移植的树，没有不活的，而且高大茂盛，结果早并且果实多。其他种树的人即使偷偷观察效仿，也没有人能比得上他。\n\n有人问他，他回答说：\"我橐驼并不能使树木长寿而且滋生繁茂，能够顺应树木的天性，来使它的本性发展罢了。大凡种植树木的本性，它的根要舒展，它培土要平整，它周围的土要旧，它捣土要紧密。已经这样做了，不要动不要虑，离开了就不再回头看。栽种它时要像对待自己的孩子一样，栽好后放置要像丢弃它一样，那么它的天性就保全而本性就得其自然了。所以我只是不妨害它的生长罢了，并不是有能力使它高大茂盛；只是不抑制损耗它的果实罢了，并不是有能力使它结果早并且果实多。其他种树的人就不是这样，根拳曲土被换掉，他们培土，不是过多就是不够。即使有能与此相反的，却又爱得太深，忧虑得太勤，早上查看晚上抚摩，已经离开又回头来看，甚至抓破树皮来检验它的死活，摇动树根来观察土的松紧，那么树木的本性就一天天丧失了。虽然说爱它，其实是害它；虽然说忧它，其实是仇视它，所以都不如我。我又能做什么呢！\"\n\n问的人说：\"把你的道理，转移到做官治民上，可以吗？\"橐驼说：\"我只知道种树罢了，做官治民，不是我的职业。但是我住在乡里，看到那些长官喜欢频繁地下达命令，好像很怜爱百姓，结果却给百姓带来灾祸。早晚差役来呼喊说：'官府命令催促你们耕种，勉励你们种植，督促你们收获，早些煮茧抽丝，早些织布，养育你们的小孩，喂大你们的鸡猪。'敲鼓聚集他们，敲木梆召唤他们。我们小民百姓停下吃饭去慰劳差役，尚且不得空闲，又靠什么使我们生活繁衍、心性安宁呢？所以百姓困苦疲倦。像这样，那么与我所做的事也有相似之处吧？\"\n\n问的人说：\"嘿，不也很好吗！我问养树，得到了养民的方法。\"把这些事记下来作为官吏的鉴戒。",
      notes: [{phrase:"橐驼",pos:"有类橐驼者",explain:"骆驼。"},{phrase:"病瘘",pos:"病瘘",explain:"患佝偻病。瘘（lòu）。"},{phrase:"隆然",pos:"隆然伏行",explain:"高起的样子。"},{phrase:"号",pos:"故乡人号之",explain:"起外号。"},{phrase:"名我",pos:"名我固当",explain:"给我起名。"},{phrase:"业",pos:"驼业种树",explain:"以……为业。"},{phrase:"孳",pos:"非能使木寿且孳也",explain:"滋生、繁殖。"},{phrase:"致其性",pos:"以致其性焉尔",explain:"使它的本性发展。"},{phrase:"舒",pos:"其本欲舒",explain:"舒展。"},{phrase:"故",pos:"其土欲故",explain:"旧。"},{phrase:"莳",pos:"其莳也若子",explain:"栽种。"},{phrase:"拳",pos:"根拳而土易",explain:"拳曲。"},{phrase:"易",pos:"根拳而土易",explain:"换。"},{phrase:"恩",pos:"爱之太恩",explain:"深情。"},{phrase:"爪",pos:"爪其肤",explain:"用指甲抓破。"},{phrase:"官理",pos:"移之官理",explain:"做官治民。"},{phrase:"长人者",pos:"见长人者好烦其令",explain:"做官的人。"},{phrase:"怜",pos:"若甚怜焉",explain:"爱护。"},{phrase:"勖",pos:"勖尔植",explain:"勉励。勖（xù）。"},{phrase:"缫而绪",pos:"早缫而绪",explain:"煮茧抽丝。缫（sāo）。"},{phrase:"字",pos:"字而幼孩",explain:"养育。"},{phrase:"飧饔",pos:"辍飧饔以劳吏者",explain:"晚饭和早饭。飧（sūn）饔（yōng）。"}],
      appreciation: "《种树郭橐驼传》是柳宗元早年的传记散文作品，是一篇寓言式的传记，是\"传\"体的创新之作。\n\n写作背景：柳宗元参与王叔文政治革新失败后被贬，对官府扰民有深切体会，本文通过种树之理讽喻为官之道，是中唐\"永贞革新\"失败后的反思之作。\n\n思想内容：通过郭橐驼\"顺木之天，以致其性\"的种树经验，引申出为官治民应\"顺民之性\"\"少烦其令\"的道理。核心观点是\"养人术\"——治民要像种树一样，不可过度干扰，要给百姓休养生息的空间。\n\n写作特色：1. 寓言式传记——以\"问者\"与橐驼对话展开，将种树之理与治民之道巧妙类比；2. 对比鲜明——橐驼\"顺木之天\"与他植者\"爱之太恩，忧之太勤\"形成对比；3. 语言简洁，刻画传神——橐驼的形象塑造生动鲜明。\n\n名句价值：\"能顺木之天，以致其性焉尔\"\"其莳也若子，其置也若弃\"\"吾问养树，得养人术\"等句成为治民之道的经典比喻。"
    },
    {
      id:'wudaishilingguan', title:'五代史伶官传序', author:'欧阳修', authorId:'ouyangxiu', cat:'wenyanwen',
      audio:'resource/audio/wudaishilingguan.aac',
      text:'呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。\n\n世言晋王之将终也，以三矢赐庄宗而告之曰："梁，吾仇也；燕王吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！"庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。\n\n方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归。至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？《书》曰："满招损，谦得益。"忧劳可以兴国，逸豫可以亡身，自然之理也。\n\n故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉？',
      translation: "唉！国家兴盛与衰亡的道理，虽然说是天命，难道不是由于人事吗！考察后唐庄宗之所以得到天下，和他所以失去天下的原因，就可以知道这个道理了。\n\n世人说晋王将死的时候，把三支箭赐给庄宗而告诉他说：\"梁国是我的仇敌；燕王是我立的，契丹与我约为兄弟，但都背叛了晋国归附了梁国。这三件事，是我的遗恨。给你三支箭，你不要忘记你父亲的志向！\"庄宗接受了箭并把它收藏在宗庙里。此后用兵时，就派从事用一少牢之礼祭告祖庙，请下那箭，用锦囊装着，背着走在前面，等到凯旋时再把箭放回原处。\n\n当他用绳索捆绑着燕王父子，用木匣装着梁国君臣的首级，进入太庙，把箭还给先王，并报告成功的消息时，他意气之盛，可以说是壮极了！等到仇敌已经消灭，天下已经平定，一个普通人在夜间一声呼喊，作乱的人四方响应，仓皇向东出逃，还没见到贼人军队就已经离散，君臣相顾，不知道归向何处。甚至对天发誓剪断头发，眼泪下沾湿了衣襟，多么衰颓啊！难道是得天下难而失天下容易吗？还是考察他成败的痕迹，都由于人事呢？《尚书》说：\"自满招致损失，谦虚得到益处。\"忧虑操劳可以使国家兴盛，安逸享乐可以使自身灭亡，这是自然的道理。\n\n所以当他兴盛的时候，整个天下的豪杰，没有谁能与他争锋；等到他衰败的时候，几十个伶人围困他，就身死国灭，被天下人耻笑。祸患常常积累在微小的事情上，而智勇双全的人多被所溺爱的事物困住，难道只是伶人吗？",
      notes: [{phrase:"原",pos:"原庄宗之所以得天下",explain:"推原，考察。"},{phrase:"庄宗",pos:"原庄宗之所以得天下",explain:"后唐庄宗李存勖。"},{phrase:"三矢",pos:"以三矢赐庄宗",explain:"三支箭，象征三大遗恨。"},{phrase:"从事",pos:"则遣从事以一少牢告庙",explain:"官名，泛指一般属官。"},{phrase:"少牢",pos:"以一少牢告庙",explain:"祭祀用羊猪二牲。"},{phrase:"纳",pos:"及凯旋而纳之",explain:"放回原处。"},{phrase:"组",pos:"系燕父子以组",explain:"丝带、绳索。"},{phrase:"函",pos:"函梁君臣之首",explain:"用木匣装。名词作动词。"},{phrase:"仇雠",pos:"及仇雠已灭",explain:"仇敌。雠（chóu）。"},{phrase:"一夫",pos:"一夫夜呼",explain:"一个人，指皇甫晖。"},{phrase:"仓皇",pos:"仓皇东出",explain:"慌张。"},{phrase:"抑",pos:"抑本其成败之迹",explain:"还是。"},{phrase:"本",pos:"抑本其成败之迹",explain:"推究。"},{phrase:"满招损，谦得益",pos:"满招损，谦得益",explain:"自满招致损失，谦虚得到益处。"},{phrase:"忧劳",pos:"忧劳可以兴国",explain:"忧虑操劳。"},{phrase:"逸豫",pos:"逸豫可以亡身",explain:"安逸享乐。"},{phrase:"忽微",pos:"祸患常积于忽微",explain:"微小的事物。"},{phrase:"所溺",pos:"智勇多困于所溺",explain:"沉溺的事物。"}],
      appreciation: "本文是欧阳修所撰《新五代史·伶官传》的序，是一篇著名的史论散文。\n\n写作背景：欧阳修撰《新五代史》时，为伶官（宫廷艺人）作传，并写此序。后唐庄宗李存勖宠信伶人，导致身死国灭，欧阳修以此事为鉴，论述国家盛衰之理。\n\n思想内容：通过后唐庄宗得天下与失天下的对比，提出\"忧劳可以兴国，逸豫可以亡身\"\"祸患常积于忽微，智勇多困于所溺\"的著名论断，阐明\"盛衰之理\"在于人事而非天命的中心论点。\n\n写作特色：1. 对比鲜明——庄宗\"得天下之难\"与\"失天下之易\"对比，\"盛时\"与\"衰时\"对比；2. 史论结合——叙事为议论服务，议论水到渠成；3. 句式骈散结合，抑扬顿挫；4. 感情充沛，开篇\"呜呼\"一声感慨，奠定全文感情基调。\n\n名句价值：\"满招损，谦得益\"\"忧劳可以兴国，逸豫可以亡身\"\"祸患常积于忽微，而智勇多困于所溺\"等句成为千古传诵的警句，至今仍有深刻的警示意义。"

    {
      id:'liuguolun', title:'六国论', author:'苏洵', authorId:'suxun', cat:'wenyanwen',
      audio:'resource/audio/liuguolun.aac',
      text:'六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰：弊在赂秦也。\n\n秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云："以地事秦，犹抱薪救火，薪不尽，火不灭。"此言得之。\n\n齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。\n\n呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！\n\n夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。',
      translation: "六国灭亡，不是武器不锋利，不善于作战，弊病在于贿赂秦国。贿赂秦国而国力亏损，这就是灭亡的原因。有人说：六国相继灭亡，全是因为贿赂秦国吗？回答说：不贿赂的国家因为贿赂的国家而灭亡。因为失去强有力的援助，不能独自保全。所以说：弊病在于贿赂秦国啊。\n\n秦国除了用战争夺取土地之外，小的得到邑，大的得到城。比较秦国所得到的土地，与战胜所得到的土地，实际上多百倍；诸侯所失去的土地，与战败所失去的土地，实际上也多百倍。那么秦国最大的欲望，诸侯最大的祸患，本来就不在于战争了。想想他们的祖辈父辈，冒着霜露，斩除荆棘，才有了这点土地。子孙对它不甚爱惜，拿来送给别人，就像丢弃草芥一样。今天割让五座城，明天割让十座城，然后才能睡一个安稳觉。起床看四周边境，而秦国的军队又到了。既然如此，诸侯的土地有限，暴秦的贪欲没有满足，送给他的越多，侵犯他们越急。所以不用战争，强弱胜负已经判定了。至于国家颠覆，本来就是理所当然的。古人说：\"用土地侍奉秦国，就像抱着柴草救火，柴草烧不完，火就不会灭。\"这话说到点子上了。\n\n齐国人未曾贿赂秦国，最终也跟着五国相继灭亡，为什么呢？因为与秦国交好而不帮助五国。五国已经灭亡，齐国也不能幸免了。燕国赵国的君主，一开始有远大谋略，能够守住他们的土地，坚持大义不贿赂秦国。所以燕国虽是小国却后灭亡，这就是用兵的效果。到了太子丹用荆轲刺秦王作为计策，才招致祸患。赵国曾经与秦国交战五次，败了两次胜了三次。后来秦国两次攻打赵国，李牧接连击退秦军。等到李牧因为谗言被杀，邯郸成为秦国的一个郡，可惜赵国用武而不能坚持到底。况且燕赵处在秦国几乎要把其他国家消灭干净的时候，可以说是智谋孤立力量单薄，战败而灭亡，实在是不得已。假使三国各自爱惜他们的土地，齐国人不要依附秦国，刺客不去行刺，良将还在，那么胜败的命运，存亡的道理，应当与秦国相比，或许还不容易估量。\n\n唉！用贿赂秦国的土地封赏天下的谋臣，用侍奉秦国的心意礼遇天下的奇才，合力向西对抗秦国，那么我恐怕秦国人吃饭也咽不下去。可悲啊！有这样的形势，却被秦国人的积威所挟制，日削月割，以至于走向灭亡。治理国家的人不要让自己被积威所挟制啊！\n\n六国与秦都是诸侯，他们的实力比秦国弱，却还有可以不贿赂而战胜秦国的形势。如果凭借天下之大，反而追随六国灭亡的旧例，这就又在六国之下了。",
      notes: [{phrase:"兵",pos:"非兵不利",explain:"武器。"},{phrase:"弊",pos:"弊在赂秦",explain:"弊病。"},{phrase:"赂",pos:"弊在赂秦",explain:"贿赂，这里指割地求和。"},{phrase:"率",pos:"率赂秦耶",explain:"全都、大都。"},{phrase:"完",pos:"不能独完",explain:"保全。"},{phrase:"厥",pos:"思厥先祖父",explain:"相当于\'其\'。"},{phrase:"暴",pos:"暴霜露",explain:"暴露。暴（pù）。"},{phrase:"草芥",pos:"如弃草芥",explain:"比喻微不足道的东西。"},{phrase:"厌",pos:"暴秦之欲无厌",explain:"满足。厌通「餍」。"},{phrase:"弥",pos:"奉之弥繁",explain:"越。"},{phrase:"抱薪救火",pos:"犹抱薪救火",explain:"比喻方法不对，反而使祸患扩大。"},{phrase:"与嬴",pos:"与嬴而不助五国也",explain:"结交、亲附秦国。"},{phrase:"迁灭",pos:"终继五国迁灭",explain:"被灭。"},{phrase:"始",pos:"始速祸焉",explain:"才。"},{phrase:"速",pos:"始速祸焉",explain:"招致。"},{phrase:"再",pos:"后秦击赵者再",explain:"两次。"},{phrase:"却",pos:"李牧连却之",explain:"击退。"},{phrase:"洎",pos:"洎牧以谗诛",explain:"等到。洎（jì）。"},{phrase:"革灭",pos:"处秦革灭殆尽之际",explain:"消灭。"},{phrase:"智力",pos:"可谓智力孤危",explain:"智谋和力量。古今异义。"},{phrase:"向使",pos:"向使三国各爱其地",explain:"假使。"},{phrase:"当",pos:"当与秦相较",explain:"倘若。"},{phrase:"故事",pos:"从六国破亡之故事",explain:"旧事、前例。古今异义。"},{phrase:"劫",pos:"为秦人积威之所劫",explain:"胁迫、挟制。"}],
      appreciation: "《六国论》是苏洵政论文的代表作，是\"三苏\"文章中的名篇，与苏辙《六国论》并称。\n\n写作背景：北宋建国后对契丹（辽）和西夏采取\"岁币\"政策，以钱财换和平。苏洵借此文借古讽今，以六国赂秦之事讽喻北宋朝廷的妥协退让政策。\n\n思想内容：提出\"六国破灭，弊在赂秦\"的中心论点，分析六国因赂秦而相继灭亡的历史教训，借古讽今，告诫北宋统治者不要重蹈六国覆辙——\"为国者无使为积威之所劫哉\"。\n\n写作特色：1. 逻辑严密——开门见山提出中心论点，分\"赂者\"与\"不赂者\"两层论证，最后得出结论；2. 对比论证——秦之所欲与诸侯之所患对比，今日割城与明日割城对比；3. 语言精练，气势充沛；4. 借古讽今，含蓄委婉。\n\n名句价值：\"弊在赂秦\"\"抱薪救火，薪不尽，火不灭\"\"苟以天下之大，下而从六国破亡之故事，是又在六国下矣\"等成为千古传诵的警句。"
    },
    {
      id:'dasimajianyishu', title:'答司马谏议书', author:'王安石', authorId:'wanganshi', cat:'wenyanwen',
      audio:'resource/audio/dasimajianyishu.aac',
      text:'某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。\n\n盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。\n\n人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已；盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。\n\n无由会晤，不任区区向往之至！',
      translation: "安石启：昨日承蒙您赐教，私下以为与您交往相处友好的日子很久了，但讨论政事常常意见不合，是因为所持的主张多有不同的缘故。虽然想勉强唠叨一番，但终归不能被您理解，所以只简略地回复一下，不再一一自辩了。又想到承蒙您厚待我，对于反复论辩不应该鲁莽，所以现在详细说明原因，希望您或许能原谅我。\n\n大凡读书人所争论的，特别在于名实关系，名实关系明确了，天下的道理也就得到了。现在您用来指教我的，认为我侵官、生事、征利、拒谏，以致招致天下人的怨恨诽谤。我则认为：从君主那里接受命令，在朝廷上讨论修订法度，然后交给主管官员执行，不算侵官；推行先王的政治，用来兴利除弊，不算生事；为天下人理财，不算征利；批驳谬论，斥责巧言谄媚的人，不算拒谏。至于怨恨诽谤之多，那是本来事先就知道会这样的。\n\n人们习惯于苟且偷安不是一天了，士大夫大多把不关心国事、附和世俗讨好众人当作好事，皇上想要改变这种风气，而我不估计敌人的多少，想要出力帮助皇上来对抗他们，那么众人为什么不吵闹呢？盘庚迁都时，怨恨的是百姓，不仅是朝廷士大夫而已；盘庚不因为有怨恨的人就改变他的计划，是因为他考虑道义后才行动，做对了就看不到可后悔的地方。如果您责备我在位久了，未能帮助皇上大有作为，使百姓蒙受恩泽，那么我认罪；如果说今天应当一切不做事，只守前人所做罢了，那就不是我所敢于领教的。\n\n没有机会会面，不胜区区向往之至！",
      notes: [{phrase:"某",pos:"某启",explain:"作者自称。"},{phrase:"启",pos:"某启",explain:"写信说明。"},{phrase:"蒙教",pos:"昨日蒙教",explain:"承蒙您赐教。"},{phrase:"窃",pos:"窃以为",explain:"私下，谦词。"},{phrase:"游处",pos:"游处相好之日久",explain:"交往相处。"},{phrase:"强聒",pos:"虽欲强聒",explain:"勉强唠叨。"},{phrase:"见察",pos:"终必不蒙见察",explain:"被理解。"},{phrase:"反覆",pos:"于反覆不宜卤莽",explain:"反复论辩。"},{phrase:"卤莽",pos:"不宜卤莽",explain:"鲁莽，简慢。"},{phrase:"见恕",pos:"冀君实或见恕也",explain:"原谅我。"},{phrase:"名实",pos:"尤在于名实",explain:"名称与实际。"},{phrase:"侵官",pos:"以为侵官",explain:"侵犯原有官员的职权。"},{phrase:"生事",pos:"以为...生事",explain:"惹事生非。"},{phrase:"征利",pos:"征利",explain:"与民争利。"},{phrase:"拒谏",pos:"拒谏",explain:"拒绝劝谏。"},{phrase:"以谓",pos:"某则以谓",explain:"以为。"},{phrase:"壬人",pos:"难壬人",explain:"巧言谄媚的人。壬（rén）。"},{phrase:"怨诽",pos:"至于怨诽之多",explain:"怨恨诽谤。"},{phrase:"苟且",pos:"人习于苟且非一日",explain:"苟且偷安。"},{phrase:"恤",pos:"不恤国事",explain:"关心、顾念。"},{phrase:"同俗自媚于众",pos:"同俗自媚于众为善",explain:"附和世俗讨好众人。"},{phrase:"汹汹然",pos:"则众何为而不汹汹然",explain:"大吵大闹的样子。"},{phrase:"胥怨",pos:"胥怨者民也",explain:"相怨。"},{phrase:"度",pos:"改其度",explain:"计划。度（dù）。"},{phrase:"度义",pos:"度义而后动",explain:"考虑道义。度（duó）。"},{phrase:"是",pos:"是而不见可悔故也",explain:"认为对。"},{phrase:"膏泽",pos:"以膏泽斯民",explain:"施恩惠。"},{phrase:"不事事",pos:"今日当一切不事事",explain:"不做任何事。"}],
      appreciation: "《答司马谏议书》是王安石写给司马光的回信，是北宋政治斗争的重要文献，是\"书\"体散文的典范。\n\n写作背景：宋神宗熙宁年间，王安石推行新法。司马光时任谏议大夫，写了一封三千余字的长信攻击新法，罗列\"侵官、生事、征利、拒谏\"四大罪状。王安石以此信简短回复。\n\n思想内容：1. 针对司马光的指责，逐条驳斥——\"受命于人主\"不为侵官、\"举先王之政\"不为生事、\"为天下理财\"不为征利、\"辟邪说，难壬人\"不为拒谏；2. 表明坚持变法的决心——\"度义而后动，是而不见可悔\"；3. 批评士大夫\"习于苟且\"\"同俗自媚于众\"的因循守旧风气。\n\n写作特色：1. 言简意赅，锋芒毕露——全文仅三百余字，却针锋相对，柔中带刚；2. 逻辑严密——先确立\"名实\"标准，再逐一驳斥；3. 用典贴切——以盘庚迁都为喻，暗示变法虽遭反对但符合道义；4. 语气委婉而坚定——\"则非某之所敢知\"委婉中见坚决。\n\n名句价值：\"人习于苟且非一日\"\"度义而后动，是而不见可悔故也\"成为后世改革者的名言。"
    },
    {
      id:'xiangjixuanzhi', title:'项脊轩志', author:'归有光', authorId:'guiyouguang', cat:'wenyanwen',
      audio:'resource/audio/xiangjixuanzhi.aac',
      text:'项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。\n\n然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是，东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰："某所，而母立于兹。"妪又曰："汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：\u2018儿寒乎？欲食乎？\u2019吾从板外相为应答。"语未毕，余泣，妪亦泣。余自束发读书轩中，一日，大母过余曰："吾儿，久不见若影，何竟日默默在此，大类女郎也？"比去，以手阖门，自语曰："吾家读书久不效，儿之成，则可待乎！"顷之，持一象笏至，曰："此吾祖太常公宣德间执此以朝，他日汝当用之！"瞻顾遗迹，如在昨日，令人长号不自禁。\n\n轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。\n\n余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰："闻姊家有阁子，且何谓阁子也？"其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。\n\n庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。',
      translation: "项脊轩，是过去的南阁子。房间只有一丈见方，可以容纳一个人居住。这是一百年的老屋，灰尘泥土常常从屋顶漏下来，雨水也往下注；每次移动书桌，环顾四周竟然没有可以放置的地方。屋子又朝北，照不到阳光，太阳一过中午就已经昏暗了。我稍稍加以修缮，使屋顶不再漏雨。前面开了四扇窗子，在院子四周砌上墙，挡住南面射来的日光，日光反射回来，屋子里才明亮起来。又在院子里杂种了兰桂竹木，过去旧的栏杆，也就增添了景致。书架上摆满了书，我有时仰首高歌，有时静静地端坐，各种声音都能听到；而庭院台阶静悄悄的，小鸟不时飞来啄食，人走近也不飞走。每月十五的夜晚，明月照在半截墙上，桂树的影子斑驳错落，风吹影动，珊珊可爱。\n\n然而我住在这里，有很多可喜的事，也有很多可悲的事。以前院子里南北相通成为一体。等到伯父叔父们分家各自做饭，里里外外设置了许多小门墙，到处都是，东家的狗对着西家叫，客人得越过厨房去赴宴，鸡在厅堂里栖息。院子里开始是篱笆，后来就成了墙，一共变了两次。家里有一位老婆婆，曾经住在这里。这位老婆婆，是我死去的祖母的婢女，给我们家两代人喂过奶，我死去的母亲待她很好。房子的西边与内室相连，我母亲曾经来过一次。老婆婆常常对我说：\"某个地方，就是你母亲曾经站立过的地方。\"老婆婆又说：\"你姐姐当时抱在我怀里，呱呱地哭；你母亲用手指敲着门扇问道：'孩子冷吗？想吃东西吗？'我从门板外边替她回答。\'话没说完，我就哭了，老婆婆也哭了。我从十五岁起在轩内读书，有一天，祖母来看望我说：\"我的孩子，好久没看到你的影子了，为什么整天默默地在这里，太像个女孩子了？\"临走时，用手关上门，自言自语地说：\"我们家读书很久没有见效了，这孩子成功，是可以期待的吧！\"一会儿，拿着一个象牙笏板来，说：\"这是我祖父太常公在宣德年间拿着去朝见皇帝时用的，日后你一定会用到它！\"现在回顾这些遗迹，就像在昨天一样，让人忍不住放声大哭。\n\n项脊轩的东边以前曾经是厨房，人们来去，从轩前经过。我关着门窗住在里面，时间长了，能根据脚步声辨别人。项脊轩共四次遭火灾，能够不被焚毁，大概是有神灵保护吧。\n\n我写了这篇志之后五年，我的妻子嫁到我家来，经常到轩中，向我询问古事，有时靠着几案学写字。妻子回娘家探亲，回来转述她的小妹妹们的话说：\"听说姐姐家里有阁子，那么什么叫阁子呢？\"那以后六年，我的妻子去世了，小阁子坏了他也不再修。又过了两年，我久病无聊，于是让人重新修缮南阁子，它的形制和以前稍有不同。然而此后我多在外地，不常居住了。\n\n院子里有一棵枇杷树，是我妻子去世那一年亲手栽种的，现在已经有高高挺立像伞盖一样了。",
      notes: [{phrase:"项脊轩",pos:"项脊轩，旧南阁子也",explain:"作者书斋名。"},{phrase:"方丈",pos:"室仅方丈",explain:"一丈见方。"},{phrase:"渗漉",pos:"尘泥渗漉",explain:"渗漏。"},{phrase:"修葺",pos:"余稍为修葺",explain:"修缮。葺（qì）。"},{phrase:"辟",pos:"前辟四窗",explain:"开。"},{phrase:"垣墙",pos:"垣墙周庭",explain:"砌墙。"},{phrase:"洞然",pos:"室始洞然",explain:"明亮的样子。"},{phrase:"栏楯",pos:"旧时栏楯",explain:"栏杆。楯（shǔn）。"},{phrase:"偃仰",pos:"偃仰啸歌",explain:"仰卧。"},{phrase:"冥然",pos:"冥然兀坐",explain:"静静地。"},{phrase:"万籁",pos:"万籁有声",explain:"各种声音。"},{phrase:"三五",pos:"三五之夜",explain:"农历每月十五。"},{phrase:"斑驳",pos:"桂影斑驳",explain:"错落。"},{phrase:"珊珊",pos:"珊珊可爱",explain:"美好的样子。"},{phrase:"迨",pos:"迨诸父异爨",explain:"等到。"},{phrase:"异爨",pos:"迨诸父异爨",explain:"分家各自做饭。爨（cuàn）。"},{phrase:"逾庖",pos:"客逾庖而宴",explain:"越过厨房。"},{phrase:"老妪",pos:"家有老妪",explain:"老婆婆。妪（yù）。"},{phrase:"乳二世",pos:"乳二世",explain:"给两代人喂奶。"},{phrase:"先妣",pos:"先妣抚之甚厚",explain:"死去的母亲。"},{phrase:"中闺",pos:"室西连于中闺",explain:"内室。"},{phrase:"束发",pos:"余自束发读书轩中",explain:"指十五岁。"},{phrase:"过",pos:"大母过余曰",explain:"看望。"},{phrase:"若",pos:"久不见若影",explain:"你。"},{phrase:"大类",pos:"大类女郎也",explain:"很像。"},{phrase:"比",pos:"比去",explain:"等到。"},{phrase:"阖",pos:"以手阖门",explain:"关闭。"},{phrase:"象笏",pos:"持一象笏至",explain:"象牙做的笏板。"},{phrase:"长号",pos:"令人长号不自禁",explain:"大哭。"},{phrase:"扃牖",pos:"余扃牖而居",explain:"关窗。"},{phrase:"归宁",pos:"吾妻归宁",explain:"已婚女子回娘家探望父母。"},{phrase:"制",pos:"其制稍异于前",explain:"形制、规格。"},{phrase:"亭亭如盖",pos:"今已亭亭如盖矣",explain:"高高挺立像伞盖一样。"}],
      appreciation: "《项脊轩志》是归有光的代表作，是\"志\"体散文的典范之作，被誉为\"明文第一\"。\n\n写作背景：归有光出身于败落的世家大族，家族分崩离析，作者借小阁子项脊轩的兴废，写家族的盛衰变迁和个人身世之感。\n\n思想内容：以项脊轩为中心，通过生活琐事的回忆，表达了对祖母、母亲、妻子的深切怀念，以及对家族衰败的感慨。\"多可喜，亦多可悲\"一句是全文感情线索。\n\n写作特色：1. 细节描写传神——\"以手阖门\"\"持一象笏至\"等细节生动传神；2. 朴素自然，不事雕琢——以家常语写家常事，却能感人至深；3. 详略得当——详写祖母、母亲、妻子的轶事，略写其他；4. 借景抒情——\"庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣\"以物抒情，言简意深。\n\n名句价值：结尾\"庭有枇杷树...今已亭亭如盖矣\"一句成为悼亡名句，仅以树之长大暗示时日之久和思念之深，被誉为\"不着一字，尽得风流\"的典范。"

      id:'shizhongshan', title:'石钟山记', author:'苏轼', authorId:'sushi', cat:'wenyanwen',
      audio:'resource/audio/shizhongshan.aac',
      text:'《水经》云："彭蠡之口有石钟山焉。"郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？\n\n元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰："汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！"\n\n事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。',
      translation: "《水经》上说：\"彭蠡湖的入口处有石钟山。\"郦道元认为山下临深潭，微风鼓动波浪，水和石头互相拍打，发出的声音像大钟一样。这种说法，人们常常怀疑它。现在把钟磬放在水中，即使是大风浪也不能使它发出声响，更何况是石头呢！到了唐代，李渤才开始寻访它的遗迹，在深潭边得到两块石头，敲击它们仔细听，南边那块声音厚重模糊，北边那块声音清脆悠扬，鼓槌停止敲击了，响声还在腾跃，余音慢慢才停歇。他自以为找到了石钟山命名的真相。然而这种说法，我更加怀疑它。石头敲击铿锵作响的，到处都是这样，而这座山唯独用钟来命名，为什么呢？\n\n元丰七年六月初九日，我从齐安乘船到临汝去，长子苏迈将要赴任饶州德兴县县尉，我送他到湖口，因此得以看看人们所说的石钟山。庙里的和尚让小童拿着斧头，在乱石中间选其中一两块敲击，发出硿硿的声音。我笑了笑并不相信。到了晚上月光明亮，我独自和苏迈乘小船，到绝壁下面。大石侧立千尺高，像凶猛的野兽奇异的鬼怪，阴森森地要扑向人；山上栖息的鹘鸟，听到人声也惊飞起来，磔磔地叫着飞上云霄；又有像老人在山谷中又咳又笑的声音，有人说这是鹳鹤。我正心中惊动想要回去，却有大的声音从水上发出，噌吰地响着像钟鼓声不断。船夫非常害怕。我慢慢地观察它，原来是山下都是石缝洞穴，不知道它们的深浅，微波进入其中，水波荡漾澎湃就形成了这种声音。船回到两山之间，将要进入港口，有一块大石头挡在水流中央，上面可坐一百来人，中间空而有许多窟窿，把风浪吞进去吐出来，发出窾坎镗鞳的声音，与刚才的噌吰声互相应和，像奏乐一样。我于是笑着对苏迈说：\"你记得这些吗？那噌吰的声音，是周景王无射钟的声音；那窾坎镗鞳的声音，是魏庄子歌钟的声音。古人没有欺骗我啊！\"\n\n事情不亲眼看到亲耳听到，就凭主观推断它的有无，可以吗？郦道元的所见所闻，大概和我一样，但是说得不够详细；士大夫们终究不肯乘小船夜里停泊在绝壁下面，所以没有谁能知道真相；而渔夫船工虽然知道却不能用文字表述出来。这就是世人不能知道真相的原因啊。而见识浅陋的人竟用斧头敲打来探求它，自以为得到了它的真相。我因此记下这件事，是叹息郦道元记叙的简略，而嘲笑李渤的浅陋啊。",
      notes: [{phrase:"鼓浪",pos:"微风鼓浪",explain:"鼓，激荡、掀动。名词作动词。"},{phrase:"搏",pos:"水石相搏",explain:"搏，拍击。"},{phrase:"函胡",pos:"南声函胡",explain:"函胡，厚重而模糊。"},{phrase:"清越",pos:"北音清越",explain:"清越，清脆悠扬。"},{phrase:"桴",pos:"桴止响腾",explain:"桴（fú），鼓槌。"},{phrase:"腾",pos:"桴止响腾",explain:"腾，传播。"},{phrase:"适",pos:"余自齐安舟行适临汝",explain:"适，往、到。"},{phrase:"硿硿焉",pos:"硿硿焉",explain:"硿（kōng）硿，敲击声。焉，形容词词尾。"},{phrase:"搏人",pos:"森然欲搏人",explain:"搏，扑击。"},{phrase:"噌吰",pos:"噌吰如钟鼓不绝",explain:"噌吰（chēng hóng），形容钟声宏大。"},{phrase:"罅",pos:"石穴罅",explain:"罅（xià），裂缝。"},{phrase:"窾坎镗鞳",pos:"有窾坎镗鞳之声",explain:"窾坎（kuǎn kǎn）镗鞳（tāng tà），钟鼓相击的声音。"},{phrase:"识",pos:"汝识之乎",explain:"识（zhì），通「志」，记住。"},{phrase:"无射",pos:"周景王之无射",explain:"无射（yì），钟名。周景王所铸。"},{phrase:"不余欺",pos:"古之人不余欺也",explain:"宾语前置，即「不欺余」，没有欺骗我。"},{phrase:"臆断",pos:"而臆断其有无",explain:"臆断，凭主观推测断定。"},{phrase:"殆",pos:"殆与余同",explain:"殆，大概。"},{phrase:"莫",pos:"故莫能知",explain:"莫，没有人。否定代词。"}],
      appreciation: "《石钟山记》是苏轼于元丰七年（1084）由黄州赴汝州途中，送长子苏迈赴任途经湖口时所作的一篇考察性游记散文。\n\n思想内容：文章通过实地考察石钟山命名由来，纠正了郦道元和李渤的说法，阐明了\"事不目见耳闻，而臆断其有无，可乎\"的朴素唯物主义认识论道理，强调凡事必须深入实际调查，不可主观臆断，体现了作者求真务实的科学精神。\n\n写作特色：1. 结构严密——先提出疑点，再实地考察，最后议论推理，叙事与议论结合；2. 行文跌宕——以\"疑—访—察—笑—叹\"为线索，一波三折；3. 描写生动——\"大石侧立千尺，如猛兽奇鬼，森然欲搏人\"等句绘声绘色，营造阴森可怖的氛围；4. 巧用通假——\"识\"通\"志\"，\"莫\"通\"暮\"等。\n\n名句价值：\"事不目见耳闻，而臆断其有无，可乎\"已成为强调实地调查、反对主观臆断的千古名言。"

      id:'dengtaishan', title:'登泰山记', author:'姚鼐', authorId:'yaonai', cat:'wenyanwen',

      text:'泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。\n\n余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅，崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南。望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。\n\n戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之。或曰，此东海也。回视日观以西峰，或得日，或否，绛皓驳色，而皆若偻。\n\n亭西有岱祠，又有碧霞元君祠。皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来，其远古刻尽漫失。僻不当道者，皆不及往。\n\n山多石，少土。石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。\n\n桐城姚鼐记。',
      translation: "泰山的南面，汶水向西流；它的北面，济水向东流。南面的山谷水都流入汶水，北面的山谷水都流入济水。在那南北分界处的，是古长城。最高的日观峰，在长城南面十五里处。\n\n我在乾隆三十九年十二月，从京城冒着风雪，经过齐河、长清，穿过泰山西北的山谷，越过长城的界限，到达泰安。这个月丁未日，我和知府朱孝纯（字子颍）一起从南麓登山。四十五里，道路都是用石块砌成的台阶，有七千多级。泰山的正南面有三个山谷。中间的山谷绕过泰安城下，这就是郦道元所说的环水。我起初顺着中间的山谷进去，走了一小半，越过中岭，再顺着西面的山谷走，就到了山顶。古时登山，顺着东面的山谷进去，路上有天门。东面的山谷，古人叫它天门溪水，是我没有到过的地方。现在经过的中岭和山顶，有山崖像门槛一样挡在路上的，世人都叫它天门。路上大雾弥漫冰面湿滑，石阶几乎无法攀登。等到登上去，青山上覆盖着白雪，雪光照亮了南面的天空。望着晚日照映着城郭，汶水、徂徕山如画一般，而半山腰停留的云雾像一条带子。\n\n戊申日是月底，五更天，我和子颍坐在日观亭里，等候日出。大风卷起积雪扑打着脸面。亭子东面从脚下起都是云雾弥漫。渐渐看到云中几十个白色的像樗蒲一样立着的，是山峰。天边的云呈现一线不同的颜色，片刻间变成五彩。太阳升起，纯红像朱砂一样，下面有红光动摇承托着它。有人说，这就是东海。回头再看日观峰以西的山峰，有的被阳光照到，有的没有，红白相杂，都像弯腰曲背的样子。\n\n亭子西面有岱祠，还有碧霞元君祠。皇帝的行宫在碧霞元君祠东面。这一天观看了路上的石刻，从唐显庆年间以来，那些远古的石刻都模糊缺失了。偏僻不在路上的，都来不及去看。\n\n山上多石头，少泥土。石头呈苍黑色，多是方形的，少圆形的。少杂树，多松树，长在石头缝里，都是平顶。冰雪覆盖，没有瀑布，没有鸟兽的声音和踪迹。到日观峰几里之内没有树，而积雪和人膝盖一样高。\n\n桐城姚鼐记。",
      notes: [{phrase:"阳",pos:"泰山之阳",explain:"山的南面为阳。"},{phrase:"阴",pos:"其阴",explain:"山的北面为阴。"},{phrase:"限",pos:"越长城之限",explain:"限，界限，这里指城墙。"},{phrase:"磴",pos:"道皆砌石为磴",explain:"磴（dèng），石阶。"},{phrase:"循",pos:"余始循以入",explain:"循，顺着、沿着。"},{phrase:"烛",pos:"明烛天南",explain:"烛，照。名词作动词。"},{phrase:"居",pos:"半山居雾若带然",explain:"居，停留。"},{phrase:"晦",pos:"戊申晦",explain:"晦，农历每月最后一日。"},{phrase:"五鼓",pos:"五鼓",explain:"五更天，黎明前。"},{phrase:"樗蒱",pos:"白若樗蒱",explain:"樗蒱（chū pú），古代一种博戏，此处指樗蒲所用的骰子。"},{phrase:"采",pos:"须臾成五采",explain:"采，通「彩」，彩色。"},{phrase:"丹",pos:"正赤如丹",explain:"丹，朱砂。"},{phrase:"绛皓",pos:"绛皓驳色",explain:"绛（jiàng），大红；皓（hào），白。"},{phrase:"偻",pos:"而皆若偻",explain:"偻（lǚ），脊背弯曲。"},{phrase:"圜",pos:"少圜",explain:"圜，通「圆」，圆形。"},{phrase:"罅",pos:"生石罅",explain:"罅（xià），裂缝。"}],
      appreciation: "《登泰山记》是清代桐城派代表作家姚鼐于乾隆三十九年（1774）冬游泰山后所作的一篇著名游记，是桐城派古文的典范之作。\n\n思想内容：文章记叙了作者与友人冬日同游泰山的经过，描写了泰山雪后的壮丽景色和日观峰日出的奇观，表达了作者对祖国壮丽山河的热爱之情。\n\n写作特色：1. 用笔简练——全文不足五百字，却写尽了泰山的地理形势、登山历程、日出奇观和山貌特征，体现了桐城派\"雅洁\"的文风；2. 详略得当——以日观峰日出为详写，其余略写，主次分明；3. 描写生动——\"苍山负雪，明烛天南\"\"半山居雾若带然\"等句极为传神；\"日上，正赤如丹，下有红光动摇承之\"写日出如在目前；4. 时地分明——按时间先后和游踪顺序组织材料，脉络清晰。\n\n名句价值：\"苍山负雪，明烛天南\"已成为描写雪山的经典名句；\"半山居雾若带然\"以一\"带\"字状云雾盘桓山腰之态，为历来传诵的写景佳句。"

    {
      id:'efanggongfu', title:'阿房宫赋', author:'杜牧', authorId:'dumu', cat:'wenyanwen',
      audio:'resource/audio/efanggongfu.aac',
      text:'六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知东西。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。\n\n妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦，朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不得见者，三十六年。燕、赵之收藏，韩、魏之经营，齐、楚之精英，几世几年，摽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。\n\n嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！\n\n呜呼，灭六国者六国也，非秦也。族秦者秦也，非天下也。嗟乎！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。',
      translation: "六国灭亡，四海统一，蜀地的山林光秃了，阿房宫建成了。它覆盖三百多里地，遮蔽了天日。从骊山向北构建再向西折，一直通到咸阳。渭水、樊川两条河水缓缓流淌，流入宫墙。五步一座楼，十步一座阁；走廊像丝带一样萦回，屋檐像鸟嘴一样高啄；各随地势，屋角凑聚如钩，屋角相向如斗。盘结的样子，曲折的样子，像蜂房像水涡，矗立着不知有几千万座。长桥卧在水波上，没有云怎么会有龙？复道飞架在空中，不是雨过天晴怎么会有彩虹？高低冥迷，分辨不清东西。歌台上传出柔和的乐声，使人感到春光融融；舞殿里舞袖带起冷风，使人感到风雨凄凄。同一天之内，同一宫之中，气候却不相同。\n\n六国的妃嫔宫女、王室的子孙，离开了故国的楼阁殿宇，被辇车送到秦国，朝朝暮暮唱歌奏乐，成为秦国的宫人。明亮的星星晶莹闪烁，那是她们打开了梳妆镜；绿云缭绕，那是她们早晨梳理发髻；渭水涨起一层油腻，那是她们倒掉的胭脂水；烟雾弥漫，那是她们焚烧椒兰香料。雷霆忽然惊动人，那是宫车经过；辘辘的车声越听越远，不知它驶向何处。每一寸肌肤每一种容颜，都极尽娇美妍丽，久久地站立远望，盼望皇帝的宠幸。有的三十六年都没有见过皇帝一面。燕国、赵国收藏的珍宝，韩国、魏国经营的奇物，齐国、楚国汇聚的精华，多少代多少年，从它们本国人民那里掠夺来，堆积如山。一旦国破家亡不能再占有，都被运到阿房宫里。把鼎当作铁锅，把玉当作石头，把金子当作土块，把珍珠当作沙砾，抛弃得到处都是，秦国人看着，也不怎么爱惜。\n\n唉！一个人的心思，就是千万人的心思啊。秦国喜爱纷华奢靡，别人也眷念自己的家。为什么搜刮别人的财物连锱铢都要拿走，使用起来却像泥沙一样挥霍？使得支撑栋梁的柱子，比南面田地里的农夫还多；架在梁上的椽子，比织布机上的织女还多；钉头闪闪发光，比粮仓里的谷粒还多；瓦缝参差不齐，比周身衣服的纱线还多；直的栏横的槛，比九州的城郭还多；管弦嘈杂，比市上人们的言语还多。使天下的人民，不敢说话只敢怒目而视。暴君的心，一天比一天骄横顽固。戍边的士兵一声呐喊，函谷关被攻破，楚国人一把火，可惜化作了一片焦土！\n\n唉！灭亡六国的是六国自己，不是秦国。灭族秦的是秦国自己，不是天下人。唉！假使六国各自爱护自己的百姓，就足以抵抗秦国；假使秦国又能爱护六国的人民，那么传三世乃至万世做皇帝，谁能够灭族它呢？秦人来不及为自己哀叹，而后人替他们哀叹；后人哀叹它却不引以为鉴，也使后人又要为后人哀叹了。",
      notes: [{phrase:"兀",pos:"蜀山兀",explain:"兀，光秃。指树木被砍光。"},{phrase:"构",pos:"骊山北构而西折",explain:"构，建造。"},{phrase:"走",pos:"直走咸阳",explain:"走，趋向、通向。"},{phrase:"廊腰缦回",pos:"廊腰缦回",explain:"廊腰，走廊的转折处；缦，萦回的样子。"},{phrase:"檐牙高啄",pos:"檐牙高啄",explain:"檐牙，屋檐的尖角；啄，鸟嘴。"},{phrase:"钩心斗角",pos:"各抱地势，钩心斗角",explain:"钩心，屋角向心，如钩之牵引；斗角，屋角相向，如角之相斗。"},{phrase:"囷囷",pos:"囷囷焉",explain:"囷囷（qūn qūn），曲折回旋的样子。"},{phrase:"霁",pos:"不霁何虹",explain:"霁（jì），雨过天晴。"},{phrase:"媵嫱",pos:"妃嫔媵嫱",explain:"嫔（pín）、媵（yìng）、嫱（qiáng），都是宫廷女子的等级称号。"},{phrase:"辇",pos:"辇来于秦",explain:"辇（niǎn），帝王或后妃乘坐的车子。这里作动词，乘辇车。"},{phrase:"杳",pos:"杳不知其所之也",explain:"杳（yǎo），深远、不见踪影。"},{phrase:"摽掠",pos:"摽掠其人",explain:"摽（piāo）掠，抢劫、掠夺。"},{phrase:"鼎铛玉石",pos:"鼎铛玉石",explain:"把鼎当作铛，把玉当作石。铛（chēng），平底锅。"},{phrase:"锱铢",pos:"取之尽锱铢",explain:"锱（zī）铢（zhū），古代重量单位，比喻极微小的数量。"},{phrase:"庾",pos:"多于在庾之粟粒",explain:"庾（yǔ），露天的谷仓。"},{phrase:"独夫",pos:"独夫之心",explain:"独夫，众叛亲离的暴君，指秦始皇。"},{phrase:"举",pos:"函谷举",explain:"举，被攻下。"},{phrase:"族",pos:"族秦者秦也",explain:"族，灭族。名词作动词。"}],
      appreciation: "《阿房宫赋》是唐代文学家杜牧于宝历元年（825）所作的一篇著名赋文，时唐敬宗大起宫室，杜牧借古讽今，希望唐统治者以秦为鉴。\n\n思想内容：文章通过描写阿房宫的宏伟壮丽和宫中生活的奢靡荒淫，揭露秦始皇的暴政，指出秦朝灭亡的根本原因是\"不爱其人\"，借古讽今，向唐朝统治者提出警告。\n\n写作特色：1. 结构严谨——前半部分铺叙阿房宫的壮丽奢靡，后半部分议论抒慨，由现象到本质，由叙入议；2. 想象丰富——阿房宫在历史上被项羽焚毁，作者根据史料和想象虚构了阿房宫的壮丽景象，但具有艺术真实感；3. 铺排夸张——大量运用排比、夸张、比喻等修辞手法，如\"使负栋之柱，多于南亩之农夫\"等六个排比句气势磅礴；4. 骈散结合——既有赋体的对仗整饬，又有散文的流畅自然。\n\n名句价值：\"后人哀之而不鉴之，亦使后人而复哀后人也\"已成为历史反思的名句；\"灭六国者六国也，非秦也\"的论断至今发人深省。"

      id:'chibi', title:'赤壁赋', author:'苏轼', authorId:'sushi', cat:'wenyanwen',
      audio:'resource/audio/chibi.aac',
      translation: "壬戌年的秋天，七月十六日，苏子和客人泛舟游于赤壁之下。清风缓缓吹来，水面波澜不起。举起酒杯向客人敬酒，朗诵明月之诗，唱《窈窕》之章。一会儿，月亮从东山上升起，在斗宿和牛宿之间徘徊。白露横在江面，水光与天相连。任凭一叶扁舟随意漂荡，越过那茫茫万顷江面。浩浩荡荡像乘风凌空而行，并不知道到哪里才会停歇；飘飘然像脱离尘世、独立人世，飞升成仙。\n\n于是喝得很欢畅，敲着船舷唱起歌来。歌词说：\"桂木做的棹啊兰木做的桨，拍击着清澈的江水啊在月光浮动的水面上逆流而上。我的情思啊多么悠远，眺望美人啊却在天的另一方。\"客人中有位吹洞箫的，随着歌声应和。箫声呜呜咽咽，像怨恨像思慕，像哭泣像倾诉，余音袅袅，像细丝一样连绵不断。能使深渊中的蛟龙起舞，能使孤舟上的寡妇哭泣。\n\n苏子神色忧愁，整好衣袖端正地坐着问客人说：\"为什么箫声这样悲凉呢？\"客人说：\"『月明星稀，乌鹊南飞』，这不是曹孟德的诗吗？向西望是夏口，向东望是武昌，山川缭绕，郁郁苍苍，这不是曹孟德被周瑜围困的地方吗？当初他攻破荆州，攻占江陵，沿江顺流东下，战船连接千里，旌旗遮蔽天空，面对长江横握长矛赋诗，本来是一代的英雄啊，可如今在哪里呢？何况我和你在江边捕鱼砍柴，与鱼虾作伴，与麋鹿为友，驾一叶小舟，举起杯盏相互劝酒。像蜉蝣一样寄身于天地之间，渺小得像大海中的一粒米。哀叹我们生命的短暂，羡慕长江的无穷无尽。\"\n\n苏子说：\"您也知道那水和月亮吗？流逝的就像这水，实际上并没有流走；时圆时缺的就像这月，最终没有增减。如果从变化的角度看，那么天地之间连一瞬间都不能保持不变；如果从不变的角度看，那么万物和我们都是无穷无尽的，又有什么可羡慕的呢？再说天地之间，万物各有其主，如果不是我所有的，即使一丝一毫也不去取。只有江上的清风和山间的明月，耳朵听到就成为声音，眼睛看到就成为颜色，取用它们没有人禁止，享用它们不会枯竭。这是大自然的无穷宝藏，是我和你共同享用的。\"\n\n客人高兴地笑了，洗杯重新斟酒。菜肴果品已尽，杯盘凌乱杂乱。相互枕着在船中睡着了，不知不觉东方已经露出白色的曙光。",
      notes: [{phrase:"壬戌",pos:"壬戌之秋",explain:"干支纪年，壬戌为宋神宗元丰五年（1082）。"},{phrase:"既望",pos:"七月既望",explain:"望，农历每月十五。既望，已过望日，即十六。"},{phrase:"属",pos:"举酒属客",explain:"属（zhǔ），通「嘱」，劝、请。"},{phrase:"窈窕之章",pos:"歌窈窕之章",explain:"《诗经·周南·关雎》有「窈窕淑女」句，此处指与此相关的篇章。"},{phrase:"冯虚御风",pos:"冯虚御风",explain:"冯（píng），通「凭」，乘。虚，天空。"},{phrase:"羽化",pos:"羽化而登仙",explain:"道教称成仙为羽化。"},{phrase:"舳舻",pos:"舳舻千里",explain:"舳（zhú），船尾；舻（lú），船头。"},{phrase:"酾酒",pos:"酾酒临江",explain:"酾（shī），斟酒。"},{phrase:"横槊",pos:"横槊赋诗",explain:"槊（shuò），长矛。"},{phrase:"匏樽",pos:"举匏樽以相属",explain:"匏（páo）樽，葫芦做的酒器。"},{phrase:"蜉蝣",pos:"寄蜉蝣于天地",explain:"蜉蝣（fú yóu），寿命极短的昆虫。"},{phrase:"粟",pos:"渺沧海之一粟",explain:"粟（sù），谷粒。"},{phrase:"造物者",pos:"造物者之无尽藏也",explain:"造物者，原指创造万物的神，此指大自然。"}],
      appreciation: "《赤壁赋》是苏轼被贬黄州时所作，是中国文学史上著名的\"前赤壁赋\"，是一篇融抒情、说理、状景、写景于一体的大赋。\n\n内容结构：文章以主客问答的形式展开，先写月夜泛舟的快乐，再写箫声引发的悲思，最后以\"变与不变\"的哲理化解悲情。\n\n思想内涵：在屡遭打击的人生逆境中，作者通过宇宙观（水与月）的阐发，表达了一种随遇而安、乐观旷达的人生态度——\"物与我皆无尽也\"，体现苏轼融合儒道思想的独特哲学。\n\n艺术特色：1. 写景、抒情、说理三者水乳交融；2. 主客问答的传统形式在赋中创新运用；3. 骈散结合，文辞华美而不失自然；4. 比喻形象，哲理深刻。\n\n文赋新篇：突破汉赋堆砌辞藻的旧体，开创了\"以文为赋\"的清新文风，被誉为\"古今第一赋\"。",







      text:'壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。\n\n于是饮酒乐甚，扣舷而歌之。歌曰："桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。"客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。\n\n苏子愀然，正襟危坐而问客曰："何为其然也？"客曰："\u2018月明星稀，乌鹊南飞。\u2019此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。"\n\n苏子曰："客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。"\n\n客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。'

    {
      id:'xiaoyaoyou', title:'逍遥游（节选）', author:'庄子', authorId:'zhuangzi', cat:'wenyanwen',
      audio:'resource/audio/xiaoyaoyou.aac',
      text:'北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。\n\n《齐谐》者，志怪者也。《齐谐》曰："鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。"野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。\n\n且夫水之积也不厚，则其负大舟也无力。覆杯水于坳堂之上，则芥为之舟，置杯焉则胶，水浅而舟大也。风之积也不厚，则其负大翼也无力。故九万里，则风斯在下矣，而后乃今培风；背负青天，而莫之夭阏者，而后乃今将图南。\n\n蜩与学鸠笑之曰："我决起而飞，枪榆枋而止，时则不至，而控于地而已矣，奚以之九万里而南为？"适莽苍者，三餐而反，腹犹果然；适百里者，宿舂粮；适千里者，三月聚粮。之二虫又何知！\n\n小知不及大知，小年不及大年。奚以知其然也？朝菌不知晦朔，蟪蛄不知春秋，此小年也。楚之南有冥灵者，以五百岁为春，五百岁为秋；上古有大椿者，以八千岁为春，八千岁为秋，此大年也。而彭祖乃今以久特闻，众人匹之，不亦悲乎！',
      translation: "北方的大海里有一种鱼，它的名字叫鲲。鲲的体积巨大，不知道它有几千里；变化成为鸟，它的名字叫鹏。鹏鸟的背，不知道它有几千里；奋起而飞，它的翅膀就像垂挂的云。这种鸟，海动时就要迁徙到南方的大海——那天然的大池。\n\n《齐谐》这本书，是记载怪异事物的。《齐谐》上说：\"大鹏迁徙到南方的大海，翅膀拍击水面激起三千里浪花，乘着旋风盘旋飞上九万里的高空，凭借六月的大风离开。\"春天原野上蒸腾的水汽，空中飘动的尘埃，都是生物用气息相吹拂的结果。天的深蓝色，是它真正的颜色呢？还是因为它太远没有尽头呢？大鹏从高空往下看，也就像这样罢了。\n\n如果水的积聚不深，那么它负载大船就没有力量。在堂前低洼处倒一杯水，那么只能用小草当船；放一个杯子在上面就粘住不动，是因为水浅而船大的缘故。如果风的积聚不厚，那么它负载巨大的翅膀就没有力量。所以大鹏飞上九万里高空，风就在它下面，然后才乘着风；背靠着青天，然后才能飞向南方。\n\n蝉和小斑鸠讥笑大鹏说：\"我一下子起飞，碰到榆树和檀树的树枝就停下来，有时飞不上去，就落在地上罢了，哪里用得着飞到九万里的高空再向南飞呢？\"到郊外去的人，只准备三顿饭就回来，肚子还是饱的；到百里远的地方去的人，需要一整夜舂米准备干粮；到千里远的地方去的人，需要三个月聚积粮食。这两个小虫又懂得什么呢！\n\n小聪明比不上大智慧，寿命短的比不上寿命长的。怎么知道是这样呢？朝菌不知道一个月的开头和结尾，蟪蛄不知道一年中的春天和秋天，这就是寿命短的。楚国的南边有一种叫冥灵的树，把一千年当作一年；上古时候有一种叫大椿的树，把八千年当作一年。彭祖如今以长寿闻名，一般人与他相比，岂不可悲吗！",
      notes: [{phrase:"冥",pos:"北冥有鱼",explain:"冥，通「溟」，大海。"},{phrase:"鲲",pos:"其名为鲲",explain:"传说中的大鱼。"},{phrase:"齐谐",pos:"《齐谐》者",explain:"书名，记载怪异之事。"},{phrase:"抟扶摇",pos:"抟扶摇而上者九万里",explain:"抟（tuán），盘旋；扶摇，旋风。"},{phrase:"六月息",pos:"去以六月息者也",explain:"息，气息，指风。"},{phrase:"野马",pos:"野马也，尘埃也",explain:"野马，春天游气浮动如奔马的样子。"},{phrase:"坳堂",pos:"覆杯水于坳堂之上",explain:"坳（ào），低洼处。"},{phrase:"芥",pos:"则芥为之舟",explain:"芥，小草。"},{phrase:"夭阏",pos:"莫之夭阏者",explain:"夭（yāo），挫折；阏（è），阻塞。"},{phrase:"蜩与学鸠",pos:"蜩与学鸠笑之",explain:"蜩（tiáo），蝉；学鸠，小斑鸠。"},{phrase:"决起",pos:"我决起而飞",explain:"决，迅疾的样子。"},{phrase:"朝菌",pos:"朝菌不知晦朔",explain:"朝菌，一种朝生暮死的菌类；晦，每月末；朔，每月初。"},{phrase:"蟪蛄",pos:"蟪蛄不知春秋",explain:"蟪蛄（huì gū），寒蝉，春生夏死。"},{phrase:"冥灵",pos:"楚之南有冥灵者",explain:"传说中的长寿树。"},{phrase:"大椿",pos:"上古有大椿者",explain:"传说中的长寿树。"}],
      appreciation: "《逍遥游》是《庄子》内篇之首，集中体现了庄子追求精神自由、超越世俗束缚的哲学思想。\n\n主旨：所谓\"逍遥\"，指无待于外物、不受任何束缚的精神自由境界。庄子通过大鹏与小鸠、鲲与蜩虫的对比，讽刺了那些\"小知不及大知、小年不及大年\"却自鸣得意的人。\n\n艺术特色：1. 寓言与哲理融合——大鹏、蜩鸠、冥灵、大椿等寓言形象生动地承载了抽象哲理；2. 想象奇特，气势恢宏——鲲鹏变化、九万里高空、六月息等意象雄奇瑰丽；3. 浪漫主义风格——充满神话色彩和诗意表达。\n\n哲学意义：反映了庄子对个体精神自由的极致追求，超越物质条件的局限，是道家哲学\"无为\"\"逍遥\"思想的集中体现，对后世文学和思想影响深远。",

    {

      audio:'',
      text:'先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。\n\n宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。\n\n侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。\n\n将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。\n\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。\n\n臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。\n\n先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。\n\n愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏，臣不胜受恩感激。\n\n今当远离，临表涕零，不知所言。',
      translation: "先帝开创统一天下的大业还未完成一半，就中途去世了。如今天下分为三国，益州民力匮乏，这实在是危急存亡的关键时刻啊。然而朝中侍卫之臣在内毫不懈怠，忠诚的将士在外奋不顾身，这是因为追念先帝对他们的特殊恩遇，想要报答给陛下您啊。陛下确实应该广开言路，来发扬光大先帝遗留下来的美德，振奋有志之士的士气，不应该随便看轻自己，引用不恰当的譬喻，以致堵塞了忠臣进谏的道路。\n\n皇宫中和朝廷中，本是一个整体，提升、惩罚、表扬、批评，标准不应该不同。如果有做坏事违犯法纪的，以及尽忠行善的，都应该交给主管的官员判定赏罚，来显示陛下公正严明的治理，不应该偏袒私情，使宫内和朝廷法度不一。\n\n侍中、侍郎郭攸之、费祎、董允等人，这都是善良诚实的人，他们的志向和心思忠诚无二，因此先帝选拔他们留给陛下。我认为宫里的事情，无论大小，都拿来跟他们商量，然后再实行，一定能够弥补缺失和漏洞，得到更多的成效。\n\n将军向宠，性格品德善良平正，精通军事，从前试用的时候，先帝称赞他有才能，因此大家商议推举他做中部督。我认为军营里的事情，都拿来跟他商量，一定能使军队内部团结和睦，才能高低的人各有合适的安排。\n\n亲近贤臣，疏远小人，这是西汉之所以兴盛的原因；亲近小人，疏远贤臣，这是东汉之所以衰败的原因。先帝在世时，每次跟我谈论起这些事，没有不对桓帝、灵帝时期的腐败感到叹息痛心遗憾的。侍中、尚书、长史、参军，这些都是坚贞可靠、愿意为国捐躯的忠臣，希望陛下亲近他们、信任他们，那么汉室的兴盛，就可以指日可待了。\n\n我本来是平民，亲自在南阳耕田，只求在乱世中苟且保全性命，不奢求在诸侯之中出名。先帝不嫌我地位卑微、见识鄙陋，降低身份委屈自己，三次到草庐中来看望我，向我询问当代的大事，我因此非常感动，于是答应为先帝奔走效劳。后来遇到兵败，在战败的时候接受了重任，在危难的关头奉命出使，从那时到现在已经二十一年了。\n\n先帝知道我做事谨慎，所以临终前把国家大事托付给我。接受遗命以来，我日夜担忧叹息，唯恐托付给我的大业不能完成，从而损害先帝的英明。所以我五月渡过泸水，深入荒凉之地。如今南方已经平定，兵器铠甲已经充足，应当鼓励和率领三军，北上平定中原。希望能够竭尽自己平庸的才能，铲除奸邪凶恶的敌人，复兴汉室，回到原来的都城。这是我用来报答先帝并尽忠陛下的职责本分。至于权衡事情的得失，毫无保留地进献忠言，那就是郭攸之、费祎、董允等人的责任了。\n\n希望陛下把讨伐逆贼、复兴汉室的任务交给我，如果没有成效，就治我的罪，来告慰先帝的英灵。如果没有发扬圣德的忠言，就责备郭攸之、费祎、董允等人的怠慢，来表明他们的过失；陛下您也应该自己思虑，来询问治国的良好道理，明察和接受正直的进言，深切追念先帝的遗诏，我受恩感激不尽。\n\n如今即将远行，面对奏表眼泪落下，不知道该说什么了。",
      notes: [{phrase:"崩殂",pos:"中道崩殂",explain:"殂（cú），死亡。指刘备中途去世。"},{phrase:"疲弊",pos:"益州疲弊",explain:"人力缺乏，物力缺乏。"},{phrase:"秋",pos:"危急存亡之秋也",explain:"秋，时候、时期。这里指关键时刻。"},{phrase:"盖",pos:"盖追先帝之殊遇",explain:"盖，连接上一句的原因，有\'大概是因为\'之意。"},{phrase:"光",pos:"以光先帝遗德",explain:"光，发扬光大。名词作动词。"},{phrase:"恢弘",pos:"恢弘志士之气",explain:"恢弘，扩大、振奋。形容词作动词。"},{phrase:"妄自菲薄",pos:"不宜妄自菲薄",explain:"过分看轻自己。"},{phrase:"引喻失义",pos:"引喻失义",explain:"引喻，引用譬喻；失义，不合道理。指说话不恰当。"},{phrase:"陟罚臧否",pos:"陟罚臧否",explain:"陟（zhì），提升；罚，惩罚；臧（zāng），善；否（pǐ），恶。指赏罚褒贬。"},{phrase:"作奸犯科",pos:"作奸犯科",explain:"做奸邪事情，犯科条法令。"},{phrase:"有司",pos:"宜付有司",explain:"主管的官员。"},{phrase:"简拔",pos:"先帝简拔以遗陛下",explain:"选拔。"},{phrase:"亲贤臣，远小人",pos:"亲贤臣，远小人",explain:"亲近贤臣，疏远小人。\'亲\'\'远\'为形容词作动词。"},{phrase:"布衣",pos:"臣本布衣",explain:"平民百姓。"},{phrase:"卑鄙",pos:"不以臣卑鄙",explain:"地位低下，见识鄙俗。今义为品质恶劣。"},{phrase:"猥自枉屈",pos:"猥自枉屈",explain:"猥，降低身份；枉屈，委屈自己。"},{phrase:"驱驰",pos:"遂许先帝以驱驰",explain:"奔走效劳。"},{phrase:"夙夜忧叹",pos:"夙夜忧叹",explain:"夙（sù）夜，早晚。日夜担忧叹息。"},{phrase:"不毛",pos:"深入不毛",explain:"不毛，不长庄稼，指荒凉之地。"},{phrase:"驽钝",pos:"庶竭驽钝",explain:"驽（nú），劣马；钝，不锋利的刀。比喻才能平庸。"},{phrase:"咨诹善道",pos:"以咨诹善道",explain:"咨诹（zōu），询问。善道，好的道理。"},{phrase:"察纳雅言",pos:"察纳雅言",explain:"察纳，明察采纳；雅言，正言。"}],
      appreciation: "《出师表》是诸葛亮在决定北伐中原之前，向后主刘禅上书的一篇奏章，是中国古代散文中\"表\"体的典范之作，与《陈情表》《祭十二郎文》并称为中国古代三大抒情散文。\n\n思想内容：全文以\"恳切\"为主调，反复劝勉刘禅要继承先帝遗志，亲贤臣远小人，广开言路，赏罚分明。同时陈述了自己对蜀汉的忠诚和北伐中原的决心，表达了\"报先帝而忠陛下\"的赤诚之心。\n\n写作特色：1. 以情动人——\"臣本布衣\"一段追述先帝知遇之恩，感情真挚；2. 以理服人——前半部分以\"诚宜\"\"不宜\"反复陈说，层次清晰；3. 骈散结合——语言既有骈文的整饬之美，又有散文的流畅自然；4. 排比对偶——多处运用排比对偶句，增强文章气势。\n\n名句价值：\"鞠躬尽瘁，死而后已\"虽不在此文中（出自《后出师表》），但\"受任于败军之际，奉命于危难之间\"已成为形容临危受命的名句；\"亲贤臣，远小人\"则为历代治国理政的基本准则。"

    {
      id:'yueyanglou', title:'岳阳楼记', author:'范仲淹', authorId:'fanzhongyan', cat:'wenyanwen',
      audio:'',
      text:'庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。\n\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？\n\n若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n\n至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰"先天下之忧而忧，后天下之乐而乐"乎。噫！微斯人，吾谁与归？\n\n时六年九月十五日。',
      translation: "庆历四年的春天，滕子京被贬为巴陵郡守。到了第二年，政事顺利，百姓和乐，各种荒废的事业都兴办起来。于是重新修建岳阳楼，扩大它原来的规模，在上面刻唐代贤人和当代人的诗赋。嘱咐我写一篇文章来记述这件事。\n\n我看那巴陵郡的美好景色，全在洞庭一湖。它连接着远方的山脉，吞吐着长江的水流，浩浩荡荡，宽阔无边；早晨阳光明丽，傍晚阴气氤氲，景象千变万化。这就是岳阳楼的雄伟景象。前人的描述已经很详尽了。然而它北面通向巫峡，南面直达潇水、湘水，被贬的政客和诗人，大多在这里聚会，他们观赏景物时的心情，能没有不同吗？\n\n像那连绵不断的阴雨，整月不放晴，阴冷的风怒吼着，浑浊的波浪冲向天空；太阳和星星隐藏了光辉，山岳隐没了形体；商人和旅客无法通行，桅杆倾倒船桨折断；傍晚天色昏暗，老虎长啸猿猴悲啼。登上这座楼啊，就会产生离开国都怀念家乡、担心谗言惧怕讥讽的心情，满眼萧条景象，感伤到极点而悲痛不已。\n\n至于春风和煦阳光明媚，波澜不起，水天一色，碧波万顷；沙鸥时而飞翔时而停歇，美丽的鱼儿游来游去；岸上的芷草和小洲上的兰花，香气浓郁颜色青翠。有时大片烟雾完全消散，皎洁的月光一泻千里，浮动的波光像跳跃的碎金，静静的月影像沉入水中的玉璧，渔夫的歌声互相唱和，这种快乐真是无穷无尽！登上这座楼啊，就会感到胸怀开阔精神愉快，荣耀和屈辱一并忘了，端着酒杯迎着风，那心情真是快乐极了。\n\n唉！我曾经探求过古代品德高尚的人的思想感情，或许不同于以上两种心情，这是什么缘故呢？不因外物的好坏和自己的得失而或喜或悲；在朝廷做官就为百姓担忧；不在朝廷做官就为君主忧虑。这样进朝做官也担忧，退处江湖也担忧。那么什么时候才快乐呢？他们一定会说\"在天下人忧愁之前先忧愁，在天下人享乐之后才享乐\"吧。唉！如果没有这种人，我同谁一道呢？\n\n写于庆历六年九月十五日。",
      notes: [{phrase:"庆历",pos:"庆历四年春",explain:"宋仁宗年号，庆历四年即1044年。"},{phrase:"谪",pos:"滕子京谪守巴陵郡",explain:"谪（zhé），贬官。"},{phrase:"越",pos:"越明年",explain:"越，到。"},{phrase:"属",pos:"属予作文以记之",explain:"属（zhǔ），通「嘱」，嘱咐。"},{phrase:"胜状",pos:"巴陵胜状",explain:"胜状，美好景色。"},{phrase:"衔远山",pos:"衔远山，吞长江",explain:"衔，含。赋予洞庭湖以生命。"},{phrase:"朝晖夕阴",pos:"朝晖夕阴",explain:"晖，阳光。"},{phrase:"淫雨",pos:"若夫淫雨霏霏",explain:"淫雨，连绵过量的雨。"},{phrase:"樯倾楫摧",pos:"樯倾楫摧",explain:"樯（qiáng），桅杆；楫（jí），船桨。"},{phrase:"薄暮",pos:"薄暮冥冥",explain:"薄，迫近。"},{phrase:"春和景明",pos:"至若春和景明",explain:"景，日光。"},{phrase:"皓月",pos:"皓月千里",explain:"皓（hào），洁白、明亮。"},{phrase:"静影沉璧",pos:"静影沉璧",explain:"璧，圆形的玉。"},{phrase:"庙堂",pos:"居庙堂之高",explain:"庙堂，宗庙明堂，喻指朝廷。"},{phrase:"先天下之忧而忧，后天下之乐而乐",pos:"结尾名句",explain:"中国历代仁人志士的政治抱负和崇高胸怀的经典写照。"}],
      appreciation: "《岳阳楼记》是范仲淹应滕子京之请，为重修岳阳楼而作的散文名篇，是\"记\"体的千古绝唱。\n\n立意高远：文章超越了一般\"记\"体描写楼阁景物的局限，由景生情，由情入理，将个人际遇升华为\"先天下之忧而忧，后天下之乐而乐\"的宏大政治理想，使一篇\"记\"成为政治家的人生宣言。\n\n写作特点：1. 叙事、写景、抒情、议论熔于一炉；2. 三组对比（淫雨霏霏 vs 春和景明、迁客骚人 vs 古仁人）层层推进；3. 骈散结合，语言凝练华美。\n\n语言价值：文中\"先天下之忧而忧，后天下之乐而乐\"已成为中华民族宝贵的精神财富，激励一代代仁人志士。",

    {
      id:'zuiwengting', title:'醉翁亭记', author:'欧阳修', authorId:'ouyangxiu', cat:'wenyanwen',
      audio:'',
      text:'环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n\n若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。\n\n至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥。酿泉为酒，泉香而酒洌；山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。\n\n已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。',
      translation: "环绕滁州的都是山。它西南方的各个山峰，树林和山谷尤其秀美，远远望去树木茂盛、幽深秀丽的，是琅琊山。沿着山路走六七里，渐渐听到水声潺潺，从两座山峰之间飞泻而出的，是酿泉。山势回环，路也跟着转弯，有一座亭子像鸟张开翅膀一样高踞于泉水之上的，是醉翁亭。建亭的是谁？是山中的和尚智仙。给它命名的是谁？是太守用自己的别号来命名的。太守和客人来这儿饮酒，喝一点就醉了，而且年纪又最大，所以给自己取号叫醉翁。醉翁的情趣不在于酒，而在于山水之间。欣赏山水的乐趣，领会于心而寄托于饮酒之中。\n\n至于那太阳出来，树林中的雾气消散；暮云聚拢，山谷洞穴昏暗，或暗或明的变化，就是山间早晨和傍晚的景色。野花开放，散发幽香；佳木繁茂，形成浓密的绿荫；天高气爽，霜色洁白；水位低落，石头显露出来，这就是山间四季的景色。早晨进山，傍晚返回，四季的景色不同，乐趣也是无穷无尽的。\n\n至于背着东西的人在路上唱歌，行人在树下休息，前面的人呼唤，后面的人应答，老老少少，来来往往络绎不绝的，是滁州人在游山。到溪边钓鱼，溪水深鱼儿肥；用酿泉的水酿酒，泉水香甜酒水清澈；山中的野味野菜，杂乱地摆在前面的，是太守举行的宴席。宴饮酣畅的乐趣，不在于弹琴奏乐；投壶的投中了，下棋的赢了，酒杯和酒筹交互错杂，时起时坐大声喧哗的，是众位宾客在欢庆。面容苍老、满头白发，颓然倒在众人中间的，是太守喝醉了。\n\n不久夕阳落在山上，人的影子散乱，太守回去而宾客跟从着。树林茂密成荫，鸟鸣声到处响起，是游人离开后鸟儿在欢乐。然而鸟儿只知道山林的乐趣，却不知道人的乐趣；人们只知道跟随太守游玩的乐趣，却不知道太守把人们的快乐当作自己的快乐。醉了能和大家一同欢乐，醒来能用文章记述这件事的，是太守。太守是谁？就是庐陵欧阳修。",
      notes: [{phrase:"环滁",pos:"环滁皆山也",explain:"环，环绕。滁（chú），滁州。"},{phrase:"蔚然而深秀",pos:"望之蔚然而深秀者",explain:"蔚然，草木茂盛的样子。深秀，幽深秀丽。"},{phrase:"翼然",pos:"有亭翼然临于泉上者",explain:"像鸟张开翅膀的样子。"},{phrase:"名",pos:"名之者谁",explain:"名，命名。名词作动词。"},{phrase:"辄",pos:"饮少辄醉",explain:"辄（zhé），就。"},{phrase:"意",pos:"醉翁之意不在酒",explain:"意，情趣。"},{phrase:"寓",pos:"得之心而寓之酒也",explain:"寓，寄托。"},{phrase:"林霏",pos:"日出而林霏开",explain:"霏，雾气。"},{phrase:"暝",pos:"云归而岩穴暝",explain:"归，聚拢。暝，昏暗。"},{phrase:"伛偻提携",pos:"伛偻提携",explain:"伛偻（yǔ lǚ），驼背，指老人。提携，搀扶，指小孩。"},{phrase:"洌",pos:"泉香而酒洌",explain:"洌（liè），清。"},{phrase:"山肴野蔌",pos:"山肴野蔌",explain:"蔌（sù），菜蔬。"},{phrase:"觥筹交错",pos:"觥筹交错",explain:"觥（gōng），酒器。筹，酒筹。"},{phrase:"颓然",pos:"颓然乎其间者",explain:"颓然，醉倒的样子。"},{phrase:"乐其乐",pos:"太守之乐其乐也",explain:"把他们的快乐当作快乐。前一个「乐」为意动用法。"}],
      appreciation: "《醉翁亭记》是欧阳修被贬滁州时所作，是宋代山水游记的代表作，也是作者寄情山水、排遣郁闷的名篇。\n\n思想内容：文章通过描写醉翁亭周围朝暮四季的美景，以及滁人游山、太守宴饮、宾客欢聚的场景，抒发了作者“与民同乐”的政治情怀。“醉翁之意不在酒，在乎山水之间也”既点明主旨，又透露出作者被贬后寄情山水的旷达胸怀。表面写“醉”，实则写“乐”——山水之乐、宴饮之乐、与民同乐，层层递进。\n\n艺术特色：1. 结构精巧——全篇以“乐”字贯穿，由山水之乐到与民同乐，层层推进；2. 句式创新——大量使用骈散结合的句式，全文21个“也”字句一气贯注，形成独特的语言节奏；3. 写景如画——朝暮之景、四时之景各有特色，意境优美；4. 虚实相生——“醉”是表象，“乐”是实质，相互映衬。\n\n名句价值：“醉翁之意不在酒”已成为流传千古的成语；“与民同乐”的思想体现了宋代士大夫的政治理想。文章语言明快流畅，写景、叙事、抒情、议论自然融合，被誉为宋代山水游记的典范之作。"
    },
    {
      id:'songdongyangmashengxu', title:'送东阳马生序', author:'宋濂', authorId:'songlian', cat:'wenyanwen',
      audio:'',
      text:'余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道，又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。\n\n当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。\n\n今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？\n\n今诸生学于太学，县官日有廪稍之供，父母岁有裘葛之遗，无冻馁之患矣；坐大厦之下而诵诗书，无奔走之劳矣；有司业、博士为之师，未有问而不告、求而不得者也；凡所宜有之书，皆集于此，不必若余之手录，假借于人也。其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？\n\n东阳马生君则，在太学已二年，流辈甚称其贤。余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。与之论辨，言和而色夷。自谓少时用心于学甚劳，是可谓善学者矣。其将归见其亲也，余故道为学之难以告之。谓余勉乡人以学者，余之志也；诋我夸际遇之盛而骄乡人者，岂知予者哉？',
      translation: "我小时候就喜爱读书。家里穷，没有办法买书来看，经常向有藏书的人家借，亲手抄录，约定日期归还。遇到大寒天气，砚台里的墨水结成坚硬的冰，手指不能弯曲伸展，也不敢懈怠。抄录完毕，赶快跑着送还人家，不敢稍微超过约定的期限。因此人们大多愿意把书借给我，我也因此能够广泛地阅读各种书籍。到了成年以后，更加仰慕圣贤的学说，又担心没有大师名人和自己交往，曾经跑到百里之外，拿着经书向乡里的前辈请教。前辈德高望重，门人弟子挤满了他的屋子，从来没有稍微缓和言辞脸色。我站在旁边侍候，提出疑难询问道理，俯下身子侧着耳朵来请教；有时遇到他训斥呵责，我的态度更加恭敬，礼节更加周到，不敢说一句话来回答；等到他高兴时，就再向他请教。所以我虽然愚笨，终于还是有所收获。\n\n当我从师求学时，背着书箱拖着鞋子，行走在深山巨谷中。严冬寒风凛冽，大雪深数尺，脚上的皮肤冻裂了都不知道。到了客舍，四肢僵硬不能动弹，仆人拿着热水为我浇洗，用被子把我盖住，许久才暖和过来。住在客舍里，主人每天给我两顿饭，没有新鲜肥美的食物可以享受。同住的同学们都穿着华丽的丝绸衣服，戴着用红缨和宝物装饰的帽子，腰间系着白玉环，左边佩着刀，右边带着香囊，光彩照人像神仙一样；我却穿着粗布旧衣身处他们中间，毫无羡慕之意，因为内心有足以快乐的事（读书），不觉得吃穿的享受不如别人。我求学时的勤奋和艰苦就是如此。\n\n现在我虽已年老，没有什么成就，但还有幸跻身于君子的行列，承受着天子的恩宠，跟随在公卿之后，每天陪侍在座等候询问，天下人也称道我的名字，更何况才能超过我的人呢？\n\n如今太学生们在太学读书，朝廷每天供给粮食，父母每年送来皮衣葛衣，没有受冻挨饿的忧患了；坐在高大的屋子下诵读诗书，没有奔走求师的劳累了；有司业、博士做他们的老师，没有提问而不回答、求教而不满足的情况了；凡是应该有的书，都集中在这里，不必像我那样亲手抄写、向人借阅了。他们的学业有不精通、德行有不成就的，如果不是天资低下，那就是用心不如我专一罢了，难道是别人的过错吗？\n\n东阳的马君则，在太学已经两年，同辈的人都称赞他贤能。我到京师朝见皇上，他以同乡晚辈的身份来拜见我，写了一封长信作为见面礼，文辞很流畅通达。和他讨论辨析问题，言语温和态度平和。他自己说小时候学习非常刻苦用心，这可以说是善于学习的人了。他将要回家探望父母，所以我特地讲讲求学的艰难来告诉他。说我勉励同乡人学习，是我的本意；诋毁我夸耀自己际遇的显达而在同乡面前骄傲的，哪里是了解我的人呢？",
      notes: [{phrase:"嗜学",pos:"余幼时即嗜学",explain:"嗜，喜爱，特殊爱好。"},{phrase:"致",pos:"无从致书以观",explain:"致，得到、取得。"},{phrase:"假借",pos:"每假借于藏书之家",explain:"借。"},{phrase:"弗之怠",pos:"弗之怠",explain:"即「弗怠之」，不懈怠抄录。宾语前置句。"},{phrase:"走",pos:"走送之",explain:"走，跑。古今异义。"},{phrase:"加冠",pos:"既加冠",explain:"加冠，古代男子二十岁行冠礼，表示成年。"},{phrase:"硕师",pos:"又患无硕师名人与游",explain:"硕，大。"},{phrase:"先达",pos:"从乡之先达执经叩问",explain:"德隆望尊的前辈。"},{phrase:"叱咄",pos:"或遇其叱咄",explain:"叱咄（chì duō），训斥，呵责。"},{phrase:"负箧曳屣",pos:"负箧曳屣行深山巨谷中",explain:"箧（qiè），小箱子。曳（yè）屣（xǐ），拖着鞋子。"},{phrase:"皲裂",pos:"足肤皲裂而不知",explain:"皲（jūn）裂，皮肤因寒冷而冻裂。"},{phrase:"汤",pos:"媵人持汤沃灌",explain:"汤，热水。古今异义。"},{phrase:"寓逆旅",pos:"寓逆旅",explain:"逆旅，旅店。"},{phrase:"容臭",pos:"右备容臭",explain:"容臭（xiù），香囊。"},{phrase:"烨然",pos:"烨然若神人",explain:"烨（yè）然，光彩耀眼的样子。"}],
      appreciation: "《送东阳马生序》是宋濂于明洪武十一年（1378）写给同乡青年马君则的一篇赠序，是中国古代劝学名篇之一。\n\n思想内容：文章以作者自己青少年时期求学的艰难经历为线索，现身说法，对比今日太学生们优越的学习条件，劝勉马生珍惜时光、专心向学。作者诚恳地指出，学业能否有成不在于物质条件的好坏，而在于主观上是否专心勤奋——“其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉”。\n\n艺术特色：1. 现身说法，对比鲜明——以自己求学的“勤且艰”对比今日太学生优越的条件，以自己“中有足乐者”对比同舍生“烨然若神人”的奢华，对比之中见精神；2. 细节生动——“砚冰坚”“手指不可屈伸”“足肤皲裂”等细节描写真实可感，富有感染力；3. 语言质朴——不事雕琢，娓娓道来，诚恳真切；4. 叙事与议论结合——以叙事为基础，自然引出议论，富有说服力。\n\n名句价值：“以中有足乐者，不知口体之奉不若人也”成为后世学子的座右铭，强调精神追求高于物质享受。文章充分体现了中国古代士人“安贫乐道”“刻苦向学”的传统美德，至今对青年学子仍有深刻的启发意义。"

    {
      id:'taohuayuanji', title:'桃花源记', author:'陶渊明', authorId:'taoyuanming', cat:'wenyanwen',
      audio:'',
      text:'晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n\n见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云："不足为外人道也。"\n\n既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。\n\n南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。',
      translation: "东晋太元年间，武陵郡有个人以打鱼为生。他顺着溪水划船，忘记了路程的远近。忽然遇到一片桃花林，生长在溪水的两岸，长达几百步，中间没有别的树，花草鲜嫩美丽，落花纷纷地散在地上。渔人对此感到非常诧异，继续往前走，想要走到林子的尽头。\n\n桃林在溪水发源的地方就到头了，便出现一座山，山上有个小洞口，洞里隐隐约约似乎有光亮。渔人离开船，从洞口进入。起初洞口很狭窄，仅容一个人通过。又走了几十步，突然变得开阔明亮了。土地平坦宽广，房屋整整齐齐，有肥沃的田地、美丽的池沼、桑树竹林之类。田间小路交错相通，鸡鸣狗叫到处可以听到。在那里人们来来往往耕种劳作，男女的穿着打扮，完全像桃花源外的世人。老人和小孩们个个都安闲快乐。\n\n村里的人看到渔人，感到非常惊讶，问他是从哪里来的。渔人详细地作了回答。村里人就邀请他到自己家里去，摆酒杀鸡做饭来款待他。村里的人听说来了这样一个人，都来打听消息。他们自己说他们的祖先为了躲避秦时的战乱，领着妻子儿女和乡邻来到这个与世隔绝的地方，不再出去，于是就和外边的人隔绝了。他们问渔人现在是什么朝代，他们竟然不知道有汉朝，更不用说魏、晋两朝了。渔人把自己听到的事一一详细地告诉了他们，听的人都感叹惋惜。其余的人各自又把渔人请到自己家中，都拿出酒饭来款待他。渔人逗留了几天后，向村里人辞行。村里人嘱咐他道：\"这个地方不值得对外面的人说啊！\"\n\n渔人出来以后，找到了他的船，就顺着来时的路回去，处处都做了记号。到了武陵郡城，他去拜见太守，报告了这番经历。太守立即派人跟着他去，寻找先前所做的记号，结果迷了路，再也找不到通向桃花源的路了。\n\n南阳人刘子骥，是个志向高洁的隐士，听说了这件事，高兴地计划前往。但没有实现，不久他就病死了。从此以后就再也没有人探访桃花源了。",
      notes: [{phrase:"太元",pos:"晋太元中",explain:"东晋孝武帝司马曜的年号（376-396年）。"},{phrase:"缘",pos:"缘溪行",explain:"顺着、沿着。"},{phrase:"穷",pos:"欲穷其林",explain:"穷尽，走到尽头。"},{phrase:"俨然",pos:"屋舍俨然",explain:"整齐的样子。"},{phrase:"属",pos:"桑竹之属",explain:"类。"},{phrase:"阡陌交通",pos:"阡陌交通",explain:"阡陌，田间小路；交通，交错相通。"},{phrase:"黄发垂髫",pos:"黄发垂髫",explain:"黄发，指老人；垂髫（tiáo），指儿童。借代修辞。"},{phrase:"要",pos:"便要还家",explain:"要（yāo），通'邀'，邀请。"},{phrase:"咸",pos:"咸来问讯",explain:"都。"},{phrase:"妻子",pos:"率妻子邑人",explain:"妻子和儿女。古今异义。"},{phrase:"绝境",pos:"来此绝境",explain:"与世隔绝的地方。古今异义。"},{phrase:"无论",pos:"无论魏晋",explain:"更不用说。古今异义。"},{phrase:"扶向路",pos:"便扶向路",explain:"扶，沿着、顺着；向，从前的、旧的。"},{phrase:"志",pos:"处处志之",explain:"做记号。名词作动词。"},{phrase:"问津",pos:"后遂无问津者",explain:"问路。这里指探访、访求。津，渡口。"}],
      appreciation: "《桃花源记》是陶渊明的代表作之一，约作于宋永初二年（421年），当时作者隐居乡里，对现实政治黑暗深感不满。\n\n思想内容：文章虚构了一个与世隔绝、人人安居乐业的桃花源，描绘了一幅没有压迫、没有剥削、人人平等、自得其乐的理想社会图景，寄托了作者对美好生活的向往和对黑暗现实的不满，也反映了当时广大人民反对战争、追求和平的愿望。\n\n艺术特色：1. 虚实相生——以写实笔法叙写虚构故事，使桃花源似真似幻；2. 曲折有致——渔人进出桃花源的经过一波三折，引人入胜；3. 语言朴素——用白描手法刻画人物景物，不加雕饰而意境全出；4. 结构完整——以渔人进出为线索，按发现、访问、离开、再寻的顺序层层推进。\n\n名句价值：\"阡陌交通，鸡犬相闻\"\"黄发垂髫，并怡然自乐\"已成为描绘祥和安宁生活的经典意象；\"世外桃源\"更成为汉语中形容理想境界的固定成语。"
    },
    {
      id:'loushiming', title:'陋室铭', author:'刘禹锡', authorId:'liuyuxi', cat:'wenyanwen',
      audio:'',
      text:'山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？',
      translation: "山不在于高，有了仙人就成为名山。水不在于深，有了龙就显出灵异。这是简陋的屋子，只因我的品德好（就不感到简陋了）。苔藓痕迹碧绿，长到阶上；草色青葱，映入帘里。到这里谈笑的都是博学的人，交往的没有知识浅薄的人。可以弹奏不加装饰的古琴，阅读佛经。没有世俗的乐曲扰乱心境，没有官府公文劳神伤身。南阳有诸葛亮的草庐，西蜀有扬子云的亭子。孔子说：\"有什么简陋的呢？\"",
      notes: [{phrase:"名",pos:"有仙则名",explain:"名词作动词，出名、有名。"},{phrase:"灵",pos:"有龙则灵",explain:"名词作动词，显出灵异。"},{phrase:"斯",pos:"斯是陋室",explain:"这。"},{phrase:"馨",pos:"惟吾德馨",explain:"散布很远的香气，这里指品德高尚。"},{phrase:"鸿儒",pos:"谈笑有鸿儒",explain:"博学的人。"},{phrase:"白丁",pos:"往来无白丁",explain:"平民，这里指没有什么学问的人。"},{phrase:"素琴",pos:"可以调素琴",explain:"不加装饰的琴。"},{phrase:"金经",pos:"阅金经",explain:"指佛经。"},{phrase:"丝竹",pos:"无丝竹之乱耳",explain:"借代指世俗的管弦乐。"},{phrase:"案牍",pos:"无案牍之劳形",explain:"官府的公文。"},{phrase:"何陋之有",pos:"何陋之有",explain:"宾语前置，即「有何陋之有」。"}],
      appreciation: "《陋室铭》是刘禹锡被贬和州刺史时所作的一篇托物言志的骈文，是古代散文中的名篇。\n\n立意高远：文章以\"惟吾德馨\"为主旨，通过对陋室的描写，表达了作者安贫乐道、洁身自好的生活情趣和不慕荣华、不与世俗同流合污的高尚节操。开篇以\"山\"\"水\"起兴，以\"仙\"\"龙\"为喻，引出\"陋室\"因德而馨的主旨，立意委婉含蓄。\n\n写作特色：1. 托物言志——借陋室抒写怀抱；2. 骈散结合——以骈句为主，对仗工整，音韵和谐；3. 正反对比——\"鸿儒\"与\"白丁\"、\"素琴金经\"与\"丝竹案牍\"对比鲜明；4. 用典巧妙——以诸葛庐、子云亭自况，以孔子语作结，画龙点睛。\n\n名句价值：\"山不在高，有仙则名；水不在深，有龙则灵\"已成千古名言，与\"斯是陋室，惟吾德馨\"一道寄托了中国古代知识分子安贫乐道的精神追求，激励后人注重品德修养。"
    },
    {
      id:'ailianshuo', title:'爱莲说', author:'周敦颐', authorId:'zhoudunyi', cat:'wenyanwen',
      audio:'',
      text:'水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。\n\n予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣！',
      translation: "水上、陆地上各种草本木本的花，值得喜爱的有很多。晋代的陶渊明唯独喜爱菊花。从唐朝以来，世上的人们非常喜爱牡丹。我唯独喜爱莲花，它从淤泥中长出来却不沾染污秽，在清水里洗涤过却不显得妖媚；它的茎中间空、外部直，不生蔓，不长枝；香气传播得越远越显得清香；笔直而洁净地立在那里，只能在远处观赏，却不能靠近轻慢地玩弄它。\n\n我认为，菊花是花中的隐士；牡丹，是花中的富贵者；莲花，是花中的君子。唉！对于菊花的喜爱，在陶渊明以后很少听到了。对于莲花的喜爱，和我一样的还有谁？对于牡丹的喜爱，应当人很多了！",
      notes: [{phrase:"蕃",pos:"可爱者甚蕃",explain:"多。"},{phrase:"独",pos:"独爱菊",explain:"只，仅。"},{phrase:"染",pos:"出淤泥而不染",explain:"沾染（污秽）。"},{phrase:"濯",pos:"濯清涟而不妖",explain:"洗。"},{phrase:"清涟",pos:"濯清涟",explain:"清水。"},{phrase:"妖",pos:"濯清涟而不妖",explain:"美丽而不端庄。"},{phrase:"不蔓不枝",pos:"不蔓不枝",explain:"不生蔓，不长枝。「蔓」「枝」均为名词作动词。"},{phrase:"亭亭净植",pos:"亭亭净植",explain:"笔直地洁净地立着。亭亭，耸立的样子；植，竖立。"},{phrase:"亵玩",pos:"不可亵玩焉",explain:"亲近而不庄重地玩弄。"},{phrase:"隐逸",pos:"花之隐逸者",explain:"隐居避世。"},{phrase:"鲜",pos:"陶后鲜有闻",explain:"少。"},{phrase:"宜乎",pos:"宜乎众矣",explain:"当然、应该。"}],
      appreciation: "《爱莲说》是北宋理学家周敦颐的一篇托物言志散文，通过对莲花的赞美，表达了自己不慕名利、洁身自好的高尚情操，是中国古代咏物散文的经典之作。\n\n立意高远：文章以\"莲，花之君子者也\"为核心，通过对莲花\"出淤泥而不染，濯清涟而不妖\"的生动描写，赋予莲花君子的人格象征，表达了作者对高洁人格的追求和对世俗趋炎附势之风的鄙弃。\n\n写作特色：1. 托物言志——借莲花的形象寄寓君子品德；2. 衬托手法——以菊之\"隐逸\"与牡丹之\"富贵\"衬托莲之\"君子\"，一正一反，相得益彰；3. 三物对比——菊、牡丹、莲三者对比，寄托对三种人生态度的褒贬；4. 语言精练——骈散结合，节奏明快，描摹生动。\n\n名句价值：\"出淤泥而不染，濯清涟而不妖\"已成为君子人格的经典写照，被人们广为传诵，激励一代代人坚守节操、洁身自好。"
    },
    {
      id:'sanxia', title:'三峡', author:'郦道元', authorId:'lidaoyuan', cat:'wenyanwen',
      audio:'',
      text:'自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。\n\n至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。\n\n春冬之时，则素湍绿潭，回清倒影，绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。\n\n每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰："巴东三峡巫峡长，猿鸣三声泪沾裳。"',
      translation: "在三峡的七百里当中，两岸都是相连的山，一点也没有中断的地方。重重叠叠的岩峰像屏障一样，遮住了天，挡住了日光，如果不是正午和半夜，就看不见太阳和月亮。\n\n到了夏天江水漫上丘陵的时候，下行和上行的航道都被阻断，不能通行。有时遇到皇帝有命令必须急速传达，有时候早晨从白帝城出发，傍晚就到了江陵，这中间有一千二百多里路，即使骑着奔驰的快马，驾着长风，也不如船行得快啊。\n\n到了春冬的季节，白色的急流，碧绿的深潭，回旋着清波，倒映着各种景物的影子。极高的山峰上长着许多奇形怪状的柏树，悬泉瀑布在山峰之间飞流冲荡，水清、树荣、山高、草茂，实在很有趣味。\n\n每逢初晴的日子或者结霜的早晨，树林和山涧显出一片清凉和寂静，常常有高处的猿猴拉长声音鸣叫，声音接连不断，凄凉怪异，空旷的山谷传来回声，悲哀婉转，很久才消失。所以打鱼的人唱道：\"巴东三峡巫峡长，猿鸣三声泪沾裳。\"",
      notes: [{phrase:"略无",pos:"略无阙处",explain:"毫无。"},{phrase:"阙",pos:"略无阙处",explain:"通'缺'，中断。"},{phrase:"嶂",pos:"重岩叠嶂",explain:"像屏障一样的山峰。"},{phrase:"亭午",pos:"自非亭午夜分",explain:"正午。"},{phrase:"夜分",pos:"自非亭午夜分",explain:"半夜。"},{phrase:"曦",pos:"不见曦月",explain:"日光，这里指太阳。"},{phrase:"襄",pos:"夏水襄陵",explain:"漫上。襄（xiāng），冲上、漫上。"},{phrase:"沿",pos:"沿溯阻绝",explain:"顺流而下。"},{phrase:"溯",pos:"沿溯阻绝",explain:"逆流而上。"},{phrase:"奔",pos:"虽乘奔御风",explain:"这里指飞奔的马。动词作名词。"},{phrase:"湍",pos:"素湍绿潭",explain:"急流。"},{phrase:"巘",pos:"绝巘多生怪柏",explain:"巘（yǎn），极高的山峰。"},{phrase:"飞漱",pos:"飞漱其间",explain:"飞流冲荡。漱，冲刷。"},{phrase:"属引",pos:"属引凄异",explain:"属（zhǔ），连续；引，延长。接连不断。"},{phrase:"哀转",pos:"哀转久绝",explain:"悲哀婉转。转，通'啭'，鸣叫。"}],
      appreciation: "《三峡》节选自郦道元《水经注·江水》，是一篇著名的山水游记散文。\n\n思想内容：文章通过对三峡四季不同景物的描绘，展现了三峡雄奇险拔、清幽秀丽的景色，表达了作者对祖国大好河山的热爱和赞美之情。\n\n艺术特色：1. 结构严谨——先写山，后写水；写水按夏、春冬、秋的顺序，层次分明；2. 动静结合——\"素湍绿潭，回清倒影\"一动一静，相映成趣；3. 正面描写与侧面烘托相结合——\"虽乘奔御风，不以疾也\"以奔马和疾风衬托江水之快；4. 视听结合——绘形绘色，绘声绘影；5. 引用渔歌作结，余味无穷。\n\n名句价值：\"巴东三峡巫峡长，猿鸣三声泪沾裳\"渲染了三峡秋景的凄凉氛围，与全文相得益彰。"
    },
    {
      id:'mashuo', title:'马说', author:'韩愈', authorId:'hanyu', cat:'wenyanwen',
      audio:'',
      text:'世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n\n马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？\n\n策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰："天下无马！"呜呼！其真无马邪？其真不知马也！',
      translation: "世上先有了伯乐，然后才会有千里马。千里马经常有，可是伯乐不常有。因此，即使是很名贵的马，也只能在奴仆的手下受屈辱，和普通的马一同死在马厩里，不能凭借日行千里的本领而著称。\n\n日行千里的马，一顿有时能吃尽一石粮食。喂马的人不知道它能日行千里，而像普通的马一样来喂养它。这样的马，即使有日行千里的才能，却吃不饱，力气不足，它的才能和美好的素质也就表现不出来，想要和普通的马等同尚且办不到，又怎么能要求它日行千里呢？\n\n驾驭它，却不采用驾驭千里马的方法；喂养它，却不能让它充分发挥自己的才能；它鸣叫，却不能通晓它的意思。反而拿着鞭子站在它跟前，说：\"天下没有千里马！\"唉！难道真的没有千里马吗？恐怕是真的不识千里马吧！",
      notes: [{phrase:"伯乐",pos:"世有伯乐",explain:"相传古之善相马者，名孙阳。"},{phrase:"祗",pos:"祗辱于奴隶人之手",explain:"同「只」，只是。"},{phrase:"奴隶人",pos:"奴隶人之手",explain:"奴仆，地位低下的人。"},{phrase:"骈死",pos:"骈死于槽枥之间",explain:"并列而死。骈，两马并驾。"},{phrase:"槽枥",pos:"槽枥之间",explain:"马槽。"},{phrase:"食",pos:"食马者",explain:"同「饲」，喂养。"},{phrase:"外见",pos:"才美不外见",explain:"表现在外面。见，同「现」。"},{phrase:"等",pos:"与常马等不可得",explain:"等同。"},{phrase:"策",pos:"策之不以其道",explain:"马鞭，这里作动词，用鞭子打。"},{phrase:"道",pos:"不以其道",explain:"方法。"},{phrase:"材",pos:"尽其材",explain:"才能。"},{phrase:"临",pos:"执策而临之",explain:"面对。"}],
      appreciation: "《马说》是韩愈早期创作的一篇寓言性杂文，借千里马不遇伯乐的遭遇，抒发了作者怀才不遇的愤懑之情，是\"说\"体散文的代表作。\n\n思想内容：文章以千里马比喻有才能的人，以伯乐比喻识别、任用人才的统治者，以\"食马者\"比喻愚妄浅薄的统治者，借千里马的遭遇揭露当时人才被埋没、被摧残的社会现实，表达了作者强烈的愤慨。\n\n写作特色：1. 托物寓意——以马喻人，言在此而意在彼，含蓄而深刻；2. 反复手法——\"千里马\"多次出现，\"不知\"反复申说，层层递进；3. 句式多变——陈述、反诘、感叹交错，\"呜呼\"\"其真……邪？其真……也！\"将愤懑推向高潮；4. 结构严密——围绕\"世有伯乐，然后有千里马\"展开，首尾呼应。\n\n名句价值：\"世有伯乐，然后有千里马\"已成为识才、用才的经典名言；\"千里马常有，而伯乐不常有\"则道出了人才与识才者关系的普遍规律，至今仍具现实意义。"
    },
    {
      id:'xiaoshitanji', title:'小石潭记', author:'柳宗元', authorId:'liuzongyuan', cat:'wenyanwen',
      audio:'',
      text:'从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。\n\n潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动，俶尔远逝，往来翕忽。似与游者相乐。\n\n潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。\n\n坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。\n\n同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生：曰恕己，曰奉壹。',
      translation: "从小丘向西走一百二十步，隔着成林的竹子，听到水声，好像玉佩玉环相碰发出的声音，心里很高兴。砍伐竹子开出一条路，往下见到一个小水潭，潭水格外清凉。整块石头作为潭底，靠近岸边的地方，石底有些部分翻卷过来露出水面，成为坻、屿、嵁、岩等各种不同的形状。青葱的树木，翠绿的藤蔓，遮掩缠绕，摇动下垂，参差不齐，随风飘动。\n\n潭中的鱼大约有一百来条，都好像在空中游动，什么凭借也没有似的。阳光直照到水底，鱼的影子映在石上，呆呆地停在那里，忽然间又向远处游去，来来往往轻快敏捷。好像跟游人逗乐似的。\n\n向水潭的西南方向望去，溪水像北斗星那样曲折，又像蛇爬行那样弯曲，一段看得见，一段看不见。溪岸的形状像狗的牙齿那样参差不齐，不能知道溪水的源头在哪里。\n\n我坐在潭边，四周有竹子树木环绕合抱，寂静寥落，空无一人，令人感到心神凄凉，寒气透骨，幽静深远，弥漫着忧伤的气息。因为这里的环境过于凄清，不能长时间停留，于是记下这番景致就离开了。\n\n同游的人有：吴武陵、龚古、我的弟弟宗玄。跟着同来的，是崔家两个年轻人：一个叫恕己，一个叫奉壹。",
      notes: [{phrase:"篁竹",pos:"隔篁竹",explain:"成林的竹子。篁（huáng），竹林。"},{phrase:"珮环",pos:"如鸣珮环",explain:"玉佩、玉环，都是玉制的装饰品。"},{phrase:"清冽",pos:"水尤清冽",explain:"清凉。冽（liè），寒冷。"},{phrase:"卷",pos:"卷石底以出",explain:"翻卷。"},{phrase:"坻",pos:"为坻",explain:"坻（chí），水中高地。"},{phrase:"屿",pos:"为屿",explain:"小岛。"},{phrase:"嵁",pos:"为嵁",explain:"嵁（kān），不平的岩石。"},{phrase:"蒙络摇缀",pos:"蒙络摇缀",explain:"遮掩缠绕，摇动下垂。"},{phrase:"可",pos:"潭中鱼可百许头",explain:"大约。"},{phrase:"下澈",pos:"日光下澈",explain:"直照到水底。澈，穿透。"},{phrase:"佁然",pos:"佁然不动",explain:"愣住的样子。佁（yǐ）然，静止貌。"},{phrase:"俶尔",pos:"俶尔远逝",explain:"忽然。俶（chù）尔，突然。"},{phrase:"翕忽",pos:"往来翕忽",explain:"轻快敏捷的样子。翕（xī）忽，迅疾。"},{phrase:"斗折",pos:"斗折蛇行",explain:"像北斗星那样曲折。斗，名词作状语。"},{phrase:"犬牙差互",pos:"其岸势犬牙差互",explain:"像狗的牙齿那样参差不齐。犬牙，名词作状语。"},{phrase:"悄怆",pos:"悄怆幽邃",explain:"寂静得使人感到忧伤。悄（qiǎo）怆，忧伤。"},{phrase:"居",pos:"不可久居",explain:"停留。"}],
      appreciation: "《小石潭记》是柳宗元被贬永州期间所作\"永州八记\"中的第四篇，写于唐元和四年（809年）。\n\n思想情感：文章生动地描写了小石潭环境景物的幽美和静穆，抒发了作者贬官失意后的孤凄悲凉之情。\"凄神寒骨，悄怆幽邃\"看似写景，实则是作者心境的投射——由初见小潭的\"心乐之\"到最终的\"不可久居\"，情感由乐转忧，含蓄地表现了作者被贬后的凄苦心情。\n\n艺术特色：1. 移步换景——按游览顺序，从\"发现小潭\"到\"潭中景物\"再到\"潭溪远景\"，层次清晰；2. 正面描写与侧面烘托相结合——\"皆若空游无所依\"侧面写水之清；3. 动静结合——写鱼\"佁然不动\"\"俶尔远逝\"一动一静相映成趣；4. 情景交融——写景中暗含作者的身世之感。\n\n名句价值：\"皆若空游无所依\"\"凄神寒骨，悄怆幽邃\"已成为描绘清幽之境和孤寂心境的经典名句。"
    },
    {
      id:'caogulunzhan', title:'曹刿论战', author:'左丘明', authorId:'zuoqiuming', cat:'wenyanwen',
      audio:'',
      text:'十年春，齐师伐我。公将战，曹刿请见。其乡人曰："肉食者谋之，又何间焉？"刿曰："肉食者鄙，未能远谋。"乃入见。问："何以战？"公曰："衣食所安，弗敢专也，必以分人。"对曰："小惠未遍，民弗从也。"公曰："牺牲玉帛，弗敢加也，必以信。"对曰："小信未孚，神弗福也。"公曰："小大之狱，虽不能察，必以情。"对曰："忠之属也。可以一战。战则请从。"\n\n公与之乘，战于长勺。公将鼓之。刿曰："未可。"齐人三鼓。刿曰："可矣。"齐师败绩。公将驰之。刿曰："未可。"下视其辙，登轼而望之，曰："可矣。"遂逐齐师。\n\n既克，公问其故。对曰："夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。"',
      translation: "鲁庄公十年的春天，齐国军队攻打我国。庄公将要迎战，曹刿请求拜见庄公。他的同乡说：\"肉食者会谋划这件事，你又何必参与呢？\"曹刿说：\"肉食者目光短浅，不能深谋远虑。\"于是进见庄公。曹刿问庄公：\"您凭什么作战？\"庄公说：\"衣食这些使人安身的东西，不敢独自享受，一定把它分给别人。\"曹刿回答说：\"这种小恩小惠不能遍及百姓，百姓是不会听从您的。\"庄公说：\"祭祀用的牛羊玉帛，不敢虚报，一定对神诚实。\"曹刿回答说：\"这只是小信用，不能使神信服，神不会保佑您的。\"庄公说：\"大大小小的诉讼案件，即使不能一一明察，也一定根据实情来处理。\"曹刿回答说：\"这是尽了本职一类的事，可以凭这一点打一仗。作战时请允许我跟从。\"\n\n庄公和他同乘一辆战车，在长勺作战。庄公将要击鼓进军。曹刿说：\"不行。\"齐国人敲了三次鼓。曹刿说：\"可以了。\"齐军大败。庄公将要驱车追击。曹刿说：\"不行。\"他下车察看齐军的车辙，又登上车前横木眺望齐军，说：\"可以了。\"于是追击齐军。\n\n战胜以后，庄公问取胜的原因。曹刿回答说：\"作战，靠的是勇气。第一次击鼓能够振作士气，第二次击鼓士气就衰弱了，第三次击鼓士气就耗尽了。他们的士气耗尽了我军士气正旺盛，所以战胜了他们。大国难以推测，怕有伏兵在哪里。我观察他们的车辙乱了，望见他们的旗帜倒了，所以追击他们。\"",
      notes: [{phrase:"师",pos:"齐师伐我",explain:"师，军队。"},{phrase:"间",pos:"又何间焉",explain:"间（jiàn），参与。"},{phrase:"鄙",pos:"肉食者鄙",explain:"鄙，浅陋，这里指目光短浅。"},{phrase:"安",pos:"衣食所安",explain:"安，养，这里指使人安身的东西。"},{phrase:"专",pos:"弗敢专也",explain:"专，独自享有。"},{phrase:"牺牲",pos:"牺牲玉帛",explain:"牺牲，祭祀用的猪牛羊等祭品。"},{phrase:"加",pos:"弗敢加也",explain:"加，虚报、夸大。"},{phrase:"信",pos:"必以信",explain:"信，诚实。"},{phrase:"孚",pos:"小信未孚",explain:"孚（fú），使人信服。"},{phrase:"福",pos:"神弗福也",explain:"福，赐福、保佑。名词作动词。"},{phrase:"狱",pos:"小大之狱",explain:"狱，诉讼案件。"},{phrase:"察",pos:"虽不能察",explain:"察，明察。"},{phrase:"情",pos:"必以情",explain:"情，实情。"},{phrase:"鼓",pos:"公将鼓之",explain:"鼓，击鼓进军。名词作动词。"},{phrase:"败绩",pos:"齐师败绩",explain:"败绩，大败。"},{phrase:"驰",pos:"公将驰之",explain:"驰，驱车追赶。"},{phrase:"轼",pos:"登轼而望之",explain:"轼，车前横木。这里作动词，扶轼。"},{phrase:"既克",pos:"既克",explain:"既，已经。克，战胜。"},{phrase:"一鼓作气",pos:"一鼓作气",explain:"第一次击鼓能够振作士气。"},{phrase:"靡",pos:"望其旗靡",explain:"靡，倒下。"}],
      appreciation: "《曹刿论战》选自《左传·庄公十年》，记述的是春秋时期齐鲁长勺之战的经过，是中国古代军事史上著名的以弱胜强的战例。\n\n思想内容：文章通过记述曹刿请见、战前论政、战中指挥、战后论战的经过，刻画了一位具有政治远见和军事才能的平民知识分子形象，阐明了\"取信于民\"是战争胜利的政治前提，\"彼竭我盈\"是战争取胜的军事时机。\n\n写作特色：1. 详略得当——详写曹刿的言论，略写战争场面，突出\"论战\"的主旨；2. 对比衬托——以乡人的浅陋衬托曹刿的远见，以鲁庄公的急躁衬托曹刿的从容；3. 对话为主——通过人物对话展开情节，表现人物性格，简洁生动；4. 结构严密——按\"战前—战中—战后\"的时间顺序组织材料，环环相扣。\n\n名句价值：\"一鼓作气，再而衰，三而竭\"已成为形容做事要趁劲头大时一气呵成的经典名言；\"肉食者鄙，未能远谋\"则成为讽刺当政者短视的名句。"
    },
    {
      id:'zoujifengqiwangnajian', title:'邹忌讽齐王纳谏', author:'刘向', authorId:'liuxiang', cat:'wenyanwen',
      audio:'',
      text:'邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰："我孰与城北徐公美？"其妻曰："君美甚，徐公何能及君也？"城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰："吾孰与徐公美？"妾曰："徐公何能及君也？"旦日，客从外来，与坐谈，问之客曰："吾与徐公孰美？"客曰："徐公不若君之美也。"明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如甚远。暮寝而思之，曰："吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。"\n\n于是入朝见威王，曰："臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。"\n\n王曰："善。"乃下令："群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。"令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。',
      translation: "邹忌身高八尺多，形体容貌俊美。早晨穿戴好衣帽，照着镜子，对他的妻子说：\"我和城北徐公相比谁更美？\"他的妻子说：\"您美极了，徐公怎么能比得上您呢？\"城北的徐公，是齐国的美男子。邹忌不相信自己比徐公美，又问他的妾说：\"我和徐公相比谁更美？\"妾说：\"徐公怎么能比得上您呢？\"第二天，有客人从外面来，与邹忌坐着交谈，邹忌问客人说：\"我和徐公相比谁更美？\"客人说：\"徐公不如您美啊。\"又过了一天徐公来了，邹忌仔细地端详他，自己认为不如徐公美；再照镜子看看自己，更觉得差得远。晚上躺下来思考这件事，说：\"我妻子认为我美，是因为偏爱我；妾认为我美，是因为害怕我；客人认为我美，是因为有求于我。\"\n\n于是邹忌上朝拜见齐威王，说：\"我确实知道自己不如徐公美。我的妻子偏爱我，我的妾害怕我，我的客人有求于我，都认为我比徐公美。现在齐国土地方圆千里，有一百二十座城邑，宫里王身边的人没有不偏爱大王的，朝廷上的大臣没有不害怕大王的，全国范围内的人没有不有求于大王的：由此看来，大王所受的蒙蔽太严重了。\"\n\n齐威王说：\"好。\"于是下令：\"群臣、官吏和百姓能够当面指责我的过错的，受上等奖赏；上书劝谏我的，受中等奖赏；能够在公共场所议论我的过失，传到我耳朵里的，受下等奖赏。\"命令刚下达时，群臣都来进谏，宫廷门前像集市一样人来人往；几个月以后，还不时有人偶尔进谏；一年以后，即使想说，也没什么可进谏的了。燕、赵、韩、魏等国听说了这件事，都到齐国来朝见。这就是所谓在朝廷上战胜敌国。",
      notes: [{phrase:"修",pos:"邹忌修八尺有余",explain:"修，长，这里指身高。"},{phrase:"昳丽",pos:"而形貌昳丽",explain:"昳（yì）丽，光艳美丽。"},{phrase:"朝",pos:"朝服衣冠",explain:"朝（zhāo），早晨。"},{phrase:"服",pos:"朝服衣冠",explain:"服，穿戴。名词作动词。"},{phrase:"孰",pos:"我孰与城北徐公美",explain:"孰，谁，哪个。"},{phrase:"孰视",pos:"孰视之",explain:"孰，通「熟」，仔细。"},{phrase:"私",pos:"吾妻之美我者，私我也",explain:"私，偏爱。"},{phrase:"美我",pos:"吾妻之美我者",explain:"美，认为……美。意动用法。"},{phrase:"蔽",pos:"王之蔽甚矣",explain:"蔽，受蒙蔽。这里指所受的蒙蔽。"},{phrase:"面刺",pos:"能面刺寡人之过者",explain:"面刺，当面指责。面，名词作状语，当面。"},{phrase:"谤讥",pos:"能谤讥于市朝",explain:"谤，公开指责别人的过错；讥，谏。谤讥，指责议论。"},{phrase:"市朝",pos:"谤讥于市朝",explain:"市朝，公共场合。市，集市；朝，朝廷。"},{phrase:"间进",pos:"时时而间进",explain:"间（jiàn），间或、断断续续。"},{phrase:"期年",pos:"期年之后",explain:"期（jī）年，满一年。"},{phrase:"战胜于朝廷",pos:"此所谓战胜于朝廷",explain:"战胜于朝廷，在朝廷上战胜敌国，意指内政修明，不必用武力就能使敌国畏服。"}],
      appreciation: "《邹忌讽齐王纳谏》选自《战国策·齐策一》，是古代讽谏名篇，记述了齐国相国邹忌劝谏齐威王纳谏广开言路的故事。\n\n思想内容：文章通过邹忌从比美受蒙蔽的生活小事中悟出治国大道理，劝谏齐威王广开言路、修明内政，最终使齐国\"战胜于朝廷\"的故事，阐明了\"纳谏则兴，拒谏则亡\"的治国道理，反映了古代开明政治家注重听取民意、修明内政的政治智慧。\n\n写作特色：1. 设喻说理——以生活小事（比美受蒙蔽）类比国家大事（齐王受蒙蔽），由小到大，由家到国，巧妙自然；2. 三叠法结构——邹忌问妻、问妾、问客三问三答，齐王下令后\"门庭若市—时时而间进—无可进者\"三阶段，整齐而富有变化；3. 对比映衬——妻、妾、客三人的回答语气不同，反映其心理不同，刻画入微；4. 详略得当——详写邹忌比美和进谏，略写齐王纳谏后齐国大治的过程，主次分明。\n\n名句价值：\"王之蔽甚矣\"是古代讽谏名言；\"战胜于朝廷\"则成为修明内政、不战而屈人之兵的政治理想的经典表达。"
    },
    {
      id:'jichengtiansiyeyou', title:'记承天寺夜游', author:'苏轼', authorId:'sushi', cat:'wenyanwen',
      audio:'',
      text:'元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。',
      translation: "元丰六年十月十二日夜晚，我脱了衣服打算睡觉，这时月光照进门里，于是高兴地起身出门。想到没有可以共同游乐的人，就到承天寺寻找张怀民。张怀民也还没有睡觉，于是我们一起在庭院中散步。月光照在庭院里像积水发空一样清澈透明，水中水藻、荇菜纵横交错，原来是竹子和柏树的影子。哪一夜没有月光？哪里没有竹子和柏树？只是缺少像我们两个这样清闲的人罢了。",
      notes: [{phrase:"户",pos:"月色入户",explain:"门。"},{phrase:"欣然",pos:"欣然起行",explain:"高兴的样子。"},{phrase:"念",pos:"念无与为乐者",explain:"想到。"},{phrase:"寝",pos:"怀民亦未寝",explain:"睡、睡觉。"},{phrase:"相与",pos:"相与步于中庭",explain:"共同、一起。"},{phrase:"空明",pos:"如积水空明",explain:"形容水的澄澈。这里指月色如水般澄澈。"},{phrase:"藻、荇",pos:"水中藻、荇交横",explain:"均为水生植物。荇（xìng），荇菜。"},{phrase:"盖",pos:"盖竹柏影也",explain:"承接上文，解释原因，有\'原来是\'之意。"},{phrase:"但",pos:"但少闲人如吾两人者耳",explain:"只是。"},{phrase:"闲人",pos:"但少闲人如吾两人者耳",explain:"清闲的人。苏轼被贬黄州，名义上是\'团练副使\'，不得签书公事，故自称\'闲人\'。"},{phrase:"耳",pos:"但少闲人如吾两人者耳",explain:"罢了。"}],
      appreciation: "《记承天寺夜游》是苏轼被贬黄州期间创作的一篇小品文，写于元丰六年（1083年），当时作者因\"乌台诗案\"被贬为黄州团练副使已近四年。\n\n思想情感：文章通过描绘月夜承天寺庭院的清幽景色，抒发了作者贬谪后旷达超脱的情怀。\"闲人\"二字看似自嘲，实则包含着作者对人生遭际的达观态度——虽被闲置，却能于寻常月色中寻得乐趣，体现了苏轼特有的精神境界。\n\n艺术特色：1. 比喻精妙——\"庭下如积水空明\"，将月光比作积水，化无形为有形；\"水中藻、荇交横\"暗写竹柏之影，虚实相生；2. 语言凝练——全文仅 84 字，却写出了夜游的时间、地点、人物、经过和感受；3. 以议论作结——\"何夜无月？何处无竹柏？但少闲人如吾两人者耳\"，由景入理，点明主旨。\n\n名句价值：\"但少闲人如吾两人者耳\"已成千古名句，常被用来表达超然物外、自得其乐的人生态度。"
    },
    {
      id:'huxintingkanxue', title:'湖心亭看雪', author:'张岱', authorId:'zhangdai', cat:'wenyanwen',
      audio:'',
      text:'崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n\n到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余，大喜曰："湖中焉得更有此人！"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰："莫说相公痴，更有痴似相公者！"',
      translation: "崇祯五年十二月，我住在西湖。大雪三天，湖上行人、飞鸟的声音都消失了。这一天初更以后，我撑着一只小船，穿着裘皮衣服带着炉火，独自前往湖心亭看雪。雾凇白气弥漫，天、云、山、水，上下一片白茫茫。湖上的影子，只有长堤一道痕迹、湖心亭一个黑点、以及我的船像一根草芥、船上的人两三粒而已。\n\n到了亭上，有两个人铺着毡子相对而坐，一个童子烧着酒炉子正沸腾。看见我，非常高兴地说：\"湖中怎么还能有这样的人！\"拉着我一同喝酒。我尽力喝了三大杯才告别。问他们的姓名，是金陵人，客居在这里。等到下船，船夫喃喃地说：\"不要说相公痴，还有像相公一样痴的人！\"",
      notes: [{phrase:"更定",pos:"是日更定矣",explain:"更（gēng）定，初更开始，晚上八点左右。"},{phrase:"拏",pos:"余拏一小舟",explain:"拏（ná），撑、划。"},{phrase:"毳衣",pos:"拥毳衣炉火",explain:"毳（cuì），鸟兽的细毛。毳衣，毛皮衣服。"},{phrase:"雾凇",pos:"雾凇沆砀",explain:"雾凇（sōng），水气凝成的冰花。"},{phrase:"沆砀",pos:"雾凇沆砀",explain:"沆砀（hàng dàng），白气弥漫的样子。"},{phrase:"一白",pos:"上下一白",explain:"一白，全白。"},{phrase:"一芥",pos:"与余舟一芥",explain:"一芥，比喻极微小。芥，小草。"},{phrase:"焉得",pos:"湖中焉得更有此人",explain:"焉得，哪能。表示想不到的赞叹。"},{phrase:"大白",pos:"余强饮三大白而别",explain:"大白，大酒杯。"},{phrase:"客",pos:"是金陵人，客此",explain:"客，客居。名词作动词。"},{phrase:"痴",pos:"莫说相公痴",explain:"痴，痴情，指对山水雪景的痴迷。"}],
      appreciation: "《湖心亭看雪》是明末清初文学家张岱的小品文代表作，选自《陶庵梦忆》。\n\n思想内容：文章通过记叙作者雪夜独往湖心亭看雪的经过，表达了作者清高自赏的情怀和淡淡的故国之思。\"崇祯五年\"的纪年、\"金陵人\"的客居身份，都隐含着对故明的眷念。\n\n写作特色：1. 白描手法——文字简练朴素，不事雕琢，\"湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已\"以最简练的笔墨勾勒出西湖雪夜的空灵境界；2. 量词妙用——\"一痕\"\"一点\"\"一芥\"\"两三粒\"几个量词由大到小，由远及近，富有空间感和画面感；3. 意境空灵——\"天与云与山与水，上下一白\"营造了苍茫空阔的雪夜意境；4. 以人衬景——通过亭上遇客、舟子喃喃的细节描写，反衬出作者孤高自赏的痴态。\n\n名句价值：\"湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已\"已成为白描手法的经典范例；结尾舟子一句\"莫说相公痴，更有痴似相公者\"以俗人语言作结，含蓄隽永，余味无穷。"
    },
    {
      id:'yuzhuyuanshushu', title:'与朱元思书', author:'吴均', authorId:'wujun', cat:'wenyanwen',
      audio:'',
      text:'风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。\n\n水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。\n\n夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。',
      translation: "风尘烟雾都消散了，天和山呈现同一种颜色。我乘船随着江流飘荡，任凭它向东或向西。从富阳到桐庐一百来里，奇山异水，天下独一无二。\n\n水都呈青白色，千丈深也能见到水底。游鱼和细小的石头，一直看下去都毫无障碍。湍急的水流比飞箭还快，汹涌的波浪就像奔马一样。\n\n两岸的高山，都长着耐寒的树木，它们凭借山势争着向上，互相争着向高处和远处伸展，争着高耸直立，形成千百座山峰。泉水冲激着石头，发出泠泠的响声；美丽的鸟儿互相唱和，嘤嘤地鸣叫形成和谐动听的声音。蝉长久地鸣叫不断，猿猴不停地啼叫。像鸢鸟一样飞到天上的（追求高官厚禄的人），看到这些山峰就会平息热衷功名的心；治理国家政务的人，看到这些山谷就会流连忘返。横斜的树枝在上面遮蔽着，即使在白天也还像黄昏时那样昏暗；稀疏的枝条交相掩映，有时还能见到阳光。",
      notes: [{phrase:"共色",pos:"天山共色",explain:"共色，同一种颜色。"},{phrase:"从流",pos:"从流飘荡",explain:"从，随、顺着。"},{phrase:"许",pos:"一百许里",explain:"许，表示约数，相当于「左右」。"},{phrase:"独绝",pos:"天下独绝",explain:"独绝，独一无二。"},{phrase:"缥碧",pos:"水皆缥碧",explain:"缥（piǎo）碧，青白色。"},{phrase:"奔",pos:"猛浪若奔",explain:"奔，飞奔的马。动词作名词。"},{phrase:"轩邈",pos:"互相轩邈",explain:"轩，高；邈（miǎo），远。这里都作动词，向高处和远处伸展。"},{phrase:"指",pos:"争高直指",explain:"指，向、向上。"},{phrase:"泠泠",pos:"泠泠作响",explain:"泠泠（líng líng），形容水声。"},{phrase:"转",pos:"蝉则千转不穷",explain:"转（zhuàn），通「啭」，鸟鸣。这里指蝉鸣。"},{phrase:"鸢飞戾天",pos:"鸢飞戾天者",explain:"鸢（yuān），老鹰；戾（lì），至、到达。"},{phrase:"息心",pos:"望峰息心",explain:"息心，平息热衷功名利禄的心。"},{phrase:"反",pos:"窥谷忘反",explain:"反，通「返」，返回。"},{phrase:"柯",pos:"横柯上蔽",explain:"柯（kē），树枝。"}],
      appreciation: "《与朱元思书》是南朝梁代文学家吴均写给友人朱元思的一封信中的写景段落，是南朝山水小品中的佳作，与《与施从事书》《与顾章书》并称为吴均\"三书\"。\n\n思想内容：文章描绘了富春江从富阳到桐庐一段的奇山异水，表达了作者厌弃尘俗、寄情山水、向往自然的情怀。\"鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反\"尤为直接地抒发了作者鄙弃功名利禄、避世隐退的思想。\n\n写作特色：1. 骈文典范——全文以四字句为主，对仗工整，音韵和谐；2. 动静结合——写水以动衬静，写山以静蓄动；3. 视听结合——既写山水的色彩和形态，又写泉声、鸟鸣、蝉噪、猿啼，多角度描绘；4. 详略得当——山水奇绝处详写，过渡处一笔带过。\n\n名句价值：\"鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反\"是抒发厌弃官场、归隐山林情怀的千古名句；\"风烟俱净，天山共色\"以极简笔墨开篇，境界开阔。"
    },
    {
      id:'suiyoujiayao', title:'虽有嘉肴', author:'《礼记》', authorId:'liji', cat:'wenyanwen',
      audio:'',
      text:'虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰"学学半"，其此之谓乎！',
      translation: "虽然有美味的菜肴，不吃，就不知道它的味美；虽然有最好的道理，不学，就不知道它的好处。所以学习之后才知道自己的不足，教人之后才知道自己的困惑。知道自己的不足，然后能自我反思；知道自己的困惑，然后能自我勉励。所以说：教与学是互相促进的。《兑命》说\"教别人也是学习的一半\"，大概说的就是这个意思吧！",
      notes: [{phrase:"嘉",pos:"虽有嘉肴",explain:"嘉，美好。"},{phrase:"旨",pos:"不知其旨也",explain:"旨，味美。"},{phrase:"至道",pos:"虽有至道",explain:"至道，最好的道理。"},{phrase:"困",pos:"教然后知困",explain:"困，困惑，理解不清。"},{phrase:"自反",pos:"然后能自反也",explain:"自反，自我反思。"},{phrase:"自强",pos:"然后能自强也",explain:"自强，自己努力向上。"},{phrase:"教学相长",pos:"教学相长也",explain:"教与学互相促进。长（zhǎng），推进、促进。"},{phrase:"兑命",pos:"《兑命》曰",explain:"兑（yuè）命，即《说命》，《尚书》篇名。兑，通「说」。"},{phrase:"学学半",pos:"学学半",explain:"上一个「学」（xiào）同「斆」，指教；下一个「学」（xué）指学习。教人是学习的一半。"},{phrase:"此之谓乎",pos:"其此之谓乎",explain:"此之谓，说的就是这个吧。宾语前置句。"}],
      appreciation: "《虽有嘉肴》节选自《礼记·学记》，是中国古代最早的教育理论著作之一。《学记》系统论述了教育理论、教学原则和方法，在世界教育史上具有重要地位。\n\n思想内容：文章以\"嘉肴\"\"至道\"为喻，论述了\"教学相长\"的道理——教与学相互促进，相辅相成。通过\"学然后知不足，教然后知困\"的辩证关系，揭示了教育过程中教与学互相启发、共同提高的规律。\n\n写作特色：1. 设喻说理——以日常生活经验（嘉肴要品尝才知其美味）类比学习（至道要学习才知其好处），浅显易懂；2. 对比论证——以\"弗食\"与\"弗学\"对比，以\"知不足\"与\"知困\"对比，逻辑严密；3. 引经据典——结尾引用《尚书·兑命》\"学学半\"作结，强化论点，言简意赅；4. 句式整饬——多用对偶句，朗朗上口。\n\n名句价值：\"教学相长\"已成为教育学的经典命题，至今仍是教育工作者的重要指导思想。"
    },
    {
      id:'shengyuhuananyule', title:'生于忧患，死于安乐', author:'孟子', authorId:'mengzi', cat:'wenyanwen',
      audio:'',
      text:'舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。\n\n人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。',
      translation: "舜从田间被起用，傅说从筑墙工作中被举用，胶鬲从鱼盐贩子中被举用，管夷吾从狱官手中被举用，孙叔敖从海边被举用，百里奚从市井中被举用。所以上天将要把重大责任交给这个人，必定先使他的心志受苦，使他的筋骨劳累，使他的体肤饥饿，使他身受贫困之苦，使他做事不顺，通过这些来使他的心受到震动，使他的性格坚韧起来，不断增加他原本不具备的才能。\n\n人常常犯错误，然后才能改正；心意困苦，思虑阻塞，然后才能有所作为；憔悴枯槁表现在脸色上，吟咏叹息发于声音，然后才能被人们了解。在国内如果没有守法度的大臣和辅佐君主的士人，在国外如果没有敌国外患，国家往往会灭亡。这样以后才明白，忧患使人生存发展，安逸享乐使人萎靡死亡的道理。",
      notes: [{phrase:"发",pos:"舜发于畎亩之中",explain:"发，起，指被任用。"},{phrase:"举",pos:"傅说举于版筑之间",explain:"举，被举用、被选拔。"},{phrase:"畎亩",pos:"畎亩之中",explain:"畎（quǎn）亩，田间、田地。"},{phrase:"版筑",pos:"版筑之间",explain:"版筑，两板相夹，中间填土夯实筑墙。"},{phrase:"士",pos:"管夷吾举于士",explain:"士，狱官。"},{phrase:"空乏",pos:"空乏其身",explain:"空乏，缺乏，这里指使他身处贫困。"},{phrase:"拂",pos:"行拂乱其所为",explain:"拂，违背、不顺。"},{phrase:"动心忍性",pos:"所以动心忍性",explain:"动心，使他的心受到震动；忍性，使他的性格坚韧。都是使动用法。"},{phrase:"曾",pos:"曾益其所不能",explain:"曾（zēng），同「增」，增加。"},{phrase:"恒",pos:"人恒过",explain:"恒，常常。"},{phrase:"衡于虑",pos:"衡于虑",explain:"衡，同「横」，梗塞，指不顺。"},{phrase:"作",pos:"而后作",explain:"作，奋起，指有所作为。"},{phrase:"征",pos:"征于色",explain:"征，表现、显露。"},{phrase:"拂士",pos:"法家拂士",explain:"拂（bì）士，辅佐君主的贤士。拂，通「弼」，辅佐。"},{phrase:"入则",pos:"入则无法家拂士",explain:"入，在里面，指国内。下文「出」指国外。"}],
      appreciation: "《生于忧患，死于安乐》选自《孟子·告子下》，是孟子阐述其政治思想和人生哲学的著名篇章。\n\n思想内容：文章通过列举六位古代圣贤从卑微境遇中崛起的事例，论证了\"人才要在困境中造就\"的道理，进而推及国家治理，得出\"生于忧患而死于安乐\"的著名论断，强调忧患意识对个人修养和国家兴亡的重要意义。\n\n写作特色：1. 排比开头——文章起首连举六人，句式整齐，气势磅礴，为下文论点张本；2. 由个人到国家——从个人成长推及国家兴亡，层层递进，逻辑严密；3. 正反对比——\"入则有法家拂士，出则有敌国外患\"与\"国恒亡\"正反对比，突出论点；4. 言简意赅——结句\"然后知生于忧患而死于安乐也\"一语作结，警策精警。\n\n名句价值：\"生于忧患，死于安乐\"已成为中华民族忧患意识的经典表述，激励一代代仁人志士居安思危、奋发图强。"
    },
    {
      id:'yuwosuoyuye', title:'鱼我所欲也', author:'孟子', authorId:'mengzi', cat:'wenyanwen',
      audio:'',
      text:'鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。\n\n一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。',
      translation: "鱼，是我想要的；熊掌，也是我想要的；如果两者不能同时得到，就舍弃鱼而选取熊掌。生命，是我想要的；道义，也是我想要的；如果两者不能同时得到，就舍弃生命而选取道义。生命也是我想要的，但我想要的东西有比生命更重要的，所以不做苟且偷生的事；死亡也是我厌恶的，但我厌恶的东西有比死亡更严重的，所以有的祸患我不去躲避。如果人们想要的东西没有比生命更重要的，那么凡是可以保命的手段什么不采用呢？如果人们厌恶的东西没有比死亡更严重的，那么凡是可以躲避祸患的事什么不做呢？采用某种方法就可以保命却有人不采用，采用某种方法就可以躲避祸患却有人不去做，因此可见想要的东西有比生命更重要的，厌恶的东西有比死亡更严重的。不仅贤人有这种思想，人人都有，只是贤人能不丧失它罢了。\n\n一筐饭，一碗汤，得到它就能活，得不到就会死。吆喝着给人，过路的饿人都不接受；用脚踩过再给人，乞丐也不屑于接受。万钟的俸禄却不分辨是否合于礼义就接受了，万钟的俸禄对我有什么益处呢？是为了住宅的华美、妻妾的侍奉、所认识的穷苦人感激我吗？从前为了不丧失本心宁可身死也不接受，现在为了住宅的华美却接受了；从前为了不丧失本心宁可身死也不接受，现在为了妻妾的侍奉却接受了；从前为了不丧失本心宁可身死也不接受，现在为了所认识的穷苦人感激我却接受了：这些不也是可以停止的吗？这就叫做失去了他的本心。",
      notes: [{phrase:"得兼",pos:"二者不可得兼",explain:"得兼，同时得到。"},{phrase:"苟得",pos:"故不为苟得也",explain:"苟得，苟且取得，这里指苟且偷生。"},{phrase:"辟",pos:"故患有所不辟也",explain:"辟，通「避」，躲避。"},{phrase:"由是",pos:"由是则生而有不用也",explain:"由是，按照这种方法。是，指代上文「可以得到生命的办法」。"},{phrase:"丧",pos:"贤者能勿丧耳",explain:"丧，丧失。"},{phrase:"箪",pos:"一箪食",explain:"箪（dān），古代盛饭的圆竹器。"},{phrase:"豆",pos:"一豆羹",explain:"豆，古代盛食物的木制器皿，形似高足盘。"},{phrase:"呼尔",pos:"呼尔而与之",explain:"呼尔，轻蔑地吆喝。尔，助词。"},{phrase:"蹴尔",pos:"蹴尔而与之",explain:"蹴（cù）尔，踩踏的样子。"},{phrase:"不屑",pos:"乞人不屑也",explain:"不屑，认为不值得，这里是不愿意接受的意思。"},{phrase:"万钟",pos:"万钟则不辩礼义而受之",explain:"万钟，优厚的俸禄。钟，古代量器。"},{phrase:"辩",pos:"不辩礼义",explain:"辩，通「辨」，辨别。"},{phrase:"乡",pos:"乡为身死而不受",explain:"乡（xiàng），通「向」，从前。"},{phrase:"已",pos:"是亦不可以已乎",explain:"已，停止、放弃。"},{phrase:"本心",pos:"此之谓失其本心",explain:"本心，天性，天良。这里指羞恶之心。"}],
      appreciation: "《鱼我所欲也》选自《孟子·告子上》，是孟子论述\"性善论\"和\"义利之辨\"的著名篇章。\n\n思想内容：文章以鱼与熊掌为喻，提出\"舍生取义\"的道德主张，认为\"义\"的价值高于生命。进而指出\"羞恶之心\"人皆有之，批判了当时社会上为利禄而丧失本心的现象，强调要保持本心，不为外物所惑。\n\n写作特色：1. 比喻开篇——以\"鱼，我所欲也；熊掌，亦我所欲也\"设喻，引出\"舍生取义\"的中心论点，深入浅出；2. 正反对比——\"生亦我所欲\"与\"死亦我所恶\"对比，\"一箪食，一豆羹\"与\"万钟\"对比，凸显\"本心\"的重要；3. 排比铺陈——\"乡为身死而不受\"三句排比，气势充沛，感情强烈；4. 逻辑严密——先从正面立论\"舍生取义\"，再以\"呼尔而与之\"\"蹴尔而与之\"和\"万钟\"正反论证，最后归结到\"失其本心\"。\n\n名句价值：\"舍生取义\"已成为中华民族崇尚道德操守的精神信条；\"非独贤者有是心也，人皆有之\"是孟子\"性善论\"的经典表述。"
    },
    {
      id:'daxiezhongshushu', title:'答谢中书书', author:'陶弘景', authorId:'taohongjing', cat:'wenyanwen',
      audio:'',
      text:'山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。',
      translation: "山水的美丽，自古以来就是人们共同谈论的话题。高耸的山峰直插云霄，清澈的水流能见到水底。两岸的石壁，五彩斑斓交相辉映。青色的树林和翠绿的竹子，四季都具备。清晨的雾气将要消散，猿猴和鸟儿此起彼伏地鸣叫；夕阳将要落下，潜游的鱼儿争相跳出水面。实在是人间的仙都。自从谢灵运以来，不再有能够欣赏这种奇妙景色的人了。",
      notes: [{phrase:"共谈",pos:"古来共谈",explain:"共谈，共同谈论、赞叹。"},{phrase:"交辉",pos:"五色交辉",explain:"交辉，交相辉映。"},{phrase:"俱",pos:"四时俱备",explain:"俱，都。"},{phrase:"歇",pos:"晓雾将歇",explain:"歇，消散。"},{phrase:"颓",pos:"夕日欲颓",explain:"颓，坠落、落下。"},{phrase:"沉鳞",pos:"沉鳞竞跃",explain:"沉鳞，潜游在水中的鱼。鳞，借代鱼。"},{phrase:"欲界",pos:"实是欲界之仙都",explain:"欲界，佛教三界之一，指有人间七情六欲的境界，即人间。"},{phrase:"仙都",pos:"实是欲界之仙都",explain:"仙都，神仙居住的美好地方。"},{phrase:"康乐",pos:"自康乐以来",explain:"康乐，指南朝宋著名山水诗人谢灵运，袭封康乐公。"},{phrase:"与",pos:"未复有能与其奇者",explain:"与（yù），参与，这里指欣赏、领悟。"}],
      appreciation: "《答谢中书书》是南朝齐梁时期道教思想家、文学家陶弘景写给朋友谢中书（谢徵）的一封信，是六朝山水小品中的名篇。\n\n思想内容：文章以清丽的笔触描绘了江南山川的秀美景色，表达了作者沉醉山水的愉悦之情和归隐林泉的志趣，\"自康乐以来，未复有能与其奇者\"既表现了作者自比谢灵运的隐者情怀，又流露出知音难觅的淡淡怅惘。\n\n写作特色：1. 结构精巧——总起（山川之美，古来共谈）—分述（高峰、清流、石壁、林竹、晨景、暮景）—总结（欲界仙都，知音难觅），脉络清晰；2. 骈散结合——以四字句为主，间用散句，整齐而有变化；3. 视听结合——高峰清流为视觉，猿鸟乱鸣为听觉，色彩鲜明，声音悦耳；4. 动静相宜——\"晓雾将歇，猿鸟乱鸣\"以动衬静，\"夕日欲颓，沉鳞竞跃\"动静结合。\n\n名句价值：\"山川之美，古来共谈\"开篇即立全篇之旨，已成为描绘山水之美的经典语句；全文虽仅六十八字，却成为六朝山水小品文的代表作。"
    },
    // ===== 古诗词 =====
    {
      id:'chunjiang', title:'春江花月夜', author:'张若虚', authorId:'zhangruoxu', cat:'gushici',
      audio:'resource/audio/chunjiang.aac',
      text:'春江潮水连海平，海上明月共潮生。\n滟滟随波千万里，何处春江无月明。\n江流宛转绕芳甸，月照花林皆似霰。\n空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。\n江畔何人初见月，江月何年初照人？\n人生代代无穷已，江月年年望相似。\n不知江月待何人，但见长江送流水。\n白云一片去悠悠，青枫浦上不胜愁。\n谁家今夜扁舟子？何处相思明月楼？\n可怜楼上月裴回，应照离人妆镜台。\n玉户帘中卷不去，捣衣砧上拂还来。\n此时相望不相闻，愿逐月华流照君。\n鸿雁长飞光不度，鱼龙潜跃水成文。\n昨夜闲潭梦落花，可怜春半不还家。\n江水流春去欲尽，江潭落月复西斜。\n斜月沉沉藏海雾，碣石潇湘无限路。\n不知乘月几人归，落月摇情满江树。',
      translation: "春天的江潮水势浩荡，与大海连成一片，一轮明月从海上升起，仿佛随着潮水一起涌出。\n月光闪耀随波荡漾千万里，什么地方的春江没有明月的光华？\n江水曲折地绕过花草丛生的原野，月光照在开满鲜花的树林上，像雪珠一样洁白闪光。\n月光如霜在空中飞舞而感觉不到它的飞动，水边白沙上的白霜与月光交融也分不清。\n江天一色没有一丝纤尘，皎洁的天空中只有一轮孤月高悬。\n江畔什么人最初见到这月亮？江上的月亮又是什么年头最初照耀着人？\n人生一代一代地流传没有穷尽，江上的月亮年年看起来都是相似的。\n不知道江月等待着什么人，只见长江不断地送走流水。\n一片白云悠然飘去，青枫浦上令人不胜忧愁。\n谁家今夜有飘荡在江上的扁舟？何处有人在明月照耀的楼上相思？\n可怜那月光在楼上徘徊不去，应该照在离人的妆镜台上。\n月光透过珠帘卷也卷不去，照在捣衣砧上拂也拂不走。\n此时互相望着却听不见对方的声音，愿意追逐月光流去照耀着你。\n鸿雁飞得再远也不能逾越月光，鱼龙潜入水中只激起波纹。\n昨夜梦见幽静的潭水中飘落着花瓣，可怜春天已过半还不能回家。\n江水带着春光流去将尽，江潭上的落月又向西倾斜。\n斜月沉入海雾之中藏起来，碣石到潇湘相距路途遥远。\n不知今夜有多少人乘着月色归家，落月的余晖摇动着离情洒满了江边的树林。",
      notes: [{phrase:"滟滟",pos:"滟滟随波千万里",explain:"波光荡漾的样子。"},{phrase:"芳甸",pos:"江流宛转绕芳甸",explain:"遍生花草的郊野。"},{phrase:"霰",pos:"月照花林皆似霰",explain:"霰（xiàn），白色小冰粒，此处喻月光下的花林如雪珠般洁白。"},{phrase:"流霜",pos:"空里流霜不觉飞",explain:"形容月光皎洁如霜飞舞。"},{phrase:"汀",pos:"汀上白沙看不见",explain:"汀（tīng），水边平地、沙洲。"},{phrase:"纤尘",pos:"江天一色无纤尘",explain:"微细的灰尘。"},{phrase:"皎皎",pos:"皎皎空中孤月轮",explain:"明亮洁白的样子。"},{phrase:"穷已",pos:"人生代代无穷已",explain:"穷尽。"},{phrase:"悠悠",pos:"白云一片去悠悠",explain:"飘忽不定的样子。"},{phrase:"青枫浦",pos:"青枫浦上不胜愁",explain:"地名，今湖南浏阳境内，\'浦\'字暗含离别之意。"},{phrase:"扁舟子",pos:"谁家今夜扁舟子",explain:"驾着小舟飘荡在外的人。"},{phrase:"月华",pos:"愿逐月华流照君",explain:"月光。"},{phrase:"摇情",pos:"落月摇情满江树",explain:"激荡情思，使离情摇曳。"}],
      appreciation: "《春江花月夜》是张若虚的代表作，被誉为\"孤篇盖全唐\"的千古绝唱。诗作以春、江、花、月、夜五种意象为线索，描绘了一幅幽美邈远、澄澈空灵的春江月夜图。\n\n艺术特色：全诗共三十六句，每四句一换韵，共换九韵，韵律和谐婉转，缠绵悱恻。诗中\"江畔何人初见月，江月何年初照人\"是对宇宙人生的终极追问，将个体的生命与永恒的江月并置，体现了盛唐时代昂扬开阔的精神气质，被闻一多誉为\"诗中的诗，顶峰上的顶峰\"。\n\n思想情感：诗由景入理，由理入情，从月夜美景写到宇宙哲思，再到人间离愁。\"不知江月待何人\"句则由哲理思考转入对离人相思的描写，思妇与游子的相思被融入月夜景色之中，情景交融，浑然天成。\n\n名句赏析：结尾\"落月摇情满江树\"一句将离情与落月交织，余韵悠长，意味无穷。\"人生代代无穷已，江月年年望相似\"则以豁达的胸襟超越了个体生命的局限，体现了对生命永恒的思考。"
    },
    {
      id:'jingnv', title:'静女', author:'《诗经·邶风》', authorId:'shijing', cat:'gushici',
      audio:'resource/audio/jingnv.aac',
      text:'静女其姝，俟我于城隅。爱而不见，搔首踟蹰。\n静女其娈，贻我彤管。彤管有炜，说怿女美。\n自牧归荑，洵美且异。匪女之为美，美人之贻。',
      translation: "文静的姑娘真美丽，约我在城角相会。故意躲藏看不见，急得我抓耳挠腮徘徊不前。\n文静的姑娘真姣好，送我一支红管笛。红管笛鲜亮有光泽，喜爱你这美丽的容颜。\n从郊野采回白茅芽，确实美丽又奇异。并不是你本身美，只因是美人赠送的。",
