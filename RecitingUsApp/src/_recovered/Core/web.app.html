<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="resource/logomini.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <title>背书哇</title>
  <style>
    :root{
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --bg:#f5f5f7;--fg:#1a1a1a;--card:rgba(255,255,255,0.82);--pri:#0066cc;--pri-fg:#ffffff;
      --muted:rgba(240,240,240,0.85);--muted-fg:#555555;--border:rgba(200,200,200,0.55);
      --orange:#d46600;--sub:#555555;--hover:rgba(230,230,230,0.65);--active:rgba(210,210,210,0.75);
      --div:rgba(220,220,220,0.55);--warn:#e8a000;--side-bg:rgba(247,247,247,0.72);
      --content-bg:rgba(255,255,255,0.58);--player-bg:rgba(247,247,247,0.82);
      --track-bg:#e8e8e8;--overlay:rgba(250,250,250,0.88);
      --hl:#ffea80;--hl-fg:#332200;--shadow:rgba(0,0,0,0.12);
      --glass-tint-light:rgba(255,255,255,0.55);--glass-tint-dark:rgba(30,30,32,0.65);
    }
    body.dark{
      --bg:#0d0d0d;--fg:#f0f0f0;--card:rgba(28,28,30,0.82);--pri:#4da6ff;--pri-fg:#0d0d0d;
      --muted:rgba(45,45,48,0.85);--muted-fg:#b0b0b0;--border:rgba(80,80,80,0.55);
      --orange:#ff9f40;--sub:#a0a0a0;--hover:rgba(50,50,54,0.65);--active:rgba(70,70,74,0.75);
      --div:rgba(60,60,64,0.55);--warn:#c49b18;--side-bg:rgba(20,20,22,0.72);
      --content-bg:rgba(18,18,20,0.62);--player-bg:rgba(20,20,22,0.82);
      --track-bg:#2a2a2a;--overlay:rgba(15,15,15,0.92);
      --hl:#6b5a10;--hl-fg:#ffea80;--shadow:rgba(0,0,0,0.4);
    }
    .art-split:not(.no-split) + .art-appreciation {
      /* 赏析在 artSplit 外部时：分栏模式固定为左列宽度，与原文底部对齐 */
      width: 100%;
      box-sizing: border-box;
      margin-right: auto;
      margin-top: 12px;
      padding: 16px 20px;
      background: var(--card);
    }
    .art-split.no-split + .art-appreciation {
      /* 不分栏（仅原文）：全宽显示 */
      width: 100%;
    }
    
    @font-face{font-family:'LXGW WenKai';src:url('resource/wordtype/Regular.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
    *{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
    /* ===== 图标系统：用 mask + currentColor 引用 resource/icon/*.svg，自动适配明暗主题 ===== */
    .ico{display:inline-block;width:18px;height:18px;flex-shrink:0;background:currentColor;
      -webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
    .ico-search{--ico:url("resource/icon/search.svg")}
    .ico-setting{--ico:url("resource/icon/setting.svg")}
    .ico-sun{--ico:url("resource/icon/sun.svg")}
    .ico-night{--ico:url("resource/icon/night.svg")}
    .ico-enlarge{--ico:url("resource/icon/enlarge.svg")}
    .ico-reduce{--ico:url("resource/icon/reduce.svg")}
    .ico-rw{--ico:url("resource/icon/-5.svg")}
    .ico-ff{--ico:url("resource/icon/+5.svg")}
    .ico-play{--ico:url("resource/icon/play.svg")}
    .ico-pause{--ico:url("resource/icon/pause.svg")}
    .ico-loop{--ico:url("resource/icon/singleloop.svg")}
    .ico-list{--ico:url("resource/icon/listplayback.svg")}
    .ico-tts{--ico:url("resource/icon/TTS.svg")}
    .ico-star{--ico:url("resource/icon/star.svg")}
    .ico-unstar{--ico:url("resource/icon/unstar.svg")}
    html,body{height:100vh}
    body{font-family:'KaiTi','STKaiti','楷体','Noto Serif CJK SC','SimSun','宋体','Songti SC','Microsoft YaHei',serif;height:100vh;overflow:hidden;color:var(--fg);display:flex;flex-direction:column;position:relative;
      background:linear-gradient(135deg,#e8eef5 0%,#f3f3f3 40%,#f5ede0 100%);--wallpaper-url:url('resource/background/background.png')}
    body.dark{background:linear-gradient(135deg,#161616 0%,#1e1e1e 40%,#241e1a 100%)}
    /* 壁纸层：底图 + 毛玻璃遮罩（沿用旧版背景效果） */
    body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:var(--wallpaper-url) center/cover no-repeat;z-index:-2}
    body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:-1;backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8)}
    .wrap{display:flex;flex:1;overflow:hidden}

    /* ===== SIDEBAR ===== */
    .side{width:280px;background:var(--side-bg);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;font-family:'Microsoft YaHei','Segoe UI',sans-serif;transition:width .2s,opacity .2s}
    .side-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .side-head h1{font-size:15px;font-weight:600;color:var(--fg);text-shadow:0 1px 2px rgba(255,255,255,.35)}
    body.dark .side-head h1{text-shadow:0 1px 2px rgba(0,0,0,.35)}
    /* “切换用户”按钮：与侧栏目录按钮（.sbtn）同风格，融入问候语区域 */
    .switch-user-btn{min-height:30px;padding:4px 10px 4px 8px;border:none;border-left:3px solid transparent;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:var(--sub);transition:background .1s,color .1s}
    .switch-user-btn:hover{color:var(--fg)}
    .switch-user-btn:active{background:var(--active)}
    .mode-selector-wrap{position:relative;flex-shrink:0}
    .mode-indicator{height:30px;padding:0 20px 0 12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;font-size:13px;color:var(--fg);display:flex;align-items:center;justify-content:center;position:relative;transition:background .12s,border-color .12s;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236b6b6b' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
    .mode-indicator:hover{background-color:var(--hover);border-color:var(--pri)}
    .mode-indicator:active{background:var(--active)}
    .mode-dot-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--warn);animation:breathe 2s ease-in-out infinite;pointer-events:none}
    .mode-indicator-text{position:relative;z-index:1}
    .mode-selector-menu{position:absolute;top:calc(100% + 4px);right:0;min-width:120px;background:var(--card);border:1px solid var(--border);box-shadow:0 6px 24px var(--shadow);z-index:50;display:none;overflow:hidden}
    .mode-selector-menu.open{display:block;animation:fadeUp .15s ease-out}
    .mode-selector-item{display:block;width:100%;padding:10px 14px;border:none;background:transparent;text-align:left;cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--fg);transition:background .12s}
    .mode-selector-item:hover{background:var(--hover)}
    .mode-selector-item.active{color:var(--pri);font-weight:600;background:rgba(0,120,212,0.06)}
    @keyframes breathe{0%,100%{opacity:.15}50%{opacity:.45}}

    .mode-bar{display:flex;margin:0 16px 4px;border:1px solid var(--border);background:var(--card)}
    .mode-btn{flex:1;height:32px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:var(--sub);transition:background .1s,color .1s}
    .mode-btn:hover{background:var(--hover)}
    .mode-btn.active{background:var(--pri);color:var(--pri-fg)}
    .search-wrap{padding:0 16px 4px;position:relative}
    .search-wrap .ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;color:var(--muted-fg)}
    .search-box{width:100%;height:32px;border:1px solid var(--border);background:var(--card);font-family:inherit;font-size:13px;color:var(--fg);padding:0 10px 0 28px;outline:none}
    .search-box:focus{border-color:var(--pri)}
    .search-box::placeholder{color:var(--muted-fg)}
    .side-div{height:1px;background:var(--border);margin:0 16px}
    .side-nav{flex:1;overflow-y:auto;padding-top:8px}
    .side-nav::-webkit-scrollbar{width:6px}
    .side-nav::-webkit-scrollbar-thumb{background:var(--muted-fg)}
    .sec-label{padding:6px 16px 2px}
    .sec-label span{font-size:12px;color:var(--sub);font-weight:500;letter-spacing:.5px}
    .sbtn{min-height:44px;border:none;background:0 0;cursor:pointer;font-family:inherit;font-size:14px;color:var(--fg);text-align:left;padding:8px 16px;border-left:3px solid transparent;display:flex;align-items:center;gap:8px;width:100%;transition:background .1s,border-color .1s}
    /* ===== Windows 10 UWP Reveal 揭示光照（全部按钮，手电筒探路式）===== */
    /* 常态：低饱和度底色，平缓克制（仅中性按钮；选中/彩色按钮保留自身底色） */
    .sbtn:not(.sel):not(.dynasty-sel):not(.recited),.nav-parent:not(.sel),.nav-child:not(.sel),.switch-user-btn,.mode-select-item,.mode-selector-item,.mode-btn:not(.active){background:rgba(120,130,142,.055)}
    body.dark .sbtn:not(.sel):not(.dynasty-sel):not(.recited),body.dark .nav-parent:not(.sel),body.dark .nav-child:not(.sel),body.dark .switch-user-btn,body.dark .mode-select-item,body.dark .mode-selector-item,body.dark .mode-btn:not(.active){background:rgba(255,255,255,.05)}
    /* 背景光斑：中心始终为指针位置（可在按钮外），随距离靠近渐亮——手电筒探路式 */
    button:not(.study-tab),.author-card{position:relative;overflow:hidden}
    button:not(.study-tab)::before,.author-card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:var(--rv,0);border-radius:inherit;background:radial-gradient(circle 70px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.15),rgba(255,255,255,.05) 45%,transparent 80%)}
    /* 边框高光：光斑经 mask 只显示 1.5px 边缘环，强度明显高于背景——边缘先被照亮 */
    button:not(.study-tab)::after,.author-card::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:var(--rv,0);padding:1.5px;border-radius:inherit;background:radial-gradient(circle 60px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.9),rgba(255,255,255,.28) 45%,transparent 80%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
    .sbtn:active{background:var(--active)}
    /* 目录按钮之间留一点缝隙 */
    .side .sbtn,.side .nav-parent,.side .nav-child{margin-bottom:2px}
    .sbtn.sel{background:linear-gradient(90deg,rgba(0,102,204,.05) 0%,rgba(0,102,204,.12) 50%,rgba(0,102,204,.22) 100%)}
    .nav-parent{min-height:44px;border:none;background:0 0;cursor:pointer;font-family:inherit;font-size:14px;color:var(--fg);text-align:left;padding:8px 16px;border-left:3px solid transparent;display:flex;align-items:center;width:100%;transition:background .1s,border-color .1s}
    .nav-parent:active{background:var(--active)}
    .nav-parent.sel{background:linear-gradient(90deg,rgba(0,102,204,.05) 0%,rgba(0,102,204,.12) 50%,rgba(0,102,204,.22) 100%)}
    .nav-parent.guide{cursor:pointer}
    .nav-arrow{margin-left:auto;font-size:11px;color:var(--muted-fg);transition:transform .2s;flex-shrink:0;padding-left:8px}
    .nav-arrow.open{transform:rotate(90deg)}
    .nav-children{display:none}
    .nav-children.open{display:block}
    .nav-child{min-height:40px;border:none;background:0 0;cursor:pointer;font-family:inherit;font-size:13px;color:var(--sub);text-align:left;padding:6px 16px 6px 40px;border-left:3px solid transparent;display:flex;align-items:center;width:100%;transition:background .1s,border-color .1s}
    .nav-children .nav-child{font-size:14px;color:var(--fg)}
    .nav-child:active{background:var(--active)}
    .nav-child.sel{background:linear-gradient(90deg,rgba(0,102,204,.05) 0%,rgba(0,102,204,.12) 50%,rgba(0,102,204,.22) 100%);color:var(--fg)}
    .more-wrap{border-top:1px solid var(--border);display:flex;align-items:center;padding:6px 8px;gap:4px}
    .more-wrap .sbtn{flex:1;font-size:13px;color:var(--sub);min-height:36px}
    .util-btn{height:36px;min-width:36px;padding:0 8px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:15px;color:var(--fg);display:flex;align-items:center;justify-content:center;transition:background .1s}
    .util-btn:hover{background:var(--hover)}
    .util-btn:active{background:var(--active)}

    /* ===== CONTENT ===== */
    .content{flex:1;overflow-y:auto;background:var(--content-bg);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);position:relative;scroll-behavior:smooth}
    .content::-webkit-scrollbar{width:8px}
    .content::-webkit-scrollbar-track{background:0 0}
    .content::-webkit-scrollbar-thumb{background:#c1c1c1}
    body.dark .content::-webkit-scrollbar-thumb{background:#555}

    .c-inner{padding:48px 24px 40px;display:flex;flex-direction:column;align-items:center;max-width:900px;margin:0 auto}
    .c-inner > *{width:100%}
    .art-split{display:flex;gap:0;width:100%;transition:all .3s ease}
    .art-split.no-split{flex-direction:column}
    .art-split.no-split .art-translation{display:none}
    .art-split.no-split .art-divider{display:none}
    .art-split.no-split .art{width:100%}
    .art-split:not(.no-split){display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row dense;position:relative;transition:none;gap:14px}
    .art-split:not(.no-split)::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);pointer-events:none}
    .art-split:not(.no-split) .art,
    .art-split:not(.no-split) .art-translation,
    .art-split:not(.no-split) .art-body{display:contents}
    .art-split:not(.no-split) .art-divider{display:none}
    .art-split:not(.no-split) .art > .art-head,
    .art-split:not(.no-split) .art > .art-author,
    .art-split:not(.no-split) .art > .art-body > *{grid-column:1}
    .art-split:not(.no-split) .art-translation > .art-head,
    .art-split:not(.no-split) .art-translation > .art-author,
    .art-split:not(.no-split) .art-translation > .art-body > *{grid-column:2}
    /* 分栏模式下按行对照：压缩段落间距，避免一侧高、另一侧留白过大 */
    .art-split:not(.no-split) .art-body > p{margin-bottom:0.3em}
    .art-split:not(.no-split) .art-translation > .art-body > p{margin-bottom:0.3em;padding-left:0}
    .art-split:not(.no-split) .art-translation > .art-body > p.notes-row{font-family:'LXGW WenKai','KaiTi','STKaiti','楷体',serif;line-height:1.7;color:var(--fg)}
    /* 字解模式（散文）：跳过空行后用约一行的段间距替代 */
    .art-split.notes-mode.para-gap .art-body > p{margin-bottom:1.15em}
    .art-split.notes-mode.para-gap .art-body > p:last-child{margin-bottom:0}
    @keyframes transSlide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    .art-divider{width:1px;background:var(--border);flex-shrink:0;align-self:stretch;margin:0 0}
    .art-translation .art-title{font-size:25px;font-weight:700;color:var(--fg);text-align:center}
    .art-translation .art-body{font-family:'LXGW WenKai','KaiTi','STKaiti','楷体',serif;color:var(--fg);line-height:2}
    .art-translation .art-body p{margin-bottom:0.8em;padding-left:20px}
    .art-split:not(.no-split) .art-translation > .art-author{visibility:hidden;pointer-events:none}
    .art-head-btns{position:fixed;top:calc(16px + var(--sat));right:calc(16px + var(--sar));display:flex;gap:6px;z-index:40}
    .head-btn{padding:4px 10px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:12px;color:var(--muted-fg);border-radius:4px;transition:all .15s;white-space:nowrap}
    .head-btn:hover{background:var(--hover)}
    .head-btn.on{color:var(--pri);background:rgba(0,102,204,.10)}
    .head-btn .ico{width:14px;height:14px;margin-right:4px}
    .sbtn.recited{background:linear-gradient(90deg,transparent 0%,transparent 45%,rgba(76,175,80,.22) 100%);color:var(--fg)}
    .sbtn.recited.sel{background:linear-gradient(90deg,rgba(0,102,204,.05) 0%,rgba(0,102,204,.12) 50%,rgba(0,102,204,.22) 100%);font-weight:600}
    .sbtn.dynasty-sel{background:linear-gradient(90deg,rgba(0,102,204,.05) 0%,rgba(0,102,204,.12) 50%,rgba(0,102,204,.22) 100%);color:var(--fg);font-weight:600}
    .art{width:100%}
    .art-head{display:flex;align-items:center;justify-content:center;margin-bottom:8px}
    .art-title{font-size:26px;font-weight:700;color:var(--fg);text-align:center}
    .art-author{font-size:18px;color:var(--fg);margin-bottom:16px;text-align:right}
    .author-tag-btn{display:inline-block;padding:4px 14px;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:999px;cursor:pointer;font-family:'Microsoft YaHei','KaiTi',sans-serif;font-size:18px;transition:background .15s,border-color .15s,transform .05s}
    .author-tag-btn:hover{background:var(--hover)}
    .author-tag-btn:active{transform:translateY(1px)}
    .art-body{font-size:16px;line-height:2;color:var(--fg)}
    .art-body p{margin-bottom:0.8em}
    .art-body mark.hl{background:var(--hl);color:var(--hl-fg);padding:0 2px;cursor:pointer;border-radius:0}
    .art-body mark.hl.cur{outline:2px solid var(--orange);outline-offset:1px}

    /* search hit nav */
    .search-nav{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--border);font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--sub);backdrop-filter:blur(10px)}
    .search-nav button{width:28px;height:28px;border:none;background:var(--card);cursor:pointer;color:var(--fg);display:flex;align-items:center;justify-content:center}
    .search-nav button:hover{background:var(--hover)}

    .fs-ctrl{position:fixed;bottom:68px;right:16px;display:flex;gap:4px;z-index:10}
    .fs-btn{width:36px;height:36px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;color:var(--fg);display:flex;align-items:center;justify-content:center}
    .fs-btn:hover{background:var(--hover)}
    .fs-btn:active{background:var(--active)}

    .author-grid{padding:40px 3vw;display:flex;flex-wrap:wrap;gap:20px;justify-content:flex-start}
    .author-card{width:calc(33.333% - 14px);min-width:240px;background:var(--card);border:1px solid var(--border);cursor:pointer;padding:20px;position:relative;overflow:hidden}
    .author-card-name{font-size:20px;font-weight:700;color:var(--fg);margin-bottom:4px;font-family:'Microsoft YaHei',sans-serif}
    .author-card-dynasty{font-size:13px;color:var(--sub);margin-bottom:12px;font-family:'Microsoft YaHei',sans-serif}
    .author-card-brief{font-size:14px;color:var(--muted-fg);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

    .author-detail{padding:40px 3vw;max-width:900px;margin:0 auto}
    .author-detail-name{font-size:28px;font-weight:700;color:var(--fg);margin-bottom:4px;font-family:'Microsoft YaHei',sans-serif}
    .author-detail-dynasty{font-size:15px;color:var(--sub);margin-bottom:20px;font-family:'Microsoft YaHei',sans-serif}
    .author-detail-bio{font-family:'LXGW WenKai','KaiTi','STKaiti','楷体',serif;font-size:15px;line-height:2;color:var(--fg);margin-bottom:28px}
    .author-detail-bio p{margin-bottom:1em}
    .author-detail-works-title{font-size:16px;font-weight:600;color:var(--fg);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--div);font-family:'Microsoft YaHei',sans-serif}
    .author-work-link{display:inline-block;padding:8px 16px;margin:4px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--fg);transition:background .1s}
    .author-work-link:hover{background:var(--hover)}
    .back-btn{display:inline-block;padding:8px 16px;margin-bottom:20px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--sub);transition:background .1s}
    .back-btn:hover{background:var(--hover)}

    /* ===== STUDY PANEL (译文/注释/赏析) ===== */
    .study-panel{margin-top:32px;border:1px solid var(--border);background:var(--card);font-family:'Microsoft YaHei','KaiTi',sans-serif}
    .study-panel-head{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;color:var(--fg);display:flex;align-items:center;gap:8px}
    .study-panel-head .icon{font-size:16px}
    .study-panel-head .sub{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
    .study-tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.02)}
    .study-tab{flex:1;height:40px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;color:var(--sub);transition:background .12s,color .12s;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
    .study-tab:hover{background:var(--hover);color:var(--fg)}
    .study-tab.active{background:var(--card);color:var(--pri);font-weight:600}
    .study-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--pri)}
    .study-tab .badge{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 6px;background:var(--muted);color:var(--sub);font-size:11px;border-radius:9px;margin-left:4px}
    .study-tab.active .badge{background:var(--pri);color:var(--pri-fg)}
    .study-content{padding:20px 24px;line-height:1.9;font-size:15px;color:var(--fg);max-height:480px;overflow-y:auto;display:none}
    .study-content.active{display:block;animation:fadeUp .2s ease-out}
    .study-content p{margin-bottom:14px;text-indent:2em}
    .study-content p:last-child{margin-bottom:0}
    .study-content-empty{padding:24px;text-align:center;color:var(--sub);font-size:13px}

    /* ===== APPRECIATION 赏析文本框 ===== */
    .art-appreciation{margin-top:24px;padding:20px 24px;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--orange);font-family:'LXGW WenKai','KaiTi','STKaiti','楷体',serif;font-size:15px;line-height:1.6;color:var(--fg);white-space:pre-wrap;display:none}
    .art-appreciation-title{font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px;letter-spacing:1px}

    /* ===== MODE SELECTOR (翻译/字解/仅原文) ===== */
    .mode-select-wrap{position:relative;display:inline-block}
    .mode-select-btn{position:relative;height:30px;padding:0 28px 0 12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--fg);transition:background .12s,border-color .12s;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236b6b6b' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
    .mode-select-btn:hover{background-color:var(--hover)}
    .mode-select-btn.on{color:var(--pri);border-color:var(--pri)}
    /* 用 fixed 定位绕开移动端父容器 overflow 裁剪；坐标由 JS 动态计算 */
    .mode-select-menu{position:fixed;min-width:140px;background:var(--card);border:1px solid var(--border);box-shadow:0 6px 24px var(--shadow);z-index:1000;display:none;overflow:hidden;border-radius:6px}
    .mode-select-menu.open{display:block;animation:fadeUp .15s ease-out}
    .mode-select-item{display:block;width:100%;padding:10px 14px;border:none;background:transparent;text-align:left;cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--fg);transition:background .12s}
    .mode-select-item:hover{background:var(--hover)}
    .mode-select-item.active{color:var(--pri);font-weight:600;background:rgba(0,120,212,0.06)}
    .mode-select-item .desc{display:block;font-size:11px;color:var(--sub);margin-top:2px;font-weight:400}
    .mode-select-item.active .desc{color:var(--pri);opacity:0.8}

    /* ===== NOTES 字解模式：左侧 pos 高亮 + 右侧 explain 列表 ===== */
    .art-body .note-mark{background:linear-gradient(transparent 70%, rgba(232,135,30,0.35) 70%);border-bottom:2px solid var(--orange);padding-bottom:1px;cursor:help;font-weight:500}
    .art-body .note-mark .nm-idx{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;font-size:10px;font-family:'Microsoft YaHei',sans-serif;background:var(--orange);color:#fff;border-radius:0;margin-left:2px;padding:0 4px;vertical-align:super;font-weight:600}
    .notes-list{padding:8px 0}
    .notes-list-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--div)}
    .notes-list-item:last-child{border-bottom:none}
    .notes-list-idx{flex-shrink:0;width:22px;height:22px;line-height:22px;text-align:center;font-size:11px;font-family:'Microsoft YaHei',sans-serif;background:var(--orange);color:#fff;border-radius:0;font-weight:600}
    .notes-list-body{flex:1;min-width:0}
    .notes-list-pos{font-size:14px;color:var(--fg);font-family:'LXGW WenKai','KaiTi',serif;margin-bottom:4px;line-height:1.6}
    .notes-list-explain{font-size:13px;color:var(--sub);line-height:1.7;font-family:'Microsoft YaHei',sans-serif}
    /* 字解模式：右侧按行对齐的字解条目 */
    .notes-row{margin:0;padding:0;min-height:1.5em}
    .notes-row-item{display:block;font-size:inherit;line-height:1.7;color:var(--fg);font-family:'LXGW WenKai','KaiTi','STKaiti','楷体',serif;padding:2px 0}
    .notes-row-idx{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;font-size:10px;font-family:'Microsoft YaHei',sans-serif;background:var(--orange);color:#fff;border-radius:0;margin-right:6px;vertical-align:middle}

    /* 在线查询（兜底 + 对照）*/
    .online-lookup{padding:8px 4px;text-align:center}
    .online-lookup-tip{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.7}
    .online-lookup-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
    .online-lookup-btn{display:inline-block;padding:10px 18px;background:var(--card);border:none;color:var(--pri);text-decoration:none;border-radius:6px;font-size:14px;cursor:pointer;transition:background .15s,color .15s;font-family:'Microsoft YaHei','KaiTi',sans-serif;font-weight:500}
    .online-lookup-btn:hover{background:var(--pri);color:var(--pri-fg)}
    .online-lookup-btn:active{transform:translateY(1px)}
    .online-lookup-hint{font-size:12px;color:var(--sub);margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:4px;border-left:3px solid var(--orange)}
    .note-item{padding:12px 0;border-bottom:1px dashed var(--div)}
    .note-item:last-child{border-bottom:none}
    .note-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
    .note-phrase{display:inline-block;padding:3px 10px;background:var(--pri);color:var(--pri-fg);font-weight:600;font-size:14px;border-radius:2px}
    .note-pos{font-size:12px;color:var(--sub);font-family:'Microsoft YaHei',sans-serif;font-style:italic}
    .note-explain{font-size:14px;color:var(--fg);line-height:1.7}
    @media (max-width:480px){
      .study-tab{font-size:13px;height:38px}
      .study-content{padding:16px;font-size:14px}
      .study-panel-head{padding:12px 16px;font-size:14px}
    }

    /* Example cards (practice mode) */
    .example-view{padding:32px 3vw;max-width:1000px;margin:0 auto}
    .example-title{font-size:22px;font-weight:700;color:var(--fg);margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--div);font-family:'Microsoft YaHei',sans-serif}
    .example-grid{display:flex;flex-wrap:wrap;gap:16px}
    .example-card{width:calc(50% - 8px);min-width:300px;background:var(--card);border:1px solid var(--border);padding:18px 20px;transition:border-color .15s}
    .example-card:hover{background:var(--hover)}
    .example-sentence{font-size:17px;line-height:1.8;color:var(--fg);margin-bottom:10px}
    .example-explain{font-size:13px;color:var(--muted-fg);line-height:1.6;margin-bottom:8px;font-family:'Microsoft YaHei',sans-serif}
    .example-source{font-size:12px;color:var(--pri);cursor:pointer;display:inline-block;font-family:'Microsoft YaHei',sans-serif}
    .example-source:hover{text-decoration:underline}

    .about{padding:40px 3vw;max-width:800px;margin:0 auto}
    .about-card{background:var(--card);border:1px solid var(--border);padding:16px 20px;margin-bottom:12px;font-family:'Microsoft YaHei',sans-serif;backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);box-shadow:0 4px 18px rgba(0,0,0,.08)}
    .about-card h3{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--div);color:var(--fg)}
    .about-row{display:flex;padding:6px 0;font-size:14px}
    .about-label{flex-shrink:0;width:120px;color:var(--sub)}
    .about-value{color:var(--fg)}
    .about-card .kbd{display:inline-block;padding:2px 8px;border:1px solid var(--border);background:var(--bg);font-size:12px;margin:0 2px}
    .wallpaper-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;max-height:240px;overflow-y:auto}
    .wallpaper-thumb{position:relative;width:calc(33.333% - 7px);min-width:120px;aspect-ratio:16/10;border:2px solid transparent;border-radius:4px;overflow:hidden;cursor:pointer;background:var(--bg)}
    .wallpaper-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .wallpaper-thumb.active{border-color:var(--pri)}
    .wallpaper-thumb .wp-del{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer;border-radius:2px}
    .wallpaper-thumb:hover .wp-del{display:flex}
    .wp-empty{color:var(--muted-fg);font-size:13px;padding:8px 0}
    .wp-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
    .wp-tools input[type="number"]{width:70px;height:30px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:0 6px;font-family:inherit}
    .wp-tools label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);cursor:pointer}
    .wp-status{font-size:12px;color:var(--sub);margin-top:8px}

    .placeholder-msg{text-align:center;color:var(--sub);font-size:18px;padding-top:120px;font-family:'Microsoft YaHei',sans-serif}
    .empty-state{text-align:center;color:var(--sub);padding:80px 20px;font-family:'Microsoft YaHei',sans-serif}
    .empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
    .empty-state .title{font-size:18px;margin-bottom:8px;color:var(--fg)}
    .empty-state .desc{font-size:14px;color:var(--muted-fg)}

    /* view transition */
    .view{animation:fadeUp .18s ease-out}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* ===== PLAYER ===== */
    .player{min-height:56px;padding:0 12px var(--sab);gap:4px;flex-shrink:0;z-index:5;background:var(--player-bg);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--border);display:flex;align-items:center}
    .p-btn{min-width:36px;min-height:36px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center;color:var(--fg);font-size:13px;transition:background .1s,opacity .1s}
    .p-btn:hover{background:var(--hover)}
    .p-btn:active{background:var(--active)}
    .p-btn.play{background:var(--pri);color:var(--pri-fg);border-color:var(--pri);min-width:44px;font-size:16px}
    .p-btn.play:hover{background:#006cbd;border-color:#006cbd}
    .p-btn.play:active{background:#005a9e;border-color:#005a9e}
    .p-btn.disabled,.p-track.disabled{opacity:.35;pointer-events:none}
    .p-btn.loop-on{color:var(--orange);border-color:var(--orange)}
    .p-btn.tts-playing{background:#e74c3c;color:#fff;border-color:#e74c3c;animation:ttsPulse 1.5s ease-in-out infinite}
    @keyframes ttsPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(231,76,60,.7)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(231,76,60,0)}}
    .tts-seg{transition:background .3s,color .3s}
    .tts-seg.tts-hl{background:var(--pri);color:var(--pri-fg);padding:2px 4px;border-radius:2px}

    .p-title{font-size:13px;color:var(--sub);white-space:nowrap;margin-right:8px;font-family:'Microsoft YaHei',sans-serif;overflow:hidden;text-overflow:ellipsis;max-width:200px}
    .p-area{display:flex;align-items:center;flex:1;min-width:80px}
    .p-time{font-size:12px;color:var(--sub);white-space:nowrap;font-family:'Microsoft YaHei',sans-serif}
    .p-track{background:var(--track-bg);height:4px;cursor:pointer;flex:1}
    .p-fill{background:var(--orange);height:4px;width:0}
    .hidden{display:none!important}

    /* ===== HAMBURGER & RESPONSIVE ===== */
    .hamburger{display:none;position:fixed;top:calc(10px + var(--sat));left:calc(10px + var(--sal));z-index:60;width:36px;height:36px;border:none;border-radius:10px;background:var(--card);cursor:pointer;font-size:22px;line-height:1;color:var(--fg);align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:0}
    .hamburger:active{transform:scale(.95)}
    .side-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:50}
    @media (max-width:768px){
      /* 手机/平板：左侧边栏默认收起为抽屉，汉堡菜单呼出 */
      .hamburger{display:flex}
      .side{position:fixed;top:var(--sat);left:0;bottom:0;z-index:55;transform:translateX(-100%);transition:transform .25s ease;width:260px;border-radius:0;border-right:1px solid var(--border)}
      .side.open{transform:translateX(0);box-shadow:4px 0 24px var(--shadow)}
      .side-overlay.show{display:block}
      /* 移动端背景不透明，避免玻璃渐变背景透出导致整屏发粉/发紫 */
      .side, .content{background:rgba(255,255,255,.96)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
      body.dark .side, body.dark .content{background:rgba(28,28,30,.96)!important}
      body::before{opacity:.25}
      body.dark body::before{opacity:.15}
      /* 顶部工具栏与汉堡按钮在同一行，适度缩小按钮 */
      .art-head-btns{top:calc(10px + var(--sat));right:calc(10px + var(--sar));left:calc(50px + var(--sal));gap:4px;flex-wrap:wrap;justify-content:flex-end;max-height:calc(100vh - var(--sat) - var(--sab) - 20px);overflow-y:auto}
      .head-btn, .mode-select-btn{padding:5px 8px;font-size:12px}
      .mode-select-menu{right:0;left:auto;min-width:130px}
      .mode-select-item{padding:8px 12px;font-size:13px}
      .fs-ctrl{bottom:calc(60px + var(--sab));right:calc(8px + var(--sar))}
      .fs-btn{width:30px;height:30px;font-size:14px}
      .author-card{width:calc(50% - 10px);min-width:0}
      .author-grid{padding:20px 12px;gap:12px}
      .example-card{width:100%;min-width:0}
      .example-view{padding:20px 12px}
      .c-inner{padding:56px 8px 40px 12px}
      .art-title{font-size:22px}
      .art-translation .art-title{font-size:21px}
      .author-tag-btn{font-size:16px}
      .player{height:48px;padding:0 6px;gap:2px}
      .p-btn{min-width:30px;min-height:30px;font-size:11px}
      .p-btn.play{min-width:36px;font-size:14px}
      .p-title{max-width:80px;font-size:11px}
      .p-time{font-size:10px}
      .p-area{min-width:60px}
      .art-split:not(.no-split){display:flex;flex-direction:column}
      .art-split:not(.no-split)::before{display:none}
      .art-split:not(.no-split) .art,
      .art-split:not(.no-split) .art-translation,
      .art-split:not(.no-split) .art-body{display:block}
      .art-split:not(.no-split) .art{width:100%}
      .art-split:not(.no-split) .art-translation{width:100%}
      .art-divider{width:100%;height:1px}
      .art-translation .art-body p{padding-left:0}
      .art-translation .art-author{display:none}
    }
    @media (max-width:480px){
      .c-inner{padding:40px 8px 36px}
      .art-body{font-size:14px;line-height:1.8}
      .art-title{font-size:20px}
      .art-translation .art-title{font-size:19px}
      .art-author{font-size:16px}
      .author-tag-btn{font-size:16px}
      .author-card{width:100%;min-width:0}
      .author-card-name{font-size:17px}
      .author-grid{padding:16px 8px;gap:10px}
      .author-detail,.about{padding:20px 12px}
      .author-detail-name{font-size:22px}
      .about-card{padding:12px 14px}
      .example-view{padding:16px 8px}
      .example-title{font-size:18px}
      .search-nav{padding:4px 8px;font-size:11px}
      .player{height:44px;padding:0 4px;gap:1px}
      .p-btn{min-width:28px;min-height:28px;font-size:10px}
      .p-btn.play{min-width:32px;font-size:13px}
      .p-title{max-width:60px;font-size:10px}
      .p-time{font-size:9px}
      .p-area{min-width:40px}
      .fs-ctrl{bottom:calc(54px + var(--sab));right:calc(4px + var(--sar))}
      .fs-btn{width:28px;height:28px;font-size:14px}
      /* 小屏隐藏次要工具按钮，避免挤压 */
      #shortcutBtn{display:none}
    }

    /* exercise mode */
    .exercise-area{padding:24px 3vw;max-width:800px;margin:0 auto}
    .exercise-title{font-size:20px;font-weight:700;color:var(--fg);margin-bottom:20px;font-family:'Microsoft YaHei',sans-serif}
    .exercise-question{font-size:17px;line-height:2;color:var(--fg);margin-bottom:16px;padding:16px;background:var(--card);border:1px solid var(--border)}
    .exercise-blank{display:inline-block;min-width:60px;border:none;border-bottom:2px solid var(--pri);background:transparent;font-family:inherit;font-size:inherit;color:var(--fg);text-align:center;outline:none;padding:2px 8px;margin:0 4px}
    .exercise-blank:focus{border-bottom-color:var(--orange)}
    .exercise-blank.correct{border-bottom-color:#4caf50;color:#4caf50}
    .exercise-blank.wrong{border-bottom-color:#f44336;color:#f44336}
    .exercise-submit{margin-top:16px;padding:10px 24px;border:none;background:var(--pri);color:var(--pri-fg);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:14px}
    .exercise-submit:hover{opacity:.9}
    .exercise-btn{margin-top:16px;margin-left:8px;padding:10px 20px;border:none;background:var(--card);color:var(--fg);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:14px;transition:background .15s}
    .exercise-btn:hover{background:var(--hover)}
    .exercise-btn.warn{color:var(--orange)}
    .exercise-btn.warn:hover{background:rgba(255,150,0,.08)}
    .exercise-summary{margin-top:20px;padding:20px;background:var(--card);border:1px solid var(--border);font-family:'Microsoft YaHei',sans-serif}
    .exercise-summary h4{font-size:16px;color:var(--fg);margin-bottom:12px;font-weight:600}
    .exercise-summary .summary-row{padding:8px 12px;margin-bottom:4px;border-left:3px solid var(--border);font-size:13px;color:var(--fg);background:var(--bg)}
    .exercise-summary .summary-row.correct{border-left-color:#4caf50}
    .exercise-summary .summary-row.wrong{border-left-color:#f44336}
    .exercise-summary .summary-row .q{color:var(--sub);font-size:12px;margin-bottom:2px}
    .exercise-summary .summary-row .a{color:var(--fg)}
    .exercise-summary .summary-row .a .ua{color:#f44336;text-decoration:line-through;margin-right:6px}
    .exercise-summary .summary-row .a .ca{color:#4caf50}
    .exercise-options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
    .exercise-option{padding:12px 16px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:15px;color:var(--fg);text-align:left;transition:background .15s}
    .exercise-option:hover{background:var(--hover)}
    .exercise-option.selected{background:var(--active)}
    .exercise-option.correct{background:rgba(76,175,80,.1)}
    .exercise-option.wrong{background:rgba(244,67,54,.1)}
    .exercise-result{margin-top:16px;padding:12px 16px;font-family:'Microsoft YaHei',sans-serif;font-size:14px}
    .exercise-result.correct{background:rgba(76,175,80,.1);color:#4caf50;border:1px solid #4caf50}
    .exercise-result.wrong{background:rgba(244,67,54,.1);color:#f44336;border:1px solid #f44336}
    .exercise-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .exercise-nav button{padding:8px 16px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--fg)}
    .exercise-nav button:hover{background:var(--hover)}
    .exercise-nav button.active{background:var(--pri);color:var(--pri-fg)}
    /* feihua (飞花令) */
    .feihua-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 4px}
    .feihua-char-box{display:flex;flex-direction:column;align-items:center;margin:6px 0 2px}
    .feihua-char{font-size:64px;font-weight:700;color:var(--pri);line-height:1;font-family:'KaiTi','STKaiti','楷体',serif;text-shadow:0 2px 8px rgba(0,0,0,.08)}
    .feihua-char-label{font-size:13px;color:var(--sub);font-family:'Microsoft YaHei',sans-serif;margin-top:6px}
    .feihua-timer{width:100%;max-width:420px;height:8px;background:var(--track-bg);border-radius:4px;overflow:hidden}
    .feihua-timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#ff9800,#e74c3c);transition:width 1s linear}
    .feihua-meta{display:flex;gap:18px;font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--sub)}
    .feihua-meta b{color:var(--fg);font-size:16px}
    .feihua-input{width:100%;max-width:520px;height:46px;border:2px solid var(--pri);background:var(--card);color:var(--fg);font-family:'KaiTi','STKaiti','楷体',serif;font-size:20px;padding:0 14px;outline:none;text-align:center}
    .feihua-input:focus{border-color:var(--orange)}
    .feihua-input:disabled{opacity:.7}
    .feihua-examples{width:100%;max-width:560px;margin-top:6px;font-family:'Microsoft YaHei',sans-serif}
    .feihua-examples .fe-title{font-size:12px;color:var(--sub);margin-bottom:6px}
    .feihua-examples .fe-item{padding:8px 12px;margin-bottom:6px;background:var(--card);border:1px solid var(--border);font-family:'KaiTi','STKaiti','楷体',serif;font-size:16px;color:var(--fg);line-height:1.8}
    .feihua-examples .fe-item .fe-from{font-family:'Microsoft YaHei',sans-serif;font-size:11px;color:var(--sub);margin-left:6px}
    .feihua-summary{text-align:center;font-family:'Microsoft YaHei',sans-serif}
    .feihua-summary .big{font-size:40px;font-weight:700;color:var(--pri);margin:8px 0}
    .feihua-summary .row{font-size:14px;color:var(--sub);margin:4px 0}
    .wrongbook-item{padding:12px 16px;margin-bottom:8px;background:var(--card);border:1px solid var(--border);font-family:'Microsoft YaHei',sans-serif}
    .wrongbook-item .question{font-size:15px;color:var(--fg);margin-bottom:4px}
    .wrongbook-item .answer{font-size:13px;color:var(--sub)}
    .wrongbook-item .correct-answer{font-size:13px;color:#4caf50}
    .wrongbook-item .retry-btn{display:inline-block;margin-top:8px;padding:4px 12px;border:none;color:var(--pri);cursor:pointer;font-size:12px;background:transparent}
    .stats-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .stats-card{flex:1;min-width:120px;padding:16px;background:var(--card);border:1px solid var(--border);text-align:center;font-family:'Microsoft YaHei',sans-serif}
    .stats-card .number{font-size:28px;font-weight:700;color:var(--pri)}
    .stats-card .label{font-size:12px;color:var(--sub);margin-top:4px}
    @media (max-width:768px){
      .exercise-question{font-size:15px;padding:12px}
      .exercise-option{font-size:13px;padding:10px 12px}
      .stats-grid{gap:8px}
      .stats-card{padding:12px;min-width:80px}
      .stats-card .number{font-size:22px}
    }
    @media (max-width:480px){
      .exercise-question{font-size:14px;padding:10px}
      .exercise-blank{min-width:40px;font-size:14px}
      .exercise-option{font-size:12px;padding:8px 10px}
      .stats-card{min-width:60px;padding:10px}
      .stats-card .number{font-size:18px}
    }

    /* flashcard mode */
    .flashcard-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 3vw;max-width:700px;margin:0 auto}
    .flashcard-counter{font-family:'Microsoft YaHei',sans-serif;font-size:14px;color:var(--sub);margin-bottom:16px}
    .flashcard{perspective:1000px;width:100%;max-width:600px;height:280px;cursor:pointer;margin-bottom:24px}
    .flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s ease;transform-style:preserve-3d}
    .flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
    .flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:32px;font-size:19px;line-height:1.8;background:var(--card);border:1px solid var(--border);text-align:center;overflow-y:auto}
    .flashcard-back{transform:rotateY(180deg)}
    .flashcard-hint{font-family:'Microsoft YaHei',sans-serif;font-size:11px;color:var(--muted-fg);position:absolute;top:12px;left:16px}
    .flashcard-actions{display:flex;gap:16px;margin-top:8px}
    .flashcard-btn{height:44px;padding:0 24px;border:none;background:var(--card);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:14px;color:var(--fg);display:flex;align-items:center;gap:8px;transition:background .15s}
    .flashcard-btn:hover{background:var(--hover)}
    .flashcard-btn.forgot{color:#f44336}
    .flashcard-btn.forgot:hover{background:rgba(244,67,54,.1)}
    .flashcard-btn.remember{color:#4caf50}
    .flashcard-btn.remember:hover{background:rgba(76,175,80,.1)}
    .flashcard-done{text-align:center;padding:60px 20px;font-family:'Microsoft YaHei',sans-serif}
    .flashcard-done .icon{font-size:48px;margin-bottom:16px}
    .flashcard-done .title{font-size:20px;color:var(--fg);margin-bottom:8px}
    .flashcard-done .sub{font-size:14px;color:var(--sub)}
    @media (max-width:480px){
      .flashcard{height:220px}
      .flashcard-front,.flashcard-back{font-size:16px;padding:20px}
      .flashcard-btn{height:40px;padding:0 16px;font-size:13px}
    }

    /* ===== TOAST ===== 自动消失提示现统一复用右上角 notice-rail，不再单独居中显示 ===== */

    /* ===== 右上角持久通知「辐条」 ===== */
    .notice-rail{position:fixed;top:56px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-height:62vh;overflow-y:auto;pointer-events:none}
    .notice-item{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:320px;padding:10px 8px 10px 14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--pri);border-radius:10px;box-shadow:0 8px 28px var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:'Microsoft YaHei',sans-serif;font-size:13px;color:var(--fg);animation:noticeIn .28s cubic-bezier(.21,1.02,.73,1) both}
    .notice-item.success{border-left-color:#4caf50}
    .notice-item.info{border-left-color:var(--pri)}
    .notice-item.warn{border-left-color:var(--orange)}
    .notice-item.error{border-left-color:#f44336}
    .notice-item .notice-text{flex:1;min-width:0;line-height:1.5;color:inherit}
    .notice-item.success .notice-text{color:#4caf50}
    .notice-item.info .notice-text{color:var(--pri)}
    .notice-item.warn .notice-text{color:var(--orange)}
    .notice-item.error .notice-text{color:#f44336}
    .notice-item .notice-close{flex-shrink:0;width:22px;height:22px;border:none;background:transparent;color:var(--sub);cursor:pointer;font-size:15px;line-height:1;border-radius:5px;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
    .notice-item .notice-close:hover{background:var(--hover);color:var(--fg)}
    .notice-clear-all{pointer-events:auto;align-self:flex-end;margin-top:2px;padding:4px 10px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:12px;border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .notice-clear-all:hover{background:var(--hover);color:var(--fg)}
    @keyframes noticeIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}

    /* ===== 错误警告：屏幕中央大提示（Windows 11 低电量提醒风格），不自动熄灭，需手动关闭 ===== */
    .error-alert-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:errFade .18s ease-out}
    .error-alert{position:relative;display:flex;align-items:flex-start;gap:16px;max-width:440px;width:100%;padding:24px 26px 24px 22px;background:var(--card);border:1px solid var(--border);border-left:6px solid #f44336;box-shadow:0 20px 60px var(--shadow);font-family:'Microsoft YaHei',sans-serif;animation:noticeIn .25s ease-out}
    .error-alert-icon{flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#f44336;color:#fff;font-size:22px;font-weight:700;line-height:1}
    .error-alert-body{flex:1;min-width:0}
    .error-alert-title{font-size:16px;font-weight:700;color:#f44336;margin-bottom:8px}
    .error-alert-msg{font-size:14px;line-height:1.7;color:var(--fg);white-space:pre-wrap;word-break:break-word}
    .error-alert-close{position:absolute;top:10px;right:12px;width:26px;height:26px;border:none;background:transparent;color:var(--sub);cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
    .error-alert-close:hover{background:var(--hover);color:var(--fg)}
    @keyframes errFade{from{opacity:0}to{opacity:1}}

    /* ===== WORD MODE (百词斩风格) ===== */
    .mode-btn.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
    #viewWordGame{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:32px 3vw}
    .word-game{width:100%;max-width:640px;background:var(--card);border:1px solid var(--border);padding:32px;display:flex;flex-direction:column;align-items:center;animation:fadeUp .2s ease-out}
    .word-game-progress{font-size:13px;color:var(--sub);margin-bottom:16px;font-family:'Microsoft YaHei',sans-serif}
    .word-game-word{font-size:56px;font-weight:700;color:var(--pri);margin-bottom:12px;line-height:1.2}
    .word-game-question{font-size:18px;color:var(--fg);margin-bottom:24px;text-align:center;font-family:'Microsoft YaHei',sans-serif;line-height:1.6}
    .word-game-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
    .word-game-option{padding:14px 12px;border:none;background:var(--bg);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:15px;color:var(--fg);text-align:center;transition:background .15s}
    .word-game-option:hover{background:var(--hover)}
    .word-game-option.correct{background:rgba(76,175,80,.12);color:#4caf50}
    .word-game-option.wrong{background:rgba(244,67,54,.12);color:#f44336}
    .word-game-option.disabled{pointer-events:none}
    .word-game-feedback{display:none;width:100%;margin-top:16px;padding:12px 16px;background:var(--bg);border-left:3px solid var(--pri);font-family:'Microsoft YaHei',sans-serif;font-size:14px;color:var(--fg);line-height:1.6}
    .word-game-feedback.show{display:block}
    .word-game-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
    .word-game-btn{padding:10px 24px;border:none;background:var(--pri);color:var(--pri-fg);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:14px;transition:opacity .15s}
    .word-game-btn:hover{opacity:.9}
    .word-game-btn.secondary{background:var(--card);color:var(--fg)}
    .word-game-btn.secondary:hover{background:var(--hover)}
    .word-game-btn:disabled{opacity:.5;cursor:not-allowed}
    .word-game-result{text-align:center;padding:40px 20px}
    .word-game-result .score{font-size:48px;font-weight:700;color:var(--pri);margin-bottom:8px}
    .word-game-result .desc{font-size:16px;color:var(--fg);margin-bottom:24px;font-family:'Microsoft YaHei',sans-serif}
    .word-game-start{text-align:center;padding:40px 20px}
    .word-game-start .title{font-size:22px;font-weight:700;color:var(--fg);margin-bottom:12px;font-family:'Microsoft YaHei',sans-serif}
    .word-game-start .desc{font-size:14px;color:var(--sub);margin-bottom:24px;line-height:1.6}
    @media (max-width:768px){
      .word-game-word{font-size:44px}
      .word-game-options{grid-template-columns:1fr}
      .word-game{padding:24px}
    }

    /* ===== WORD CARD (虚词卡片) ===== */
    .word-card{width:100%;max-width:800px;background:var(--card);border:1px solid var(--border);padding:32px;display:grid;grid-template-columns:auto 1fr;gap:32px;animation:fadeUp .2s ease-out;position:relative}
    .word-card-left{display:flex;flex-direction:column;align-items:flex-start}
    .word-card-left .word-game-word{font-size:80px;color:var(--pri);margin-bottom:8px}
    .word-card-right{display:flex;flex-direction:column;gap:12px}
    .word-card-meaning{padding:12px 16px;background:var(--bg);border-left:3px solid var(--pri);border-radius:2px}
    .word-card-meaning-text{font-size:16px;font-weight:600;color:var(--fg);margin-bottom:6px;font-family:'Microsoft YaHei',sans-serif}
    .word-card-example{font-size:14px;color:var(--sub);line-height:1.8;font-family:'LXGW WenKai','KaiTi',serif}
    .word-card-example em{color:var(--pri);font-style:normal;font-weight:600}
    .word-card-footer{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:8px}
    .word-card-btn{padding:10px 24px;border:none;background:var(--pri);color:var(--pri-fg);cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-size:14px;transition:opacity .15s}
    .word-card-btn:hover{opacity:.9}
    @media (max-width:768px){
      .word-card{grid-template-columns:1fr;gap:20px;padding:24px}
      .word-card-left .word-game-word{font-size:56px}
    }

    /* ===== LIQUID GLASS(照抄 liquid-glass-react 视觉管线) ===== */
    .lg-pos{position:relative}
    .lg-root{isolation:isolate;border-radius:var(--lg-radius,0)!important;transition:transform .2s ease-out;box-shadow:0 8px 32px rgba(0,0,0,.12)}
    body.dark .lg-root{box-shadow:0 8px 32px rgba(0,0,0,.35)}
    .lg-svg{position:absolute!important;width:0!important;height:0!important;pointer-events:none}
    .lg-warp{position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:var(--lg-tint,rgba(255,255,255,.55))}
    body.dark .lg-warp{background:var(--lg-tint-dark,rgba(28,28,30,.72))}
    .lg-border{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;padding:1.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;box-shadow:0 0 0 .5px rgba(255,255,255,.5) inset,0 1px 3px rgba(255,255,255,.25) inset,0 1px 4px rgba(0,0,0,.35)}
    .lg-border.screen{mix-blend-mode:screen;opacity:.2}
    .lg-border.overlay{mix-blend-mode:overlay}
    .lg-glow{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .2s ease-out;mix-blend-mode:overlay;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 60%)}
    .lg-root.lg-clickable:hover .lg-glow{opacity:.35}
    /* 大面板使用液态玻璃时保留玻璃质感同时确保文字可读：仅移除原生 backdrop-filter，保留背景供 lg-warp 叠加强化 */
    #side.lg-root,footer.player.lg-root{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    /* 小元素（toast、下拉菜单、关于卡片）保持纯透明，依靠 lg-warp */
    .mode-selector-menu.lg-root,.toast.lg-root,.about-card.lg-root{background:transparent!important}
    /* dash 卡片等面板：默认半透明白底，lg-root 加持后由 lg-warp 增强玻璃感 */
    .dash-card,.author-card,.example-card,.word-game,.word-card,.flashcard,.study-panel,.art-appreciation{background:var(--card);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);box-shadow:0 4px 18px rgba(0,0,0,.08)}
    body.dark .dash-card,body.dark .author-card,body.dark .example-card,body.dark .word-game,body.dark .word-card,body.dark .flashcard,body.dark .study-panel,body.dark .art-appreciation{box-shadow:0 4px 18px rgba(0,0,0,.25)}
    .dash-card.lg-root,.author-card.lg-root,.example-card.lg-root,.word-game.lg-root,.word-card.lg-root,.flashcard.lg-root,.study-panel.lg-root,.art-appreciation.lg-root{background:transparent!important}
    /* 文章正文玻璃质感：纯 CSS backdrop-filter，不依赖 SVG 滤镜 */
    .glass-article{background:rgba(255,255,255,.03);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:20px;border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.06),0 1px 3px rgba(255,255,255,.1) inset;padding:24px 32px;margin:0 auto;position:relative;overflow:hidden}
    .glass-article::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.05) 50%,rgba(255,255,255,.15) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:1}
    body.dark .glass-article{background:rgba(20,20,22,.03);border-color:rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.2),0 1px 3px rgba(255,255,255,.05) inset}
    .art-split:not(.no-split).glass-article{padding:20px 24px}

    /* 今日仪表盘样式已随 Home 模式一并移除 */

    /* ===== 链式背诵(V2.1 §1.1 渐进消隐) ===== */
    .chain-wrap{font-family:'Microsoft YaHei',sans-serif}
    .chain-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--border);background:var(--card);margin-bottom:14px}
    .chain-toolbar .chain-level{font-size:14px;font-weight:600;color:var(--fg)}
    .chain-toolbar .chain-level-tag{font-size:12px;color:var(--sub)}
    .chain-toolbar .spacer{flex:1}
    .chain-sent{padding:12px 16px;border:1px solid var(--border);background:var(--card);margin-bottom:10px;line-height:2}
    .chain-sent .chain-text{font-family:'KaiTi','STKaiti','楷体',serif;font-size:19px;color:var(--fg)}
    .chain-sent .chain-text .dim{opacity:.32}
    .chain-sent .chain-text .ghost{opacity:.18}
    .chain-sent .chain-text .first-char{color:var(--pri);font-weight:700}
    .chain-sent .chain-ops{display:flex;gap:8px;margin-top:8px}
    .chain-sent.ok-stuck{border-color:var(--warn)}
    .chain-btn{padding:5px 12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;font-size:12px;color:var(--fg);transition:background .12s}
    .chain-btn:hover{background:var(--hover)}
    .chain-btn.primary{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
    .chain-btn.warn{color:var(--orange)}
    .chain-btn:disabled{opacity:.4;cursor:not-allowed}
    .chain-progress{font-size:12px;color:var(--sub)}

    /* ===== 复习卡片(SRS-lite,方案 V2 §4) ===== */
    .review-stage{max-width:560px;margin:0 auto;font-family:'Microsoft YaHei',sans-serif}
    .review-meta{font-size:12px;color:var(--sub);margin-bottom:10px}
    .review-card{border:1px solid var(--border);background:var(--card);padding:32px 24px;text-align:center}
    .review-card .review-from{font-size:12px;color:var(--sub);margin-bottom:14px}
    .review-card .review-front{font-family:'KaiTi','STKaiti','楷体',serif;font-size:22px;color:var(--fg);line-height:1.9;letter-spacing:2px}
    .review-card .review-back{font-family:'KaiTi','STKaiti','楷体',serif;font-size:20px;color:var(--fg);line-height:2;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
    .review-actions{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .review-grade{padding:8px 16px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;font-size:13px;color:var(--fg);transition:background .12s}
    .review-grade:hover{background:var(--hover)}
    .review-grade.g0{border-color:#e57373;color:#e57373}
    .review-grade.g3{border-color:#81c784;color:#81c784}

    @media print{

    {

      audio:'resource/audio/lunyu.aac',
      text:'子曰："学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？"(《学而》)\n\n有子曰："其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！"(《学而》)\n\n子曰："君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。"(《学而》)\n\n子曰："人而不仁，如礼何？人而不仁，如乐何？"(《八佾》)\n\n子曰："朝闻道，夕死可矣。"(《里仁》)\n\n子曰："君子喻于义，小人喻于利。"(《里仁》)\n\n子曰："见贤思齐焉，见不贤而内自省也。"(《里仁》)\n\n子曰："质胜文则野，文胜质则史。文质彬彬，然后君子。"(《雍也》)\n\n曾子曰："士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？"(《泰伯》)\n\n子曰："譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。"(《子罕》)\n\n子曰："知者不惑，仁者不忧，勇者不惧。"(《子罕》)\n\n颜渊问仁。子曰："克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？"颜渊曰："请问其目。"子曰："非礼勿视，非礼勿听，非礼勿言，非礼勿动。"颜渊曰："回虽不敏，请事斯语矣。"(《颜渊》)\n\n子贡问曰："有一言而可以终身行之者乎？"子曰："其恕乎！己所不欲，勿施于人。"(《卫灵公》)\n\n子曰："小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君。多识于鸟兽草木之名。"(《阳货》)',
      translation: "孔子说：\"学习并按时复习，不也很愉快吗？有朋友从远方来，不也很高兴吗？别人不了解我，我却不生气，不也是有德之人吗？\"\n\n有子说：\"为人孝顺父母尊敬兄长，却喜好触犯上级，这种人很少；不喜好触犯上级，却喜好作乱，这种人从来没有过。君子专心致力于根本，根本树立了，道理便由此发生。孝顺父母、尊敬兄长，这就是'仁'的根本吧！\"\n\n孔子说：\"君子吃饭不追求过饱，居住不追求过分舒适，做事敏捷而说话谨慎，亲近有德之人来匡正自己，这样可以说是好学了。\"\n\n孔子说：\"一个人如果不仁义，礼还有什么用？一个人如果不仁义，乐还有什么用？\"\n\n孔子说：\"早上懂得了真理，就算晚上死去也值得。\"\n\n孔子说：\"君子懂得大义，小人只懂得小利。\"\n\n孔子说：\"见到德才兼备的人就想着向他看齐，见到不贤的人就反省自己。\"\n\n孔子说：\"质朴多于文采就粗野，文采多于质朴就浮夸。文采和质朴兼备，然后才能成为君子。\"\n\n曾子说：\"读书人不可以不刚强而有毅力，因为他责任重大而道路遥远。以实现仁德作为自己的责任，难道不重大吗？奋斗到死才停止，难道不遥远吗？\"\n\n孔子说：\"譬如堆土成山，只差一筐土就完成了，这时停下来，是我自己停下来的；譬如填平土地，虽然只倒了一筐土，这时继续前进，也是我自己要前进的。\"\n\n孔子说：\"聪明人不会迷惑，有仁德的人不会忧愁，勇敢的人不会畏惧。\"\n\n颜渊问什么是仁。孔子说：\"约束自己使言行合乎礼就是仁。一旦做到约束自己使言行合乎礼，天下人都会归向你。实行仁德全靠自己，难道靠别人吗？\"颜渊说：\"请问具体怎么做。\"孔子说：\"不合礼的事不看，不合礼的事不听，不合礼的事不说，不合礼的事不做。\"颜渊说：\"我虽然不聪敏，请让我照这些话去做。\"\n\n子贡问道：\"有没有一句话可以终身奉行的呢？\"孔子说：\"那大概是『恕』吧！自己不愿意的，不要强加给别人。\"\n\n孔子说：\"年轻人何不学《诗》呢？《诗》可以激发情志，可以观察社会，可以结交朋友，可以抒发怨愤。近可以用来侍奉父母，远可以用来事奉君上。还可以多认识一些鸟兽草木的名字。\"",

      appreciation: "《论语》是儒家学派的经典著作之一，记录了孔子及其弟子言行，集中体现了孔子的政治主张、伦理思想、道德观念及教育原则等。\n\n学习方法上：强调\"好学\"——不求物质享受，敏事慎言，向有德之人看齐。\n\n修身做人上：提出\"君子\"标准——质朴与文采兼备、见贤思齐、内自省、克制私欲。\n\n处世态度上：倡导\"恕道\"——\"己所不欲，勿施于人\"，成为儒家处理人际关系的基本准则。\n\n语言上：言简意赅，富于哲理，许多语句已成为成语沿用至今。",

      id:'quanxue', title:'劝学', author:'荀子', authorId:'xunzi', cat:'wenyanwen',
      audio:'resource/audio/quanxue.aac',
      text:'君子曰：学不可以已。\n\n青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，𫐓使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。\n\n吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。\n\n积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。',
      translation: "君子说：学习是不可以停止的。\n\n靛青是从蓝草里提取出来的，可是比蓝草的颜色更深；冰是水凝结成的，却比水更冷。一块木材直得合乎墨线，但用火烤使它弯曲做成车轮，它的弯度就合乎圆规了。即使再晒干，也不会再挺直，这是因为火烤使它弯曲的。所以木材经过墨线量过就直了，金属刀剑在磨石上磨过就锋利了，君子广泛地学习并且每天对自己反省检查，就能智慧明达而行为没有过错了。\n\n我曾经整天思索，却不如片刻学习所得；我曾经踮起脚跟远望，却不如登到高处看得广阔。登到高处招手，手臂并没有加长，可是远处的人能看见；顺着风呼喊，声音并没有加大，可是听的人听得很清楚。借助车马的人，并不是脚走得快，却能到达千里之外；借助船只的人，并不是会游泳，却能横渡江河。君子的本性跟一般人没什么不同，只是善于借助外物罢了。\n\n堆积土石成了高山，风雨就从这里兴起；汇积水流成为深渊，蛟龙就从这里产生；积累善行养成高尚的品德，智慧和圣心就自然具备了。所以不积累每一小步，就不能到达千里之外；不汇集细流，就不能形成江海。千里马一跃，不能超过十步；劣马走十天，成功的秘诀在于走个不停。雕刻一下就停手，腐朽的木头也刻不断；不停地刻下去，金石也能雕刻成功。蚯蚓没有锋利的爪牙、强壮的筋骨，却能上吃泥土，下饮泉水，是因为它用心专一。螃蟹有六条腿、两只大螯，但如果没有蛇鳝的洞穴它就无处栖身，是因为它用心浮躁。",
      notes: [{phrase:"青，取之于蓝",pos:"青，取之于蓝",explain:"靛青，从蓝草中提取。比喻学生胜过老师或后人胜过前人。"},{phrase:"𫐓",pos:"𫐓以为轮",explain:"𫐓（róu），通「揉」，使木弯曲的工艺。"},{phrase:"槁暴",pos:"虽有槁暴",explain:"槁，枯；暴（pù），晒。枯干。"},{phrase:"参省",pos:"日参省乎己",explain:"参，检验；省（xǐng），反省。"},{phrase:"须臾",pos:"须臾之所学",explain:"片刻、一会儿。"},{phrase:"跂",pos:"吾尝跂而望矣",explain:"跂（qǐ），踮起脚跟。"},{phrase:"假",pos:"善假于物",explain:"假，借助、利用。"},{phrase:"驽马十驾",pos:"驽马十驾",explain:"驽马，劣马；十驾，套十天的车。"},{phrase:"锲而不舍",pos:"锲而不舍",explain:"锲（qiè），刻。比喻坚持不懈。"},{phrase:"蚓无爪牙之利",pos:"蚓无爪牙之利，筋骨之强",explain:"定语后置：即「无利爪牙、强筋骨」。"}],
      appreciation: "《劝学》是《荀子》的首篇，文章系统论述了学习的目的、态度、方法及内容，是先秦儒家教育思想的重要文献。\n\n论证特点：通篇设喻，将抽象道理寓于具体形象之中。比喻多达二十余种，正面设喻（青取之于蓝）、反面设喻（锲而舍之）、连续设喻（登高、顺风、假舆马、假舟楫），使文章说理透辟，形象生动。\n\n思想内涵：核心观点是\"学不可以已\"，强调学习要\"善假于物\"——借助外物弥补先天不足；\"锲而不舍\"——持之以恒方能成功；\"用心专一\"——专注是学习的根本保证。\n\n现实意义：至今对学习仍有重要指导意义，特别是\"不积跬步，无以至千里\"成为千古流传的治学格言。",







    },
    {
      id:'quyuanliezhuan', title:'屈原列传（节选）', author:'司马迁', authorId:'simaqian', cat:'wenyanwen',
      audio:'resource/audio/quyuanliezhuan.aac',
      text:'屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。"离骚"者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。',
      translation: "屈原痛心怀王听信不聪（不能明辨是非），说人坏话、奉承献媚的小人蒙蔽了君王的明见，邪恶的小人危害了公正的人，端方正直的人不被君王所容，所以忧愁苦闷深思苦虑，写下了《离骚》。\"离骚\"，就是遭遇忧患的意思。天是人类的原始，父母是人生的根本。人处境困难时总要追念本源，所以人在劳苦疲倦到极点时，没有不呼天喊地的；在疾病痛苦内心悲伤时，没有不呼唤父母的。屈原坚持正道，循直而行，竭尽忠信和智慧来侍奉他的君主，谗人离间他，可以说处境困难了。诚信却被怀疑，忠贞却被诽谤，能没有怨愤吗？屈原写《离骚》，大概是由怨愤引起的。《国风》好写男女之情但不越礼，《小雅》怨恨讥刺朝政但不倡乱。像《离骚》这样的作品，可以说兼而有之了。它远称帝喾，近述齐桓公，中古称述商汤、周武王，以此来讥刺当时政事。阐明道德的广大崇高，国家治乱的条理系统，没有不完全展现出来的。他的文章简约，他的言辞含蓄，他的志趣高洁，他的行为廉正。文辞虽说的琐细事物，但旨意极大；所举的事例虽近，但表达的意义深远。他的志趣高洁，所以作品所述事物芬芳；他的行为廉正，所以至死也不为世俗所容。他自动地远离浊泥污泥，像蝉蜕壳那样摆脱污秽，超脱于尘埃之外，不沾染世俗的污垢，是个洁白纯真出淤泥而不染的人。推究这种志趣，即使同日月争光也是可以的。",
      notes: [{phrase:"疾",pos:"屈平疾王听之不聪也",explain:"痛心。"},{phrase:"谗谄",pos:"谗谄之蔽明也",explain:"说人坏话、奉承献媚的小人。"},{phrase:"方正",pos:"方正之不容也",explain:"端方正直的人。"},{phrase:"离忧",pos:"离骚者，犹离忧也",explain:"遭遇忧患。"},{phrase:"反本",pos:"人穷则反本",explain:"追念本源。反同「返」。"},{phrase:"惨怛",pos:"疾痛惨怛",explain:"内心悲痛。怛（dá）。"},{phrase:"间",pos:"谗人间之",explain:"离间。"},{phrase:"见",pos:"信而见疑",explain:"表被动，被。"},{phrase:"靡不毕见",pos:"靡不毕见",explain:"没有不完全展现出来。见（xiàn）同「现」。"},{phrase:"指",pos:"其称文小而其指极大",explain:"同「旨」，旨意。"},{phrase:"濯淖",pos:"自疏濯淖污泥之中",explain:"污泥。濯（zhuó）淖（nào）。"},{phrase:"蝉蜕",pos:"蝉蜕于浊秽",explain:"比喻解脱。蜕（tuì）。"},{phrase:"皭然泥而不滓",pos:"皭然泥而不滓者也",explain:"洁白的样子，出淤泥而不染。皭（jiào）。"}],
      appreciation: "本文节选自《史记·屈原贾生列传》，是文学史上最早、最完整的屈原传记，是研究屈原及其作品的重要文献。司马迁以深沉的敬意，对屈原的人格与作品给予崇高评价。\n\n写作背景：司马迁因李陵之祸受宫刑后发愤著书，对屈原的悲剧命运有深切的共鸣。文中既有对屈原的同情赞颂，也有对自己身世的感慨寄托。\n\n写作特色：1. 夹叙夹议，叙议结合——在叙述屈原事迹中融入强烈的主观评价；2. 善用对比——屈原的忠贞与怀王的昏庸、奸佞的得势与屈原的被疏，形成强烈对比；3. 语言骈散结合，感情真挚充沛。\n\n思想内涵：高度评价屈原\"正道直行\"\"志洁行廉\"的高尚人格，并以\"与日月争光\"的至高赞誉肯定其历史地位。\n\n名句价值：\"其志洁，故其称物芳；其行廉，故死而不容\"\"信而见疑，忠而被谤\"等句，深刻揭示了忠贤被害的历史悲剧。"
    },
    {
      id:'jianshizuzhi', title:'谏太宗十思疏', author:'魏征', authorId:'weizheng', cat:'wenyanwen',
      audio:'resource/audio/jianshizuzhi.aac',
      text:'臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。\n\n凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡。岂取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则胡越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎；奔车朽索，其可忽乎！\n\n君人者，诚能见可欲则思知足以自戒，将有作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，在君无事，可以尽豫游之乐，可以养松、乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！',
      translation: "臣听说想要树木生长得高大，一定要稳固它的根基；想要水流得长远，一定要疏通它的源头；想要国家安定，一定要积聚它的道德和道义。水源不深却希望水流得远，根基不稳固却要求树木长得高大，道德不深厚却想要国家安定，我虽然愚笨，也知道这是不可能的，更何况明智的人呢！国君承担着帝位的重任，处于天下最大的位置，将推崇极高的天命，永保无尽的福禄。如果不考虑居安思危，用节俭戒除奢侈，道德不能保持深厚，性情不能克制欲望，这也就像砍伐树根却要求树木茂盛，堵塞源头却希望水流长远一样。\n\n所有历代君王，承受上天的大命，没有不是在忧患中德行显著，成功后却德行衰败的。有好的开端的确实很多，能坚持到底的却很少。难道是取得天下容易而守住天下困难吗？当初取得天下时还游刃有余，今天守住天下却力不从心，为什么呢？因为处在忧患之中，必定竭尽诚意来对待下属；已经实现志向，就放纵情欲而傲视他人。竭尽诚意，那么胡越也能结为一体；傲视他人，那么骨肉之亲也会形同陌路。即使用严酷的刑法督责他们，用威严发怒震慑他们，最终也不过是苟且免于罪罚却不怀仁德，表面恭顺却内心不服。怨言不在大小，可怕的只是众人；水能载舟也能覆舟，这是应当慎重对待的；用腐朽的绳索驾驭奔驰的马车，难道可以疏忽吗！\n\n统治百姓的人，果真能做到见到想要的东西就想到知足来自我警戒，将要兴建工程就想到适可而止来安定百姓，想到地位高危就想到谦逊来修养自身，惧怕盈满就想到江海居于百川之下，乐于游乐就想到三驱之法作为限度，担心懈怠就想到慎始慎终，担心耳目被蒙蔽就想到虚心来接纳下属，想到谗佞邪恶就想到端正自身来斥退邪恶，施恩时就想到不要因为欢喜而错误地赏赐，处罚时就想到不要因为愤怒而滥用刑罚。总括这十思，发扬这九种品德，选拔有才能的人而任用他们，选择好的建议而听从，那么有智慧的人就能尽献他们的谋略，勇武的人就能竭尽他们的力量，仁爱的人就能广布他们的恩惠，诚信的人就能献出他们的忠诚。文武百官争相效力，国君就可以无为而治，能够尽情享受游乐的快乐，可以养生如赤松子、王子乔那样长寿，弹琴垂衣拱手，不用说话就能教化天下。何必劳神苦思，代替下属处理职务，役使自己聪明的耳目，亏损无为的大道呢！",
      notes: [{phrase:"长",pos:"求木之长者",explain:"长（zhǎng），生长。"},{phrase:"浚",pos:"必浚其泉源",explain:"疏通。"},{phrase:"神器",pos:"人君当神器之重",explain:"帝位。"},{phrase:"休",pos:"永保无疆之休",explain:"福禄。"},{phrase:"景命",pos:"承天景命",explain:"大命。"},{phrase:"克终",pos:"能克终者盖寡",explain:"坚持到底。"},{phrase:"董",pos:"虽董之以严刑",explain:"督责。"},{phrase:"载舟覆舟",pos:"载舟覆舟",explain:"比喻民心向背决定国家存亡。"},{phrase:"三驱",pos:"思三驱以为度",explain:"古代君王打猎的三面合围之法。"},{phrase:"黜",pos:"思正身以黜恶",explain:"斥退。"},{phrase:"垂拱",pos:"鸣琴垂拱",explain:"垂衣拱手，指无为而治。"}],
      appreciation: "本文是魏征于贞观十一年（637）写给唐太宗的奏疏。当时唐朝处于鼎盛时期，太宗逐渐骄奢，魏征连上四疏，此为其中之一。\n\n思想内容：以\"积德义\"为核心，提出\"十思\"作为君王修身的准则，劝谏太宗居安思危、戒奢以俭、虚心纳下、知人善任。核心观点是\"载舟覆舟\"——民心向背决定国家存亡。\n\n写作特色：1. 善用比喻——开篇以木之根本、水之泉源喻国家之德义，形象生动；2. 骈散结合，对仗工整；3. 正反对比——殷忧时\"竭诚待下\"与得志后\"纵情傲物\"形成对比，\"殷忧道著\"与\"功成德衰\"形成对比。\n\n名句价值：\"居安思危，戒奢以俭\"\"载舟覆舟，所宜深慎\"\"怨不在大，可畏惟人\"等成为历代君王的座右铭，至今仍有警示意义。"
    },
    {
      id:'shishuo', title:'师说', author:'韩愈', authorId:'hanyu', cat:'wenyanwen',
      audio:'resource/audio/shishuo.aac',
      text:'古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。\n\n嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎！爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰："彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。"呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！\n\n圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。\n\n李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。',
      translation: "古代求学的人必定有老师。老师，是用来传授道理、讲授学业、解答疑难的人。人不是一生下来就懂得道理的，谁能没有疑惑？有疑惑却不跟老师学习，那些成为疑惑的问题，就始终不能解决了。在我之前出生的人，他懂得道理本来就比我早，我跟从他向他学习；在我之后出生的人，他懂得道理如果也比我早，我也跟从他向他学习。我学习的是道理，哪里用得着知道他的年龄比我大还是小呢？因此不论地位贵贱，不论年龄大小，道存在的地方，就是老师存在的地方。\n\n唉！从师学习的风尚不流传已经很久了！想要人们没有疑惑就难了！古代的圣人，他们超出常人很多，尚且跟从老师请教；现在的一般人，他们比圣人差得远了，却以向老师学习为耻。因此圣人就更加圣明，愚人就更加愚笨。\n\n人们爱自己的孩子，就选择老师来教他；对于他自己呢，却以跟从老师学习为耻，真是糊涂啊！那些儿童的老师，教他读书并学习其中的断句，不是我所说的传授道理、解答疑惑的老师。不明白断句，疑惑不能解决，有的向老师学习，有的不向老师学习，小的方面学习，大的方面丢弃，我看不出他们有什么明智之处。\n\n巫医、乐师、各种工匠这些人，不以互相学习为耻。士大夫这一类人，一提到\"老师\"\"弟子\"这些称呼，就聚在一起讥笑人家。问他们为什么笑，他们就说：\"他和他年龄差不多，懂得的道理也差不多。地位低的就以之为耻，地位高的就以之为近于谄媚。\"唉！从师学习的风尚不能恢复，由此可以知道了。\n\n圣人没有固定的老师。孔子曾向郯子、苌弘、师襄、老聃请教。郯子这些人，他们的贤能赶不上孔子。孔子说：\"三个人同行，其中就一定有可以当我老师的人。\"因此学生不一定不如老师，老师不一定比学生贤能。\n\n李家的孩子叫蟠，十七岁，爱好古文，六经的经文和传文都普遍学习了，不被时俗所限制，向我学习。我赞许他能实行古人从师学习的道理，写了这篇《师说》送给他。",
      notes: [{phrase:"师者，所以传道受业解惑也",pos:"师者，所以传道受业解惑也",explain:"所以，用来……的。受，同「授」，传授。明确老师的三大职责。"},{phrase:"人非生而知之者",pos:"人非生而知之者",explain:"知，懂得。强调学习是后天的事。"},{phrase:"吾师道也",pos:"吾师道也",explain:"师，名词作动词，学习。"},{phrase:"师道之不传也久矣",pos:"师道之不传也久矣",explain:"师道，从师求学的风尚。"},{phrase:"句读",pos:"习其句读",explain:"读（dòu），句子中间需要停顿的地方。"},{phrase:"圣人无常师",pos:"圣人无常师",explain:"常，固定。"},{phrase:"术业有专攻",pos:"术业有专攻",explain:"攻，研究、学习。"}],
      appreciation: "《师说》是韩愈的一篇著名论说文，针对当时士大夫耻于从师的不良风气，论述了从师学习的重要意义和择师的标准，是体现韩愈\"古文运动\"主张的代表作。\n\n论证方法：运用正反对比论证（古之圣人从师 vs 今之众人耻师）、事例论证（孔子师郯子等）、类比论证（巫医乐师百工 vs 士大夫），层层推进，逻辑严密。\n\n立论思想：提出\"道之所存，师之所存\"——择师以\"道\"为标准，不论贵贱长幼，具有朴素的平等观念和辩证思想。\n\n语言特色：句式整饬而有变化，感情充沛，气势磅礴。文中\"师者，所以传道受业解惑也\"已成为对教师职责的经典定义。",







    },
    {
      id:'zilu', title:'子路、曾皙、冉有、公西华侍坐', author:'《论语》', authorId:'kongzi', cat:'wenyanwen',
      audio:'resource/audio/zilu.aac',
      text:'子路、曾皙、冉有、公西华侍坐。\n\n子曰："以吾一日长乎尔，毋吾以也。居则曰：\u2018不吾知也！\u2019如或知尔，则何以哉？"\n\n子路率尔而对曰："千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。"\n\n夫子哂之。\n\n"求！尔何如？"\n\n对曰："方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。"\n\n"赤！尔何如？"\n\n对曰："非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。"\n\n"点！尔何如？"\n\n鼓瑟希，铿尔，舍瑟而作，对曰："异乎三子者之撰。"\n\n子曰："何伤乎？亦各言其志也。"\n\n曰："莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。"\n\n夫子喟然叹曰："吾与点也！"\n\n三子者出，曾皙后。曾皙曰："夫三子者之言何如？"\n\n子曰："亦各言其志也已矣。"\n\n曰："夫子何哂由也？"\n\n曰："为国以礼，其言不让，是故哂之。"\n\n"唯求则非邦也与？"\n\n"安见方六七十如五六十而非邦也者？"\n\n"唯赤则非邦也与？"\n\n"宗庙会同，非诸侯而何？赤也为之小，孰能为之大？"',
      translation: "子路、曾皙、冉有、公西华陪孔子坐着。\n\n孔子说：\"因为我比你们年长一些，不要因为我年长就不敢说话了。你们平时常说：'没有人了解我呀！'如果有人了解你们，那么你们要做什么呢？\"\n\n子路轻率地回答说：\"一个拥有一千辆兵车的国家，夹在大国之间，外有军队入侵，内有饥荒相迫；让我去治理它，等到三年，可以使百姓有勇气，并且懂得道理。\"\n\n孔子对他微微一笑。\n\n\"求，你怎么样？\"\n\n冉有回答说：\"方圆六七十里或者五六十里的小国，让我去治理，等到三年，可以使百姓富足。至于礼乐教化，那就等君子来施行了。\"\n\n\"赤，你怎么样？\"\n\n公西华回答说：\"不敢说我能做什么，但我愿意学习。宗庙祭祀之事，或者诸侯会盟，穿着礼服，戴着礼帽，我愿意做一个小傧相。\"\n\n\"点，你怎么样？\"\n\n曾皙弹瑟的声音稀疏下来，铿的一声放下瑟站起来，回答说：\"我和他们三位所说的不一样。\"\n\n孔子说：\"有什么妨碍呢？也只是各人说说自己的志向罢了。\"\n\n曾皙说：\"暮春时节，春天的衣服已经穿上了，我和五六个成年人、六七个少年，在沂水里洗澡，在舞雩台上吹风，唱着歌回家。\"\n\n孔子长叹一声说：\"我赞成曾点啊！\"\n\n三位同学出去后，曾皙走在后面。曾皙说：\"他们三位的话怎么样？\"\n\n孔子说：\"也不过是各人说说自己的志向罢了。\"\n\n曾皙说：\"老师为什么笑仲由呢？\"\n\n孔子说：\"治理国家要用礼，他的话不谦让，所以笑他。\"\n\n\"难道冉求讲的不是国家吗？\"\n\n\"怎么见得方圆六七十里或五六十里就不是国家呢？\"\n\n\"难道公西赤讲的不是国家吗？\"\n\n\"宗庙祭祀和诸侯会盟，不是诸侯的事又是什么？公西赤只能做个小傧相，那谁还能做大傧相呢？",
      notes: [{phrase:"长乎尔",pos:"以吾一日长乎尔",explain:"比你们年长。"},{phrase:"毋吾以",pos:"毋吾以也",explain:"不要因为我（而不敢说话）。"},{phrase:"居",pos:"居则曰",explain:"平时。"},{phrase:"率尔",pos:"子路率尔而对曰",explain:"轻率、急切的样子。"},{phrase:"千乘之国",pos:"千乘之国",explain:"拥有一千辆兵车的国家。乘（shèng），兵车。"},{phrase:"摄",pos:"摄乎大国之间",explain:"夹。"},{phrase:"比及",pos:"比及三年",explain:"等到。"},{phrase:"方",pos:"且知方也",explain:"合乎礼义。"},{phrase:"哂",pos:"夫子哂之",explain:"微笑。哂（shěn）。"},{phrase:"作",pos:"舍瑟而作",explain:"起。"},{phrase:"撰",pos:"异乎三子者之撰",explain:"才能，这里指所言志向。"},{phrase:"莫",pos:"莫春者",explain:"同「暮」。"},{phrase:"冠者",pos:"冠者五六人",explain:"成年人。冠（guàn）。"},{phrase:"与",pos:"吾与点也",explain:"赞成。"}],
      appreciation: "本文选自《论语·先进》，是《论语》中最具文学性的篇章之一，生动记录了孔子与四位弟子\"言志\"的情景。\n\n思想内容：通过弟子各言其志，反映了孔子的政治理想——\"为国以礼\"，以及他对\"大同社会\"的向往——\"暮春者\"一段描绘了礼乐文明下的和谐生活图景。孔子\"吾与点也\"的感慨，体现了他对太平治世的追求。\n\n写作特色：1. 人物刻画生动——子路的率尔、冉有的谦逊、公西华的从容、曾皙的从容不迫，各具性情；2. 语言简练传神——\"夫子哂之\"\"喟然叹曰\"等动作神态描写极为传神；3. 以对话推动情节，结构完整。\n\n名句价值：\"暮春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归\"成为儒家理想社会的诗意写照，影响深远。"
    },
    {
      id:'baoanan', title:'报任安书（节选）', author:'司马迁', authorId:'simaqian', cat:'wenyanwen',
      audio:'resource/audio/baoanan.aac',
      text:'古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。此人皆意有所郁结，不得通其道，故述往事、思来者。乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。\n\n仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。亦欲以究天人之际，通古今之变，成一家之言。草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也！',
      translation: "古时候富贵而名字磨灭的人，多得数不清，只有卓越不凡的人才被后人称道。周文王被囚禁而推演出《周易》；孔子遭受困厄而作《春秋》；屈原被放逐，才创作了《离骚》；左丘明失明，才写出了《国语》；孙膑被截去膝盖骨，兵法才编撰而成；吕不韦被贬到蜀地，世上流传《吕览》；韩非被囚禁在秦国，写出了《说难》《孤愤》；《诗经》三百篇，大都是圣贤抒发愤懑而作。这些人都是心里有所郁结，不能实现他们的理想，所以记述往事，思考未来。至于左丘明失去视力，孙膑断了双脚，终于不能被任用，便退而著书立说，来舒展他们的愤懑，想留下文章来表现自己的思想。\n\n我私下不自量力，近来依托于拙劣的文辞，搜集天下散失的旧闻，粗略考订其事迹，综合其始末，考察其成败兴衰的规律，上起黄帝，下到当今，作十表，本纪十二篇，书八篇，世家三十篇，列传七十篇，共一百三十篇。也是想以此来探究天道与人事的关系，贯通从古到今的变化规律，成为一家之言。草稿还没有完成，恰巧遭遇这场灾祸，我痛惜此书没有完成，因此受了最严酷的刑罚也没有怨怒的表情。我实在是想写成此书，藏之名山，传给可传的人，流传到都市大都，那么我就偿还了此前受辱的债务，即使被杀一万次，难道会后悔吗！然而这些只能对智者说，难以对俗人讲啊！",
      notes: [{phrase:"摩灭",pos:"名摩灭",explain:"磨灭。摩通「磨」。"},{phrase:"倜傥",pos:"唯倜傥非常之人称焉",explain:"卓越不凡。倜傥（tì tǎng）。"},{phrase:"演",pos:"文王拘而演《周易》",explain:"推演。"},{phrase:"厄",pos:"仲尼厄而作《春秋》",explain:"困厄。"},{phrase:"厥",pos:"厥有《国语》",explain:"乃，才。"},{phrase:"膑脚",pos:"孙子膑脚",explain:"截去膝盖骨。膑（bìn）。"},{phrase:"大底",pos:"大底圣贤发愤之所为作也",explain:"大抵。底通「抵」。"},{phrase:"通其道",pos:"不得通其道",explain:"实现他们的理想。"},{phrase:"网罗",pos:"网罗天下放失旧闻",explain:"搜集。"},{phrase:"稽",pos:"稽其成败兴坏之纪",explain:"考察。"},{phrase:"究天人之际",pos:"究天人之际",explain:"探究天道与人事之间的关系。"},{phrase:"通古今之变",pos:"通古今之变",explain:"贯通古今变化的规律。"},{phrase:"责",pos:"偿前辱之责",explain:"同「债」。"}],
      appreciation: "本文节选自司马迁《报任安书》，是司马迁在受宫刑后写给朋友任安的一封回信，是中国文学史上著名的抒情散文。\n\n写作背景：司马迁因李陵之祸被处以宫刑，忍辱负重完成了《史记》。任安曾写信劝他\"推贤进士\"，司马迁迟迟未复，此信是任安因罪下狱待决时所作的复信。\n\n思想内容：1. 提出\"发愤著书\"说——列举文王、孔子、屈原等先贤都是在逆境中成就伟大著作，阐发自己忍辱著史的精神动力；2. 表达了\"究天人之际，通古今之变，成一家之言\"的宏大治史理想；3. 抒发了\"虽万被戮，岂有悔哉\"的坚定决心。\n\n写作特色：1. 感情充沛，悲愤深沉；2. 排比铺陈，气势磅礴——\"文王拘而演《周易》\"一段以排比列举史实，极具说服力；3. 骈散结合，错落有致。\n\n名句价值：\"人固有一死，或重于泰山，或轻于鸿毛\"（出自本文前段）\"究天人之际，通古今之变，成一家之言\"成为中国古代史学的最高理想，影响深远。"

      id:'guoqinlun', title:'过秦论（上）', author:'贾谊', authorId:'jiayi', cat:'wenyanwen',
      audio:'resource/audio/guoqinlun.aac',
      text:'秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。于是秦人拱手而取西河之外。\n\n孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有甯越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。\n\n及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。\n\n始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。\n\n且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。',
      translation: "秦孝公占据崤山、函谷关的坚固，拥有雍州的土地，君臣坚固地守卫着，来窥视周王室，有席卷天下、征服宇内、吞并四海的意图，并吞八荒的雄心。在这个时候，商鞅辅佐他，对内建立法律制度，致力于耕田纺织，修治防守作战的器具，对外实行连横使诸侯互相争斗。于是秦人毫不费力地取得了西河以外的土地。\n\n秦孝公死后，惠文王、武王、昭襄王继承原有的基业，沿袭前人的策略，向南夺取汉中，向西攻取巴蜀，向东割取肥沃的土地，向北收服要害的郡县。诸侯恐惧，会盟图谋削弱秦国，不吝惜珍器重宝和肥饶的土地，来招致天下的士人，合纵结交，联合成为一体。在这个时候，齐国有孟尝君，赵国有平原君，楚国有春申君，魏国有信陵君。这四位公子，都明智而忠信，宽厚而爱人，尊贤而重士，约定合纵拆散连横，联合韩、魏、燕、楚、齐、赵、宋、卫、中山的军队。于是六国的士人，有宁越、徐尚、苏秦、杜赫这一类人为他们出谋划策，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅这一类人沟通他们的意图，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢这一类人统率他们的军队。曾经以十倍于秦国的土地，百万大军，攻打函谷关攻打秦国。秦人开关引敌进来，九国的军队，犹豫不敢前进。秦人没有损失一支箭一个箭头的代价，而天下诸侯已经困乏了。于是合纵散约失败，争着割地贿赂秦国。秦国有余力来制服他们的弱点，追击败逃的军队，尸体倒下百万，流血可以漂起大盾；趁着有利的形势，宰割天下，分裂山河。强国请求臣服，弱国入朝称臣。延续到孝文王、庄襄王，享国的时间短，国家没有什么事。\n\n到了秦始皇，发扬六代传下来的功业，挥舞长鞭驾驭天下，吞并东周西周而灭亡六国，登上最尊贵的皇帝位而控制六合，拿着刑具鞭打天下，威震四海。向南夺取百越的土地，设立桂林郡、象郡；百越的君主，低着头颈上系着绳索，把性命交给下级官吏。于是派蒙恬向北修筑长城而守卫边防，击退匈奴七百多里；胡人不敢南下牧马，士兵不敢弯弓报怨。于是废除先王之道，焚烧诸子百家的著作，来愚弄百姓；毁坏著名的城池，杀害英雄豪杰；收缴天下的兵器，聚集到咸阳，销毁刀刃和箭头，铸造成十二个金人，来削弱天下百姓。然后据守华山作为城墙，凭借黄河作为护城河，据守亿丈高的城墙，下临深不可测的深渊，作为坚固的防御。良将手持劲弩守卫要害之处，信臣精卒排列着利兵盘问来往行人。天下已经平定，秦始皇的心里，自以为关中的坚固，是千里金城，子孙帝王万世的基业。\n\n秦始皇死后，余威震慑着风俗不同的边远地区。然而陈涉是以破瓮做窗户、以草绳系门轴的穷人之子，是氓隶之徒，又是迁徙的人；才能赶不上一般人，没有仲尼、墨翟的贤能，没有陶朱、猗顿的富有；跻身于戍卒之间，而起事于阡陌之中，率领疲惫的士卒，带领数百人的队伍，反过来攻打秦国；砍下树木做兵器，举起竹竿当旗帜，天下人如云般汇集响应，担着粮食如影随形地跟从。山东豪俊于是并起而灭亡了秦朝。\n\n况且天下并没有缩小变弱，雍州的土地，崤山函谷关的坚固，还是从前那样。陈涉的地位，不比齐、楚、燕、赵、韩、魏、宋、卫、中山的君主尊贵；锄头木棍，不比钩戟长矛锋利；贬谪戍守的军队，不比九国的军队强大；深谋远虑，行军用兵的策略，比不上先前的士人。然而成功失败发生变化，功业结果相反，为什么呢？假使山东各国与陈涉比量长短大小，比较权力实力，就不能同日而语了。然而秦国以区区之地，造成万乘的势力，控制八州而使同列朝贡，已有一百多年；然后把六合作为家，崤函作为宫；一个普通人发难而七庙毁灭，自身死于他人之手，被天下人耻笑，是什么原因呢？不施仁义，而攻守的形势不同啊。",
      notes: [{phrase:"固",pos:"据崤函之固",explain:"坚固（地势）。"},{phrase:"席卷、包举、囊括",pos:"席卷天下，包举宇内，囊括四海",explain:"像卷席子、打包袱、装口袋一样吞并。"},{phrase:"八荒",pos:"并吞八荒之心",explain:"八方荒远之地。"},{phrase:"连衡",pos:"外连衡而斗诸侯",explain:"即连横。"},{phrase:"拱手",pos:"秦人拱手而取西河之外",explain:"比喻毫不费力。"},{phrase:"蒙",pos:"蒙故业",explain:"承受、继承。"},{phrase:"因",pos:"因遗策",explain:"沿袭。"},{phrase:"弱",pos:"谋弱秦",explain:"使……弱。"},{phrase:"爱",pos:"不爱珍器重宝",explain:"吝惜。"},{phrase:"逡巡",pos:"逡巡而不敢进",explain:"有所顾虑而徘徊不前。逡巡（qūn xún）。"},{phrase:"漂橹",pos:"流血漂橹",explain:"漂浮大盾。"},{phrase:"振",pos:"振长策而御宇内",explain:"挥舞。"},{phrase:"履至尊",pos:"履至尊而制六合",explain:"登上帝位。"},{phrase:"黔首",pos:"以愚黔首",explain:"百姓。"},{phrase:"销锋镝",pos:"销锋镝",explain:"销毁兵器。镝（dí）。"},{phrase:"谁何",pos:"信臣精卒陈利兵而谁何",explain:"盘问。"},{phrase:"瓮牖绳枢",pos:"瓮牖绳枢之子",explain:"以破瓮做窗，以草绳系户枢。牖（yǒu）。"},{phrase:"氓隶",pos:"氓隶之人",explain:"农村下层人。"},{phrase:"阡陌",pos:"倔起阡陌之中",explain:"田间小路。"},{phrase:"揭竿",pos:"揭竿为旗",explain:"举竿。"},{phrase:"景从",pos:"赢粮而景从",explain:"如影随形。景通「影」。"},{phrase:"絜",pos:"度长絜大",explain:"衡量。絜（xié）。"},{phrase:"序八州而朝同列",pos:"序八州而朝同列",explain:"控制八州使同列来朝。"}],
      appreciation: "《过秦论》是贾谊著名的政论文，分上中下三篇，本文为上篇。\"过\"是名词作动词，指责过失的意思，即论述秦朝的过失。\n\n写作背景：西汉初年，鉴于秦朝速亡的教训，贾谊作此篇论述秦之得失，旨在告诫汉朝统治者要施行仁政。\n\n思想内容：通过对秦国从兴盛到灭亡的过程的描述，提出\"仁义不施而攻守之势异也\"的中心论点——秦统一前处于攻势，可以用武力；统一后处于守势，应该用仁义。秦不施仁义，所以速亡。\n\n写作特色：1. 铺陈夸张，气势恢宏——大量运用排比、对偶，使文章气势磅礴；2. 对比鲜明——秦国的强大与陈涉的弱小对比，秦国的强盛与速亡对比，效果强烈；3. 欲抑先扬——前半极力渲染秦之强，为后文\"一夫作难而七庙隳\"的结论蓄势。\n\n名句价值：\"仁义不施而攻守之势异也\"\"斩木为兵，揭竿为旗\"\"胡人不敢南下而牧马\"等成为千古传诵的名句。"
