<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="resource/logomini.ico" type="image/x-icon">
  <link rel="manifest" href="config/manifest.json">
  <title>背书哇</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<button class="hamburger" id="hamburger" title="展开/收起侧边栏" aria-label="展开/收起侧边栏">☰</button>
<div class="side-overlay" id="sideOverlay"></div>
  <div class="art-head-btns">
    <button class="head-btn" id="recitedBtn" title="标记已背诵"><i class="ico ico-unstar" id="recitedIco"></i>已背诵</button>
    <button class="head-btn" id="chainBtn" title="链式背诵(渐进消隐)">链式背诵</button>
    <button class="head-btn" id="readAloudBtn" title="全文朗读(逐句高亮)">朗读</button>
      <button class="head-btn" id="pinyinBtn" title="拼音注音开关">拼音</button>
    <div class="mode-select-wrap">
      <button class="mode-select-btn" id="modeSelectBtn" type="button">仅原文</button>
      <div class="mode-select-menu" id="modeSelectMenu">
        <button class="mode-select-item active" data-mode="orig-only" type="button">仅原文<span class="desc">只显示原文</span></button>
        <button class="mode-select-item" data-mode="translation" type="button">翻译<span class="desc">原文 + 译文对照</span></button>
        <button class="mode-select-item" data-mode="notes" type="button">字解<span class="desc">原文 + 字词解释</span></button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <aside class="side" id="side">
      <div class="side-head">
        <h1 id="greet"></h1>
        <button class="switch-user-btn" id="switchUserBtn" type="button" title="切换用户 / 退出登录">切换用户</button>
        <div class="mode-selector-wrap">
          <button class="mode-indicator" id="modeIndicator" type="button">
            <span class="mode-dot-bg"></span>
            <span class="mode-indicator-text" id="modeIndicatorText">文章</span>
          </button>
          <div class="mode-selector-menu" id="modeSelectorMenu">
            <button class="mode-selector-item active" data-system-mode="learn" type="button">文章</button>
            <button class="mode-selector-item" data-system-mode="word" type="button">字词</button>
            <button class="mode-selector-item" data-system-mode="practice" type="button">语法</button>
            <button class="mode-selector-item" data-system-mode="exercise" type="button">练习</button>
          </div>
        </div>
      </div>
    <div class="mode-bar" id="modeBar">
      <button class="mode-btn active" id="modeBtn1" data-mode="art">篇目</button>
      <button class="mode-btn" id="modeBtn2" data-mode="author">作家</button>
      <button class="mode-btn hidden" id="modeBtn3" data-mode="extra">扩展</button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <i class="ico ico-search"></i>
      <input class="search-box" id="searchIn" placeholder="搜索篇目">
    </div>
    <div class="side-div"></div>
    <nav class="side-nav" id="nav"></nav>
    <div class="more-wrap">
      <button class="sbtn" id="moreBtn"><i class="ico ico-setting"></i>更多</button>
      <button class="util-btn" id="themeBtn" title="切换主题"><i class="ico ico-sun" id="themeIco"></i></button>
    </div>
  </aside>

  <main class="content" id="contentArea">
    <div id="viewArt" class="view">
      <div class="search-nav hidden" id="searchNav">
        <button id="hlPrev" title="上一个">↑</button>
        <span id="hlCount">0 / 0</span>
        <button id="hlNext" title="下一个">↓</button>
        <button id="hlClose" title="清除">清除</button>
      </div>
      <div class="c-inner" id="cInner">
        <div class="art-split" id="artSplit">
          <div class="art" id="artBox">
            <div class="art-head">
              <div class="art-title" id="artTitle"></div>
            </div>
            <div class="art-author" id="artAuthor"></div>
            <div class="art-body" id="artBody"></div>
          </div>

          <div class="art-divider" id="artDivider"></div>

          <div class="art art-translation" id="artTransBox">
            <div class="art-head">
              <div class="art-title" id="artTransTitle">译文</div>
            </div>
            <div class="art-author trans-author-placeholder">&#8203;</div>
            <div class="art-body" id="artTransBody"></div>
          </div>
        </div>

        <div class="art-appreciation" id="artAppreciation">
          <div id="artAppreciationBody"></div>
        </div>
      </div>
    </div>
    <div id="viewAuthors" class="view hidden"><div class="author-grid" id="authorGrid"></div></div>
    <div id="viewAuthorDetail" class="author-detail view hidden"></div>
    <div id="viewDynasty" class="view hidden"><div class="author-grid" id="dynastyGrid"></div></div>
    <div id="viewExample" class="example-view view hidden"></div>
    <div id="viewAbout" class="about view hidden">
      <div class="about-card">
        <h3>软件信息</h3>
        <div class="about-row"><span class="about-label">软件名称</span><span class="about-value">背书哇</span></div>
        <div class="about-row"><span class="about-label">版本号</span><span class="about-value" id="aboutVersion">读取中…</span></div>
        <div class="about-row"><span class="about-label">作者</span><span class="about-value">@喔糖圆鼠</span></div>
        <div class="about-row"><span class="about-label">共创作者</span><span class="about-value">@F15EX @落星尘 @Motziki</span></div>
        <div class="about-row"><span class="about-label">录音资源</span><span class="about-value">人民教育出版社（仅供个人学习参考）</span></div>
        <div class="about-row"><span class="about-label">正文资源</span><span class="about-value">https://github.com/clover-yan/gaokao-poetry</span></div>
      </div>
      <div class="about-card">
        <h3>壁纸设置</h3>
        <div class="about-row" style="flex-direction:column;align-items:flex-start">
          <span class="about-label" style="margin-bottom:8px">我的壁纸</span>
          <div class="about-value" style="width:100%">
            <input type="file" id="wpUploadInput" accept="image/*" style="display:none">
            <button class="back-btn" id="wpUploadBtn" style="margin:0">上传壁纸</button>
            <div class="wallpaper-list" id="wpList"></div>
            <div class="wp-tools">
              <label><input type="checkbox" id="wpRotate"> 自动切换壁纸</label>
              <input type="number" id="wpInterval" min="1" value="30" title="切换间隔（分钟）">
              <span style="font-size:13px;color:var(--sub)">分钟</span>
            </div>
            <div class="wp-status" id="wpStatus"></div>
          </div>
        </div>
      </div>
      <div class="about-card">
        <h3>显示设置</h3>
        <div class="about-row"><span class="about-label">全局字体大小</span><span class="about-value" style="display:flex;align-items:center;gap:8px">
          <button class="back-btn" id="gfsMinus" style="margin:0;padding:2px 10px;font-size:16px">−</button>
          <span id="gfsValue" style="min-width:52px;text-align:center">四号 (16px)</span>
          <button class="back-btn" id="gfsPlus" style="margin:0;padding:2px 10px;font-size:16px">+</button>
        </span></div>
      </div>
      <div class="about-card">
        <h3>AI 大模型设置</h3>
        <div class="about-row" style="flex-direction:column;align-items:flex-start;gap:10px">
          <div style="width:100%;display:flex;align-items:center;gap:8px">
            <span class="about-label" style="min-width:90px;flex-shrink:0">API 地址</span>
            <input type="text" id="aiApiUrl" placeholder="https://api.deepseek.com/chat/completions" style="flex:1;height:32px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:0 10px;font-family:inherit;font-size:13px;outline:none" class="ai-input">
          </div>
          <div style="width:100%;display:flex;align-items:center;gap:8px">
            <span class="about-label" style="min-width:90px;flex-shrink:0">API Key</span>
            <input type="password" id="aiApiKey" placeholder="sk-xxxxxxxxxxxxxxxx" style="flex:1;height:32px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:0 10px;font-family:inherit;font-size:13px;outline:none" class="ai-input">
          </div>
          <div style="width:100%;display:flex;align-items:center;gap:8px">
            <span class="about-label" style="min-width:90px;flex-shrink:0">模型名称</span>
            <input type="text" id="aiModel" placeholder="deepseek-v4-flash" style="flex:1;height:32px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:0 10px;font-family:inherit;font-size:13px;outline:none" class="ai-input">
          </div>
          <div style="display:flex;gap:8px;margin-top:4px">
            <button class="back-btn" id="aiSaveBtn" style="margin:0">保存设置</button>
            <button class="back-btn" id="aiTestBtn" style="margin:0">测试连接</button>
          </div>
          <div id="aiStatus" style="font-size:12px;color:var(--sub);margin-top:4px"></div>
          <div style="width:100%;margin-top:8px">
            <div style="font-size:13px;color:var(--sub);margin-bottom:6px">情境默写出题偏好</div>
            <div style="display:flex;gap:8px" id="quizTypeGroup">
              <button class="back-btn quiz-type-btn" data-quiz-type="mock" style="margin:0">模拟题</button>
              <button class="back-btn quiz-type-btn" data-quiz-type="real" style="margin:0">高考真题</button>
              <button class="back-btn quiz-type-btn" data-quiz-type="any" style="margin:0">不限</button>
            </div>
          </div>
        </div>
      </div>
      <div class="about-card">
        <h3>数据管理</h3>
        <div class="about-row"><span class="about-label">数据备份</span><span class="about-value"><button class="back-btn" id="exportBtn" style="margin:0 4px 0 0">导出数据</button><button class="back-btn" id="importBtn" style="margin:0">导入数据</button></span></div>
        <div class="about-row"><span class="about-label">存储用量</span><span class="about-value" id="storageUsage">-</span></div>
        <div class="about-row" style="flex-direction:column;align-items:flex-start"><span class="about-label" style="margin-bottom:8px">重置数据</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <button class="back-btn reset-btn" data-reset="wrongbook" style="margin:0;font-size:12px">错题本</button>
            <button class="back-btn reset-btn" data-reset="stats" style="margin:0;font-size:12px">统计</button>
            <button class="back-btn reset-btn" data-reset="recite" style="margin:0;font-size:12px">已背诵</button>
            <button class="back-btn reset-btn" data-reset="all" style="margin:0;font-size:12px;color:#f44336;border-color:#f44336">全部</button>
          </div>
        </div>
      </div>
    </div>
    <div id="viewWordGame" class="view hidden"></div>
  </main>
</div>

  <div class="fs-ctrl hidden" id="fsCtrl">
    <button class="fs-btn" id="authorTtsBtn" title="朗读作者详情"><i class="ico ico-tts"></i></button>
    <button class="fs-btn" id="fsMinus" title="缩小字体"><i class="ico ico-reduce"></i></button>
    <button class="fs-btn" id="fsPlus" title="放大字体"><i class="ico ico-enlarge"></i></button>
  </div>

  <footer class="player" id="player">
    <button class="p-btn" id="btnRW" title="后退5秒"><i class="ico ico-rw"></i></button>
    <button class="p-btn play" id="btnPP" title="播放/暂停 (Space)"><i class="ico ico-play" id="ppIco"></i></button>
    <button class="p-btn" id="btnFF" title="前进5秒"><i class="ico ico-ff"></i></button>
    <button class="p-btn" id="speedBtn" title="倍速">1x</button>
    <button class="p-btn" id="loopBtn" title="单曲循环"><i class="ico ico-loop" id="loopIco"></i></button>
  <span class="p-title" id="pTitle"></span>
  <div class="p-area">
    <span class="p-time" style="margin-right:8px" id="tCur">0:00</span>
    <div class="p-track" id="pTrack"><div class="p-fill" id="pFill"></div></div>
    <span class="p-time" style="margin-left:8px" id="tTotal">0:00</span>
  </div>
</footer>

<!-- 数据层外部化（阶段 P0-1）：6 个独立数据文件 -->
<!-- 加载顺序原则：基础数据优先（articles 在前），工具类置后（situational 在后） -->
<!-- 注：各文件之间无运行时依赖（仅声明 var），任何顺序均可，但保持此顺序便于维护 -->
<script src="js/data/articles.js"></script>
<script src="js/data/authors.js"></script>
<script src="js/data/jushi.js"></script>
<script src="js/data/ci-lei-huo-yong.js"></script>
<script src="js/data/situational-questions.js"></script>

<script src="liquid-glass.js"></script>
<script src="js/error-boundary.js"></script>
<script src="js/migrate.js"></script>

<!-- 打包为桌面端/安卓 App 时页面以 file:// 加载，fetch('config/*.json') 会被 CORS 拦截。
     此文件把 game.json / version.json 内联为全局变量，作为 file:// 场景的兜底数据源。
     由 gen_bundled_config.py 生成；带服务器时仍优先用 fetch 的最新 json。 -->
<script src="config/bundled.js"></script>

<script src="js/pinyin-dict.js"></script>

<script src="js/app.main.js"></script>

<script src="js/profile.js"></script>
<script src="js/error-display.js"></script>

<script src="js/account.js"></script>
<script src="js/reveal.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
